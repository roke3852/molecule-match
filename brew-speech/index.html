<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#140e0b">
<title>比賽英文講稿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 像素風：深焙咖啡色為底；琥珀＝重點與選中；紅＝錄音／警告；青＝答對；藍＝涼。硬邊、無圓角、方塊陰影 */
:root{--bg:#140e0b;--bg2:#1c1410;--card:#24190f;--card2:#2f2116;--ink:#f3e9d6;--mute:#a59887;--dim:#6e5f50;--line:#4a3424;--line2:#6b4a32;
 --acc:#f0b46a;--acc2:#d9893a;--accD:#7a4a1c;--ok:#4fb3a9;--okbg:#173330;--bad:#d64545;--badbg:#3a1618;--chip:#2f2116;
 --hot:#e8633a;--warm:#f0b46a;--cool:#6c9bd2;--px:"DotGothic16","Noto Sans TC",monospace;--sh:3px 3px 0 #000}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",-apple-system,"PingFang TC",sans-serif;touch-action:manipulation}
body{background-image:linear-gradient(#ffffff05 1px,transparent 1px),linear-gradient(90deg,#ffffff05 1px,transparent 1px);background-size:8px 8px}
button,input,select,textarea{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer}
button:active{transform:translate(2px,2px)}
svg.px{image-rendering:pixelated;shape-rendering:crispEdges;vertical-align:middle;flex:none}
/* 頂部框 */
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:2px solid var(--line);padding:env(safe-area-inset-top) 0 0}
.top:before{content:"";display:block;height:4px;background:repeating-linear-gradient(90deg,var(--acc) 0 8px,var(--acc2) 8px 16px,var(--accD) 16px 24px,var(--line) 24px 32px)}
.top .row{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px}
.top h1{font-family:var(--px);font-weight:400;font-size:17px;margin:0;flex:1;letter-spacing:2px;color:var(--ink);display:flex;align-items:center;gap:8px}
.top h1 small{display:block;font-size:10px;color:var(--mute);letter-spacing:1px;margin-top:2px}
.top .ib{font-family:var(--px);border:2px solid var(--line2);background:var(--card);color:var(--ink);border-radius:0;padding:5px 8px;font-size:12px;box-shadow:2px 2px 0 #000}
.wrap{max-width:620px;margin:0 auto;padding:12px 12px calc(env(safe-area-inset-bottom) + 160px)}
/* 底部分頁 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg2);border-top:2px solid var(--line2);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;max-width:124px;border:0;background:none;padding:7px 0 6px;font-size:11px;font-family:var(--px);color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px;letter-spacing:1px}
nav.tabs button.on{color:var(--acc);background:linear-gradient(var(--acc) 0 3px,transparent 3px)}
nav.tabs button:not(.on) svg{opacity:.55;filter:grayscale(.5)}
/* 共用 */
.seg{display:flex;background:var(--bg2);border:2px solid var(--line);padding:3px;margin-bottom:12px;gap:3px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;padding:8px 6px;font-size:13px;white-space:nowrap;color:var(--mute);font-family:var(--px);letter-spacing:1px;display:flex;align-items:center;justify-content:center;gap:5px}
.seg button.on{background:var(--acc);color:#1a1008;box-shadow:inset -2px -2px 0 var(--acc2)}
.card{background:var(--card);border:2px solid var(--line);padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
h2{font-family:var(--px);font-weight:400;font-size:15px;margin:20px 2px 10px;color:var(--acc);letter-spacing:2px;display:flex;align-items:center;gap:8px}
h2:after{content:"";flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--line2) 0 4px,transparent 4px 8px)}
h3{font-family:var(--px);font-weight:400;font-size:15px;margin:0 0 8px;letter-spacing:1px;display:flex;align-items:center;gap:8px}
.mute{color:var(--mute)}.sm{font-size:12px}
.btn{font-family:var(--px);border:2px solid var(--line2);background:var(--card2);color:var(--ink);border-radius:0;padding:8px 12px;font-size:13px;box-shadow:2px 2px 0 #000;letter-spacing:1px;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#1a1008;box-shadow:inset -2px -2px 0 var(--acc2),2px 2px 0 #000}
.btn.big{width:100%;padding:13px;font-size:16px}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--card2);border:2px solid var(--line);border-radius:0;padding:5px 9px;font-size:14px;margin:0 6px 7px 0;color:var(--ink);font-family:var(--px);box-shadow:2px 2px 0 #000;cursor:pointer;text-align:left}
.chip small{font-size:11px;color:var(--mute);font-family:"Noto Sans TC",sans-serif}
.chip.on{background:var(--acc);border-color:var(--acc);color:#1a1008;box-shadow:inset -2px -2px 0 var(--acc2),2px 2px 0 #000}
.chip.on small{color:#5a3a18}
.chip .x{opacity:.7;margin-left:2px}
.chip.add{background:none;border:2px dashed var(--line2);color:var(--acc);box-shadow:none}
.chip.long{line-height:1.45;font-family:"Noto Sans TC",sans-serif}
.chips{display:flex;flex-wrap:wrap}
.fld{display:block;margin-bottom:10px}
.fld>span{display:block;font-size:12px;color:var(--mute);margin-bottom:4px;font-family:var(--px);letter-spacing:1px}
.fld input,.fld select,.fld textarea{width:100%;border:2px solid var(--line2);background:var(--bg);color:var(--ink);border-radius:0;padding:9px 10px;font-size:16px}
.fld input::placeholder,.fld textarea::placeholder{color:var(--dim)}
.fld textarea{min-height:60px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 8px}
details.box{background:var(--card);border:2px solid var(--line);margin-bottom:12px;box-shadow:var(--sh)}
details.box>summary{list-style:none;padding:12px 14px;font-family:var(--px);font-size:15px;display:flex;align-items:center;gap:8px;letter-spacing:1px}
details.box>summary::-webkit-details-marker{display:none}
details.box>summary::after{content:"▼";margin-left:auto;color:var(--mute);font-size:11px}
details.box[open]>summary::after{content:"▲"}
details.box>.in{padding:0 14px 12px}
.slot{padding:10px;margin-bottom:8px;border:2px dashed var(--line2);background:var(--bg2);min-height:46px}
.slot.hot{border-color:var(--hot)}.slot.warm{border-color:var(--warm)}.slot.cool{border-color:var(--cool)}
.slot .lab{font-size:12px;font-family:var(--px);margin-bottom:6px}
.tip{background:var(--bg2);border:2px solid var(--line);border-left:6px solid var(--acc2);padding:10px 12px;font-size:13px;line-height:1.65;color:#d8c8b0;margin-bottom:12px}
/* 像素舞台 */
.stage{position:relative;border:2px solid var(--line2);box-shadow:var(--sh);margin-bottom:12px;line-height:0;background:#000}
.stage canvas{width:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.stage .cap{position:absolute;left:8px;bottom:6px;line-height:1.2;font-family:var(--px);font-size:11px;color:var(--ink);background:#000c;padding:3px 6px;letter-spacing:1px}
/* 點選產生器 */
.pk{background:var(--card);border:2px solid var(--line);padding:11px 12px 5px;margin-bottom:10px;box-shadow:var(--sh)}
.pkh{font-family:var(--px);font-size:14px;margin-bottom:9px;color:var(--ink);letter-spacing:1px;display:flex;align-items:center;gap:6px}
.pkh span{color:var(--mute);font-size:11px;margin-left:4px;font-family:"Noto Sans TC",sans-serif;letter-spacing:0}
.pv{border-top:2px dashed var(--line);margin-top:3px;padding-top:8px}
.pvl{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.pvl button{border:2px solid var(--line2);background:var(--bg);padding:3px 5px;flex:none;line-height:0;color:var(--acc)}
.pvl span{display:block;font-family:var(--px);font-size:15px;line-height:1.55;color:#f8eedc}
.pvl small{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.pbar{position:sticky;top:calc(env(safe-area-inset-top) + 50px);z-index:4;background:var(--bg2);border:2px solid var(--acc2);padding:7px 9px;margin-bottom:12px;display:flex;gap:6px;align-items:center;box-shadow:var(--sh)}
.pbar .pbi{flex:1;display:flex;flex-direction:column;font-size:13px;font-family:var(--px)}
.pbar .pbi b{font-weight:400;display:flex;align-items:center;gap:5px;color:var(--acc)}
.pbar .pbi span{font-size:11px;color:var(--mute)}
.pbar .btn{padding:6px 8px;font-size:12px}
.tsel{display:flex;gap:6px;margin-bottom:9px}
.tsel button{flex:1;border:2px solid var(--line);background:var(--bg2);padding:6px 4px;font-size:14px;font-family:var(--px);display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:2px 2px 0 #000}
.tsel button small{font-size:10px;color:var(--mute)}
.tsel button.on.hot{border-color:var(--hot);background:#3a1a10}.tsel button.on.warm{border-color:var(--warm);background:#3a2a10}.tsel button.on.cool{border-color:var(--cool);background:#14243a}
.seg.fc{margin:4px 0 9px}.seg.fc button{flex:none;padding:5px 8px;font-size:12px}
/* 講稿 */
.sbar{position:sticky;top:calc(env(safe-area-inset-top) + 50px);z-index:4;background:var(--bg);padding:6px 0 8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sbar .btn{padding:6px 9px;font-size:12px}
.sbar .btn.on{background:var(--accD);border-color:var(--acc)}
.sec{margin-bottom:16px}
.sec .hd{display:flex;align-items:center;gap:8px;margin:0 2px 8px;font-family:var(--px)}
.sec .hd b{font-weight:400;font-size:15px;color:var(--acc);letter-spacing:2px}
.sec .hd i{font-style:normal;font-size:12px;color:var(--mute)}
.sec .hd .t{margin-left:auto;font-size:11px;color:var(--mute);border:2px solid var(--line);padding:1px 6px}
.sen{background:var(--card);border:2px solid var(--line);padding:11px 12px;margin-bottom:8px;box-shadow:var(--sh);cursor:pointer;position:relative}
.sen.cur{border-color:var(--acc2)}
.sen.cur:before{content:"▶";position:absolute;left:-2px;top:-2px;background:var(--acc2);color:#1a1008;font-size:9px;padding:1px 3px;font-family:var(--px)}
.sen.play{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc),var(--sh);background:#3a2814}
.sen .en{font-family:var(--px);font-size:17px;line-height:1.6;color:#fbf1df;letter-spacing:.3px}
.sen .zh{font-size:13px;color:var(--mute);margin-top:5px;line-height:1.55}
.sen .en.hide{color:transparent;background:repeating-linear-gradient(90deg,var(--line) 0 8px,var(--card2) 8px 16px);user-select:none}
.sen .gap{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--acc);color:transparent;background:var(--bg2)}
.sen .gap.show{color:var(--acc);border-color:transparent;background:none}
.sen .tools{display:flex;gap:5px;margin-top:9px;align-items:center;flex-wrap:wrap}
.sen .tools button{border:2px solid var(--line2);background:var(--bg2);padding:3px 7px;font-size:12px;font-family:var(--px);line-height:1;min-height:28px;display:inline-flex;align-items:center;color:var(--ink)}
.sen .say,.say{font-size:11px;color:var(--acc);background:#2a1c0c;border:1px solid var(--accD);padding:2px 6px;font-family:var(--px)}
.sen.custom{border-style:dashed}
.sen.off{opacity:.4}
/* 播放列 */
.player{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 50px);z-index:6;display:flex;flex-direction:column;align-items:center;padding:6px 10px 8px;background:#0c0806f2;border-top:2px solid var(--acc2);color:var(--ink)}
.player .pli{font-size:12px;color:var(--acc);margin-bottom:5px;font-family:var(--px);letter-spacing:1px}
.player .plb{display:flex;gap:6px;width:100%;max-width:600px}
.player button{flex:1;border:2px solid var(--line2);background:var(--card2);color:var(--ink);padding:8px 4px;font-size:14px;white-space:nowrap;font-family:var(--px);box-shadow:2px 2px 0 #000}
.player button.pp{flex:2;background:var(--acc);border-color:var(--acc);color:#1a1008;box-shadow:inset -2px -2px 0 var(--acc2),2px 2px 0 #000}
.player button.on{background:var(--bad);border-color:var(--bad)}
/* 草稿 */
.drafts summary{flex-wrap:wrap}
.dr{border:2px solid var(--line);padding:10px;margin-bottom:8px;background:var(--bg2)}
.dr.cur{border-color:var(--acc2);background:#2a1c0e}
.drt{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.drt b{font-family:var(--px);font-weight:400;font-size:15px}
.tagc{font-size:10px;background:var(--acc2);color:#1a1008;padding:1px 5px;font-family:var(--px)}
/* 單字、條目 */
.vgrid{display:flex;flex-wrap:wrap}
.vw{background:var(--card);border:2px solid var(--line);padding:6px 9px;margin:0 6px 7px 0;font-size:14px;text-align:left;font-family:var(--px);box-shadow:2px 2px 0 #000;color:var(--ink)}
.vw small{display:block;font-size:11px;color:var(--mute);font-family:"Noto Sans TC",sans-serif}
.ent{background:var(--card);border:2px solid var(--line);padding:12px;margin-bottom:10px;box-shadow:var(--sh)}
.ent .t{display:flex;align-items:center;gap:8px}
.ent .t b{font-size:16px;font-family:var(--px);font-weight:400;letter-spacing:.5px}
.ent .t .sp{margin-left:auto}
.ent .say{display:inline-block;margin-top:6px}
.ent p{margin:8px 0 0;font-size:15px;line-height:1.6;font-family:var(--px);color:#f8eedc}
.ent p+.zh,.ent .zh{font-size:13px;color:var(--mute);margin-top:3px;line-height:1.55}
.pl{border:2px solid var(--line2);background:var(--bg2);padding:3px 7px;font-size:12px;font-family:var(--px);color:var(--ink);display:inline-flex;align-items:center;gap:4px;line-height:1.2}
.regs{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.regs button{border:2px solid var(--line);background:var(--bg2);padding:5px 8px;font-size:13px;text-align:left;font-family:var(--px);color:var(--ink)}
.regs button small{display:block;font-size:10px;color:var(--acc)}
/* 彈出視窗 */
.mask{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:88vh;overflow:auto;border-top:4px solid var(--acc2);padding:14px 14px calc(env(safe-area-inset-bottom) + 18px)}
.sheet .sh{display:flex;align-items:center;margin-bottom:12px}
.sheet .sh b{font-size:16px;flex:1;font-family:var(--px);font-weight:400;letter-spacing:1px;color:var(--acc)}
.sheet .sh button{border:2px solid var(--line2);background:var(--card);font-size:14px;color:var(--ink);padding:2px 8px;font-family:var(--px)}
.big-en{font-size:30px;font-family:var(--px);color:var(--acc)}
.diff span{display:inline-block;margin:0 4px 5px 0;padding:2px 6px;font-size:16px;font-family:var(--px)}
.diff .y{background:var(--okbg);color:var(--ok);border:1px solid var(--ok)}.diff .n{background:var(--badbg);color:#ff8a7e;border:1px dashed var(--bad)}
.score{font-size:44px;font-family:var(--px);color:var(--acc)}
.rec{width:84px;height:84px;border:3px solid #000;background:var(--bad);color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;margin:12px auto;box-shadow:inset -4px -4px 0 #8a1f22,4px 4px 0 #000}
.rec.on{animation:pulse 1s steps(2) infinite}
@keyframes pulse{50%{background:#ff6b5e}}
.qz .prompt{font-size:26px;font-family:var(--px);text-align:center;margin:12px 0 4px}
.qz .ask{text-align:center;color:var(--mute);font-size:13px}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{text-align:left;background:var(--card);border:2px solid var(--line2);padding:12px 14px;font-size:16px;font-family:var(--px);color:var(--ink);box-shadow:2px 2px 0 #000}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
.prog{height:10px;background:var(--bg2);border:2px solid var(--line);margin:4px 0 12px;padding:1px}
.prog i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--acc) 0 6px,transparent 6px 8px)}
.clock{font-size:64px;font-family:var(--px);text-align:center;letter-spacing:4px;margin:4px 0;color:var(--acc);text-shadow:4px 4px 0 #000}
.clock.over{color:var(--bad)}
.prompter{background:#000;border:2px solid var(--line2);color:#fbf1df;padding:16px;font-size:19px;line-height:1.65;font-family:var(--px);max-height:42vh;overflow:auto}
.prompter p{margin:0 0 10px}
.prompter .z{font-size:13px;color:var(--mute);font-family:"Noto Sans TC",sans-serif;margin-top:-6px}
.segrow{display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:2px dashed var(--line);font-size:14px;font-family:var(--px)}
.segrow.cur{color:var(--acc)}
.segrow.done{color:var(--mute)}
.segrow .r{margin-left:auto}
.over{color:var(--bad)}.under{color:var(--ok)}
.qa .q{font-size:15px;font-family:var(--px);letter-spacing:.3px}
.qa .qz{font-size:12px;color:var(--mute);margin-top:2px}
.qa .a{margin-top:8px;padding-top:8px;border-top:2px dashed var(--line)}
.qa summary{font-family:var(--px)}
audio{filter:invert(.9) sepia(.3)}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:#000;border:2px solid var(--acc);color:var(--acc);padding:9px 14px;font-size:14px;font-family:var(--px);opacity:0;transition:opacity .2s steps(2);pointer-events:none;z-index:30;box-shadow:var(--sh)}
#toast.on{opacity:1}
.sig{text-align:center;color:var(--dim);font-size:12px;margin-top:28px;letter-spacing:3px;font-family:var(--px)}
</style>

</head>
<body>
<div class="top"><div class="row"><h1><span id="hlogo"></span><span>比賽英文講稿<small>Brewers Cup 上台介紹自己的咖啡</small></span></h1><button class="ib" data-act="share">分享</button><button class="ib" data-act="settings">設定</button></div></div>
<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs"></nav>
<div id="toast"></div>
<script>
/* ================= 資料 ================= */
const ORIGINS=[
 {id:"ethiopia",en:"Ethiopia",zh:"衣索比亞",say:"ee-thee-OH-pee-uh",
  d:["Ethiopia is the birthplace of Arabica coffee, and many coffees here still come from local heirloom varieties.","衣索比亞是阿拉比卡咖啡的發源地，許多咖啡至今仍來自當地的原生品種。"],
  d2:["Most coffee here is grown by smallholders and brought to washing stations to be processed.","這裡的咖啡多由小農種植，再送到處理廠處理。"],
  r:[["Yirgacheffe","耶加雪菲","yur-guh-CHEF-ee"],["Guji","古吉","GOO-jee"],["Sidama","西達摩","sih-DAH-muh"],["Bench Maji","班奇馬吉","BENCH MAH-jee"],["Limu","利姆","LEE-moo"],["Harrar","哈拉","HAR-er"]]},
 {id:"kenya",en:"Kenya",zh:"肯亞",say:"KEN-yuh",
  d:["Kenyan coffees are known for their intense, bright acidity, often with blackcurrant and grapefruit notes.","肯亞咖啡以強烈明亮的酸質聞名，常帶有黑醋栗和葡萄柚的調性。"],
  d2:["Many Kenyan coffees are processed at cooperative factories and sold through a grading system like AA and AB.","許多肯亞咖啡在合作社處理廠處理，並以 AA、AB 等分級出售。"],
  r:[["Nyeri","涅里","nyeh-REE"],["Kirinyaga","基里尼亞加","kee-reen-YAH-gah"],["Embu","恩布","EM-boo"],["Murang'a","穆蘭卡","moo-RAHNG-ah"]]},
 {id:"panama",en:"Panama",zh:"巴拿馬",say:"PAN-uh-mah",
  d:["Panama became world-famous for Gesha after Hacienda La Esmeralda introduced it to the specialty world in 2004.","2004 年翡翠莊園讓藝伎在精品咖啡界一鳴驚人，巴拿馬也因此聞名世界。"],

const VARIETIES=[
 {id:"gesha",en:"Gesha",zh:"藝伎",say:"GEH-shuh（也常聽到 GAY-shuh）",d:["Gesha originally came from the Gori Gesha forest in southwestern Ethiopia, and it's famous for its jasmine, bergamot and tea-like elegance.","藝伎最早來自衣索比亞西南部的 Gori Gesha 森林，以茉莉花、佛手柑與茶感般的優雅聞名。"]},
 {id:"typica",en:"Typica",zh:"鐵比卡",say:"TIP-ih-kuh",d:["Typica is one of the oldest cultivated Arabica varieties, known for a clean, sweet and delicate cup.","鐵比卡是最古老的栽培阿拉比卡品種之一，以乾淨、甜美、細緻的風味著稱。"]},
 {id:"bourbon",en:"Bourbon",zh:"波旁",say:"BUR-bun",d:["Bourbon is a natural mutation of Typica from Réunion Island, known for its sweetness and complexity.","波旁是鐵比卡在留尼旺島的自然突變，以甜感和複雜度著稱。"]},
 {id:"pinkbourbon",en:"Pink Bourbon",zh:"粉紅波旁",say:"pink BUR-bun",d:["Despite its name, Pink Bourbon from Colombia is genetically closer to Ethiopian landraces, and it often shows floral and fruity complexity.","粉紅波旁雖然叫波旁，基因上其實更接近衣索比亞原生種，常有花香與水果的複雜度。"]},
 {id:"sl28",en:"SL28",zh:"SL28",say:"S-L twenty-eight",d:["SL28 was selected by Scott Agricultural Laboratories in Kenya in the 1930s, and it's known for intense acidity and blackcurrant notes.","SL28 是 1930 年代由肯亞史考特農業實驗室選育，以強烈酸質和黑醋栗調性聞名。"]},
 {id:"sl34",en:"SL34",zh:"SL34",say:"S-L thirty-four",d:["SL34 is another Kenyan selection from Scott Labs, with a heavier body and a deep, winey character.","SL34 同樣是肯亞史考特實驗室的選育品種，口感較厚實，帶有深沉的酒感。"]},
 {id:"caturra",en:"Caturra",zh:"卡杜拉",say:"kuh-TOO-ruh",d:["Caturra is a compact natural mutation of Bourbon found in Brazil, with bright acidity.","卡杜拉是在巴西發現的波旁矮種突變，酸質明亮。"]},
 {id:"catuai",en:"Catuai",zh:"卡杜艾",say:"kah-too-EYE",d:["Catuai is a cross between Mundo Novo and Caturra, developed in Brazil for high yields.","卡杜艾是新世界與卡杜拉的雜交種，在巴西培育以提高產量。"]},
 {id:"pacamara",en:"Pacamara",zh:"帕卡瑪拉",say:"pah-kah-MAH-ruh",d:["Pacamara is a cross between Pacas and Maragogype from El Salvador, with very large beans and bold, complex flavors.","帕卡瑪拉是薩爾瓦多培育的帕卡斯與象豆雜交種，豆粒很大，風味強烈複雜。"]},
 {id:"sidra",en:"Sidra",zh:"希德拉",say:"SEE-druh",d:["Sidra is a variety from Ecuador, likely of Ethiopian origin, loved for its floral, fruity and very sweet profile.","希德拉來自厄瓜多，可能源自衣索比亞，以花香、果香和非常甜的風味受到喜愛。"]},
 {id:"wushwush",en:"Wush Wush",zh:"Wush Wush（衣索比亞原生種）",say:"WOOSH-woosh",d:["Wush Wush is an Ethiopian landrace now grown in Colombia, known for intense fruit and wine-like notes.","Wush Wush 是衣索比亞原生種，現在也種在哥倫比亞，以濃郁果香和酒感著稱。"]},
 {id:"landrace",en:"Ethiopian landrace",zh:"衣索比亞原生種",say:"LAND-race",d:["These are local Ethiopian landrace varieties, such as 74110 and 74158 selected by the Jimma research center, which give floral and citrus complexity.","這是衣索比亞的當地原生品種，例如吉瑪研究中心選育的 74110、74158，帶來花香與柑橘的複雜度。"]},
 {id:"java",en:"Java",zh:"爪哇",say:"JAH-vuh",d:["The Java variety was selected from Ethiopian landraces and is known for an elegant, tea-like cup.","爪哇品種選育自衣索比亞原生種，以優雅、茶感的風味聞名。"]},
 {id:"laurina",en:"Laurina",zh:"蘿莉娜",say:"law-REE-nuh",d:["Laurina, also called Bourbon Pointu, is a naturally low-caffeine mutation of Bourbon.","蘿莉娜又稱尖身波旁，是天然低咖啡因的波旁突變。"]},
 {id:"eugenioides",en:"Eugenioides",zh:"尤金諾伊狄",say:"yoo-jee-nee-OY-deez",d:["Eugenioides is a different coffee species and one of the parents of Arabica, with very low caffeine and striking sweetness.","尤金諾伊狄是另一個咖啡物種，也是阿拉比卡的親本之一，咖啡因很低，甜感驚人。"]},
 {id:"castillo",en:"Castillo",zh:"卡斯提優",say:"kas-TEE-yoh",d:["Castillo is a disease-resistant variety developed in Colombia to fight coffee leaf rust.","卡斯提優是哥倫比亞為對抗葉鏽病培育的抗病品種。"]}

const PROCESSES=[
 {id:"washed",en:"washed",zh:"水洗",say:"WOSHT",d:["In washed processing, the fruit is removed and the beans are fermented and washed before drying, which gives a clean and transparent cup.","水洗處理會先去除果肉，經過發酵、清洗再乾燥，讓風味乾淨透明。"]},
 {id:"natural",en:"natural",zh:"日曬",say:"NACH-ruhl",d:["In natural processing, the whole cherry is dried with the fruit still on, which brings out fruity sweetness and a heavier body.","日曬處理是整顆咖啡果帶著果肉一起乾燥，帶出果香甜感和較厚實的口感。"]},
 {id:"honey",en:"honey-processed",zh:"蜜處理",say:"HUN-ee",d:["In honey processing, the skin is removed but some of the sticky mucilage is left on during drying, which adds sweetness and body.","蜜處理會去掉果皮，但保留部分黏稠的果膠一起乾燥，增加甜感與口感。"]},
 {id:"anaerobic",en:"anaerobic",zh:"厭氧",say:"an-uh-ROH-bik",d:["In anaerobic fermentation, the coffee ferments in sealed tanks without oxygen, which creates intense and unique fruit flavors.","厭氧發酵是讓咖啡在密封、無氧的槽中發酵，創造出強烈獨特的水果風味。"]},
 {id:"carbonic",en:"carbonic maceration",zh:"二氧化碳浸漬",say:"kar-BON-ik mas-uh-RAY-shun",d:["Carbonic maceration is borrowed from winemaking: whole cherries ferment in a tank filled with carbon dioxide.","二氧化碳浸漬法借鏡自釀酒：整顆咖啡果在充滿二氧化碳的槽中發酵。"]},
 {id:"thermal",en:"thermal shock",zh:"熱衝擊",say:"THUR-mul shock",d:["With thermal shock, the beans are washed with hot water and then cold water after fermentation to lock in the aromatics.","熱衝擊處理是在發酵後先用熱水、再用冷水沖洗，把香氣鎖住。"]},
 {id:"yeast",en:"yeast-inoculated",zh:"接種酵母",say:"yeest ih-NOK-yuh-lay-tid",d:["Yeast-inoculated fermentation uses a selected yeast strain to guide the fermentation and highlight specific flavors.","接種酵母發酵是使用選定的酵母菌株引導發酵，凸顯特定風味。"]},
 {id:"lactic",en:"lactic",zh:"乳酸發酵",say:"LAK-tik",d:["Lactic fermentation encourages lactic acid bacteria, which gives a creamy body and a yogurt-like acidity.","乳酸發酵是讓乳酸菌主導發酵，帶來奶油般的口感和優格般的酸質。"]},
 {id:"double",en:"double-fermented",zh:"雙重發酵",say:"DUB-ul fer-MEN-tid",d:["Double fermentation means the coffee is fermented twice: first as whole cherries, and then again after pulping.","雙重發酵是指咖啡發酵兩次：先整顆果實發酵，去果肉後再發酵一次。"]},
 {id:"wethulled",en:"wet-hulled",zh:"濕剝",say:"wet-HULLD",d:["Wet-hulling removes the parchment while the beans are still wet, giving an earthy, heavy-bodied cup.","濕剝法是在豆子還潮濕時就去掉內果皮，風味厚實且帶土壤調性。"]}

 m.addEventListener("click",e=>{if(e.target===m)close()});document.body.appendChild(m)}

function pickSheet(k){const lab={hot:"熱的時候",warm:"溫的時候",cool:"涼的時候"}[k];
 const body=FLAVORS.map(c=>`<h2>${c.cat}</h2><div>${c.items.map(i=>`<span class="chip ${S.f[k].includes(i[0])?"on":""}" data-act="togflv" data-k="${k}" data-v="${esc(i[0])}">${esc(i[0])} <small>${esc(i[1])}</small></span>`).join("")}</div>`).join("");
 sheet(lab+" 選風味（建議 2–3 個）",body)}
function wordSheet(w){const o=FLV[w]||VMAP[w.toLowerCase()];if(!o)return;
 const ex=[`I'm getting notes of ${o.en}.`,`我喝到${o.zh}的調性。`];
 sheet("風味詞",`<div class="big-en">${esc(o.en)}</div><div class="mute">${esc(o.zh)}${o.say?"・🗣 "+esc(o.say):""}</div>
  <div class="btns" style="margin:10px 0"><button class="btn pri" data-act="say" data-v="${esc(o.en)}">▶ 唸一次</button><button class="btn" data-act="slow" data-v="${esc(o.en)}">🐢 慢速</button></div>
  <div class="ent"><p>${esc(ex[0])} <button class="pl" data-act="say" data-v="${esc(ex[0])}">▶</button></p><div class="zh">${esc(ex[1])}</div></div>
  <div class="sm mute" style="margin:10px 0 6px">加進我的講稿：</div>
  <div class="btns">${[["hot","fire","熱"],["warm","sun","溫"],["cool","snow","涼"]].map(x=>`<button class="btn ${S.f[x[0]].includes(o.en)?"pri":""}" data-act="togflv2" data-k="${x[0]}" data-v="${esc(o.en)}">${spr(x[1],16)}${x[2]}</button>`).join("")}</div>`)}

  <div class="tip">想好中文但不會說英文？先寫中文，英文可以參考「描述句型」或問答頁的句子改寫。</div><button class="btn pri" data-act="savecustom" data-v="${sec}">加入</button>`)}

/* ---- 跟讀 ---- */
let rec=null,recBusy=false,mediaRec=null,chunks=[];
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function norm(t){return t.toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9'. ]+/g," ").replace(/\.(?!\d)/g," ").split(/\s+/).filter(Boolean)}
function compare(target,heard){const a=norm(target),b=norm(heard);const n=a.length,m=b.length;const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
 for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
 const ok=new Array(n).fill(false);let i=0,j=0;while(i<n&&j<m){if(a[i]===b[j]){ok[i]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}
 const c=ok.filter(Boolean).length;return {words:a.map((w,k)=>({w,ok:ok[k]})),score:n?Math.round(c/n*100):0}}
function shadowSheet(text,id){V.shText=text;V.shId=id||null;
 sheet("跟讀評分",`<div class="ent"><p style="font-size:18px;margin:0">${esc(text)}</p>${id?`<div class="zh">${esc((allSentences(false).find(x=>x.id===id)||{}).zh||"")}</div>`:""}</div>
  <div class="btns" style="justify-content:center"><button class="btn" data-act="say" data-v="${esc(text)}">▶ 正常</button><button class="btn" data-act="slow" data-v="${esc(text)}">🐢 慢速</button></div>
  <button class="rec" id="recbtn" data-act="rec">${spr("mic",44)}</button><div class="sm mute" style="text-align:center" id="rechint">${SR?"按下麥克風開始唸，唸完再按一次":"這個瀏覽器不支援語音辨識，改成錄音後自己回放比對"}</div><div id="recout" style="margin-top:12px"></div>
  ${id?`<div class="btns" style="justify-content:center;margin-top:10px"><button class="btn" data-act="shadownext">下一句 →</button></div>`:""}`)}
function stopRec(){if(rec){try{rec.stop()}catch(e){}}if(mediaRec&&mediaRec.state==="recording"){try{mediaRec.stop()}catch(e){}}}
function toggleRec(){const btn=$("#recbtn");if(!btn)return;
 if(recBusy){stopRec();return}
 if(window.speechSynthesis)speechSynthesis.cancel();
 if(SR){rec=new SR();rec.lang=S.set.accent;rec.interimResults=true;rec.continuous=true;let txt="";
  rec.onresult=e=>{txt=[...e.results].map(r=>r[0].transcript).join(" ");const o=$("#recout");if(o)o.innerHTML=`<div class="sm mute">聽到：${esc(txt)}</div>`};
  rec.onerror=e=>{if(e.error==="not-allowed")toast("請允許使用麥克風");else if(e.error!=="no-speech"&&e.error!=="aborted")toast("辨識錯誤："+e.error)};
  rec.onend=()=>{recBusy=false;rec=null;const b=$("#recbtn");if(b){b.classList.remove("on");b.innerHTML=spr("mic",44)}$("#rechint")&&($("#rechint").textContent="再按一次重唸");if(txt)showResult(txt)};
  try{rec.start();recBusy=true;btn.classList.add("on");btn.textContent="■";$("#rechint").textContent="正在聽…唸完按 ■"}catch(e){toast("無法開始辨識")}}
 else if(navigator.mediaDevices&&window.MediaRecorder){navigator.mediaDevices.getUserMedia({audio:true}).then(st=>{chunks=[];mediaRec=new MediaRecorder(st);
  mediaRec.ondataavailable=e=>chunks.push(e.data);mediaRec.onstop=()=>{st.getTracks().forEach(t=>t.stop());recBusy=false;const b=$("#recbtn");if(b){b.classList.remove("on");b.innerHTML=spr("mic",44)}
   const url=URL.createObjectURL(new Blob(chunks,{type:mediaRec.mimeType}));const o=$("#recout");if(o)o.innerHTML=`<div class="sm mute" style="margin-bottom:6px">你的錄音：</div><audio controls src="${url}" style="width:100%"></audio>`};
  mediaRec.start();recBusy=true;btn.classList.add("on");btn.textContent="■"}).catch(()=>toast("請允許使用麥克風"))}
 else toast("這個瀏覽器不支援錄音")}
function showResult(txt){const r=compare(V.shText,txt);const o=$("#recout");if(!o)return;
 if(V.shId){const prev=S.best[V.shId];if(prev==null||r.score>prev){S.best[V.shId]=r.score;save()}}
 const miss=r.words.filter(w=>!w.ok).map(w=>w.w);
 o.innerHTML=`<div style="text-align:center"><span class="score">${r.score}%</span><div class="sm mute">${r.score>=90?"很棒！幾乎完美 🎉":r.score>=70?"不錯，再順一次":"多聽幾次慢速再跟"}</div></div>
  <div class="diff" style="margin-top:10px">${r.words.map(w=>`<span class="${w.ok?"y":"n"}">${esc(w.w)}</span>`).join("")}</div>
  ${miss.length?`<div class="btns" style="margin-top:8px">${[...new Set(miss)].slice(0,8).map(w=>`<button class="pl" data-act="say" data-v="${esc(w)}">▶ ${esc(w)}</button>`).join("")}</div>`:""}
  <div class="sm mute" style="margin-top:8px">辨識結果：${esc(txt)}</div>`}
function randomSentence(weak){const all=allSentences(true);if(!all.length)return null;
 if(weak){const s=all.slice().sort((a,b)=>(S.best[a.id]??-1)-(S.best[b.id]??-1));return s[0]}
 return all[Math.floor(Math.random()*all.length)]}

/* ---- 測驗 ---- */
let quizState=null;
function startQuiz(type){let pool=VOCAB.slice();
 if(type==="mine"){const t=allSentences(true).map(s=>s.en.toLowerCase()).join(" ");pool=VOCAB.filter(o=>t.includes(o.en.toLowerCase()))}
 if(type==="wrong")pool=VOCAB.filter(o=>S.wrong[o.en]>0);
 if(pool.length<2){toast("題目不夠，先多選幾個風味");return}
 close();quizState={type,qs:shuffle(pool).slice(0,10),i:0,right:0,done:false};quizQ()}
function quizQ(){const q=quizState;if(q.i>=q.qs.length){sheet("測驗結果",`<div style="text-align:center"><div class="score">${q.right} / ${q.qs.length}</div><div class="mute" style="margin:6px 0 14px">${q.right===q.qs.length?"全對！":"答錯的已放進錯題本"}</div><button class="btn pri big" data-act="quiz" data-v="${q.type}">再來一輪</button></div>`);quizState=null;return}
 const it=q.qs[q.i];const listen=q.type==="listen";
 const same=VOCAB.filter(o=>o!==it&&o.cat===it.cat);const others=shuffle(same.length>=3?same:VOCAB.filter(o=>o!==it)).slice(0,3);
 const opts=shuffle([it,...others]);q.cur=it;q.opts=opts;q.answered=false;
 const body=`<div class="qz"><div class="prog"><i style="width:${q.i/q.qs.length*100}%"></i></div><div class="ask">${it.cat}・${listen?"聽英文，選出中文意思":"選出對應的英文"}</div>
  <div class="prompt">${listen?`<button class="btn pri" data-act="say" data-v="${esc(it.en)}">▶ 再聽一次</button>`:esc(it.zh)}</div>
  <div class="opts">${opts.map((o,k)=>`<button class="opt" data-act="ans" data-v="${k}">${esc(listen?o.zh:o.en)}</button>`).join("")}</div><div id="qfb"></div></div>`;
 const m=$("#mask");if(m&&quizState){$("#sbody").innerHTML=body}else{const keep=quizState;sheet("單字測驗",body);quizState=keep}
 if(listen)setTimeout(()=>speak(it.en),250)}
function answer(k){const q=quizState;if(!q||q.answered)return;q.answered=true;const o=q.opts[k],it=q.cur;const ok=o===it;
 document.querySelectorAll(".opt").forEach((b,i)=>{if(q.opts[i]===it)b.classList.add("ok");else if(i===+k)b.classList.add("bad")});
 if(ok){q.right++;if(S.wrong[it.en])S.wrong[it.en]--}else S.wrong[it.en]=(S.wrong[it.en]||0)+2;save();
 if(q.type!=="listen")speak(it.en);
 $("#qfb").innerHTML=`<div class="ent" style="margin-top:10px"><b>${esc(it.en)}</b> <span class="mute">${esc(it.zh)}</span>${it.say?`<div class="say">🗣 ${esc(it.say)}</div>`:""}</div><button class="btn pri big" data-act="qnext">下一題 →</button>`}

/* ---- 彩排 ---- */
let RH=null;
function rehearse(){const b=build();const secs=SECS.filter(([k])=>(b[k]||[]).some(s=>!s.off));const base=secs.reduce((n,s)=>n+s[3],0);
 sheet("計時彩排",`<div id="rh"></div>`);
 RH={secs:secs.map(s=>({k:s[0],zh:s[1],en:s[2],target:Math.round(s[3]/base*S.set.total*0.85)})),i:-1,t0:0,splits:[],timer:null};rhDraw()}
function rhDraw(){if(!RH||!$("#rh"))return;const now=RH.t0?(Date.now()-RH.t0)/1000:0;const b=build();
 const cur=RH.secs[RH.i];const over=now>S.set.total;
 $("#rh").innerHTML=`<div class="clock ${over?"over":""}">${RH.t0?fmt(now):fmt(0)}</div><div class="sm mute" style="text-align:center;margin-bottom:10px">總時間 ${fmt(S.set.total)}・剩 ${over?"超時 "+fmt(now-S.set.total):fmt(S.set.total-now)}</div>
 ${cur?`<div class="prompter">${(b[cur.k]||[]).filter(s=>!s.off).map(s=>`<p>${esc(s.en)}</p>${S.set.zh?`<p class="z">${esc(s.zh)}</p>`:""}`).join("")}</div>`:`<div class="tip">提詞板會顯示目前這一段。段落時間是依總時間按比例分配，並保留約 15% 給沖煮動作。</div>`}
 <div style="margin:12px 0">${RH.secs.map((s,i)=>{const sp=RH.splits[i];return `<div class="segrow ${i===RH.i?"cur":i<RH.i?"done":""}"><span>${i<RH.i?"✓":i===RH.i?"▶":"・"} ${s.zh} <span class="sm mute">${s.en}</span></span><span class="r">${sp!=null?`<span class="${sp>s.target?"over":"under"}">${fmt(sp)}</span> / `:""}${fmt(s.target)}</span></div>`}).join("")}</div>
 ${RH.done?`<div class="tip">完成！總共 ${fmt(RH.total)}。紅字是超過建議時間的段落。</div><button class="btn pri big" data-act="close">關閉</button>`:
  `<button class="btn pri big" data-act="rhnext">${RH.i<0?"開始計時 ▶":RH.i===RH.secs.length-1?"結束 ■":"下一段 →"}</button>`}`}
function rhNext(){if(!RH)return;const now=Date.now();
 if(RH.i<0){RH.t0=now;RH.last=now;RH.i=0;RH.timer=setInterval(rhDraw,500)}
 else{RH.splits[RH.i]=(now-RH.last)/1000;RH.last=now;RH.i++;
  if(RH.i>=RH.secs.length){clearInterval(RH.timer);RH.done=true;RH.total=(now-RH.t0)/1000;const d=new Date();
   S.runs.push({d:(d.getMonth()+1)+"/"+d.getDate(),t:Math.round(RH.total)});S.runs=S.runs.slice(-20);save()}}
 rhDraw();const p=document.querySelector(".prompter");if(p)p.scrollTop=0}

/* ================= 事件 ================= */
document.addEventListener("click",e=>{const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act,v=t.dataset.v;
 switch(a){
 case"tab":stopAll();V.tab=v;render();scrollTo(0,0);break;
 case"smode":stopAll();{const was=V.scriptMode;V.scriptMode=v;close();V.tab="script";render();if(was==="edit"||v==="edit")scrollTo(0,0)}break;
 case"gohide":V.tab="script";V.scriptMode="hide";render();scrollTo(0,0);break;
 case"gogap":V.tab="script";V.scriptMode="gap";render();scrollTo(0,0);break;
 case"togzh":S.set.zh=!S.set.zh;save();render();break;
 case"fsub":V.flavSub=v;render();break;
 case"osub":V.originSub=v;render();break;
 case"say":speak(v);break;
 case"slow":speak(v,.65);break;
 case"playall":playAll();break;
 case"setcur":P.i=+v;playOne();break;
 case"pone":playOne();break;
 case"pnext":{const n=allSentences(true).length;P.i=Math.min(n-1,P.i+1);playOne();break}
 case"pprev":P.i=Math.max(0,P.i-1);playOne();break;
 case"pauto":if(P.auto){stopAll();refreshPlayer()}else playList(allSentences(true),{track:true,repeat:true,start:P.i});break;
 case"p1":S.f[t.dataset.k]=v;if(t.dataset.k==="name")S.f.nameZh=v;save();render();break;
 case"pcity":S.f.city=v;S.f.cityZh=(CITIES.find(c=>c[0]===v)||[0,v])[1];save();render();break;
 case"pcountry":{const o=byId(ORIGINS,v);S.f.country=v;S.f.region=o.r[0][0];save();render();break}
 case"pcust":{const k=t.dataset.k;const x=prompt(t.dataset.q||"自填",S.f[k]||"");if(x==null||!x.trim())return;S.f[k]=x.trim();if(k==="city")S.f.cityZh=x.trim();if(k==="name")S.f.nameZh=x.trim();save();render();break}
 case"pm":{const k=t.dataset.k;const val=(k==="extras"||k==="closings")?+v:v;const arr=S.f[k]=S.f[k]||[];const i=arr.indexOf(val);if(i>=0)arr.splice(i,1);else arr.push(val);save();render();break}
 case"ppair":{const k=t.dataset.k,arr=k==="theme"?THEMES:STORIES,o=arr[+v];S.f[k+"En"]=o[0];S.f[k+"Zh"]=o[0]?o[1]:"";save();render();break}
 case"ppaircust":{const k=t.dataset.k;const en=prompt(k==="theme"?"主題（英文）":"故事（英文，一兩句）",S.f[k+"En"]||"");if(en==null||!en.trim())return;const zh=prompt("中文意思（可空白）",S.f[k+"Zh"]||"");S.f[k+"En"]=en.trim();S.f[k+"Zh"]=(zh||"").trim();save();render();break}
 case"ptemp":V.temp=v;render();break;
 case"pfcat":V.fcat=+v;render();break;
 case"pflv":{const k=t.dataset.k,arr=S.f[k];const i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else{if(arr.length>=4){toast("每個溫度最多 4 個");return}arr.push(v)}save();render();break}
 case"dsave":{const cur=S.cur&&S.drafts[S.cur];const def=cur?cur.name:autoName();
  sheet("存草稿",`<label class="fld"><span>草稿名稱</span><input id="dname" value="${esc(def)}"></label><div class="sm mute" style="margin-bottom:10px">${esc(draftSummary(S.f))}・${allSentences(true).length} 句</div>
  <div class="btns">${cur?`<button class="btn pri" data-act="dsave2" data-v="over">存回「${esc(cur.name)}」</button><button class="btn" data-act="dsave2" data-v="new">另存成新草稿</button>`:`<button class="btn pri" data-act="dsave2" data-v="new">儲存</button>`}</div>`);break}
 case"dsave2":{let name=($("#dname").value||"").trim()||autoName();if(v==="new"&&S.cur&&S.drafts[S.cur]&&name===S.drafts[S.cur].name)name=autoName();const d=new Date();const ds=`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  const id=v==="over"&&S.cur?S.cur:"d"+Date.now().toString(36);
  S.drafts[id]={name,d:ds,o:Date.now(),n:allSentences(true).length,sum:draftSummary(S.f),st:clone(curState())};S.cur=id;V.dopen=true;save();close();render();toast("已存到「📒 我的草稿」");break}
 case"dopen":{const d=S.drafts[v];if(!d)return;if(isDirty()&&!confirm("目前這份有改過還沒存，要直接打開別的草稿嗎？"))return;
  const st=clone(d.st);S.f=Object.assign(clone(DEF),st.f);S.ovr=st.ovr||{};S.off=st.off||{};S.custom=st.custom||{};S.cur=v;P.i=0;V.scriptMode="read";save();render();scrollTo(0,0);toast("已打開「"+d.name+"」");break}
 case"dplay":{const d=S.drafts[v];if(!d)return;if(playing){stopAll();refreshPlayer();return}playList(allSentences(true,d.st),{});toast("播放「"+d.name+"」，再按一次停止");break}
 case"dren":{const d=S.drafts[v];const n=prompt("新的草稿名稱",d.name);if(n&&n.trim()){d.name=n.trim();save();render()}break}
 case"ddel":{if(!t.dataset.arm){t.dataset.arm=1;t.textContent="確定刪除？";setTimeout(()=>{if(t.isConnected){delete t.dataset.arm;t.textContent="✕ 刪除"}},2500);return}delete S.drafts[v];if(S.cur===v)S.cur=null;save();render();break}
 case"dnew":if(isDirty()&&!confirm("目前這份有改過還沒存，確定開新的？"))return;S.f=clone(DEF);S.ovr={};S.off={};S.custom={};S.cur=null;P.i=0;V.scriptMode="edit";save();render();scrollTo(0,0);toast("開了一份新講稿（範例資料）");break;
 case"unhide":t.classList.remove("hide");break;
 case"reveal":t.classList.add("show");break;
 case"shadow":{const s=allSentences(false).find(x=>x.id===v);if(s)shadowSheet(s.en,s.id);break}
 case"shadowtext":shadowSheet(v,null);break;
 case"shadowrand":{const s=randomSentence(false);if(s)shadowSheet(s.en,s.id);break}
 case"shadowweak":{const s=randomSentence(true);if(s)shadowSheet(s.en,s.id);break}
 case"shadownext":{const s=randomSentence(false);if(s)shadowSheet(s.en,s.id);break}
 case"rec":toggleRec();break;
 case"edit":editSheet(v);break;
 case"saveedit":S.ovr[v]={en:$("#e-en").value.trim(),zh:$("#e-zh").value.trim()};save();close();render();toast("已改寫");break;
 case"resetedit":delete S.ovr[v];save();close();render();break;
 case"off":S.off[v]=!S.off[v];save();render();break;
 case"addcustom":customSheet(v);break;
 case"savecustom":{const en=$("#e-en").value.trim();if(!en){toast("請先寫英文");return}(S.custom[v]=S.custom[v]||[]).push({en,zh:$("#e-zh").value.trim()});save();close();render();break}
 case"delcustom":{const [k,c]=v.split(".c");S.custom[k].splice(+c,1);save();render();break}
 case"pick":pickSheet(v);break;
 case"togflv":{const k=t.dataset.k,arr=S.f[k];const i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else{if(arr.length>=4){toast("每個溫度最多 4 個");return}arr.push(v)}t.classList.toggle("on",i<0);save();render();break}
 case"togflv2":{const k=t.dataset.k,arr=S.f[k];const i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else{if(arr.length>=4){toast("每個溫度最多 4 個");return}arr.push(v)}t.classList.toggle("pri",i<0);save();toast(i<0?"已加入講稿":"已從講稿移除");break}
 case"rmflv":{const arr=S.f[t.dataset.k];arr.splice(arr.indexOf(v),1);save();render();break}
 case"word":wordSheet(v);break;
 case"usecountry":{const o=byId(ORIGINS,v);S.f.country=v;S.f.region=o.r[0][0];save();toast("講稿產地改成 "+o.zh);break}
 case"usevar":S.f.variety=v;save();toast("講稿品種改成 "+byId(VARIETIES,v).zh);break;
 case"useproc":S.f.process=v;save();toast("講稿處理法改成 "+byId(PROCESSES,v).zh);break;
 case"resetform":if(confirm("恢復範例資料？你填的會被覆蓋。")){S.f=clone(DEF);save();render()}break;
 case"quiz":startQuiz(v);break;
 case"ans":answer(v);break;
 case"qnext":quizState.i++;quizQ();break;
 case"total":S.set.total=+v;save();render();break;
 case"rehearse":rehearse();break;
 case"rhnext":rhNext();break;
 case"close":close();render();break;
 case"settings":settingsSheet();break;
 case"rate":S.set.rate=+v;save();settingsSheet();speak("Please take your first sip.");break;
 case"accent":S.set.accent=v;save();settingsSheet();speak("Please take your first sip.");break;
 case"export":{const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));navigator.clipboard.writeText(code).then(()=>toast("備份碼已複製"),()=>prompt("複製這段備份碼",code));break}
 case"import":{const c=prompt("貼上備份碼");if(!c)return;try{const o=JSON.parse(decodeURIComponent(escape(atob(c.trim()))));localStorage.setItem(KEY,JSON.stringify(o));S=load();close();render();toast("已還原")}catch(err){toast("備份碼不正確")}break}
 case"clearwrong":S.wrong={};save();toast("已清空");break;
 case"clearedits":if(confirm("清除所有改寫和自訂句？")){S.ovr={};S.custom={};S.off={};save();close();render()}break;
 case"share":navigator.clipboard.writeText(location.href.split("#")[0]).then(()=>toast("已複製連結"),()=>toast("無法複製，請從網址列複製"));break;
 }});
document.addEventListener("change",e=>{const el=e.target;if(!el.dataset||!el.dataset.f)return;const k=el.dataset.f;S.f[k]=el.value;
 if(k==="country"){const o=byId(ORIGINS,el.value);S.f.region=o.r[0][0];save();const box=el.closest("details");V.openForm=box&&box.dataset.box;render();return}
 save()});
document.addEventListener("input",e=>{const el=e.target;if(el.dataset&&el.dataset.f&&el.tagName!=="SELECT"){S.f[el.dataset.f]=el.value;save()}});
document.addEventListener("toggle",e=>{if(e.target.dataset&&e.target.dataset.dr)V.dopen=e.target.open},true);
function hl(id){document.querySelectorAll(".sen.play").forEach(x=>x.classList.remove("play"));if(!id)return;const el=document.getElementById("s-"+id.replace(/\./g,"_"));if(el){el.classList.add("play");el.scrollIntoView({behavior:"smooth",block:"center"})}}
function readView(){return V.tab==="script"&&V.scriptMode!=="edit"}
function refreshPlayer(){document.querySelectorAll("[data-act=playall]").forEach(b=>b.innerHTML=playing&&!P.auto?"■ 停止":spr("spk",14)+"全部念");
 if(!readView())return;const all=allSentences(true);const cur=all[P.i];const pl=$(".player");
 if(pl){pl.querySelector(".pli").textContent=`${P.auto?"🔁 自動跟唸中・":""}第 ${all.length?P.i+1:0}/${all.length} 句${cur?"・"+((SECS.find(x=>x[0]===cur.sec)||[])[1]||""):""}`;
  const a=pl.querySelector("[data-act=pauto]");a.textContent=P.auto?"■ 停":"🔁 跟唸";a.classList.toggle("on",P.auto)}
 document.querySelectorAll(".sen.cur").forEach(x=>x.classList.remove("cur"));
 const el=cur&&document.getElementById("s-"+cur.id.replace(/\./g,"_"));if(el)el.classList.add("cur")}
function playList(list,opt){opt=opt||{};stopAll();if(!list.length)return;let i=opt.start||0;const tok={};playing=tok;if(opt.repeat)P.auto=true;refreshPlayer();
 const next=()=>{if(playing!==tok)return;
  if(i>=list.length||(opt.one&&i>(opt.start||0))){playing=null;P.auto=false;if(!opt.one)hl(null);refreshPlayer();return}
  const s=list[i];if(opt.track){P.i=i;refreshPlayer();hl(s.id)}i++;
  speak(s.en,null,()=>{if(playing!==tok)return;const gap=opt.repeat?(wordsCount(s.en)*0.45/S.set.rate+1.3)*1000:450;setTimeout(next,opt.one?0:gap)})};
 next()}
function playAll(){if(playing&&!P.auto){stopAll();refreshPlayer();return}playList(allSentences(true),{track:readView()})}
function playOne(){const all=allSentences(true);if(!all.length)return;P.i=Math.max(0,Math.min(all.length-1,P.i));playList(all,{track:true,one:true,start:P.i})}
render();
</script>
<script>/*offline*/if("serviceWorker"in navigator)navigator.serviceWorker.register("../sw.js",{scope:"../"}).catch(function(){});</script>
