<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Roke 的 App">
<meta name="theme-color" content="#3b2a20">
<title>Roke 的 App</title>
<style>
:root{--bg:#f6f1ea;--card:#fff;--ink:#2b2018;--mute:#8a7a6c;--line:#e4d9cc;--accent:#3b2a20}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;padding:calc(20px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto}
h1{font-size:26px;margin:4px 0 4px}
.sub{color:var(--mute);font-size:14px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
a.app{display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;transition:transform .12s,box-shadow .12s}
a.app:active{transform:scale(.98)}
a.app:hover{box-shadow:0 4px 14px rgba(59,42,32,.12)}
.ic{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
.nm{font-size:17px;font-weight:700}
.ds{font-size:13px;color:var(--mute);margin-top:3px;line-height:1.4}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:8px;background:#efe6da;color:#6b5646;margin-top:6px}
footer{margin-top:28px;font-size:12px;color:var(--mute);text-align:center}
</style>
</head>
<body>
<main>
  <h1>Roke 的 App</h1>
  <div class="sub">點一下就能打開</div>
  <div class="grid" id="grid"></div>
  <footer>新增 App：把它放進一個新資料夾，再在這頁的 APPS 清單加一行。</footer>
</main>
<script>
// 新增 App：在這裡加一行 { path, name, desc, icon, color, tag }
const APPS = [
  { path:"molecule/",    name:"分子消消樂",          desc:"分子模型配對遊戲，認識官能基與分子結構", icon:"🧪", color:"#dbeafe", tag:"遊戲" },
  { path:"coffee-expo/", name:"2026 台灣咖啡展 逛展地圖", desc:"南港1館 4F 互動平面圖、名店標示、已逛紀錄與筆記", icon:"☕", color:"#efe0c8", tag:"11/13–11/16" },
  { path:"fukuoka-trip/", name:"福岡 5大2小 8天7夜", desc:"每日行程時間軸、地圖導航、待辦打包清單、計程車與買票日文卡", icon:"🍁", color:"#fbe0d6", tag:"11/21–11/28" },
  { path:"spelling/",           name:"拼字消消樂",     desc:"英文拼字配對遊戲，點單字聽發音與字母", icon:"🔤", color:"#fef3c7", tag:"遊戲" },
  { path:"molecule-reactions/", name:"分子反應圖鑑",   desc:"用分子模型看懂光合作用、水果香氣、咖啡風味等化學反應", icon:"⚗️", color:"#dcfce7", tag:"學習" },
  { path:"extraction-sim/",     name:"萃取分子模擬器", desc:"模擬手沖咖啡萃取時各種風味分子的溶出", icon:"🫖", color:"#ede0d4", tag:"咖啡" },
  { path:"cupping/",            name:"杯測教室",       desc:"咖啡杯測流程與風味評分練習", icon:"☕", color:"#f5e6d3", tag:"咖啡" },
  { path:"smell-training/",     name:"嗅覺練習日誌",   desc:"香氣材料嗅覺練習與紀錄", icon:"👃", color:"#fce7f3", tag:"練習" },
  { path:"yoshi-combos/",       name:"耀西連招手冊",   desc:"任天堂明星大亂鬥 耀西連招整理", icon:"🦖", color:"#d9f99d", tag:"遊戲" },
  { path:"mtx-sim/",            name:"小台指期模擬器", desc:"模擬下單、保證金、風險指標，可手動控制指數", icon:"📈", color:"#e0e7ff", tag:"投資" },
  { path:"eink-notes/",         name:"元太法說會筆記", desc:"元太 法說會重點整理", icon:"📝", color:"#f1f5f9", tag:"投資" }
];
document.getElementById("grid").innerHTML = APPS.map(a=>`
  <a class="app" href="${a.path}">
    <div class="ic" style="background:${a.color}">${a.icon}</div>
    <div><div class="nm">${a.name}</div><div class="ds">${a.desc}</div>${a.tag?`<span class="tag">${a.tag}</span>`:""}</div>
  </a>`).join("");
</script>
</body>
</html>
