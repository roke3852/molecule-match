<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Roke 的 App">
<meta name="theme-color" content="#3b2a20">
<title>Roke 的 App</title>
<style>
:root{--bg:#f6f1ea;--card:#fff;--ink:#2b2018;--mute:#8a7a6c;--line:#e4d9cc;--accent:#3b2a20;--star:#f5a524;--new:#e5484d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;padding:calc(20px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto}
h1{font-size:26px;margin:4px 0 4px}
.sub{color:var(--mute);font-size:14px;margin-bottom:14px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar label{font-size:13px;color:var(--mute)}
select,.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 10px}
.btn{cursor:pointer}
.btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.notice{background:#fff4e5;border:1px solid #f3d5a8;color:#7a4b12;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:14px;display:flex;gap:8px;align-items:flex-start}
.notice b{color:var(--new)}
.notice .x{margin-left:auto;background:none;border:0;font-size:16px;color:#7a4b12;cursor:pointer;padding:0 2px}
h2{font-size:15px;color:var(--mute);margin:18px 2px 8px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.app{position:relative;display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 44px 14px 14px;transition:transform .12s,box-shadow .12s}
.app:hover{box-shadow:0 4px 14px rgba(59,42,32,.12)}
.app:active{transform:scale(.98)}
.app a.cover{position:absolute;inset:0;border-radius:16px;z-index:1}
.ic{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px;flex:none;position:relative}
.dot{position:absolute;top:-4px;right:-4px;background:var(--new);color:#fff;font-size:10px;font-weight:700;border-radius:8px;padding:1px 5px;border:2px solid var(--card)}
.bd{flex:1;min-width:0}
.nm{font-size:17px;font-weight:700}
.ds{font-size:13px;color:var(--mute);margin-top:3px;line-height:1.4}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:8px;background:#efe6da;color:#6b5646}
.ver{font-size:11px;padding:1px 7px;border-radius:8px;background:#eef2f6;color:#475569;font-variant-numeric:tabular-nums}
.ver.new{background:#fde8e8;color:var(--new);font-weight:700}
.note{font-size:12px;color:#7a4b12;background:#fff4e5;border-radius:8px;padding:4px 8px;margin-top:6px;line-height:1.4}
.star{position:absolute;top:8px;right:8px;z-index:2;width:34px;height:34px;border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:#cbbfb2;border-radius:10px}
.star.on{color:var(--star)}
.mv{display:none;width:100%;gap:6px}
.editing .mv{display:flex}
.editing .star{display:none}
.editing a.cover{display:none}
.editing .app{flex-wrap:wrap;padding-right:14px}
.mv button{flex:1;height:38px;border:1px solid var(--line);background:#faf6f0;color:var(--ink);border-radius:10px;font:inherit;font-size:13px;cursor:pointer}
.mv button:active{background:#efe6da}
.mv button:disabled{opacity:.3}
.head{display:flex;align-items:flex-start;gap:10px}
.head>div{flex:1;min-width:0}
.refresh{flex:none;margin-top:6px;font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:7px 13px;cursor:pointer;display:flex;align-items:center;gap:5px}
.refresh .r{display:inline-block}
.refresh.busy .r{animation:spin .8s linear infinite}
.refresh:disabled{opacity:.7}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--accent);color:#fff;font-size:14px;padding:9px 16px;border-radius:20px;box-shadow:0 4px 14px rgba(0,0,0,.2);z-index:9;max-width:90vw;text-align:center}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.cats button{flex:none;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.cats button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.cats .cnt{font-size:12px;opacity:.65;margin-left:3px}
#list h2:first-child{margin-top:4px}
.empty{color:var(--mute);font-size:14px;padding:28px 12px;text-align:center;background:var(--card);border:1px dashed var(--line);border-radius:16px;line-height:1.6}
.tabs{display:flex;gap:4px;background:#ebe2d6;padding:4px;border-radius:12px;margin-bottom:12px}
.tabs button{flex:1;font:inherit;font-size:15px;font-weight:600;border:0;background:none;color:var(--mute);padding:9px 6px;border-radius:9px;cursor:pointer}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(59,42,32,.15)}
.tabs .cnt{font-size:12px;font-weight:500;margin-left:4px;opacity:.7}
footer{margin-top:28px;font-size:12px;color:var(--mute);text-align:center;line-height:1.6}
</style>
</head>
<body>
<main>
  <div class="head">
    <div>
      <h1>Roke 的 App</h1>
      <div class="sub">點一下就能打開・點 ☆ 加入我的最愛分頁</div>
    </div>
    <button class="refresh" id="refreshBtn" aria-label="重新整理"><span class="r">↻</span>更新</button>
  </div>

  <div class="tabs" id="tabs">
    <button data-tab="all">全部 App<span class="cnt" id="cntAll"></span></button>
    <button data-tab="fav">⭐ 我的最愛<span class="cnt" id="cntFav"></span></button>
  </div>

  <div class="cats" id="cats"></div>

  <div class="bar">
    <label for="sort">排序</label>
    <select id="sort">
      <option value="default">預設</option>
      <option value="recent">最近使用</option>
      <option value="freq">最常使用</option>
      <option value="updated">最近更新</option>
      <option value="name">名稱</option>
      <option value="custom">自訂順序</option>
    </select>
    <button class="btn" id="editBtn">調整順序</button>
  </div>

  <div id="notice"></div>
  <div id="list"></div>

  <footer>按右上角「↻ 更新」會重新抓這頁和所有 App 的最新版。<br>新增或更新 App：在這頁的 APPS 清單加一行或改 ver / updated（日期＋時間）/ note。<br>版本號一變，首頁就會在那個 App 上顯示「新版」。<br><span id="hubVer"></span></footer>
</main>
<script>
const HUB_VER = "2.0";
/* 分類：App 的 cat 填這裡的 id；順序就是分類標籤與分組的順序 */
const CATS = [
  { id:"coffee", name:"咖啡", icon:"☕" },
  { id:"learn",  name:"學習", icon:"🧪" },
  { id:"invest", name:"投資", icon:"📈" },
  { id:"travel", name:"旅行", icon:"✈️" },
  { id:"game",   name:"遊戲", icon:"🎮" },
  { id:"life",   name:"生活", icon:"🐱" }
];
/* 新增 App：加一行 { path, name, desc, icon, color, cat, tag, ver, updated, note }
   更新 App：把 ver 往上加、updated 改成更新的日期時間（"YYYY-MM-DD HH:MM"，台灣時間）、note 寫這次改了什麼 */
const APPS = [
  { path:"outfit/",      name:"穿搭試衣間", desc:"設定身高體重與各部位尺寸，人形試穿各風格單品；多人衣櫃、自己新增衣服與照片、商店真實售價估預算", icon:"👕", color:"#e3e8ee", cat:"life", tag:"穿搭",
    ver:"1.12", updated:"2026-11-17 11:55", note:"首頁背景可以換：服飾街夜景、日本街頭、台灣街頭、海邊、攝影棚，選了會記住" },
  { path:"cat-food/",    name:"毛毛的飲食過敏紀錄", desc:"罐頭／飼料過敏與喜好紀錄、成分過敏原分析、每日熱量與減重追蹤", icon:"🐱", color:"#fde9d9", cat:"life", tag:"毛毛",
    ver:"1.3.2", updated:"2026-11-16 13:55", note:"家人共用名單整理：同暱稱的裝置合併成一列、沒填暱稱又離線的不列出、舊紀錄自動清除，也可手動移除" },
  { path:"molecule/",    name:"分子消消樂",          desc:"分子模型配對遊戲，認識官能基與分子結構", icon:"🧪", color:"#dbeafe", cat:"learn", tag:"遊戲",
    ver:"1.1", updated:"2026-11-14 10:47", note:"卡片改用示性式，看得出官能基；配對成功另顯示分子式" },
  { path:"coffee-expo/", name:"2026 台灣咖啡展 逛展地圖", desc:"南港1館 4F 互動平面圖、名店標示、已逛紀錄與筆記", icon:"☕", color:"#efe0c8", cat:"coffee", tag:"11/13–11/16",
    ver:"1.6", updated:"2026-11-14 10:57", note:"新增器材／義式烘豆／生豆產區／水與吧台 4 個主題篩選，補 30 多家廠商介紹與 6 個新攤位" },
  { path:"fukuoka-trip/", name:"福岡 5大2小 8天7夜", desc:"每日行程時間軸、地圖導航、待辦打包清單、計程車與買票日文卡", icon:"🍁", color:"#fbe0d6", cat:"travel", tag:"11/21–11/28",
    ver:"2.14", updated:"2026-11-16 19:35", note:"11/21–11/23 標示為日本三連休（11/23 勤勞感謝日），並提醒人潮" },
  { path:"spelling/",           name:"拼字消消樂",     desc:"英文拼字配對遊戲，點單字聽發音與字母", icon:"🔤", color:"#fef3c7", cat:"learn", tag:"遊戲", ver:"1.0", updated:"2026-11-14 10:17" },
  { path:"ball-stick/", name:"分子球棍組裝", desc:"放球、接棍子，組出球棍模型；基礎＋進階 53 關，計分、稱號與排行榜，從氫氣到綠原酸", icon:"⚛️", color:"#d5ebe5", cat:"learn", tag:"遊戲", ver:"1.5", updated:"2026-11-17 11:20", note:"新增遊戲開始畫面；預設立體模型、分子式隱藏（提示會扣分）、玩家選單與 4 碼密碼" },
  { path:"molecule-reactions/", name:"分子反應圖鑑",   desc:"用分子模型看懂光合作用、水果香氣、咖啡風味等化學反應", icon:"⚗️", color:"#dcfce7", cat:"learn", tag:"學習", ver:"1.0", updated:"2026-11-14 10:17" },
  { path:"extraction-sim/",     name:"手沖咖啡實驗室", desc:"萃取模擬器＋客人闖關＋咖啡比賽＋磨豆機挑戰＋4:6 教學", icon:"🫖", color:"#ede0d4", cat:"coffee", tag:"咖啡", ver:"5.2", updated:"2026-11-16 20:25", note:"嗅覺斷水：新增「各階段混在一起聞起來像什麼」，9 個香氣家族、甜香 vs 苦澀感氣味、嗅覺疲勞開關" },
  { path:"coffee-lab-plan/",    name:"咖啡實驗室商業化路線圖", desc:"五階段路線圖、待解問題清單、第一個月推廣計畫、贊助模式、收入試算；可用 Google 雲端同步進度", icon:"🗺️", color:"#f4e3e4", cat:"coffee", tag:"商業化", ver:"1.3", updated:"2026-11-16 01:30", note:"新增「贊助合作」分頁：五種贊助模式依難度排列、起步順序、合作要談清楚的五件事清單" },
  { path:"brew-log/",           name:"沖煮紀錄 × 風味地圖", desc:"手沖紀錄：控制圖、注水曲線、高溫/中常溫風味雷達、參數對風味", icon:"📊", color:"#d6ece6", cat:"coffee", tag:"咖啡", ver:"1.4", updated:"2026-11-14 23:15", note:"新增「實驗」分頁：每杯自動比出改了什麼參數、結果變了什麼，預期 vs 結果判定，標記有干擾的杯" },
  { path:"brew-notes/",         name:"沖煮筆記",       desc:"記一杯：複製上一杯、0–5 分三溫度感官、風味輪、養豆天數；甜蜜點圖、改參數的影響、重現性；可貼上文字筆記自動填寫", icon:"📓", color:"#f4e1e6", cat:"coffee", tag:"咖啡", ver:"1.0", updated:"2026-11-16 23:58" },
  { path:"cupping/",            name:"杯測教室",       desc:"咖啡杯測流程與風味評分練習", icon:"☕", color:"#f5e6d3", cat:"coffee", tag:"咖啡", ver:"1.0", updated:"2026-11-14 10:17" },
  { path:"coffee-terroir/",     name:"咖啡風土圖鑑",   desc:"產地、品種、莊園介紹（附 Google Maps），處理法與烘豆互動教學，咖啡知識消消樂", icon:"🌍", color:"#f4ede2", cat:"coffee", tag:"咖啡", ver:"1.9", updated:"2026-11-17 02:20", note:"新增「配方」分頁：9 組常見配方豆與風味雷達圖，可自己調比例與焙度" },
  { path:"grinder-guide/",      name:"磨豆機拆裝教學", desc:"C40、ZP6 Special 拆解與組合，一步一步圖解＋限時挑戰", icon:"🔧", color:"#e8e2d8", cat:"coffee", tag:"咖啡", ver:"1.3", updated:"2026-11-15 23:45", note:"挑戰加入固定、旋轉方向與轉三下的動作；C40 可選固定搖柄或固定三爪" },
  { path:"bean-hunter/",        name:"咖啡尋豆師",     desc:"尋豆師模擬遊戲：飛產地、參訪莊園、杯測、驗豆、議價、競標；主線故事、莊園與客戶對話、病蟲害、生涯升級與生豆圖鑑", icon:"🧭", color:"#dfe9dc", cat:"coffee", tag:"遊戲", ver:"1.1", updated:"2026-11-17 10:25", note:"新增玩家登入（名字＋可選的 4 碼密碼）、線上存檔、排行榜" },
  { path:"gear-atlas/",         name:"咖啡器材圖鑑",   desc:"磨豆機、濾杯、義式咖啡機、烘焙設備：原理圖解、58 項代表器材、並排比較、小測驗、自訂照片", icon:"⚙️", color:"#e3e8ee", cat:"coffee", tag:"咖啡", ver:"1.3", updated:"2026-11-17 01:15", note:"新增 Google 雲端同步：收藏、照片與測驗紀錄存到自己的雲端硬碟，換手機也看得到" },
  { path:"smell-training/",     name:"嗅覺練習日誌",   desc:"香氣材料嗅覺練習與紀錄", icon:"👃", color:"#fce7f3", cat:"coffee", tag:"練習", ver:"1.0", updated:"2026-11-14 10:17" },
  { path:"yoshi-combos/",       name:"耀西連招手冊",   desc:"任天堂明星大亂鬥 耀西連招整理", icon:"🦖", color:"#d9f99d", cat:"game", tag:"遊戲", ver:"1.0", updated:"2026-11-14 10:17" },
  { path:"mtx-sim/",            name:"小台指期模擬器", desc:"模擬下單、保證金、風險指標，可手動控制指數", icon:"📈", color:"#e0e7ff", cat:"invest", tag:"投資", ver:"1.0", updated:"2026-11-14 10:17" },
  { path:"eink-notes/",         name:"元太法說會筆記", desc:"元太 分季法說筆記、指引回測、股價與產線時程", icon:"📝", color:"#f1f5f9", cat:"invest", tag:"投資", ver:"2.0", updated:"2026-11-14 16:10" }
];

/* ---------- 本機儲存（每支手機/瀏覽器各自記錄） ---------- */
const KEY = "roke-hub-v1";
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || null }catch(e){ return null } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)) }catch(e){} }
let S = load();
if(!S){ /* 第一次打開：把目前版本都當成看過，不要整頁都是「新版」 */
  S = { fav:[], tab:"all", cat:"all", sort:"default", order:[], seen:{}, opens:{}, last:{}, hideNotice:"" };
  APPS.forEach(a => S.seen[a.path] = a.ver);
  save();
}
["fav","order"].forEach(k => S[k] = S[k] || []);
S.cat = S.cat || "all";
["seen","opens","last"].forEach(k => S[k] = S[k] || {});
/* 新加入目錄的 App 也直接視為已看過 */
APPS.forEach(a => { if(!(a.path in S.seen)) S.seen[a.path] = a.ver; });
save();

let editing = false;
const isNew = a => S.seen[a.path] !== a.ver;
const isFav = a => S.fav.includes(a.path);
/* updated 格式："YYYY-MM-DD HH:MM"（台灣時間） */
const fmtDate = d => { const [date,time] = d.split(" "); const [y,m,dd] = date.split("-"); return `${+m}/${+dd}${time?" "+time:""}` };
const fmtFull = d => d.replace(/-/g,"/");

function customIndex(){
  const idx = {}; let n = 0;
  S.order.forEach(p => { if(APPS.some(a=>a.path===p) && !(p in idx)) idx[p] = n++; });
  APPS.forEach(a => { if(!(a.path in idx)) idx[a.path] = n++; });
  return idx;
}
function sorted(list){
  const def = Object.fromEntries(APPS.map((a,i)=>[a.path,i]));
  const tie = (a,b) => def[a.path]-def[b.path];
  const arr = list.slice();
  switch(S.sort){
    case "recent":  arr.sort((a,b)=>(S.last[b.path]||0)-(S.last[a.path]||0) || tie(a,b)); break;
    case "freq":    arr.sort((a,b)=>(S.opens[b.path]||0)-(S.opens[a.path]||0) || tie(a,b)); break;
    case "updated": arr.sort((a,b)=>(b.updated||"").localeCompare(a.updated||"") || isNew(b)-isNew(a) || tie(a,b)); break;
    case "name":    arr.sort((a,b)=>a.name.localeCompare(b.name,"zh-Hant")); break;
    case "custom":  { const ci = customIndex(); arr.sort((a,b)=>ci[a.path]-ci[b.path]); break; }
    default:        arr.sort(tie);
  }
  return arr;
}

function card(a, i, n){
  const nw = isNew(a);
  return `<div class="app" data-p="${a.path}">
    <a class="cover" href="${a.path}?v=${encodeURIComponent(a.ver||"")}" aria-label="${a.name}"></a>
    <div class="ic" style="background:${a.color}">${a.icon}${nw?`<span class="dot">新</span>`:""}</div>
    <div class="bd">
      <div class="nm">${a.name}</div>
      <div class="ds">${a.desc}</div>
      <div class="meta">
        ${a.tag?`<span class="tag">${a.tag}</span>`:""}
        ${a.ver?`<span class="ver${nw?" new":""}">v${a.ver}${nw?" 新版":""}${a.updated?" · "+fmtDate(a.updated):""}</span>`:""}
      </div>
      ${nw && a.note ? `<div class="note">${a.updated?`<b>${fmtFull(a.updated)}</b> 更新：`:"更新："}${a.note}</div>` : ""}
    </div>
    <button class="star${isFav(a)?" on":""}" data-fav="${a.path}" aria-label="我的最愛">${isFav(a)?"★":"☆"}</button>
    <div class="mv">
      <button data-mv="top" data-p="${a.path}" ${i===0?"disabled":""}>⤒ 置頂</button>
      <button data-mv="up" data-p="${a.path}" ${i===0?"disabled":""}>▲ 上移</button>
      <button data-mv="down" data-p="${a.path}" ${i===n-1?"disabled":""}>▼ 下移</button>
      <button data-mv="bottom" data-p="${a.path}" ${i===n-1?"disabled":""}>⤓ 置底</button>
    </div>
  </div>`;
}

const catOf = a => CATS.some(c=>c.id===a.cat) ? a.cat : "other";
const catName = id => { const c = CATS.find(c=>c.id===id); return c ? `${c.icon} ${c.name}` : "其他"; };
const inTab = a => S.tab !== "fav" || isFav(a);
const visible = () => sorted(APPS).filter(a => inTab(a) && (S.cat === "all" || catOf(a) === S.cat));
/* 依分類分組（看「全部分類」且排序為預設／自訂／名稱時）；其他情況一整串 */
function blocks(){
  const list = visible();
  const group = S.cat === "all" && ["default","custom","name"].includes(S.sort);
  if(!group) return [{ title:"", items:list }];
  const ids = [...CATS.map(c=>c.id), "other"];
  return ids.map(id => ({ title:catName(id), items:list.filter(a=>catOf(a)===id) })).filter(b=>b.items.length);
}

function render(){
  document.getElementById("sort").value = S.sort;
  const eb = document.getElementById("editBtn");
  eb.textContent = editing ? "完成" : "調整順序";
  eb.classList.toggle("on", editing);

  /* 版本提示 */
  const news = APPS.filter(isNew);
  const sig = news.map(a=>a.path+a.ver).join("|");
  document.getElementById("notice").innerHTML = news.length && S.hideNotice !== sig
    ? `<div class="notice">🔔<div><b>${news.length} 個 App 有新版</b>：${news.map(a=>`${a.name} v${a.ver}`).join("、")}</div><button class="x" id="closeNotice" aria-label="關閉">✕</button></div>`
    : "";

  /* 分頁 */
  if(S.tab !== "fav") S.tab = "all";
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === S.tab));
  document.getElementById("cntAll").textContent = APPS.length;
  document.getElementById("cntFav").textContent = APPS.filter(isFav).length;

  /* 分類標籤 */
  const pool = APPS.filter(inTab);
  const used = [...CATS.map(c=>c.id), "other"].filter(id => APPS.some(a=>catOf(a)===id));
  if(S.cat !== "all" && !used.includes(S.cat)) S.cat = "all";
  document.getElementById("cats").innerHTML =
    `<button data-cat="all" class="${S.cat==="all"?"on":""}">全部分類<span class="cnt">${pool.length}</span></button>` +
    used.map(id => `<button data-cat="${id}" class="${S.cat===id?"on":""}">${catName(id)}<span class="cnt">${pool.filter(a=>catOf(a)===id).length}</span></button>`).join("");

  const bs = blocks();
  const el = document.getElementById("list");
  el.className = editing ? "editing" : "";
  el.innerHTML = bs.some(b=>b.items.length)
    ? bs.map(b => `${b.title?`<h2>${b.title}</h2>`:""}<div class="grid">${b.items.map((a,i)=>card(a,i,b.items.length)).join("")}</div>`).join("")
    : S.tab === "fav"
      ? `<div class="empty">${S.cat==="all"?"還沒有最愛的 App":"這個分類還沒有最愛的 App"}<br>到「全部 App」點卡片右上角的 ☆ 就會加進來</div>`
      : `<div class="empty">這個分類目前沒有 App</div>`;
}

/* 在自訂順序中移動：只在同一組（畫面上同一區塊）裡移動 */
function move(path, how){
  const order = sorted(APPS).map(a=>a.path);
  const group = (blocks().find(b=>b.items.some(a=>a.path===path)) || {items:[]}).items.map(a=>a.path);
  const i = group.indexOf(path); if(i<0) return;
  let target;
  if(how==="up") target = group[i-1];
  else if(how==="down") target = group[i+1];
  else if(how==="top") target = group[0];
  else target = group[group.length-1];
  if(!target || target===path) return;
  if(how==="up" || how==="down"){
    const pi = order.indexOf(path), pj = order.indexOf(target);
    [order[pi], order[pj]] = [order[pj], order[pi]];
  } else {
    order.splice(order.indexOf(path),1);
    const t = order.indexOf(target);
    order.splice(how==="top" ? t : t+1, 0, path);
  }
  S.order = order; save(); render();
  const c = document.querySelector(`.app[data-p="${CSS.escape(path)}"]`);
  if(c) c.scrollIntoView({block:"nearest", behavior:"smooth"});
}

/* 重新整理：繞過快取重抓目錄頁與每個 App，再重新載入 */
function toast(msg){
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2600);
}
async function refreshAll(){
  const b = document.getElementById("refreshBtn");
  b.disabled = true; b.classList.add("busy"); b.lastChild.textContent = "更新中…";
  const before = Object.fromEntries(APPS.map(a=>[a.path,a.ver]));
  try{ sessionStorage.setItem("roke-hub-before", JSON.stringify(before)); }catch(e){}
  const opt = { cache:"reload" };
  await Promise.allSettled([
    fetch("./", opt), fetch("index.html", opt),
    ...APPS.map(a => fetch(a.path, opt))
  ]);
  location.replace(location.pathname + "?r=" + Date.now());
}
(function afterRefresh(){
  const q = new URLSearchParams(location.search);
  if(!q.has("r")) return;
  history.replaceState(null, "", location.pathname);
  let before = null;
  try{ before = JSON.parse(sessionStorage.getItem("roke-hub-before")); sessionStorage.removeItem("roke-hub-before"); }catch(e){}
  if(!before) return;
  const changed = APPS.filter(a => before[a.path] !== a.ver);
  setTimeout(()=>toast(changed.length ? `已更新：${changed.map(a=>`${a.name} v${a.ver}`).join("、")}` : "已是最新版"), 150);
})();
document.getElementById("refreshBtn").addEventListener("click", refreshAll);
document.getElementById("hubVer").textContent = `目錄頁 v${HUB_VER}`;
document.getElementById("cats").addEventListener("click", e=>{
  const b = e.target.closest("[data-cat]"); if(!b) return;
  S.cat = b.dataset.cat; save(); render();
});

document.getElementById("sort").addEventListener("change", e=>{
  S.sort = e.target.value;
  if(S.sort === "custom" && !S.order.length) S.order = APPS.map(a=>a.path);
  if(S.sort !== "custom") editing = false;
  save(); render();
});
document.getElementById("tabs").addEventListener("click", e=>{
  const b = e.target.closest("[data-tab]"); if(!b) return;
  S.tab = b.dataset.tab; save(); render(); window.scrollTo(0,0);
});
/* 按「調整順序」會自動切到自訂順序，從目前看到的順序開始調 */
document.getElementById("editBtn").addEventListener("click", ()=>{
  if(!editing && S.sort !== "custom"){
    S.order = sorted(APPS).map(a=>a.path);
    S.sort = "custom"; save();
  }
  editing = !editing; render();
});

document.getElementById("list").addEventListener("click", e=>{
  const f = e.target.closest("[data-fav]");
  if(f){ e.preventDefault();
    const p = f.dataset.fav;
    S.fav = S.fav.includes(p) ? S.fav.filter(x=>x!==p) : [...S.fav, p];
    save(); render(); return; }
  const m = e.target.closest("[data-mv]"); if(m){ if(!m.disabled) move(m.dataset.p, m.dataset.mv); return; }
  const a = e.target.closest("a.cover");
  if(a){ /* 記錄使用次數、最後使用時間，並把這版標成已看過 */
    const p = a.closest(".app").dataset.p, app = APPS.find(x=>x.path===p);
    S.opens[p] = (S.opens[p]||0) + 1; S.last[p] = Date.now(); S.seen[p] = app.ver; save();
  }
});
document.getElementById("notice").addEventListener("click", e=>{
  if(e.target.id === "closeNotice"){
    S.hideNotice = APPS.filter(isNew).map(a=>a.path+a.ver).join("|"); save(); render();
  }
});
/* 從 App 返回首頁時（iOS 的返回快取）重新整理狀態 */
window.addEventListener("pageshow", ()=>{ S = load() || S; render(); });
render();
</script>
