<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>分子反應圖鑑</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
/* Layout: sticky topic switcher, a hero with the topic's signature molecule spinning, then a numbered pathway of reaction steps (reactants → condition → products) */
:root{
  --bg:#eef2f1; --surface:#fbfcfc; --ink:#16202a; --muted:#566370; --line:#d3dbdf; --chip:#e3e9ec;
  --green:#2a8648; --amber:#ad6208; --brown:#7a4729; --teal:#17768a; --toast:#a8431c; --indigo:#3b5bb0; --rose:#ad3557; --caramel:#95601a; --violet:#6b3fae; --olive:#5f6f12; --cobalt:#1c6fb8; --azure:#2563c9; --pos:#d0423b; --neg:#2f6fd8; --plum:#8a3a86; --wheat:#8a6a12; --tS:#8a6d00; --tP:#b35a0a; --atom-Na:#9058d6; --atom-Cl:#2ea64c;
  --accent:var(--green);
  --atom-C:#3a4048; --atom-H:#f3f5f7; --atom-O:#de3f37; --atom-N:#3263d4; --atom-S:#e3bb20; --atom-P:#ea8521;
  --atom-edge:rgba(20,30,40,.30); --stick:#8d969f;
  --f-display:"Noto Serif TC","Songti TC","Source Han Serif TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1216; --surface:#141b21; --ink:#e5ebef; --muted:#97a3ae; --line:#25303a; --chip:#1d262e;
  --green:#5bbf7b; --amber:#eba23e; --brown:#cf9a6e; --teal:#4cb5c9; --toast:#e8825a; --indigo:#839ff0; --rose:#ef7f9e; --caramel:#e3ad62; --violet:#b591f2; --olive:#bccb5a; --cobalt:#6db3ef; --azure:#79a7f5; --pos:#ff7a70; --neg:#6fa2ff; --plum:#e08ad8; --wheat:#e3c15e; --tS:#e8c43a; --tP:#f0953a; --atom-Na:#b48af0; --atom-Cl:#55cc70;
  --atom-C:#838b95; --atom-H:#e8ecf0; --atom-O:#ef5a4f; --atom-N:#5f8cf2; --atom-S:#e8c43a; --atom-P:#f0953a;
  --atom-edge:rgba(0,0,0,.5); --stick:#5c6670; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1216; --surface:#141b21; --ink:#e5ebef; --muted:#97a3ae; --line:#25303a; --chip:#1d262e;
  --green:#5bbf7b; --amber:#eba23e; --brown:#cf9a6e; --teal:#4cb5c9; --toast:#e8825a; --indigo:#839ff0; --rose:#ef7f9e; --caramel:#e3ad62; --violet:#b591f2; --olive:#bccb5a; --cobalt:#6db3ef; --azure:#79a7f5; --pos:#ff7a70; --neg:#6fa2ff; --plum:#e08ad8; --wheat:#e3c15e; --tS:#e8c43a; --tP:#f0953a; --atom-Na:#b48af0; --atom-Cl:#55cc70;
  --atom-C:#838b95; --atom-H:#e8ecf0; --atom-O:#ef5a4f; --atom-N:#5f8cf2; --atom-S:#e8c43a; --atom-P:#f0953a;
  --atom-edge:rgba(0,0,0,.5); --stick:#5c6670; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body[data-topic="fruit"]{--accent:var(--amber)}
body[data-topic="coffee"]{--accent:var(--brown)}
body[data-topic="maillard"]{--accent:var(--toast)}
body[data-topic="maillardsim"]{--accent:var(--toast)}
body[data-topic="redox"]{--accent:var(--indigo)}
body[data-topic="atp"]{--accent:var(--rose)}
body[data-topic="caramel"]{--accent:var(--caramel)}
body[data-topic="caramelsim"]{--accent:var(--caramel)}
body[data-topic="cleaning"]{--accent:var(--teal)}
body[data-topic="carbs"]{--accent:var(--wheat)}
body[data-topic="protein"]{--accent:var(--rose)}
body[data-topic="fat"]{--accent:var(--amber)}
body[data-topic="vsepr"]{--accent:var(--cobalt)}
body[data-topic="cga"],body[data-topic="cgagame"]{--accent:var(--green)}
body[data-topic="ions"]{--accent:var(--azure)}
body[data-topic="acidbase"]{--accent:var(--violet)}
body[data-topic="aliphatic"]{--accent:var(--olive)}
body[data-topic="aromatic"]{--accent:var(--cobalt)}
body[data-topic="saturation"]{--accent:var(--plum)}
body[data-topic="sugar"]{--accent:var(--wheat)}
body[data-topic="groups"]{--accent:var(--teal)}
body[data-topic="review"]{--accent:var(--teal)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1040px;margin:0 auto;padding-block:8px 48px}

.bar{display:flex;flex-direction:column;gap:10px;padding-block:12px 14px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:900;font-size:17px;letter-spacing:.04em}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:8px 14px}
.tgroup{display:flex;flex-direction:column;gap:5px;min-width:0}
.tglab{font-size:11px;letter-spacing:.12em;color:var(--muted)}
.tgbtns{display:flex;flex-wrap:wrap;gap:5px}
.tabs button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 12px;border-radius:999px;cursor:pointer}
.tabs button:hover{border-color:var(--accent)}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700}
[hidden]{display:none!important}
.minibar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:10px;background:var(--bg);border-bottom:1px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));box-shadow:0 2px 8px rgba(0,0,0,.08)}
.minibar .brand{font-size:15px}
.minibar b{font-size:14px;color:var(--accent);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.minibar button,.nshead button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.navsheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:center;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px))}
.nscard{background:var(--bg);border-radius:16px;padding:14px;width:100%;max-width:720px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.nshead{display:flex;justify-content:space-between;align-items:center}
.nshead b{font-family:var(--f-display);font-size:17px}
.minibar button:focus-visible,.nshead button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs button:focus-visible,.play:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:center;padding-block:28px 12px}
.hero h1{font-family:var(--f-display);font-weight:900;font-size:clamp(34px,7vw,56px);line-height:1.15;margin:0 0 10px;text-wrap:balance}
.hero h1 span{color:var(--accent)}
.eqn{font-family:var(--f-mono);font-size:clamp(14px,2.4vw,18px);background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:8px 12px;display:inline-block;margin-bottom:14px;max-width:100%;overflow-x:auto;white-space:nowrap}
.hero p{margin:0;color:var(--muted);max-width:36em}
.hero-mol{position:relative;aspect-ratio:1/0.85;max-width:100%}
.hero-mol canvas{width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab}
.hero-mol .tag{position:absolute;left:0;bottom:0;font-size:12px;color:var(--muted)}
.hero-mol .tag b{color:var(--ink);font-weight:700}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);padding-block:10px 4px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:1px solid var(--atom-edge)}
.legend .hint{margin-left:auto}

.steps{display:flex;flex-direction:column;gap:18px;margin-top:18px;counter-reset:s}
.step{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.step header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.num{font-family:var(--f-mono);font-weight:500;font-size:13px;color:var(--accent);letter-spacing:.08em}
.step h2{font-family:var(--f-display);font-weight:700;font-size:22px;margin:0;line-height:1.3}
.where{font-size:12px;color:var(--muted);letter-spacing:.03em;margin-left:auto}
.step p{margin:0;max-width:44em}

.eq{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center}
.side{display:flex;flex-direction:column;gap:8px;min-width:0}
.side .label{font-size:11px;letter-spacing:.12em;color:var(--muted)}
.mols{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px}
.mol{margin:0;position:relative;background:var(--bg);border-radius:12px;padding:6px 8px 10px;display:flex;flex-direction:column;min-width:0;transition:box-shadow .3s}
.mol canvas{width:100%;aspect-ratio:1/0.82;display:block;touch-action:pan-y;cursor:grab}
.mol canvas:active,.hero-mol canvas:active{cursor:grabbing}
.coef{position:absolute;top:8px;left:10px;font-family:var(--f-mono);font-size:13px;font-weight:500;color:var(--accent)}
.mol figcaption{display:flex;flex-direction:column;line-height:1.35;gap:1px}
.mol b{font-size:14px}
.en{font-size:11px;color:var(--muted)}
.fx{font-family:var(--f-mono);font-size:12.5px;margin-top:2px}
.cf{font-family:var(--f-mono);font-size:12.5px;line-height:1.45;overflow-wrap:anywhere}
.cf em{font-family:var(--f-body);font-style:normal;font-size:10.5px;color:var(--muted);margin-right:5px;letter-spacing:.04em}
.fgc{color:var(--accent);font-weight:500}
.cfi,.clcf{font-family:var(--f-mono);overflow-wrap:anywhere}
.clcf{font-size:12px;color:var(--muted)}
.fgchips{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.fgchip{font-size:10.5px;line-height:1.5;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--ink);border-radius:999px;padding:0 7px;white-space:nowrap}
.fgchip i{font-style:normal;font-family:var(--f-mono);color:var(--muted);margin-left:3px}
.fgchip b{font-family:var(--f-mono);font-weight:500;color:var(--accent);margin-left:2px}
.note{font-size:12px;color:var(--muted);margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-mono);font-size:12px;background:var(--chip);border-radius:999px;padding:2px 10px}

.arrow{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);font-size:12px;text-align:center;max-width:120px}
.arrow svg{width:56px;height:16px;overflow:visible}
.arrow .shaft{stroke:var(--line);stroke-width:2}
.arrow .fill{stroke:var(--accent);stroke-width:2;stroke-dasharray:50;stroke-dashoffset:50}
.arrow .head{fill:var(--accent)}

.play{align-self:flex-start;font:inherit;font-size:13px;font-weight:500;border:1px solid var(--accent);color:var(--accent);background:transparent;
  border-radius:999px;padding:5px 14px;cursor:pointer}
.play:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}

.run .reactants .mol{animation:give 2.6s ease both}
.run .products .mol{animation:take 2.6s ease both}
.run .arrow .fill{animation:flow 2.6s ease both}
@keyframes give{0%{box-shadow:0 0 0 0 transparent}20%{box-shadow:0 0 0 2px var(--accent)}45%{opacity:1}60%{opacity:.35;box-shadow:0 0 0 0 transparent}100%{opacity:1}}
@keyframes take{0%{opacity:1}12%{opacity:.15;transform:scale(.94)}55%{opacity:.15;transform:scale(.94)}75%{opacity:1;transform:scale(1.03);box-shadow:0 0 0 2px var(--accent)}100%{transform:none;box-shadow:0 0 0 0 transparent}}
@keyframes flow{0%,25%{stroke-dashoffset:50}60%,100%{stroke-dashoffset:0}}

.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:18px}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.grp canvas{width:100%;aspect-ratio:1/0.62;display:block;touch-action:pan-y;cursor:grab;background:var(--bg);border-radius:10px}
.grp .head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.grp h2{font-family:var(--f-display);font-weight:700;font-size:20px;margin:0}
.grp .gf{font-family:var(--f-mono);font-size:15px;color:var(--accent);font-weight:500}
.grp .cls{font-size:12px;color:var(--muted)}
.grp .ex{font-size:12px;color:var(--muted)}
.grp .ex b{color:var(--ink);font-weight:500}
.grp p{margin:0;font-size:14px}
.grp .seen{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-top:auto;padding-top:4px}
.go{font:inherit;font-size:12px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:1px 10px;cursor:pointer}
.go:hover{border-color:var(--accent);color:var(--accent)}
.go:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.go i{font-style:normal;color:var(--muted);margin-right:4px}
.hero-mol .tag .now{color:var(--accent);font-weight:700}
.ladder{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:18px;display:flex;flex-direction:column;gap:14px}
.ladder h2{font-family:var(--f-display);font-weight:700;font-size:22px;margin:0}
.ladder > p{margin:0;max-width:44em}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.rule{background:var(--bg);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.rule b{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500}
.rule span{font-size:14px}
.rule .ox-r{color:var(--accent);font-weight:700}
.rungs-wrap{overflow-x:auto;padding-bottom:4px}
.rungs{display:grid;grid-template-columns:repeat(5,minmax(112px,1fr));gap:8px;min-width:580px}
.rung{display:flex;flex-direction:column;gap:6px;min-width:0}
.ox{font-family:var(--f-mono);font-size:22px;font-weight:500;text-align:center;color:var(--accent)}
.ox small{display:block;font-size:11px;color:var(--muted);font-family:var(--f-body);font-weight:400}
.dir{min-width:580px;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px;align-items:center}
.dir .bar2{flex:1;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--line),var(--accent))}
.wordf{background:var(--bg);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.wordf b{color:var(--accent);font-size:13px}
.wf{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.term{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-weight:500}
.term.res{border-color:var(--accent);color:var(--accent)}
.op{font-family:var(--f-mono);color:var(--muted)}
.parts{margin-top:0;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.parts .gf{font-size:12px;color:var(--muted);font-weight:400}
.ediag{overflow-x:auto}
.ediag svg{width:100%;max-width:520px;display:block;margin:0 auto}
.ediag .ax{stroke:var(--line);stroke-width:1.5}
.ediag .axl,.ediag .sub{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.ediag .curve{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.ediag .lbl{fill:var(--ink);font-size:13px;font-weight:700;font-family:var(--f-mono)}
.ediag .dg{stroke:var(--ink);stroke-width:1.5}
.ediag .dgh{fill:var(--ink)}
.ediag .guide{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 4}
.ediag .dgl{fill:var(--accent);font-size:13px;font-weight:700;font-family:var(--f-mono)}
.after{margin-top:18px}
.cycle{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;counter-reset:c}
.cycle li{counter-increment:c;display:flex}
.stage{font:inherit;text-align:left;color:inherit;width:100%;background:var(--bg);border:1.5px solid transparent;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;font-size:14px;cursor:pointer;transition:border-color .3s}
.stage.on{border-color:var(--accent)}
.stage:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mscene{background:var(--bg);border-radius:12px;padding:8px}
.mscene svg{width:100%;max-width:560px;display:block;margin:0 auto}
.mscene .cap{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.mscene .actin circle{fill:color-mix(in srgb,var(--accent) 30%,var(--surface));stroke:var(--accent);stroke-width:1}
.mscene .thick{fill:var(--stick)}
.mscene .neck{stroke:var(--stick);stroke-width:7;stroke-linecap:round}
.mscene .blob{fill:var(--atom-N);stroke:var(--atom-edge);stroke-width:1}
.mscene .cargo rect{fill:var(--surface);stroke:var(--accent);stroke-width:1.2}
.mscene .cargo text,.mscene .pi text{fill:var(--ink);font-size:10px;font-family:var(--f-mono);text-anchor:middle;font-weight:500}
.mscene .pi{opacity:0;transform:translate(236px,108px);transition:transform 1.2s ease,opacity .4s}
.mscene .pi circle{fill:var(--atom-P)}
.mscene .pi.go{opacity:1;transform:translate(300px,118px)}
.mscene .slide{opacity:0;transition:opacity .3s}
.mscene .slide.on{opacity:1}
.mscene .slide line{stroke:var(--ink);stroke-width:1.5}
.mscene .slide path{fill:var(--ink)}
.mscene .slide text{fill:var(--ink);font-size:11px;font-family:var(--f-body)}
.cycle li b::before{content:counter(c) " ";font-family:var(--f-mono);color:var(--accent)}
.swatches{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.sw{display:flex;flex-direction:column;gap:2px;font-size:13px;background:var(--bg);border-radius:12px;padding:10px}
.sw .chipc{height:44px;border-radius:8px;margin-bottom:6px;border:1px solid var(--atom-edge)}
.sw b{font-size:14px}
.sw .tp{font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.mnemo{margin-top:18px}
.mnemo h3{font-family:var(--f-display);font-weight:700;font-size:18px;margin:6px 0 0}
.verse{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:6px}
.vline{font:inherit;color:inherit;width:100%;text-align:left;background:var(--bg);border:1.5px solid transparent;border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.vline:hover{border-color:var(--accent)}
.vline:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vt{font-size:14px}
.verse .vg{font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--ink)}
.verse .vg i{font-size:12px}
.sdraw{display:flex;justify-content:center;align-items:center;min-height:64px;overflow-x:auto}
.sdraw svg{display:block;max-width:100%;height:auto}
.sdraw line{stroke:var(--ink);stroke-width:1.6;stroke-linecap:round}
.sdraw .sa{font-family:var(--f-mono);font-size:15px;font-weight:500;text-anchor:middle;dominant-baseline:central;fill:var(--ink)}

  <p class="foot">模型為示意：原子位置由簡易力場自動排列，鍵長與鍵角是近似值，未呈現順反與手性等立體化學。部分步驟把多步反應壓縮成一步，標示於反應條件中。</p>

<script>
// ---- core: SMILES-lite parser, valence H filling, 3D relaxation layout (no DOM) ----
const VAL = { C: 4, N: 3, O: 2, S: 2, P: 5, H: 1, Cl: 1, Na: 1 };
const RAD = { C: 0.34, N: 0.32, O: 0.32, S: 0.42, P: 0.4, H: 0.22, Cl: 0.46, Na: 0.5 };

function parseSmiles(s) {
  const atoms = [], bonds = [];
  let prev = -1, order = 1;
  const stack = [], ring = {};
  const addBond = (a, b, o) => bonds.push({ a, b, o });
  const addAtom = (el, charge) => {
    atoms.push({ el, charge, parent: prev });
    const idx = atoms.length - 1;
    if (prev >= 0) addBond(prev, idx, order);
    order = 1; prev = idx;
  };
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (c === '(') stack.push(prev);
    else if (c === ')') prev = stack.pop();
    else if (c === '=') order = 2;
    else if (c === '#') order = 3;
    else if (c >= '0' && c <= '9') {
      if (ring[c]) { addBond(ring[c].a, prev, Math.max(order, ring[c].o)); delete ring[c]; }
      else ring[c] = { a: prev, o: order };
      order = 1;
    } else if (c === '[') {
      const j = s.indexOf(']', i);
      const body = s.slice(i + 1, j);
      const el = body.match(/^[A-Z][a-z]?/)[0];
      const charge = body.includes('+') ? 1 : body.includes('-') ? -1 : 0;
      addAtom(el, charge);
      i = j;
    } else if (/[A-Z]/.test(c)) addAtom(c, 0);
  }
  // fill hydrogens
  const heavy = atoms.length;
  for (let i = 0; i < heavy; i++) {
    const a = atoms[i];
    const v = a.el === 'Na' ? 0 : VAL[a.el] + a.charge;
    const used = bonds.reduce((t, b) => t + (b.a === i || b.b === i ? b.o : 0), 0);
    for (let k = 0; k < v - used; k++) {
      atoms.push({ el: 'H', charge: 0, parent: i });
      addBond(i, atoms.length - 1, 1);
    }
  }
  return { atoms, bonds };
}

function formulaOf(m) {
  const c = {};
  m.atoms.forEach(a => (c[a.el] = (c[a.el] || 0) + 1));
  const sub = n => (n === 1 ? '' : String(n).replace(/\d/g, d => '₀₁₂₃₄₅₆₇₈₉'[d]));
  const order = ['C', 'H', ...Object.keys(c).filter(k => k !== 'C' && k !== 'H').sort()];
  const q = m.atoms.reduce((t, a) => t + a.charge, 0);
  const sup = q === 0 ? '' : (Math.abs(q) > 1 ? String(Math.abs(q)).replace(/\d/g, d => '⁰¹²³⁴⁵⁶⁷⁸⁹'[d]) : '') + (q > 0 ? '⁺' : '⁻');
  return order.filter(k => c[k]).map(k => k + sub(c[k])).join('') + sup;
}

function layout(m) {
  const n = m.atoms.length;
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647 - 0.5; };
  const P = [];
  for (let i = 0; i < n; i++) {
    const p = m.atoms[i].parent;
    if (p < 0) P.push([0, 0, 0]);
    else {
      let v = [rnd(), rnd(), rnd()];
      const l = Math.hypot(...v) || 1;
      P.push([P[p][0] + v[0] / l, P[p][1] + v[1] / l, P[p][2] + v[2] / l]);
    }
  }
  const nb = Array.from({ length: n }, () => []);
  const blen = (b) => {
    const h = m.atoms[b.a].el === 'H' || m.atoms[b.b].el === 'H';
    if (h) return 0.72;
    return b.o === 1 ? 1 : b.o === 2 ? 0.88 : 0.8;
  };
  const C = [];
  const linked = new Set();
  const key = (a, b) => (a < b ? a * 1000 + b : b * 1000 + a);
  m.bonds.forEach(b => {
    const L = blen(b);
    nb[b.a].push({ j: b.b, L, o: b.o });
    nb[b.b].push({ j: b.a, L, o: b.o });
    C.push({ a: b.a, b: b.b, d: L, w: 1 });
    linked.add(key(b.a, b.b));
  });
  for (let i = 0; i < n; i++) {
    const ns = nb[i];
    if (ns.length < 2) continue;
    const doubles = ns.filter(x => x.o === 2).length, triples = ns.filter(x => x.o === 3).length;
    const ang = (doubles >= 2 || triples) ? Math.PI : doubles === 1 ? (2 * Math.PI) / 3 : 1.9106;
    for (let x = 0; x < ns.length; x++)
      for (let y = x + 1; y < ns.length; y++) {
        const a = ns[x], b = ns[y];
        const d = Math.sqrt(a.L * a.L + b.L * b.L - 2 * a.L * b.L * Math.cos(ang));
        C.push({ a: a.j, b: b.j, d, w: 0.6 });
        linked.add(key(a.j, b.j));
      }
  }
  const relax = (c, k) => {
    const A = P[c.a], B = P[c.b];
    const dx = B[0] - A[0], dy = B[1] - A[1], dz = B[2] - A[2];
    const d = Math.hypot(dx, dy, dz) || 1e-6;
    const f = ((d - c.d) / d) * 0.5 * k;
    A[0] += dx * f; A[1] += dy * f; A[2] += dz * f;
    B[0] -= dx * f; B[1] -= dy * f; B[2] -= dz * f;
  };
  const ITER = 700;
  for (let it = 0; it < ITER; it++) {
    const early = it < 250;
    for (let i = 0; i < n; i++)
      for (let j = i + 1; j < n; j++) {
        if (linked.has(key(i, j))) continue;
        const hi = m.atoms[i].el === 'H', hj = m.atoms[j].el === 'H';
        let min = hi && hj ? 1.25 : hi || hj ? 1.45 : 1.75;
        if (early) min *= 1.5;
        const A = P[i], B = P[j];
        const dx = B[0] - A[0], dy = B[1] - A[1], dz = B[2] - A[2];
        const d = Math.hypot(dx, dy, dz);
        if (d < min) relax({ a: i, b: j, d: min }, 0.3);
      }
    for (const c of C) relax(c, c.w);
  }
  // center + radius
  const cen = [0, 0, 0];
  P.forEach(p => { cen[0] += p[0] / n; cen[1] += p[1] / n; cen[2] += p[2] / n; });
  let R = 0;
  P.forEach((p, i) => {
    p[0] -= cen[0]; p[1] -= cen[1]; p[2] -= cen[2];
    R = Math.max(R, Math.hypot(...p) + RAD[m.atoms[i].el]);
  });
  m.pos = P; m.R = Math.max(R, 1);
  return m;
}

      { t: '苯環的祕密', x: '1865 年，德國化學家凱庫勒提出苯是單雙鍵交替的六角環。據說他夢見一條蛇咬住自己的尾巴，才想到碳鏈可以頭尾相接。但單雙鍵交替的畫法有兩種，苯並不是在兩者之間切換，而是兩者的平均。所以現在常在六角形裡畫一個圓，表示電子在整個環上共享。', kekule: true,
        blocks: [

}

// ---- review counts: per-viewer, saved to the viewer's private db subtree; browser storage when db is unavailable
const Review = {
  counts: {}, last: {}, mode: 'loading', ref: null, timer: null, saving: Promise.resolve(),
  load() {
    try { const d = JSON.parse(localStorage.getItem('review-v1') || '{}'); this.counts = d.counts || {}; this.last = d.last || {}; } catch (e) {}
  },
  saveLocal() { try { localStorage.setItem('review-v1', JSON.stringify({ counts: this.counts, last: this.last })); } catch (e) {} },
  async init() {
    this.load();
    const c = window.claude;
    if (!c || !c.use) { this.mode = 'local'; return this.changed(); }
    const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
    const id = user ? await user.id() : null;
    if (!db || !id) { this.mode = 'local'; return this.changed(); }
    this.ref = db.doc('data/users/' + id + '/reviews');
    const t = setTimeout(() => { if (this.mode === 'loading') { this.mode = 'offline'; this.changed(); } }, 10000);
    this.ref.onSnapshot(snap => {
      if (snap.metadata.hasPendingWrites) return;
      const d = snap.exists ? snap.data() : null;
      if (d) { this.counts = { ...(d.counts || {}) }; this.last = { ...(d.last || {}) }; }
      else if (!snap.metadata.fromCache && Object.keys(this.counts).length) this.persist(); // first visit: carry over local history
      if (!snap.metadata.fromCache) { clearTimeout(t); this.mode = 'account'; }
      this.changed();
    }, () => { clearTimeout(t); this.mode = 'local'; this.ref = null; this.changed(); });
  },
  persist() {
    this.saveLocal();
    if (!this.ref) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => {
      const body = { counts: { ...this.counts }, last: { ...this.last } };
      this.saving = this.saving.then(() => this.ref.set(body)).catch(() => { this.mode = 'local'; this.ref = null; this.changed(); });
    }, 700);
  },
  record(i) { this.counts[i] = (this.counts[i] || 0) + 1; this.last[i] = Date.now(); this.persist(); this.changed(); },
  reset() { this.counts = {}; this.last = {}; this.persist(); this.changed(); },
  changed() {
    document.querySelectorAll('.vcount').forEach(el => (el.textContent = countLabel(+el.dataset.count)));
    if (document.body.dataset.topic === 'review') renderReview();
  },
};
function countLabel(i) { const n = Review.counts[i] || 0; return n ? `複習 ${n} 次` : '尚未複習'; }
function ago(t) {
  if (!t) return '尚未複習';
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return '剛剛'; if (m < 60) return m + ' 分鐘前';
  const h = Math.round(m / 60); if (h < 24) return h + ' 小時前';
  const d = Math.round(h / 24); return d < 30 ? d + ' 天前' : new Date(t).toLocaleDateString('zh-TW');
}





// ---- 離子：拿走或加入電子 ----
const EL_DATA = [
  ['H', '氫', 1, [1, -1]], ['Li', '鋰', 3, [1]], ['C', '碳', 6, []], ['N', '氮', 7, [-3]], ['O', '氧', 8, [-2]], ['F', '氟', 9, [-1]], ['Ne', '氖', 10, []],
  ['Na', '鈉', 11, [1]], ['Mg', '鎂', 12, [2]], ['Al', '鋁', 13, [3]], ['S', '硫', 16, [-2]], ['Cl', '氯', 17, [-1]], ['Ar', '氬', 18, []], ['K', '鉀', 19, [1]], ['Ca', '鈣', 20, [2]],
];
const SHELL_CAP = [2, 8, 8, 8], SHELL_R = [46, 78, 110, 142];
const NOBLE = { 2: '氦', 10: '氖', 18: '氬' };
const IONS = { el: 'Na', Z: 11, e: 11, parts: [], raf: 0, msg: null };
const supCharge = q => (q === 0 ? '' : (Math.abs(q) > 1 ? String(Math.abs(q)).replace(/\d/g, d => '⁰¹²³⁴⁵⁶⁷⁸⁹'[d]) : '') + (q > 0 ? '⁺' : '⁻'));
function shellsOf(e) { const out = []; let left = e; for (const c of SHELL_CAP) { if (left <= 0) break; out.push(Math.min(c, left)); left -= c; } return out; }
function ionLayout() { // target angle/radius for each electron, outermost last
  const sh = shellsOf(IONS.e), out = [];
  sh.forEach((n, k) => { for (let i = 0; i < n; i++) out.push({ r: SHELL_R[k] * (IONS.e > IONS.Z ? 1 + 0.04 * (IONS.e - IONS.Z) : 1), a: (i / n) * Math.PI * 2 + k * 0.4, shell: k }); });
  return out;
}
function ionSync(instant) {
  const tg = ionLayout();
  while (IONS.parts.length < tg.length) { const a = Math.random() * 6.28; IONS.parts.push({ r: 230, a, tr: 0, ta: a, op: 0, gone: false }); }
  IONS.parts.filter(p => !p.gone).forEach((p, i) => { if (i < tg.length) { p.tr = tg[i].r; p.ta = tg[i].a; p.shell = tg[i].shell; if (instant) { p.r = p.tr; p.a = p.ta; p.op = 1; } } });
}
function ionInfo() {
  const d = EL_DATA.find(x => x[0] === IONS.el), q = IONS.Z - IONS.e, sh = shellsOf(IONS.e);
  const name = q === 0 ? d[1] + '原子' : IONS.el === 'H' && q < 0 ? '氫負離子' : d[1] + '離子';
  const noble = IONS.e > 0 && NOBLE[IONS.e] && sh[sh.length - 1] === SHELL_CAP[sh.length - 1];
  let msg;
  if (q === 0) msg = d[3].length ? `中性原子：質子和電子一樣多，正負抵消。${d[3].map(c => c > 0 ? `它容易失去 ${c} 顆電子` : `它容易得到 ${-c} 顆電子`).join('，也可能')}。` : IONS.el === 'C' ? '碳不太會變成離子，它比較喜歡和別的原子共用電子（共價鍵）。' : `${d[1]}的外層本來就是滿的，所以幾乎不會變成離子。`;
  else if (IONS.e === 0) msg = '電子全部拿光，只剩一顆質子。這就是 H⁺：酸性的來源其實就是一顆裸露的質子，在水裡會立刻黏到水分子上變成 H₃O⁺。';
  else if (d[3].includes(q)) msg = `少了 ${q > 0 ? q : -q} 顆電子之後，${q > 0 ? '正電比負電多' : '負電比正電多'}，所以帶 ${q > 0 ? '+' : '−'}${Math.abs(q)} 電荷。${noble ? `現在的電子排列和${NOBLE[IONS.e]}一樣，外層剛好填滿，非常穩定，所以${d[1]}在自然界多半以 ${IONS.el}${supCharge(q)} 的形式存在。` : ''}`.replace('少了', q > 0 ? '少了' : '多了');
  else if (q > 0) msg = `繼續拿走電子要越來越多能量。${noble ? '' : '外層沒有填滿，'}現實中 ${IONS.el}${supCharge(q)} 幾乎不存在。${IONS.el === 'Na' && q === 2 ? '例如拿走鈉的第二顆電子，需要的能量大約是第一顆的 9 倍，因為要挖開已經填滿的內層。' : ''}`;
  else msg = `電子塞太多，負電之間互相排斥，${IONS.el}${supCharge(q)} 很不穩定，現實中幾乎不存在。`;
  if (q !== 0 && IONS.e > 0) msg += q > 0 ? ' 失去外層電子後，離子會比原子小一圈。' : ' 多出來的電子互相排斥，離子會比原子大一些。';
  return { d, q, sh, name, noble, msg };
}
