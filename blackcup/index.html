<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>黑杯聽音</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
html,body,*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text}

/* 配色邏輯：黑白灰為底（黑杯）；紅＝品牌與關鍵抉擇／危險；藍＝知識（技術）；米白＝聚光燈（名聲）；青＝清澈（良心）。暖琥珀只出現在畫面裡的光源。 */
:root{
  --ink:#0e1116;--ink2:#151a22;--ink3:#1e2530;--line:#343e4c;--line2:#4a5566;
  --cream:#ece4d4;--muted:#8b93a1;--dim:#5b6372;
  --cherry:#d64545;--cherry2:#ff6b5e;--cherryD:#7a1f22;
  --blue:#6c9bd2;--teal:#4fb3a9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--cream);font-family:"Noto Sans TC",system-ui,sans-serif;touch-action:manipulation;overscroll-behavior:none}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;touch-action:manipulation}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative}
/* top frame */
.frame{position:sticky;top:0;z-index:20;background:var(--ink);border-bottom:1px solid var(--line)}
.frame:before{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--cherry) 0 18%,var(--ink3) 18% 100%)}
.frame-in{display:flex;align-items:center;gap:8px;padding:7px 10px}
.frame .ttl{font-family:"DotGothic16";color:var(--cream);letter-spacing:3px;font-size:15px;white-space:nowrap}
.frame .ttl b{color:var(--cherry);font-weight:400}
.frame .ch{font-size:11px;color:var(--muted);flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.stats{display:flex;gap:7px}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9px;color:var(--muted);font-family:"DotGothic16"}
.bar{width:40px;height:6px;background:#06080b;border:1px solid var(--line);display:flex;padding:0 1px;gap:1px}
.bar i{display:block;height:100%;flex:0 0 calc(10% - 1px)}
.screen{display:none;flex:1;flex-direction:column}
.screen.on{display:flex}
/* scene */
.scene{position:relative;width:100%;aspect-ratio:16/10;background:#000;overflow:hidden;border-bottom:1px solid var(--line)}
.scene canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
.portrait{position:absolute;left:12px;top:20px;width:60px;height:60px;image-rendering:pixelated;background:var(--ink3);border:1px solid var(--line2)}
.portrait.hide{display:none}
.box.av .txt{padding-left:72px;min-height:64px}
.loc{position:absolute;top:8px;right:8px;font-family:"DotGothic16";font-size:11px;background:rgba(14,17,22,.85);border-left:3px solid var(--cherry);padding:3px 9px;color:var(--cream);letter-spacing:1px}
/* dialogue */
.dlg{flex:1;display:flex;flex-direction:column;padding:12px 12px 8px;gap:9px;background:var(--ink)}
.box{position:relative;border:1px solid var(--line2);background:var(--ink2);padding:20px 14px 14px;min-height:140px;box-shadow:0 0 0 3px var(--ink),0 0 0 4px var(--line);cursor:pointer}
.name{position:absolute;top:-12px;left:10px;background:var(--cream);color:var(--ink);padding:1px 10px 1px 8px;font-family:"DotGothic16";font-size:14px;border-left:4px solid var(--cherry)}
.name.n{display:none}
.txt{font-size:16.5px;line-height:1.85;letter-spacing:.3px;min-height:3.6em}
.txt.narr{color:#c3c9d3;font-family:"Noto Serif TC",serif}
.more{position:absolute;right:10px;bottom:6px;color:var(--cherry);font-size:12px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.term{color:#9cc0ea;border-bottom:1px dotted var(--blue);cursor:pointer}
.pname{color:var(--cream);font-weight:700;border-bottom:1px dotted var(--muted);cursor:pointer}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tb{flex:1;min-width:48px;background:var(--ink2);border:1px solid var(--line);padding:8px 4px;font-size:12.5px;color:var(--cream);font-family:"DotGothic16"}
.tb:active{background:var(--ink3)}
.tb.on{border-color:var(--cherry);color:var(--cherry2)}
.nextbtn{display:none;background:var(--cherry);color:#fff;border:none;padding:10px;font-family:"DotGothic16";font-size:15px;box-shadow:0 3px 0 var(--cherryD)}
.nextbtn.on{display:block}
/* choices */
.choices{display:none;flex-direction:column;gap:8px}
.choices.on{display:flex}
.cq{font-family:"DotGothic16";color:var(--cream);font-size:14px;padding:4px 0 4px 10px;border-left:4px solid var(--cherry)}
.opt{text-align:left;background:var(--ink2);border:1px solid var(--line2);padding:11px 12px 11px 30px;font-size:15px;line-height:1.6;position:relative;box-shadow:0 3px 0 #06080b}
.opt:before{content:"";position:absolute;left:11px;top:19px;width:8px;height:8px;background:var(--cherry)}
.opt:active{border-color:var(--cherry);transform:translateY(2px);box-shadow:none}
.danger{font-size:11px;color:var(--cherry2);font-family:"DotGothic16";text-align:center;letter-spacing:1px}
.scene.doom canvas{filter:grayscale(.75) contrast(1.1)}
.scene.doom:after{content:"";position:absolute;inset:0;background:radial-gradient(transparent 40%,rgba(122,31,34,.55));mix-blend-mode:multiply;pointer-events:none;animation:doomin 1.2s ease-out both}
@keyframes doomin{from{opacity:0}to{opacity:1}}
.box.doom{border-color:var(--cherryD);box-shadow:0 0 0 3px var(--ink),0 0 0 4px var(--cherryD)}
.box.doom .txt.narr{color:#d9b3b3}
.aud{display:flex;gap:8px;width:100%;max-width:360px;margin-top:6px}
.slot{border:1px solid var(--line);background:var(--ink);padding:10px;margin:8px 0}
.slot-h{display:flex;justify-content:space-between;font-family:DotGothic16;font-size:13px}.slot-h b{color:var(--cream);font-weight:400;border-left:3px solid var(--cherry);padding-left:6px}.slot-h span{color:var(--muted)}
.slot-t{margin-top:6px;font-weight:700}.slot-t small{color:var(--muted);font-weight:400;margin-left:8px;font-size:12px}
.slot-p{font-size:13px;color:#c3c9d3;margin-top:4px;line-height:1.6}.slot-s{font-family:DotGothic16;font-size:12px;color:var(--muted);margin-top:4px}
.slot-b{display:flex;gap:6px;margin-top:8px}.slot-b .tb{flex:0 0 auto;padding:6px 14px}
#tvLayer{position:absolute;inset:0;pointer-events:none}
.tvl{position:absolute;font-family:"DotGothic16","Noto Sans TC",sans-serif;font-size:12px;line-height:1.5;background:rgba(14,17,22,.9);color:#c3c9d3;padding:0 7px 0 6px;border-left:2px solid #4a5566;white-space:nowrap}
.tvl.dim{font-size:10.5px;color:#8b93a1;background:rgba(14,17,22,.75)}
.tvl.hi{color:#ece4d4;border-left-color:#d64545;font-size:13px}
.tvl.dest{background:#d64545;color:#fff;border-left-color:#fff}
.tvs{position:absolute;top:8px;left:8px;font-family:"DotGothic16","Noto Sans TC",sans-serif;font-size:12px;background:rgba(14,17,22,.9);border:1px solid #4a5566;color:#ece4d4;padding:2px 8px}
#labOv{position:fixed;inset:0;z-index:95;background:#0e1116;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#labOv iframe{flex:1;width:100%;border:0;background:#1b1512}
.lab-top{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--ink)}
.lab-top>div{flex:1;min-width:0}.lab-top b{font-family:DotGothic16;font-weight:400;border-left:4px solid var(--cherry);padding-left:8px;display:block}
.lab-top span{display:block;font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lab-top button{background:var(--ink2);border:1px solid var(--line2);color:var(--cream);padding:7px 12px;font-family:DotGothic16;flex:none}
.lab-res{background:var(--ink);border-top:2px solid var(--cherry);padding:10px 12px}
.lr-t{font-family:DotGothic16;font-size:14px}.lr-t b{color:#9cc0ea;font-weight:400}.lr-t em{font-style:normal;color:var(--teal)}.lr-t i{font-style:normal;color:var(--muted)}
.lr-b{display:flex;gap:8px;margin-top:8px}.lr-b button{flex:1;padding:10px;font-family:DotGothic16;border:1px solid var(--line2);background:var(--ink2);color:var(--cream)}.lr-b #labDone{background:var(--cherry);border-color:var(--cherry);color:#fff}
.brewgo small{display:block;font-size:12px;color:var(--muted);margin-top:2px}.brewgo{border-color:var(--teal)}.brewgo:before{background:var(--teal)!important}
.cq.brewq{border-left-color:var(--teal)}
.bbean{font-size:12px;color:var(--muted);margin:-2px 0 2px;font-family:DotGothic16}
.brow{display:flex;align-items:center;gap:6px}.brow span{width:52px;font-family:DotGothic16;font-size:13px;color:var(--muted)}
.bchip{flex:1;padding:9px 0;background:var(--ink2);border:1px solid var(--line2);color:var(--cream);font-family:DotGothic16;font-size:14px}
.bchip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#0e1116}
.bbar{position:relative;height:12px;background:#06080b;border:1px solid var(--line2)}.bbar i{display:block;height:100%;width:0;background:var(--blue)}.bbar em{position:absolute;top:-4px;width:2px;height:18px;background:var(--cherry)}
.bhold{padding:20px;font-family:DotGothic16;font-size:18px;background:var(--ink2);border:2px solid var(--teal);color:var(--cream);touch-action:none;user-select:none;-webkit-user-select:none}
.bhold.on{background:var(--teal);color:#0e1116}
.big:disabled{opacity:.4}
.bres{display:flex;gap:10px;align-items:center}.bchart{width:58%;flex:none}.bnum{font-family:DotGothic16;font-size:15px}.bnum b{color:#9cc0ea;font-weight:400}.bset{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.6}
.bhint{font-size:14px;line-height:1.7;border-left:3px solid var(--blue);padding-left:8px;color:#c3c9d3}
.bscale{position:absolute;left:50%;transform:translateX(-50%);top:72%;font-family:"DotGothic16",monospace;font-size:13px;color:#9cc0ea;background:#0e1116;padding:0 6px;border:1px solid #343e4c}
.btarget{position:absolute;left:8px;top:8px;font-family:DotGothic16;font-size:12px;background:rgba(14,17,22,.9);border-left:3px solid var(--teal);padding:2px 8px}
.actcap{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;font-family:"DotGothic16","Noto Sans TC",sans-serif;font-size:14px;background:rgba(14,17,22,.9);color:#ece4d4;border-left:3px solid #d64545;padding:3px 12px;white-space:nowrap}
.jsign{position:absolute;top:56%;transform:translateX(-50%);font-family:"DotGothic16","Noto Sans TC",sans-serif;font-size:11px;color:#2e1b11;white-space:nowrap;font-weight:700}
.pestl{position:absolute;bottom:6px;transform:translateX(-50%);font-family:"DotGothic16","Noto Sans TC",sans-serif;font-size:12px;background:rgba(14,17,22,.9);color:#ece4d4;border-left:3px solid #d64545;padding:2px 9px;white-space:nowrap}
.inv{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--ink2);padding:6px 8px;min-height:46px}
.inv-h{font-family:DotGothic16;font-size:12px;color:var(--muted);writing-mode:vertical-rl;letter-spacing:2px;border-right:1px solid var(--line);padding-right:6px}
.inv-l{display:flex;flex-wrap:wrap;gap:6px;flex:1}.inv-e{font-size:12px;color:var(--dim)}
.inv-i{width:36px;height:36px;display:grid;place-items:center;background:var(--ink);border:1px solid var(--line2);padding:0}
.inv-i{position:relative}.inv-i.k:after{content:"";position:absolute;right:2px;top:2px;width:5px;height:5px;background:var(--cherry)}.inv-i.m:after{content:"";position:absolute;right:2px;top:2px;width:5px;height:5px;background:#f0b46a;border-radius:50%}
.inv-g{font-family:DotGothic16;font-size:10px;color:var(--muted);align-self:center;letter-spacing:1px}.inv-g.k{color:#ff8a7e}.inv-g.m{color:#f0b46a}.inv-sep{width:1px;align-self:stretch;background:var(--line);margin:0 2px}
.inv.ask{border-color:var(--cherry);box-shadow:0 0 0 1px var(--cherry),0 0 14px rgba(214,69,69,.35)}.inv.ask .inv-i{animation:invask 1.2s ease-in-out infinite}
@keyframes invask{50%{border-color:var(--cherry);transform:translateY(-2px)}}
.cq.useq{border-left-color:#f0b46a}
.usegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.useit{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--ink2);border:1px solid var(--line2);padding:8px 4px 6px;box-shadow:0 3px 0 #06080b;font-size:12px;line-height:1.3;color:var(--cream);position:relative}
.useit svg{image-rendering:pixelated;background:var(--ink3);border:1px solid var(--line)}
.useit small{font-family:DotGothic16;font-size:10px;color:var(--muted)}.useit.k small{color:#ff8a7e}.useit.m small{color:#f0b46a}
.useit:active{transform:translateY(2px);box-shadow:none}.useit.no{animation:useno .35s;border-color:#6a2a2a;opacity:.55}.useit.ok{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal)}
@keyframes useno{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.usemsg{font-size:14px;line-height:1.7;border-left:3px solid var(--blue);padding-left:8px;color:#c3c9d3;min-height:24px}.usemsg b{color:var(--cream)}
.usepop{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%) scale(.6);z-index:86;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--ink);border:1px solid var(--line2);border-top:4px solid #f0b46a;padding:16px 22px;box-shadow:0 10px 40px rgba(0,0,0,.6);animation:usepop .45s cubic-bezier(.2,1.4,.4,1) forwards}
.usepop svg{image-rendering:pixelated}.usepop small{font-family:DotGothic16;color:#f0b46a;letter-spacing:3px}.usepop b{font-family:"Noto Serif TC",serif;font-size:18px;color:var(--cream)}
.usepop.out{animation:usepopo .35s ease-in forwards}
@keyframes usepop{to{transform:translate(-50%,-50%) scale(1)}}@keyframes usepopo{to{transform:translate(-50%,-80%) scale(.9);opacity:0}}
.inv-i svg{image-rendering:pixelated}.inv-i.new{border-color:var(--cherry);animation:invnew .5s ease-in-out 4}
@keyframes invnew{50%{transform:translateY(-4px)}}
.itempop{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:85;display:flex;gap:12px;align-items:center;background:var(--ink);border:1px solid var(--line2);border-left:4px solid var(--cherry);padding:12px 18px 12px 14px;box-shadow:0 0 0 3px var(--ink),0 10px 30px #000;animation:itin .35s cubic-bezier(.2,1.6,.4,1) both;pointer-events:none}
.itempop svg{image-rendering:pixelated;background:var(--ink3);border:1px solid var(--line)}
.itempop small{display:block;font-family:DotGothic16;color:var(--cherry2);letter-spacing:2px;font-size:12px}.itempop b{font-family:DotGothic16;font-weight:400;font-size:17px;white-space:nowrap}
.itempop.out{opacity:0;transform:translate(-50%,-10px);transition:.4s}
@keyframes itin{from{opacity:0;transform:translate(-50%,10px) scale(.7)}to{opacity:1;transform:translateX(-50%) scale(1)}}
.rtag{position:absolute;transform:translate(-50%,-130%);font-family:"DotGothic16",sans-serif;font-size:10px;color:#ece4d4;background:rgba(14,17,22,.9);border:1px solid;padding:0 4px;white-space:nowrap}.rtag.ok{border-color:#4fb3a9;color:#4fb3a9;transform:translate(-50%,40%)}
.rlab{position:absolute;left:78%;transform:translateX(-50%);font-family:"DotGothic16",sans-serif;font-size:11px;color:#8b93a1}
.wlab{position:absolute;top:8%;transform:translateX(-50%);font-family:"DotGothic16",sans-serif;font-size:12px;background:rgba(14,17,22,.9);color:#9cc0ea;border-left:3px solid #6c9bd2;padding:2px 8px;white-space:nowrap;display:none}.wlab.bad{color:#ff6b5e;border-left-color:#d64545}
.fcount{position:absolute;left:50%;top:56%;transform:translateX(-50%);text-align:center;font-family:"DotGothic16",sans-serif;background:rgba(14,17,22,.92);border:1px solid #e48aa6;padding:3px 10px;z-index:5}
.fcount small{display:block;font-size:10px;color:#e48aa6}.fcount b{font-weight:400;font-size:18px;color:#ece4d4}
.fcard{position:absolute;display:flex;gap:6px;align-items:center;max-width:46%;background:rgba(236,228,212,.96);color:#0e1116;border-radius:6px;padding:4px 8px 4px 5px;box-shadow:0 4px 12px rgba(0,0,0,.5);font-size:10.5px;line-height:1.3;transform:rotate(var(--r));animation:fin .35s cubic-bezier(.2,1.4,.4,1) both}
.fcard i{flex:none;width:14px;height:14px;border-radius:3px}.fcard b{display:block;font-size:10px;color:#5b6372}.fcard span{display:block}
@keyframes fin{from{opacity:0;transform:translate(var(--fx),var(--fy)) rotate(var(--r)) scale(.6)}to{opacity:1;transform:rotate(var(--r))}}
.rform{position:absolute;left:50%;top:6%;width:78%;transform:translateX(-50%) rotate(-1.5deg);background:#f4efe4;color:#2a2f3a;padding:8px 10px 6px;box-shadow:0 8px 24px rgba(0,0,0,.6);font-size:10.5px;line-height:1.35;animation:formin .6s cubic-bezier(.2,1.2,.4,1) both}
@keyframes formin{from{transform:translate(-50%,60%) rotate(-6deg);opacity:0}}
.rf-h{text-align:center;border-bottom:2px solid #2a2f3a;padding-bottom:3px;margin-bottom:3px}.rf-h small{display:block;font-size:9px;color:#5b6372}.rf-h b{font-family:"Noto Serif TC",serif;font-size:14px;font-weight:900;letter-spacing:2px}.rf-h span{display:block;font-size:9.5px;letter-spacing:4px}
.rf-r{display:flex;align-items:center;gap:6px;border-bottom:1px solid #cfc3aa;padding:2px 0;position:relative;min-height:18px}.rf-r label{width:38%;font-size:10px;color:#5b6372;flex:none}
.hw{font-style:normal;font-family:"Noto Serif TC",serif;font-size:12px;color:#1f3a6b}.hw.dim{color:#8b93a1}
.rf-r.key{background:rgba(214,69,69,.1);outline:2px solid #d64545;outline-offset:1px;margin:3px 0;animation:keyb 1s steps(2) infinite}.rf-r.key label{color:#7a1f22;font-weight:700}.rf-r.key em{display:block;font-style:normal;font-size:9px;color:#d64545}
.rform.done .rf-r.key{animation:none;background:rgba(79,179,169,.12);outline-color:#4fb3a9}
@keyframes keyb{50%{outline-color:transparent}}
.need{margin-left:auto;font-size:10px;color:#d64545;font-family:DotGothic16}
.seal{margin-left:auto;border:2px solid #d64545;color:#d64545;font-size:8.5px;line-height:1.1;padding:1px 3px;transform:rotate(-12deg);font-weight:700;text-align:center;animation:stamp .4s .9s both}
@keyframes stamp{from{transform:rotate(-12deg) scale(2.4);opacity:0}}
.rf-n{font-size:8.5px;color:#7a1f22;margin-top:3px}
#tvLayer.click{pointer-events:auto}
.rfire{display:flex;gap:8px}.rfire .bhold{flex:1;padding:14px 0}
.arrsign{position:absolute;transform:translate(-50%,-50%);font-family:"DotGothic16","Noto Sans TC",sans-serif;font-size:12px;color:#f2c94c;white-space:nowrap;letter-spacing:1px}
.arrlab{position:absolute;transform:translate(-50%,-50%);font-family:"DotGothic16","Noto Sans TC",sans-serif;font-size:11px;color:#cfe0f2;white-space:nowrap;background:rgba(14,17,22,.75);padding:1px 6px}
.arrlab.dst{color:#fff;background:#d64545}
.pickPad{position:absolute;inset:0;cursor:pointer}
.cupHit{position:absolute;top:48%;width:15%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:none;border:0;padding:0;cursor:default}
.cupHit.on{cursor:pointer}
.shelf{position:absolute;inset:6% 4% 8%;display:flex;gap:4%;align-items:flex-end;justify-content:center}
.sbag{flex:1;max-width:30%;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:transform .2s}
.sbag .bagsvg{width:70%;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))}.sbag.sel{transform:translateY(-6px) scale(1.06)}.sbag.sel .tag{border-color:#d64545}

 me:{name:'你',role:'主角．小小咖啡師',desc:'在台北「白霧咖啡」當咖啡師第二年。抽屜裡壓著一張台灣盃手沖錦標賽報名表，夢想是站上世界的舞台。',

/* ============ 詞典 ============ */
const GLOSS={
 '萃取率':'從咖啡粉裡溶進水中的物質比例。一般認為 18–22% 是好喝區間，太低偏酸薄（萃取不足），太高偏苦澀（過度萃取）。',
 'TDS':'總溶解固體。咖啡液的濃度，用折射計量。手沖常見目標約 1.15–1.35%。',
 '金杯':'金杯圖：橫軸萃取率、縱軸濃度（TDS），中間那塊「萃取率 18–22%、濃度 1.15–1.35%」就是金杯區。',
 '塞水':'注水後水排不下去、粉床泡太久，萃取過度，杯子會苦澀乾。常見原因：磨太細、細粉太多、濾杯與濾紙不合、注水太猛把細粉沖到底部。',
 '粉床':'咖啡粉在濾杯裡鋪成的那一層。粉床是否平整，決定水會不會均勻通過。',
 '通道效應':'水只從粉床某條「捷徑」快速通過，那條路過萃、其他地方萃不到，杯子同時苦又酸。',
 '細粉':'研磨時產生的極細粉末，容易堵住濾紙、也容易過萃。',
 '粉水比':'咖啡粉與水的重量比，例如 1:15 是 15 克粉配 225 克水。比例越大（1:17）越淡。',
 '藝伎':'Geisha／Gesha，源自衣索比亞的咖啡品種，在巴拿馬聲名大噪。典型風味：茉莉花、佛手柑、蜜桃、紅茶感。價格常是一般精品豆的數倍到數十倍。',

 tru:{t:'祖母的杯子',h:`<p>三個月後，台灣的協會發出更正公告：「2014 年台灣盃冠軍，沈懷舟，恢復頭銜。」附件的第一份文件，是你十二年前寫的觀察紀錄。</p><p>你飛到台北，走進大稻埕巷底的舟火焙煎所。沈懷舟替你沖了一杯，你替他沖了一杯——用你祖母的虹吸壺。</p><p>他喝了一口，說：「很老派。」你說：「謝謝。」</p><p>回到東京，你在喫茶「花野」的吧台後面，貼了一張紙：咖啡不會說謊，說謊的是人。所以，要留下證據。</p>`},

/* ============ 狀態 / 存檔 ============ */
const SKEY='blackcup_v1';
let DB={players:{},last:''};
try{DB=JSON.parse(localStorage.getItem(SKEY))||DB}catch(e){}
function saveDB(){try{localStorage.setItem(SKEY,JSON.stringify(DB))}catch(e){}}
let P=null; // player profile
let S=null; // run state
function newPlayer(n){return{name:n,cleared:0,endings:[],met:['me'],run:null,best:null}}
/* 本傳 story='main'；外傳 story=GD 的 key。每條線各自記錄進度 */
function useStory(k){CH=(k&&k!=='main'&&GD[k])?GD[k].ch:MAIN_CH}
function prog(k){k=k||(S&&S.story)||'main';if(k==='main')return P;if(!P.gd)P.gd={};if(!P.gd[k])P.gd[k]={cleared:0,run:null};return P.gd[k]}
function storyTag(k){return k&&k!=='main'&&GD[k]?GD[k].short+'｜':''}
function startChapter(ci,stats,flags,story){
  story=story||(S&&S.story)||'main';useStory(story);
  const st0=story==='main'?{tech:2,fame:2,heart:2}:{...GD[story].stats0};
  S={story,ch:ci,i:0,stats:stats||st0,flags:flags||{},log:[],q:[]};
  S.chStart={stats:{...S.stats},flags:{...S.flags}};
  prog(story).run=snap();saveDB();
}
function snap(){return JSON.parse(JSON.stringify({story:S.story||'main',ch:S.ch,i:S.i,stats:S.stats,flags:S.flags,chStart:S.chStart,log:S.log.slice(-80)}))}
function persist(){if(!S)return;prog().run=snap();saveDB()}

/* ============ 像素繪圖 ============ */
function portrait(cv,id){
  const g=cv.getContext('2d');g.clearRect(0,0,24,24);
  const L=PEOPLE[id].look;const p=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x,y,w,h)};
  const sk=L.skin,h=L.hair;
  // body
  p(3,19,18,5,L.cloth);p(4,18,16,1,L.cloth);

function step(){
  if(!S)return;
  if(S.q.length){const [s,t,l]=S.q.shift();if(s==='@bg'){setBg(t,l);step();return}S.curQ=[s,t];showLine({s,t});return}
  S.curQ=null;
  const nodes=CH[S.ch].nodes;
  while(true){
    const n=nodes[S.i];
    if(!n){chapterDone();return}
    if(n.bg){setBg(n.bg,n.loc);S.i++;continue}
    if(n.lbl!==undefined){S.i++;continue}
    if(n.jmp){S.i=labels(S.ch)[n.jmp];continue}
    if(n.iff){S.i=S.flags[n.iff]?labels(S.ch)[n.go]:S.i+1;continue}
    if(n.done){chapterDone();return}
    if(n.final){finale();return}
    if(n.c){persist();showChoice(n);return}
    if(n.use){persist();showUse(n);return}
    if(n.sv){S._v=Object.assign(S._v||{},JSON.parse(JSON.stringify(n.sv)));S.i++;continue}
    if(n.brew){persist();showBrew(n);return}
    if(n.item){S.i++;giveItem(n.item);continue}
    if(n.money){S.i++;addMoney(n.money,n.why);continue}
    if(n.act==='buybean'){S.i++;persist();startAct('buybean');S.act.play=1;playBuy(n);return}
    if(n.act&&n.play&&(n.act==='cup'||n.act==='cupfarm')){S.i++;persist();S._n=n;startAct(n.act);if(n.al)$('locLabel').textContent=n.al;if(n.hold)S.act.hold=n.hold;playCup(n);return}
    if(n.act==='roast'&&n.play){S.i++;persist();S._n=n;startAct('roast');if(n.al)$('locLabel').textContent=n.al;playRoast(n);return}
    if(n.act==='pick'){S.i++;persist();S._n=n;startAct('pick');if(n.al)$('locLabel').textContent=n.al;playPick(n);return}
    if(n.act&&n.play){S.i++;persist();startAct(n.act);S.act.play=1;S.act.st=0;S.act.brush=0;S.act.bv=0;playClean(n);return}
    if(n.act){S.i++;persist();if(n.ap)S._ap=n.ap;S._n=n;startAct(n.act);if(n.al)$('locLabel').textContent=n.al;if(n.sticky)S.act.sticky=1;if(n.hold)S.act.hold=n.hold;S.act.H0=n.hold||0;showLine({s:'',t:n.t});return}
    if(n.tv){S.i++;persist();startTravel(n.tv);showLine({s:'',t:n.t});return}
    if(n.s!==undefined){S.i++;persist();showLine(n);return}
    S.i++;
  }
}
function setBg(b,loc){if(S&&S.act)S.act=null;const ch=curBg!==b;if(S&&ch)S._v=null;const tl=document.getElementById('tvLayer');if(tl){tl.hidden=true;tl.innerHTML=''}curBg=b;S.bg=b;S.loc=loc;$('locLabel').textContent=loc||'';const dm=document.querySelector('.scene').classList.contains('doom');if(ch&&$('game').classList.contains('on'))sfx('whoosh');if(!dm)playTheme(musicFor(b))}

  const nt=$('nameTag');if(sp){nt.className='name';nt.textContent=sp==='me'?P.name:PEOPLE[sp].name}else nt.className='name n';
  const pc=$('pCv');if(sp){portrait(pc,sp);pc.classList.remove('hide');$('box').classList.add('av')}else{pc.classList.add('hide');$('box').classList.remove('av')}
  const text=fill(n.t);S.log.push({w:sp?(sp==='me'?P.name:PEOPLE[sp].name):'',t:text});
  const tx=$('txt');tx.className='txt'+(sp?'':' narr');tx.innerHTML='';$('more').style.display='none';
  const toks=tokenize(text);let k=0;waiting=true;

function showChoice(n){
  ffwd=false;$('tFF').classList.remove('on');waiting=false;
  const opts=n.o.filter(o=>!o.need||S.flags[o.need]);
  const sh=opts.map(o=>o).sort(()=>Math.random()-.5);
  const cw=$('choices');
  cw.innerHTML=`<div class="cq">${linkify(fill(n.c))}</div>`+sh.map((o,i)=>`<button class="opt" data-i="${i}">${linkify(fill(o.t))}</button>`).join('')+`<div class="danger">⚠ 選錯，故事就在這裡結束</div>`;
  bindLinks(cw);

function pick(o){endAct();
  sfx('pick');$('choices').classList.remove('on');
  S.log.push({w:'▸ 你選擇',t:fill(o.t),pick:1});
  if(o.fx)for(const k in o.fx)S.stats[k]=Math.max(0,Math.min(10,S.stats[k]+o.fx[k]));
  if(o.f)S.flags[o.f]=1;if(o.it)giveItem(o.it);renderStats();
  if(o.fx){const vs=Object.values(o.fx);setTimeout(()=>sfx(vs.some(v=>v<0)?'down':'up'),180)}
  if(o.fx){const ch=Object.entries(o.fx).map(([k,v])=>`${{tech:'技術',fame:'名聲',heart:'良心'}[k]} ${v>0?'+':''}${v}`).join('　');toast(ch)}
  S.q=(o.r||[]).map(x=>x.slice());
  if(o.end){S.pendingEnd={id:o.end,why:o.why};
    S.q=S.q.concat((SEQ[o.end]||[]).map(x=>x.slice()));doom(true);
    if(S.q.length){step();return}
    gameOver();return}
  S.i=o.go?labels(S.ch)[o.go]:S.i+1;persist();step();
}

function brewCalc(B){const c=B.cfg,gd=k=>GEAR[k].find(x=>x[0]===B[k])[3],bb=(BEANS[B.bean]??0)-(BEANS[c.bean]??0),ey=c.base+bb+gd('dr')+gd('gr')+gd('kt')+BGRIND[B.g][1]+BTEMP[B.tp]*(c.tk||1)+(B.poured-240)/60,bev=Math.max(40,B.poured-2.1*BDOSE),tds=ey*BDOSE/bev;
