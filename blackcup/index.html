<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>黑杯聽音</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 配色邏輯：黑白灰為底（黑杯）；紅＝品牌與關鍵抉擇／危險；藍＝知識（技術）；米白＝聚光燈（名聲）；青＝清澈（良心）。暖琥珀只出現在畫面裡的光源。 */
:root{
  --ink:#0e1116;--ink2:#151a22;--ink3:#1e2530;--line:#343e4c;--line2:#4a5566;
  --cream:#ece4d4;--muted:#8b93a1;--dim:#5b6372;
  --cherry:#d64545;--cherry2:#ff6b5e;--cherryD:#7a1f22;
  --blue:#6c9bd2;--teal:#4fb3a9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--cream);font-family:"Noto Sans TC",system-ui,sans-serif;touch-action:manipulation;overscroll-behavior:none}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;touch-action:manipulation}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative}
/* top frame */
.frame{position:sticky;top:0;z-index:20;background:var(--ink);border-bottom:1px solid var(--line)}
.frame:before{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--cherry) 0 18%,var(--ink3) 18% 100%)}
.frame-in{display:flex;align-items:center;gap:8px;padding:7px 10px}
.frame .ttl{font-family:"DotGothic16";color:var(--cream);letter-spacing:3px;font-size:15px;white-space:nowrap}
.frame .ttl b{color:var(--cherry);font-weight:400}
.frame .ch{font-size:11px;color:var(--muted);flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.stats{display:flex;gap:7px}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9px;color:var(--muted);font-family:"DotGothic16"}
.bar{width:40px;height:6px;background:#06080b;border:1px solid var(--line);display:flex;padding:0 1px;gap:1px}
.bar i{display:block;height:100%;flex:0 0 calc(10% - 1px)}
.screen{display:none;flex:1;flex-direction:column}
.screen.on{display:flex}
/* scene */
.scene{position:relative;width:100%;aspect-ratio:16/10;background:#000;overflow:hidden;border-bottom:1px solid var(--line)}
.scene canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
.portrait{position:absolute;left:12px;top:20px;width:60px;height:60px;image-rendering:pixelated;background:var(--ink3);border:1px solid var(--line2)}
.portrait.hide{display:none}
.box.av .txt{padding-left:72px;min-height:64px}
.loc{position:absolute;top:8px;right:8px;font-family:"DotGothic16";font-size:11px;background:rgba(14,17,22,.85);border-left:3px solid var(--cherry);padding:3px 9px;color:var(--cream);letter-spacing:1px}
/* dialogue */
.dlg{flex:1;display:flex;flex-direction:column;padding:12px 12px 8px;gap:9px;background:var(--ink)}
.box{position:relative;border:1px solid var(--line2);background:var(--ink2);padding:20px 14px 14px;min-height:140px;box-shadow:0 0 0 3px var(--ink),0 0 0 4px var(--line);cursor:pointer}
.name{position:absolute;top:-12px;left:10px;background:var(--cream);color:var(--ink);padding:1px 10px 1px 8px;font-family:"DotGothic16";font-size:14px;border-left:4px solid var(--cherry)}
.name.n{display:none}
.txt{font-size:16.5px;line-height:1.85;letter-spacing:.3px;min-height:3.6em}
.txt.narr{color:#c3c9d3;font-family:"Noto Serif TC",serif}
.more{position:absolute;right:10px;bottom:6px;color:var(--cherry);font-size:12px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.term{color:#9cc0ea;border-bottom:1px dotted var(--blue);cursor:pointer}
.pname{color:var(--cream);font-weight:700;border-bottom:1px dotted var(--muted);cursor:pointer}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tb{flex:1;min-width:48px;background:var(--ink2);border:1px solid var(--line);padding:8px 4px;font-size:12.5px;color:var(--cream);font-family:"DotGothic16"}
.tb:active{background:var(--ink3)}
.tb.on{border-color:var(--cherry);color:var(--cherry2)}
.nextbtn{display:none;background:var(--cherry);color:#fff;border:none;padding:10px;font-family:"DotGothic16";font-size:15px;box-shadow:0 3px 0 var(--cherryD)}
.nextbtn.on{display:block}
/* choices */
.choices{display:none;flex-direction:column;gap:8px}
.choices.on{display:flex}
.cq{font-family:"DotGothic16";color:var(--cream);font-size:14px;padding:4px 0 4px 10px;border-left:4px solid var(--cherry)}
.opt{text-align:left;background:var(--ink2);border:1px solid var(--line2);padding:11px 12px 11px 30px;font-size:15px;line-height:1.6;position:relative;box-shadow:0 3px 0 #06080b}
.opt:before{content:"";position:absolute;left:11px;top:19px;width:8px;height:8px;background:var(--cherry)}
.opt:active{border-color:var(--cherry);transform:translateY(2px);box-shadow:none}
.danger{font-size:11px;color:var(--cherry2);font-family:"DotGothic16";text-align:center;letter-spacing:1px}
.scene.doom canvas{filter:grayscale(.75) contrast(1.1)}
.scene.doom:after{content:"";position:absolute;inset:0;background:radial-gradient(transparent 40%,rgba(122,31,34,.55));mix-blend-mode:multiply;pointer-events:none;animation:doomin 1.2s ease-out both}
@keyframes doomin{from{opacity:0}to{opacity:1}}
.box.doom{border-color:var(--cherryD);box-shadow:0 0 0 3px var(--ink),0 0 0 4px var(--cherryD)}
.box.doom .txt.narr{color:#d9b3b3}
.aud{display:flex;gap:8px;width:100%;max-width:360px;margin-top:6px}
.slot{border:1px solid var(--line);background:var(--ink);padding:10px;margin:8px 0}
.slot-h{display:flex;justify-content:space-between;font-family:DotGothic16;font-size:13px}.slot-h b{color:var(--cream);font-weight:400;border-left:3px solid var(--cherry);padding-left:6px}.slot-h span{color:var(--muted)}
.slot-t{margin-top:6px;font-weight:700}.slot-t small{color:var(--muted);font-weight:400;margin-left:8px;font-size:12px}
.slot-p{font-size:13px;color:#c3c9d3;margin-top:4px;line-height:1.6}.slot-s{font-family:DotGothic16;font-size:12px;color:var(--muted);margin-top:4px}
.slot-b{display:flex;gap:6px;margin-top:8px}.slot-b .tb{flex:0 0 auto;padding:6px 14px}
#tvLayer{position:absolute;inset:0;pointer-events:none}
.tvl{position:absolute;font-family:"DotGothic16","Noto Sans TC",sans-serif;font-size:12px;line-height:1.5;background:rgba(14,17,22,.9);color:#c3c9d3;padding:0 7px 0 6px;border-left:2px solid #4a5566;white-space:nowrap}
.tvl.dim{font-size:10.5px;color:#8b93a1;background:rgba(14,17,22,.75)}
.tvl.hi{color:#ece4d4;border-left-color:#d64545;font-size:13px}
.tvl.dest{background:#d64545;color:#fff;border-left-color:#fff}
.tvs{position:absolute;top:8px;left:8px;font-family:"DotGothic16","Noto Sans TC",sans-serif;font-size:12px;background:rgba(14,17,22,.9);border:1px solid #4a5566;color:#ece4d4;padding:2px 8px}
#labOv{position:fixed;inset:0;z-index:95;background:#0e1116;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#labOv iframe{flex:1;width:100%;border:0;background:#1b1512}
.lab-top{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--ink)}
.lab-top>div{flex:1;min-width:0}.lab-top b{font-family:DotGothic16;font-weight:400;border-left:4px solid var(--cherry);padding-left:8px;display:block}
.lab-top span{display:block;font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lab-top button{background:var(--ink2);border:1px solid var(--line2);color:var(--cream);padding:7px 12px;font-family:DotGothic16;flex:none}
.lab-res{background:var(--ink);border-top:2px solid var(--cherry);padding:10px 12px}
.lr-t{font-family:DotGothic16;font-size:14px}.lr-t b{color:#9cc0ea;font-weight:400}.lr-t em{font-style:normal;color:var(--teal)}.lr-t i{font-style:normal;color:var(--muted)}
.lr-b{display:flex;gap:8px;margin-top:8px}.lr-b button{flex:1;padding:10px;font-family:DotGothic16;border:1px solid var(--line2);background:var(--ink2);color:var(--cream)}.lr-b #labDone{background:var(--cherry);border-color:var(--cherry);color:#fff}
.brewgo small{display:block;font-size:12px;color:var(--muted);margin-top:2px}.brewgo{border-color:var(--teal)}.brewgo:before{background:var(--teal)!important}
.cq.brewq{border-left-color:var(--teal)}
.bbean{font-size:12px;color:var(--muted);margin:-2px 0 2px;font-family:DotGothic16}
.brow{display:flex;align-items:center;gap:6px}.brow span{width:52px;font-family:DotGothic16;font-size:13px;color:var(--muted)}
.bchip{flex:1;padding:9px 0;background:var(--ink2);border:1px solid var(--line2);color:var(--cream);font-family:DotGothic16;font-size:14px}
.bchip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#0e1116}
.bbar{position:relative;height:12px;background:#06080b;border:1px solid var(--line2)}.bbar i{display:block;height:100%;width:0;background:var(--blue)}.bbar em{position:absolute;top:-4px;width:2px;height:18px;background:var(--cherry)}
.bhold{padding:20px;font-family:DotGothic16;font-size:18px;background:var(--ink2);border:2px solid var(--teal);color:var(--cream);touch-action:none;user-select:none;-webkit-user-select:none}
.bhold.on{background:var(--teal);color:#0e1116}
.big:disabled{opacity:.4}
.bres{display:flex;gap:10px;align-items:center}.bchart{width:58%;flex:none}.bnum{font-family:DotGothic16;font-size:15px}.bnum b{color:#9cc0ea;font-weight:400}.bset{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.6}
.bhint{font-size:14px;line-height:1.7;border-left:3px solid var(--blue);padding-left:8px;color:#c3c9d3}
.bscale{position:absolute;left:50%;transform:translateX(-50%);top:72%;font-family:"DotGothic16",monospace;font-size:13px;color:#9cc0ea;background:#0e1116;padding:0 6px;border:1px solid #343e4c}
.btarget{position:absolute;left:8px;top:8px;font-family:DotGothic16;font-size:12px;background:rgba(14,17,22,.9);border-left:3px solid var(--teal);padding:2px 8px}
.actcap{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;font-family:"DotGothic16","Noto Sans TC",sans-serif;font-size:14px;background:rgba(14,17,22,.9);color:#ece4d4;border-left:3px solid #d64545;padding:3px 12px;white-space:nowrap}
.jsign{position:absolute;top:56%;transform:translateX(-50%);font-family:"DotGothic16","Noto Sans TC",sans-serif;font-size:11px;color:#2e1b11;white-space:nowrap;font-weight:700}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(6,8,11,.86);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.ov.on{display:flex}
.card{width:100%;max-width:520px;max-height:86vh;overflow:auto;background:var(--ink2);border:1px solid var(--line2);box-shadow:0 0 0 3px var(--ink),0 0 0 4px var(--line);padding:16px}
.card h3{margin:0 0 10px;font-family:"DotGothic16";color:var(--cream);font-weight:400;font-size:19px;letter-spacing:1px}
.card p{line-height:1.8;margin:.4em 0}
.card .x{float:right;background:none;border:1px solid var(--line);padding:2px 10px;font-family:"DotGothic16"}
.pill{display:inline-block;font-size:11px;border:1px solid var(--line);padding:1px 7px;margin:2px;color:var(--muted);font-family:"DotGothic16"}
.list .it{border-bottom:1px dashed var(--line);padding:10px 0;display:flex;gap:10px}
.list .it canvas{width:56px;height:56px;image-rendering:pixelated;background:var(--ink3);border:1px solid var(--line);flex:none}
.list b{color:var(--cream)}
.gl dt{color:#9cc0ea;font-weight:700;margin-top:10px}
.gl dd{margin:2px 0 0;line-height:1.7;color:#c3c9d3;font-size:14px}
.gl-h{color:var(--cream);font-family:DotGothic16;font-weight:400;border-left:4px solid var(--cherry);padding-left:8px}
.log .ln{padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px;line-height:1.7}
.log .who{color:var(--cream);background:var(--ink3);padding:0 5px;font-family:"DotGothic16";margin-right:6px}
.log .pick{color:var(--cherry2)}
.why{background:var(--ink);border-left:3px solid var(--blue);padding:8px 10px;margin-top:10px;font-size:14px}
.why b{color:#9cc0ea}
/* END card */
.endcard{border-color:var(--cherry)}
.endcard .tag{font-family:"DotGothic16";color:var(--cherry2);letter-spacing:3px;font-size:13px}
.endcard h3{color:#fff;font-size:24px;text-shadow:2px 2px 0 var(--cherryD)}
.goodcard{border-color:var(--teal)}
.tagc{font-family:DotGothic16;letter-spacing:3px}
.big{display:block;width:100%;margin-top:10px;background:var(--cherry);color:#fff;border:none;padding:12px;font-family:"DotGothic16";font-size:16px;box-shadow:0 3px 0 var(--cherryD);letter-spacing:2px}
.big.alt{background:rgba(21,26,34,.92);color:var(--cream);border:1px solid var(--line2);box-shadow:0 3px 0 #06080b}
.big:active{transform:translateY(2px);box-shadow:none}
/* title */
#title{position:relative;overflow:hidden}
.tscene{width:100%;max-width:520px;aspect-ratio:16/10;border:1px solid var(--line2);box-shadow:0 0 0 3px var(--ink),0 0 0 4px var(--line);margin:6px 0 4px;background:#000}
#titleCv{width:100%;height:100%;display:block;image-rendering:pixelated}
.tin{position:relative;z-index:2;padding:22px 14px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;min-height:calc(100vh - 60px)}
.lockup{position:relative;display:flex;align-items:flex-start;gap:10px;margin-top:18px;padding:6px 4px 0}
.lockup .ring{position:absolute;left:96px;top:-14px;width:132px;height:132px;pointer-events:none;opacity:.95}
.lockup .kj{position:relative;font-family:"Noto Serif TC",serif;font-weight:900;font-size:86px;line-height:1;letter-spacing:.02em;color:var(--cream)}
.lockup .kj span{display:inline-block}
.lockup .kj span:first-child{color:#fff;text-shadow:0 0 0 #000}
.lockup .seal{position:relative;margin-top:6px;background:var(--cherry);color:var(--cream);writing-mode:vertical-rl;font-family:"Noto Serif TC",serif;font-weight:900;font-size:22px;letter-spacing:.18em;padding:10px 6px;line-height:1;box-shadow:inset 0 0 0 2px var(--cherry),inset 0 0 0 3px rgba(236,228,212,.55)}
.en-line{display:flex;align-items:center;gap:10px;width:100%;max-width:330px;font-family:"Noto Serif TC",serif;font-size:11px;letter-spacing:.42em;color:var(--muted);margin-top:4px}
.en-line:before,.en-line:after{content:"";flex:1;height:1px;background:var(--line2)}
.logo2{font-family:"Noto Serif TC";color:#c3c9d3;font-size:14px;letter-spacing:.18em;text-align:center;line-height:1.9}
.logo2 i{font-style:normal;color:var(--cherry2)}
.spacer{flex:1;min-height:150px}
.who{width:100%;max-width:360px;background:rgba(21,26,34,.95);border:1px solid var(--line2);box-shadow:0 0 0 3px var(--ink),0 0 0 4px var(--line);padding:14px}
.who h4{margin:0 0 8px;font-family:"DotGothic16";color:var(--cream);font-weight:400;border-left:4px solid var(--cherry);padding-left:8px}
.who input{width:100%;padding:10px;background:var(--ink);border:1px solid var(--line);color:var(--cream);font-size:16px;font-family:inherit}
.names{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.nm{background:var(--ink3);border:1px solid var(--line2);padding:6px 12px;font-family:"DotGothic16";font-size:14px}
.menu{width:100%;max-width:360px;display:flex;flex-direction:column;gap:8px}
.chs .chrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);padding:10px;margin:6px 0;background:var(--ink)}
.chrow.lock{opacity:.4}
.chrow .n{font-family:"DotGothic16";color:var(--cherry2);width:44px}
.chrow .t{flex:1}
.chrow .t small{display:block;color:var(--muted);font-size:12px}
.sig{font-family:"DotGothic16";font-size:11px;color:var(--dim);text-align:center;padding:12px 0 18px;letter-spacing:2px}
.press{font-family:"DotGothic16";color:var(--muted);font-size:13px;text-align:center}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);border:1px solid var(--line2);border-left:4px solid var(--teal);padding:8px 14px;font-size:13px;z-index:90;display:none;font-family:"DotGothic16"}
.pop{position:fixed;z-index:80;max-width:300px;background:var(--ink);border:1px solid var(--line2);border-top:3px solid var(--blue);padding:10px 12px;font-size:14px;line-height:1.7;box-shadow:0 6px 20px #000;display:none}
.pop b{color:var(--cream);font-family:"DotGothic16";font-weight:400;font-size:15px}
.statchg{font-family:"DotGothic16";font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div id="app">
  <div class="frame"><div class="frame-in">
    <div class="ttl"><b>黑</b>杯聽音</div><div class="ch" id="chLabel">—</div>
    <div class="stats" id="stats"></div>
  </div></div>

  <!-- TITLE -->
  <section class="screen on" id="title">
    <div class="tin">
      <div class="lockup" aria-label="黑杯聽音">
        <svg class="ring" viewBox="0 0 132 132" aria-hidden="true"><g fill="none" stroke="#d64545" stroke-linecap="round"><path d="M66 10 A56 56 0 1 1 18 37" stroke-width="5"/><path d="M14 46 A56 56 0 0 1 22 30" stroke-width="2.5"/><path d="M71 18 A48 48 0 0 1 113 78" stroke-width="1.2" opacity=".55"/></g><circle cx="112" cy="104" r="3" fill="#d64545"/><circle cx="119" cy="111" r="1.6" fill="#d64545"/></svg>
        <div class="kj"><span>黑</span><span>杯</span></div>
        <div class="seal">聽音</div>
      </div>
      <div class="en-line">THE BLACK CUP</div>
      <div class="logo2">一個小小咖啡師的冠軍之路<br>與杯底，<i>看不見的那層陰影</i></div>
      <div class="tscene"><canvas id="titleCv" width="320" height="200"></canvas></div>
      <div class="who" id="loginBox">
        <h4>▸ 誰要入座？</h4>
        <div class="names" id="nameList"></div>
        <input id="nameIn" maxlength="8" placeholder="輸入你的名字（最多 8 字）" autocomplete="off">
        <button class="big" id="loginBtn">入座</button>
      </div>
      <div class="menu" id="mainMenu" style="display:none">
        <div class="press" id="hello"></div>
        <button class="big" id="mContinue">繼續故事</button>
        <button class="big alt" id="mLoad">讀取存檔</button>
        <button class="big alt" id="mChapters">章節選擇</button>
        <button class="big alt" id="mEnds">結局圖鑑</button>
        <button class="big alt" id="mHelp">怎麼玩</button>
        <button class="big alt" id="mSwitch">換人入座</button>
      </div>
      <div class="aud"><button class="tb" id="aMu"></button><button class="tb" id="aSd"></button></div>
      <div class="sig">製作　Jim Lu</div>
    </div>
  </section>

  <!-- GAME -->
  <section class="screen" id="game">
    <div class="scene"><canvas id="sceneCv" width="320" height="200"></canvas>
      <div id="tvLayer" hidden></div>
      <div class="loc" id="locLabel"></div>
    </div>
    <div class="dlg">
      <div class="box" id="box">
        <div class="name" id="nameTag"></div>
        <canvas class="portrait hide" id="pCv" width="24" height="24"></canvas>
        <div class="txt" id="txt"></div>
        <div class="more" id="more">▼</div>
      </div>
      <div class="choices" id="choices"></div>
      <button class="nextbtn" id="nextBtn">下一句 ▸</button>
      <div class="tools">
        <button class="tb" id="tLog">回顧</button>
        <button class="tb" id="tPpl">人物</button>
        <button class="tb" id="tGl">詞典</button>
        <button class="tb" id="tFF">快轉</button>
        <button class="tb" id="tSave">存檔</button>
        <button class="tb" id="tMenu">選單</button>
      </div>
    </div>
  </section>
</div>

<div class="ov" id="ov"><div class="card" id="card"></div></div>
<div class="pop" id="pop"></div>

let DB={players:{},last:''};
try{DB=JSON.parse(localStorage.getItem(SKEY))||DB}catch(e){}
function saveDB(){try{localStorage.setItem(SKEY,JSON.stringify(DB))}catch(e){}}
let P=null; // player profile
let S=null; // run state
function newPlayer(n){return{name:n,cleared:0,endings:[],met:['me'],run:null,best:null}}
function startChapter(ci,stats,flags){
  S={ch:ci,i:0,stats:stats||{tech:2,fame:2,heart:2},flags:flags||{},log:[],q:[]};
  S.chStart={stats:{...S.stats},flags:{...S.flags}};

}
function snap(){return JSON.parse(JSON.stringify({ch:S.ch,i:S.i,stats:S.stats,flags:S.flags,chStart:S.chStart,log:S.log.slice(-80)}))}

function scheduleBeat(th,t,beat){
  const spb=60/th.bpm,bar=Math.floor(beat/4)%th.ch.length,b=beat%4,[root,ch]=th.ch[bar];
  const nextRoot=th.ch[(bar+1)%th.ch.length][0];
  // 伴奏
  if(th.comp==='jazz'){if(b===0)ch.forEach((n,i)=>INS.ep(n,t+i*.012,spb*1.4,.9));if(b===1&&Math.random()<.6)ch.forEach(n=>INS.ep(n,t+spb*(.5+th.sw),spb*.6,.55))}
  if(th.comp==='tense'){if(b===0)ch.forEach(n=>INS.pad(n,t,spb*4,1.6));if(b===0||b===2)ch.forEach((n,i)=>INS.ep(n,t+i*.03,spb*1.5,1.1))}
  if(th.comp==='pad'&&b===0)ch.forEach(n=>INS.pad(n,t,spb*4,1));
  if(th.comp==='pick'){[0,1].forEach(h=>{const n=ch[(b*2+h)%ch.length]+(h&&b%2?12:0);INS.pluck(n,t+h*spb/2,spb/2,.9)})}
  if(th.comp==='stab'){if(b===0)ch.forEach(n=>INS.pad(n,t,spb*4,1.2));if(b===2||b===3)ch.forEach(n=>INS.str(n,t,spb/2,.8))}
  if(th.comp==='arp'){if(b===0)ch.forEach(n=>INS.pad(n,t,spb*4,.8));for(let k=0;k<4;k++)INS.arp(ch[(b*4+k)%ch.length]+12,t+k*spb/4,spb/4,k===0?1:.7)}
  // 低音
  if(th.bass==='walk'){const ns=[root,root+7,root+(Math.random()<.5?3:4),nextRoot+(Math.random()<.5?-1:1)];INS.bass(ns[b],t,spb*.95,1)}
  if(th.bass==='long'&&b===0)INS.bass(root,t,spb*3.5,1);
  if(th.bass==='pulse'){INS.bass(root,t,spb*.45,.9);INS.bass(root,t+spb/2,spb*.4,.6)}
  // 鼓
  const sw=th.sw||0;
  if(th.drum==='brush'){INS.brush(t,b%2?1:.5);if(Math.random()<.7)INS.hat(t+spb*(.5+sw),.6)}
  if(th.drum==='tick')INS.tick(t,b===0?1.2:.7);
  if(th.drum==='shaker'){INS.hat(t+spb/2,.8);INS.hat(t,.35)}
  if(th.drum==='heart'&&(b===0||b===2)){INS.kick(t,.9);INS.kick(t+.18,.5)}
  if(th.drum==='pop'){if(b===0||b===2)INS.kick(t,.8);if(b===1||b===3)noiseHit(AU.mus,t,.12,.05,'bandpass',1800,.8);INS.hat(t+spb/2,.8)}
  // 即興旋律
  if(th.sc&&Math.random()<th.lead){const n=th.sc[Math.floor(Math.random()*th.sc.length)];const off=Math.random()<.5?0:spb*(.5+sw);(th.comp==='pick'?INS.pluck:INS.ep)(n+(th.comp==='arp'?0:0),t+off,spb,.8)}
}

  if(!kind)return;const a=AC,g=a.createGain();g.gain.value=0.0001;g.connect(AU.mus);const nodes=[];
  const loop=(buf,type,f,q,lvl)=>{const s=a.createBufferSource();s.buffer=buf;s.loop=true;const fl=a.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q||.7;const gg=a.createGain();gg.gain.value=lvl;s.connect(fl);fl.connect(gg);gg.connect(g);s.start();nodes.push(s)};
  let iv=null;

  if(kind==='crickets'){loop(AU.brown,'lowpass',300,.7,.25);iv=setInterval(()=>{if(Math.random()<.55){const t=AC.currentTime,f=4200+Math.random()*600;for(let i=0;i<3;i++)voice(g,'sine',f,t+i*.05,.004,.05,.03)}},380)}
  if(kind==='plane'){loop(AU.brown,'lowpass',220,.7,1.1);loop(AU.noise,'lowpass',900,.5,.05)}
  if(kind==='crowd'){loop(AU.brown,'bandpass',600,.6,.9);loop(AU.noise,'bandpass',1200,.5,.06)}
  if(kind==='city'){loop(AU.brown,'lowpass',250,.7,.9);iv=setInterval(()=>{if(Math.random()<.08){const t=AC.currentTime;const o=a.createOscillator(),gg=a.createGain();o.frequency.setValueAtTime(380,t);o.frequency.linearRampToValueAtTime(300,t+1.5);o.connect(gg);gg.connect(g);env(gg,t,.3,.015,1.6);o.start(t);o.stop(t+2)}},1000)}
  g.gain.setTargetAtTime(kind==='rain'?.28:kind==='fire'?.32:.3,a.currentTime,.8);

}

const KRE=new RegExp(KEYS.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g');
function tokenize(text){ // returns tokens [{h,len}]
  const out=[];let last=0;text.replace(KRE,(m,idx)=>{
    for(const ch of text.slice(last,idx))out.push({h:esc(ch),len:1});
    if(GLOSS[m])out.push({h:`<span class="term" data-g="${m}">${m}</span>`,len:m.length});
    else out.push({h:`<span class="pname" data-p="${NAMEMAP[m]}">${m}</span>`,len:m.length});
    last=idx+m.length;return m});
  for(const ch of text.slice(last))out.push({h:esc(ch),len:1});return out}

function step(){
  if(!S)return;
  if(S.q.length){const [s,t,l]=S.q.shift();if(s==='@bg'){setBg(t,l);step();return}S.curQ=[s,t];showLine({s,t});return}
  S.curQ=null;
  const nodes=CH[S.ch].nodes;
  while(true){
    const n=nodes[S.i];
    if(!n){chapterDone();return}
    if(n.bg){setBg(n.bg,n.loc);S.i++;continue}
    if(n.lbl!==undefined){S.i++;continue}
    if(n.jmp){S.i=labels(S.ch)[n.jmp];continue}
    if(n.iff){S.i=S.flags[n.iff]?labels(S.ch)[n.go]:S.i+1;continue}
    if(n.done){chapterDone();return}
    if(n.final){finale();return}
    if(n.c){persist();showChoice(n);return}
    if(n.brew){persist();showBrew(n);return}
    if(n.act){S.i++;persist();startAct(n.act);showLine({s:'',t:n.t});return}
    if(n.tv){S.i++;persist();startTravel(n.tv);showLine({s:'',t:n.t});return}

const BGRIND={fine:['細',2],mid:['中',0],coarse:['粗',-2.2]},BTEMP={88:-1.2,92:0,96:1},BRATIO={'15':225,'16.5':247.5,'18':270},BDOSE=15;
let BH={hold:false,raf:0,last:0};
function brewCalc(B){const c=B.cfg,ey=c.base+BGRIND[B.g][1]+BTEMP[B.tp]*(c.tk||1)+(B.poured-240)/60,bev=Math.max(40,B.poured-2.1*BDOSE),tds=ey*BDOSE/bev;
  return {ey:Math.round(ey*10)/10,tds:Math.round(tds*100)/100}}
function brewHint(r){const t=[];if(r.ey<18)t.push('萃取不足（偏酸、單薄）：磨細一點，或提高水溫');else if(r.ey>22)t.push('過度萃取（苦、澀）：磨粗一點，或降低水溫');
  if(r.tds>1.35)t.push('太濃：粉水比拉大，水多一點');else if(r.tds<1.15)t.push('太淡：粉水比縮小，水少一點');return t.join('；')||'酸甜平衡，剛剛好。'}
function brewChart(r){const W=220,H=130,x=e=>20+(e-14)/12*(W-30),y=t=>H-18-(t-.9)/.8*(H-28),cx=Math.max(14,Math.min(26,r.ey)),cy=Math.max(.9,Math.min(1.7,r.tds)),ok=r.gold;
  return `<svg viewBox="0 0 ${W} ${H}" class="bchart"><rect x="20" y="10" width="${W-30}" height="${H-28}" fill="#0e1116" stroke="#343e4c"/>
   <rect x="${x(18)}" y="${y(1.35)}" width="${x(22)-x(18)}" height="${y(1.15)-y(1.35)}" fill="rgba(79,179,169,.18)" stroke="#4fb3a9"/>
   <text x="${x(20)}" y="${y(1.25)+3}" fill="#4fb3a9" font-size="9" text-anchor="middle">金杯</text>
   <circle cx="${x(cx)}" cy="${y(cy)}" r="5" fill="${ok?'#4fb3a9':'#d64545'}" stroke="#ece4d4" stroke-width="1.5"/>
   <text x="${W-10}" y="${H-4}" fill="#8b93a1" font-size="8" text-anchor="end">萃取率 →</text><text x="2" y="9" fill="#8b93a1" font-size="8">TDS</text></svg>`}
function showBrew(n){ffwd=false;$('tFF').classList.remove('on');waiting=false;
  const B={n,cfg:n.brew.cfg,g:'mid',tp:92,rt:'16.5',phase:'set',grind:0,poured:0,crank:0,prev:[curBg,S.loc]};S.brewUI=B;
  curBg='brewbar';$('locLabel').textContent='親手沖一杯';const L0=$('tvLayer');L0.innerHTML='<div class="bscale" id="bScale">0.0 g</div><div class="btarget" id="bTarget"></div>';L0.hidden=false;
  $('box').style.display='none';$('nextBtn').classList.remove('on');brewPanel()}
function brewPanel(){const B=S.brewUI,cw=$('choices');cw.classList.add('on');
  const chips=(k,opts)=>`<div class="brow"><span>${{g:'研磨',tp:'水溫',rt:'粉水比'}[k]}</span>${opts.map(([v,lab])=>`<button class="bchip" data-k="${k}" data-v="${v}" aria-pressed="${String(B[k])===String(v)}">${lab}</button>`).join('')}</div>`;
  if(B.phase==='set'){cw.innerHTML=`<div class="cq brewq">☕ ${linkify(fill(B.n.t))}</div><div class="bbean">${B.cfg.bean}${B.cfg.note?'・'+B.cfg.note:''}</div>`+
     chips('g',[['fine','細'],['mid','中'],['coarse','粗']])+chips('tp',[[88,'88°C'],[92,'92°C'],[96,'96°C']])+chips('rt',[['15','1:15'],['16.5','1:16.5'],['18','1:18']])+
     `<button class="big" id="bNext">開始磨豆 ›</button>`;
    cw.querySelectorAll('.bchip').forEach(b=>b.onclick=()=>{B[b.dataset.k]=b.dataset.k==='tp'?+b.dataset.v:b.dataset.v;sfx('tap');brewPanel()});
    $('bNext').onclick=()=>{sfx('pick');B.phase='grind';brewPanel()};}
  if(B.phase==='grind'||B.phase==='pour'){const gr=B.phase==='grind',tgt=BRATIO[B.rt];
    $('bTarget').textContent=gr?`研磨：${BGRIND[B.g][0]}`:`目標 ${tgt} g`;
    cw.innerHTML=`<div class="cq brewq">${gr?'按住按鈕，轉動磨豆機':'按住按鈕注水，秤到 <b>'+tgt+' g</b> 就放開'}</div>
     <div class="bbar"><i id="bProg"></i>${gr?'':`<em style="left:${tgt/320*100}%"></em>`}</div>
     <button class="bhold" id="bHold">${gr?'按住磨豆':'按住注水'}</button>${gr?'':'<button class="big alt" id="bDone" disabled>完成，看結果</button>'}`;
    const h=$('bHold'),on=e=>{e.preventDefault();BH.hold=true;h.classList.add('on')},off=()=>{BH.hold=false;h.classList.remove('on')};
    h.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(ev=>h.addEventListener(ev,off));
