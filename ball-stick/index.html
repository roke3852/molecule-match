<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分子球棍組裝</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* 版面想法：一張模型切割墊（深綠＋黃色刻度）當工作桌，上下是工具盒的深色邊條；黃色只留給「目前該注意的地方」。單一主題。 */
:root{
  color-scheme:dark;
  --mat:#1d5a50;
  --mat-deep:#143f38;
  --ink:#0c2622;
  --ink-2:#16362f;
  --paper:#eef6f2;
  --mute:#9fbfb6;
  --mark:#ffd24a;
  --bad:#ff9b85;
  --line:rgba(238,246,242,.14);
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Barlow Condensed","Noto Sans TC","PingFang TC",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--paper);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
sub{font-size:.68em;line-height:0}

.app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto;position:relative}

/* 上方：關卡資訊 */
header{padding:10px 16px 10px;display:flex;flex-direction:column;gap:6px;background:var(--ink)}
.bar{display:flex;align-items:center;gap:7px}
.crumb{flex:1;min-width:0;color:var(--mute);font-size:12.5px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{min-height:36px;padding:0 11px;flex:0 0 auto;border-radius:999px;border:1px solid var(--line);background:var(--ink-2);font-size:13.5px;font-weight:500}
.pill[aria-pressed="true"]{background:var(--mark);color:var(--ink);border-color:var(--mark)}
.target{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.target h1{margin:0;font-size:26px;font-weight:900;letter-spacing:.02em;line-height:1.2;text-wrap:balance}
.formula{font-family:var(--f-num);font-size:30px;font-weight:600;color:var(--mark);line-height:1;white-space:nowrap}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:28px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 6px;border-radius:999px;border:1px solid var(--line);font-family:var(--f-num);font-size:16px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--mute)}
.chip i{width:11px;height:11px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.chip.ok{color:var(--ink);background:var(--mark);border-color:var(--mark)}
.chip.over{color:var(--bad);border-color:var(--bad)}
.status{margin:0;font-size:13px;color:var(--mute);flex:1 1 100%}
.status.warn{color:var(--bad)}

/* 工作桌 */
.stage{flex:1;min-height:0;position:relative;background:radial-gradient(120% 90% at 50% 40%,var(--mat),var(--mat-deep));border-block:2px solid #0a1f1c;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.note{position:absolute;left:12px;right:12px;margin:0;padding:9px 12px;border-radius:10px;font-size:13.5px;pointer-events:none}
.hint{top:12px;background:var(--mark);color:var(--ink);font-weight:500}
.hint b{font-family:var(--f-num);font-size:17px;font-weight:600;letter-spacing:.02em}
.coach{bottom:12px;background:var(--paper);color:var(--ink);display:grid;gap:2px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.coach p{margin:0}
.coach-top{display:flex;justify-content:space-between;align-items:center;min-height:24px}
#coachStep{font-family:var(--f-num);font-size:15px;font-weight:600;letter-spacing:.08em;color:#1d5a50}
#coachDo{font-weight:700;font-size:15px}
#coachWhy{font-size:12.5px;color:#3d5a54}
#btnBack{pointer-events:auto;min-height:32px;padding:0 13px;border-radius:999px;background:var(--ink);color:var(--paper);font-size:12.5px}
.want{border-color:var(--mark)!important;box-shadow:0 0 0 2px var(--mark);animation:want .9s ease-in-out infinite alternate}
@keyframes want{to{box-shadow:0 0 0 6px rgba(255,210,74,.3)}}
.tip{bottom:12px;background:rgba(12,38,34,.82);color:var(--paper);border:1px solid var(--line)}

/* 下方：零件盒 */
.tray{background:var(--ink);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:stretch}
.parts{display:flex;gap:5px;flex:1;min-width:0;overflow-x:auto;padding:2px}
.part{flex:1 1 0;min-width:40px;max-width:64px;min-height:74px;border-radius:12px;background:var(--ink-2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.part:active{transform:translateY(1px);border-color:var(--mark)}
.ball{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-num);font-weight:600;font-size:18px;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.part small{font-size:11.5px;color:var(--mute);line-height:1;display:flex;flex-direction:column;gap:4px;align-items:center}
.formula .q{font-family:var(--f-body);font-size:15px;font-weight:500;color:var(--mute);border:1px dashed var(--line);border-radius:8px;padding:5px 10px;display:inline-block}
.hands{display:inline-flex;gap:2px}
.hands i{width:4px;height:4px;border-radius:50%;background:var(--mark)}
.tools{display:grid;gap:6px;align-content:center}
.tool{min-height:34px;min-width:64px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--ink-2);font-size:13px}
.tool:disabled{opacity:.35;cursor:default}
.tool.go{background:var(--mark);color:var(--ink);border-color:var(--mark);font-weight:700}

/* 完成卡片 */
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);color:var(--ink);border-radius:18px 18px 0 0;padding:18px 18px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -12px 40px rgba(0,0,0,.45);animation:up .35s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .tag{font-size:12px;letter-spacing:.18em;font-weight:700;color:#1d5a50}
.sheet h2{margin:2px 0 6px;font-size:22px;font-weight:900;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sheet h2 span{font-family:var(--f-num);font-weight:600;font-size:24px;color:#1d5a50}
.sheet p{margin:0 0 14px;font-size:14.5px;max-width:34em}
.sheet .row{display:flex;gap:8px}
.sheet button{min-height:46px;border-radius:12px;padding:0 18px;font-weight:700}
.sheet .next{flex:1;background:var(--ink);color:var(--paper)}
.sheet .stay{border:1px solid rgba(12,38,34,.25)}
.sheet button:focus-visible{outline-color:#1d5a50}

/* 關卡表 */
.overlay{position:absolute;inset:0;background:var(--ink);overflow-y:auto;padding:14px 16px 28px;z-index:5}
.overlay .top{display:flex;align-items:center;justify-content:space-between;position:sticky;top:-14px;background:var(--ink);padding:10px 0;z-index:1}
.overlay h2{margin:0;font-size:20px;font-weight:900}
.cloud{margin-top:6px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--ink-2);display:grid;gap:8px}
.cloud .tool{min-height:42px;font-size:14px}
.cloud p{margin:0;font-size:12.5px;color:var(--mute)}
.me{margin-top:6px;padding:14px;border-radius:14px;background:var(--mat);display:grid;gap:10px}
.me .who{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.me .who b{font-size:22px;font-weight:900;overflow-wrap:anywhere}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--mark);color:var(--ink);font-size:12.5px;font-weight:700;white-space:nowrap}
.me .nums{font-family:var(--f-num);font-size:18px;font-weight:500;font-variant-numeric:tabular-nums;display:flex;gap:16px;flex-wrap:wrap}
.me .nums span b{font-size:24px;font-weight:600;color:var(--mark);margin-right:4px}
.me .acts{display:flex;gap:8px;flex-wrap:wrap}
.syncnote{margin:0;font-size:12.5px;color:var(--paper);opacity:.8;min-height:1.2em}
.me .acts .tool{background:var(--ink);min-height:38px;flex:1 1 40%}
.rowp .tagx{display:inline-block;margin-left:6px;padding:0 6px;border-radius:6px;border:1px solid var(--line);font-size:11px;color:var(--mute);font-weight:400;vertical-align:middle}
.whosec{margin:14px 0 2px;font-size:12.5px;color:var(--mute);letter-spacing:.06em}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:14px;padding:4px;border-radius:12px;background:var(--ink-2)}
.tab{min-height:40px;border-radius:9px;font-weight:700;color:var(--mute)}
.tab small{font-family:var(--f-num);font-weight:500;font-size:14px;margin-left:6px}
.tab[aria-pressed="true"]{background:var(--mark);color:var(--ink)}
.lv .st{font-size:11px;letter-spacing:1px;color:var(--mark);display:flex;justify-content:space-between;font-family:var(--f-num)}
.lv .st i{font-style:normal;color:var(--paper);font-size:13px;letter-spacing:0}
.sub{z-index:7}
.sub .lead{margin:4px 0 12px;font-size:13px;color:var(--mute)}
.rows{display:grid;gap:6px}
.rowp{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--ink-2);border:1px solid var(--line);text-align:left;width:100%}
.rowp.you{border-color:var(--mark);background:var(--mat)}
.rowp .rk{font-family:var(--f-num);font-size:20px;font-weight:600;color:var(--mark);text-align:center}
.rowp .nm{min-width:0}
.rowp .nm b{display:block;font-size:15.5px;overflow-wrap:anywhere}
.rowp .nm small{color:var(--mute);font-size:12px}
.rowp .sc{font-family:var(--f-num);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;line-height:1.1}
.rowp .sc small{display:block;font-size:13px;font-weight:500;color:var(--mute)}
.trow{grid-template-columns:28px 1fr}
.trow.off{opacity:.5}
.trow.on .rk{color:var(--mark)}
.newp{display:flex;gap:8px;margin-top:14px}
.newp input{flex:1;min-width:0;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--ink-2);color:var(--paper);font:inherit;font-size:16px;padding:0 14px}
.newp input:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
.newp .tool{min-height:46px;min-width:76px;font-size:15px}
.timer{font-family:var(--f-num);font-size:17px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--mute);margin-left:auto}
.sheet .score{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin:0 0 6px;font-family:var(--f-num);font-size:17px}
.sheet .score b{font-size:30px;font-weight:600;color:#1d5a50;line-height:1}
.sheet .score .stars{color:#c98a00;font-size:20px;letter-spacing:2px}
.sheet .got{margin:0 0 8px;font-weight:700;color:#1d5a50}
.title{position:absolute;inset:0;z-index:6;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;
  padding:26px 20px calc(18px + env(safe-area-inset-bottom,0px));background:radial-gradient(120% 75% at 62% 44%,#27715f,var(--mat-deep) 58%,#081a17)}
.title>div{position:relative;z-index:1;pointer-events:none}
.title button{pointer-events:auto}
.t-eye{margin:0 0 10px;font-family:var(--f-num);font-size:14px;font-weight:600;letter-spacing:.3em;color:var(--mark)}
.t-name{margin:0;font-size:clamp(52px,17.5vw,88px);font-weight:900;line-height:1;letter-spacing:.03em;text-shadow:0 5px 0 rgba(4,18,16,.45)}
.t-name span{display:block;animation:rise .7s cubic-bezier(.2,.9,.3,1) backwards}
.t-name span:nth-child(2){color:var(--mark);animation-delay:.12s}
.t-name span:nth-child(3){animation-delay:.24s}
.t-sub{margin:0 0 14px;font-size:15px;font-weight:500;text-shadow:0 2px 8px rgba(4,18,16,.8);animation:rise .7s .4s cubic-bezier(.2,.9,.3,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(26px)}}
.t-cap{margin:0 0 10px;text-align:right;font-size:12px;color:var(--mute);text-shadow:0 1px 6px rgba(4,18,16,.9)}
.t-cap b{color:var(--paper);font-weight:700;margin-right:6px}
.t-stats{list-style:none;margin:0 0 12px;padding:0;display:flex;gap:20px;font-size:13px;color:var(--paper);text-shadow:0 1px 6px rgba(4,18,16,.9)}
.t-stats b{font-family:var(--f-num);font-size:32px;font-weight:600;color:var(--mark);margin-right:5px;line-height:1;font-variant-numeric:tabular-nums}
.t-go{width:100%;min-height:62px;border-radius:16px;background:var(--mark);color:var(--ink);font-size:21px;font-weight:900;letter-spacing:.35em;text-indent:.35em;
  box-shadow:0 6px 0 #a67f0f,0 0 0 0 rgba(255,210,74,.5);animation:beat 2.2s ease-in-out infinite}
.t-go:active{transform:translateY(4px);box-shadow:0 2px 0 #a67f0f}
@keyframes beat{50%{box-shadow:0 6px 0 #a67f0f,0 0 0 12px rgba(255,210,74,0)}}
.t-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.t-row button{min-height:46px;border-radius:12px;border:1px solid var(--line);background:rgba(12,38,34,.78);font-weight:700;font-size:14.5px}
.t-who{margin:12px 0 0;min-height:24px;font-size:13px;color:var(--mute);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.t-who b{color:var(--paper);font-size:15px}
.t-who button{margin-left:auto;text-decoration:underline;text-underline-offset:3px;color:var(--paper);font-size:13px;min-height:32px;padding:0 4px}
@media (max-height:620px){.t-name{font-size:clamp(40px,13vw,60px)}.t-sub{margin-bottom:8px}.t-go{min-height:52px}}
.chap{margin-top:16px}
.chap h3{margin:0 0 8px;font-size:13px;font-weight:500;color:var(--mute);letter-spacing:.06em;display:flex;justify-content:space-between}
.chap h3 b{font-family:var(--f-num);font-size:15px;font-weight:500;color:var(--mark)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.lv{min-height:66px;border-radius:12px;border:1px solid var(--line);background:var(--ink-2);padding:8px 10px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:2px}
.lv .f{font-family:var(--f-num);font-size:19px;font-weight:600;line-height:1.1}
.lv .n{font-size:12.5px;color:var(--mute);line-height:1.25}
.lv.done{background:var(--mat);border-color:transparent}
.lv.done .f{color:var(--mark)}
.lv.done .n{color:var(--paper)}
.lv.cur{box-shadow:0 0 0 2px var(--mark)}

@media (max-height:560px){.target h1{font-size:21px}.formula{font-size:24px}.part{min-height:62px}}
@media (prefers-reduced-motion:reduce){.sheet,.want,.t-name span,.t-sub,.t-go{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="bar">
      <button class="pill" id="btnLevels" type="button">關卡</button>
      <span class="crumb" id="crumb"></span>
      <button class="pill" id="btn3d" type="button" aria-pressed="false">立體</button>
      <button class="pill" id="btnTut" type="button" aria-pressed="false">教學</button>
      <button class="pill" id="btnHint" type="button" aria-pressed="false">提示</button>
    </div>
    <div class="target">
      <h1 id="name"></h1>
      <div class="formula" id="formula"></div>
    </div>
    <div class="meta">
      <div class="chips" id="chips"></div>
      <span class="timer" id="timer" aria-label="這一關的時間"></span>
      <p class="status" id="status" aria-live="polite"></p>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="cv" aria-label="組裝工作桌"></canvas>
    <p class="note hint" id="hint" hidden></p>
    <p class="note tip" id="tip" hidden></p>
    <div class="note coach" id="coach" hidden>
      <div class="coach-top"><span id="coachStep"></span><button id="btnBack" type="button" hidden>回上一步</button></div>
      <p id="coachDo"></p>
      <p id="coachWhy"></p>
    </div>
  </main>

  <footer class="tray">
    <div class="parts" id="parts"></div>
    <div class="tools">
      <button class="tool go" id="btnH" type="button" hidden>補氫</button>
      <button class="tool" id="btnDel" type="button" disabled>移除</button>
      <button class="tool" id="btnClear" type="button">清空</button>
    </div>
  </footer>

  <section class="sheet" id="win" hidden>
    <div class="tag" id="winTag">組裝完成</div>
    <h2><b id="winName"></b><span id="winFormula"></span></h2>
    <div class="score" id="winScore" hidden></div>
    <p class="got" id="winGot" hidden></p>
    <p id="winFact"></p>
    <div class="row">
      <button class="stay" id="btnStay" type="button">再看一下</button>
      <button class="next" id="btnNext" type="button">下一關</button>
    </div>
  </section>

  <section class="title" id="title">
    <canvas id="tcv" aria-hidden="true"></canvas>
    <div>
      <p class="t-eye">BALL &amp; STICK MODEL KIT</p>
      <h2 class="t-name"><span>分子</span><span>球棍</span><span>組裝</span></h2>
    </div>
    <div>
      <p class="t-cap"><b>腺苷</b>咖啡因要擋住的分子</p>
      <p class="t-sub">只給你名字和一盒原子。<br>憑化學知識，親手把分子接出來。</p>
      <ul class="t-stats" id="tStats"></ul>
      <button class="t-go" id="tStart" type="button">開始遊戲</button>
      <div class="t-row"><button id="tTut" type="button">教學模式</button><button id="tBoard" type="button">排行榜</button></div>
      <p class="t-who" id="tWho"></p>
    </div>
  </section>

  <section class="overlay" id="levels" hidden>
    <div class="top"><h2>關卡表</h2><span style="display:flex;gap:6px"><button class="pill" id="btnTitle" type="button">開始畫面</button><button class="pill" id="btnCloseLevels" type="button">回到工作桌</button></span></div>
    <div class="me" id="me"></div>
    <div class="tabs">
      <button class="tab" id="tabBasic" type="button" aria-pressed="true">基礎</button>
      <button class="tab" id="tabAdv" type="button" aria-pressed="false">進階</button>
    </div>
    <div id="levelList"></div>
    <div class="cloud" id="cloud" hidden style="margin-top:22px">
      <button class="tool" id="gBtn" type="button">另外備份到 Google 雲端硬碟（選用）</button>
      <p id="gNote" aria-live="polite">紀錄平常就會自動存到雲端。想在自己的 Google 雲端硬碟多留一份備份，再按這個按鈕。</p>
    </div>
  </section>

  <section class="overlay sub" id="board" hidden>
    <div class="top"><h2>分數排行榜</h2><button class="pill" data-close="board" type="button">返回</button></div>
    <p class="lead" id="boardNote"></p>
    <div class="rows" id="boardList"></div>
  </section>

  <section class="overlay sub" id="titles" hidden>
    <div class="top"><h2>稱號</h2><button class="pill" data-close="titles" type="button">返回</button></div>
    <p class="lead">達成條件就會解鎖。名字旁邊顯示的是你目前最高的稱號。</p>
    <div class="rows" id="titleList"></div>
  </section>

  <section class="overlay sub" id="pin" hidden style="z-index:9">
    <div class="top"><h2 id="pinTitle">輸入密碼</h2><button class="pill" data-close="pin" type="button">取消</button></div>
    <p class="lead" id="pinLead"></p>
    <form class="newp" id="pinForm">
      <input id="pinIn" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="4 個數字" aria-label="4 碼密碼">
      <button class="tool go" type="submit">確認</button>
    </form>
    <p class="lead" id="pinErr" style="color:var(--bad);margin-top:10px" aria-live="polite"></p>
  </section>

  <section class="overlay sub" id="who" hidden>
    <div class="top"><h2>誰在玩？</h2><button class="pill" id="btnWhoClose" data-close="who" type="button">返回</button></div>

const BO={'-':1,'=':2,'#':3};
function buildTarget(spec){
  const atoms=spec.a.split(' ').map((e,i)=>({id:i,e}));
  const bonds=[];
  for(const t of (spec.b||'').split(' ').filter(Boolean)){
    const m=t.match(/^(\d+)([-=#])(\d+)$/);
    bonds.push({a:+m[1],b:+m[3],o:BO[m[2]]});
  }
  const heavy=atoms.filter(a=>a.e!=='H');
  for(const a of heavy){
    let u=0;for(const k of bonds)if(k.a===a.id||k.b===a.id)u+=k.o;
    for(let i=u;i<EL[a.e].v;i++){const id=atoms.length;atoms.push({id,e:'H'});bonds.push({a:a.id,b:id,o:1});}
  }
  return {atoms,bonds};
}
function countEl(atoms){const c={};for(const a of atoms)c[a.e]=(c[a.e]||0)+1;return c;}
function sig(atoms,bonds){
  const heavy=atoms.filter(a=>a.e!=='H'),idx=new Map(),el=new Map(atoms.map(a=>[a.id,a.e]));
  heavy.forEach((a,i)=>idx.set(a.id,i));
  const nodes=heavy.map(a=>({id:a.id,e:a.e,h:0,adj:new Map()}));
  let hh=0,att=0;
  for(const k of bonds){
    const ha=el.get(k.a)==='H',hb=el.get(k.b)==='H';
    if(ha&&hb)hh++;
    else if(ha){nodes[idx.get(k.b)].h++;att++;}
    else if(hb){nodes[idx.get(k.a)].h++;att++;}
    else{const i=idx.get(k.a),j=idx.get(k.b);nodes[i].adj.set(j,k.o);nodes[j].adj.set(i,k.o);}
  }
  return {nodes,nH:atoms.length-heavy.length,att,hh};
}
function iso(A,B,noH){
  if(A.nodes.length!==B.nodes.length)return null;
  if(!noH&&(A.nH!==B.nH||A.att!==B.att||A.hh!==B.hh))return null;
  const n=A.nodes.length,map=new Array(n).fill(-1),taken=new Array(n).fill(false);
  const ok=(i,j)=>{
    const a=A.nodes[i],b=B.nodes[j];
    if(a.e!==b.e||(!noH&&a.h!==b.h)||a.adj.size!==b.adj.size)return false;
    for(const [p,o] of a.adj){if(p<i&&b.adj.get(map[p])!==o)return false;}
    return true;
  };
  const go=i=>{
    if(i===n)return true;
    for(let j=0;j<n;j++){
      if(taken[j]||!ok(i,j))continue;
      taken[j]=true;map[i]=j;
      if(go(i+1))return true;
      taken[j]=false;map[i]=-1;
    }

}

/* 教學模式：把目標分子拆成一步一步的組裝順序 */
function buildSteps(lv){
  const T=lv.target,isH=id=>T.atoms[id].e==='H';
  const heavy=T.atoms.filter(a=>a.e!=='H');
  const cur={atoms:[],bonds:[]},steps=[];
  const push=s=>{s.sig=sig(cur.atoms,cur.bonds);steps.push(s);};
  if(!heavy.length){
    cur.atoms.push(T.atoms[0]);push({k:'place',e:'H',first:true});
    cur.atoms.push(T.atoms[1]);push({k:'place',e:'H'});
    cur.bonds.push({a:0,b:1,o:1});push({k:'join',all:true});
    return steps;
  }
  const hb=T.bonds.filter(k=>!isH(k.a)&&!isH(k.b));
  const seen=new Set([heavy[0].id]),queue=[heavy[0].id],tree=new Set();
  cur.atoms.push(heavy[0]);push({k:'place',e:heavy[0].e,first:true});
  while(queue.length){
    const p=queue.shift();
    for(const k of hb){
      const q=k.a===p?k.b:k.b===p?k.a:-1;
      if(q<0||seen.has(q))continue;
      seen.add(q);queue.push(q);tree.add(k);
      cur.atoms.push(T.atoms[q]);cur.bonds.push({a:p,b:q,o:1});
      push({k:'attach',e:T.atoms[q].e,p});
    }
  }
  for(const k of hb)if(!tree.has(k)){cur.bonds.push({a:k.a,b:k.b,o:1});push({k:'join',a:k.a,b:k.b});}
  for(const k of hb)for(let o=2;o<=k.o;o++){
    cur.bonds.find(x=>(x.a===k.a&&x.b===k.b)||(x.a===k.b&&x.b===k.a)).o=o;
    push({k:'up',a:k.a,b:k.b,to:o});
  }
  const hbonds=T.bonds.filter(k=>isH(k.a)||isH(k.b));
  if(lv.autoH){
    for(const k of hbonds){cur.atoms.push(T.atoms[isH(k.a)?k.a:k.b]);cur.bonds.push({a:k.a,b:k.b,o:1});}
    push({k:'fillH'});
  }else for(const k of hbonds){
    const h=isH(k.a)?k.a:k.b,p=isH(k.a)?k.b:k.a;
    cur.atoms.push(T.atoms[h]);cur.bonds.push({a:k.a,b:k.b,o:1});push({k:'attach',e:'H',p});
  }
  return steps;
}

function pegAngles(a){

  }

  nb.sort((x,y)=>x-y);
  let best=0,start=nb[0];
  for(let i=0;i<nb.length;i++){
    const s=nb[i],e=i+1<nb.length?nb[i+1]:nb[0]+2*Math.PI;

  }
  return Array.from({length:n},(_,i)=>start+best*(i+1)/(n+1));

/* ---------- 物理：棍子是彈簧，同一個分子裡的球互相推開 ---------- */

  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){

  for(const a of A){

    a.x+=gx;a.y+=gy;

/* ---------- 繪圖 ---------- */
function drawMat(){
  const g=24;

  for(let x=0,i=0;x<=W;x+=g,i++){
    ctx.strokeStyle=i%5?'rgba(255,210,74,.07)':'rgba(255,210,74,.2)';

  }

  }
  ctx.fillStyle='rgba(255,210,74,.45)';ctx.font='500 11px "Barlow Condensed",sans-serif';
  ctx.textAlign='left';ctx.textBaseline='top';

/* ---------- 立體檢視：棍子是彈簧，每顆球身邊的鄰居、空手和孤對電子互相推開（VSEPR） ---------- */
function lonePairs(a){
  const dbl=id=>st.bonds.some(q=>(q.a===id||q.b===id)&&q.o>1);

    let n=0,sp=0;
    for(const k of st.bonds){
      if(k.a!==a.id&&k.b!==a.id)continue;
      if(k.o>1)return 0;
      n++;if(dbl(k.a===a.id?k.b:k.a))sp++;
    }
    return n===2&&sp===2?1:2;   /* 夾在兩個 sp2 碳中間的 O（呋喃環）：孤對電子躺在環的平面上 */
  }

/* 平面型的原子：有雙鍵，或是接在雙鍵旁邊、沒有立體孤對的 N、O */
function isFlat(a){
  if(st.bonds.some(q=>(q.a===a.id||q.b===a.id)&&q.o===2))return true;
  const n=st.bonds.filter(q=>q.a===a.id||q.b===a.id).length;

function rnd3(){let x,y,z,d;do{x=Math.random()*2-1;y=Math.random()*2-1;z=Math.random()*2-1;d=Math.hypot(x,y,z);}while(d<.2||d>1);return{x:x/d,y:y/d,z:z/d};}
function syncPh(){
  for(const a of st.atoms){
    const nf=Math.max(0,free(a)),n=nf+lonePairs(a);
    if(!a.ph)a.ph=[];
    while(a.ph.length>n)a.ph.pop();
    while(a.ph.length<n)a.ph.push(rnd3());
    a.ph.forEach((p,i)=>{p.free=i<nf;});

function flat3(a){a.p3={x:(a.x-W/2)*.85,y:(a.y-(H-bottomPad)/2)*.85,z:(Math.random()-.5)*150};a.v3={x:0,y:0,z:0};}
function init3(m){
  for(const a of st.atoms){
    if(a.p3)continue;
    let par=null;

    const a=m.get(k.a),b=m.get(k.b);a.nb.push(b);b.nb.push(a);
    const dx=b.p3.x-a.p3.x,dy=b.p3.y-a.p3.y,dz=b.p3.z-a.p3.z,d=Math.hypot(dx,dy,dz)||.01;

    let f=0;
    if(a.comp===b.comp&&d<260*S)f-=Math.min(1,300*S*S/(d*d));

    }
  }
  if(A.length){cx/=A.length;cy/=A.length;cz/=A.length;for(const a of A){a.p3.x-=cx*.2;a.p3.y-=cy*.2;a.p3.z-=cz*.2;}}
  return mx;
}
function scr(p){
  const cy=Math.cos(rot.y),sy=Math.sin(rot.y),cx=Math.cos(rot.x),sx=Math.sin(rot.x);
  const x1=p.x*cy+p.z*sy,z1=-p.x*sy+p.z*cy,y2=p.y*cx-z1*sx,z2=p.y*sx+z1*cx;
  const s=fit*F3/(F3-z2*fit);
  return{x:W/2+x1*s,y:topPad+(H-topPad-bottomPad)/2+y2*s,s,z:z2};
}
function project(){
  const P=new Map();
  for(const a of st.atoms)P.set(a.id,view3&&a.p3?scr(a.p3):{x:a.x,y:a.y,s:1,z:0});
  return P;
}
function setView3(on){
  view3=on;$('btn3d').setAttribute('aria-pressed',on);
  if(on){for(const a of st.atoms)if(!a.p3)flat3(a);syncPh();spinHold=performance.now()+900;}
  $('stage').classList.toggle('v3',on);
  renderMeta();kick(120);
}
function draw(now){
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  drawMat();
  if(view3){
    let ext=40;for(const a of st.atoms)if(a.p3)ext=Math.max(ext,Math.hypot(a.p3.x,a.p3.y,a.p3.z)+R(a.e)+14*S);
    const tg=Math.max(.4,Math.min(1.4,(Math.min(W,H-topPad-bottomPad)/2-6)/ext));
    fit+=(tg-fit)*.12;
  }
  const P=project();
  ctx.lineCap='round';
  for(const a of st.atoms)if(a.shake){const t=now-a.shake;if(t<350)P.get(a.id).x+=Math.sin(t/22)*5*(1-t/350);else a.shake=0;}
  // 教學：發亮的棍子
  if(tut.hl.bond){
    const a=P.get(tut.hl.bond[0]),b=P.get(tut.hl.bond[1]);
    if(a&&b){
      ctx.strokeStyle=`rgba(255,210,74,${reduced?.6:.45+.3*Math.sin(now/220)})`;ctx.lineWidth=30*S*(a.s+b.s)/2;
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    }
  }
  const items=[];
  for(const k of st.bonds){const a=P.get(k.a),b=P.get(k.b);items.push({t:0,z:(a.z+b.z)/2,k,a,b});}
  if(!st.won)for(const a of st.atoms){
    const pa=P.get(a.id),r=R(a.e);
    if(view3&&a.p3){
      for(const p of a.ph||[]){
        if(!p.free)continue;
        const q0=scr({x:a.p3.x+p.x*r*.55,y:a.p3.y+p.y*r*.55,z:a.p3.z+p.z*r*.55}),q=scr({x:a.p3.x+p.x*(r+10*S),y:a.p3.y+p.y*(r+10*S),z:a.p3.z+p.z*(r+10*S)});
        items.push({t:1,z:q.z+.001,x1:q0.x,y1:q0.y,x2:q.x,y2:q.y,s:q.s});
      }
    }else for(const ang of pegAngles(a)){
      const c=Math.cos(ang),s=Math.sin(ang);
      items.push({t:1,z:.001,x1:pa.x+c*(r-2),y1:pa.y+s*(r-2),x2:pa.x+c*(r+9*S),y2:pa.y+s*(r+9*S),s:1});
    }
  }
  for(const a of st.atoms){const p=P.get(a.id);items.push({t:2,z:p.z+.002,a,p});}
  items.sort((u,v)=>u.z-v.z);
  for(const it of items){
    if(it.t===0){
      const k=it.k;let a=it.a,b=it.b,ea=atomBy(k.a).e,eb=atomBy(k.b).e;
      if(a.z>b.z){const t=a;a=b;b=t;const e=ea;ea=eb;eb=e;}
      let ax=a.x,ay=a.y;const dx=b.x-ax,dy=b.y-ay,d=Math.hypot(dx,dy)||1,nx=-dy/d,ny=dx/d,sc=(a.s+b.s)/2*S;
      if(view3){const tr=Math.min(R(ea)*a.s*.9,d*.45);ax+=dx/d*tr;ay+=dy/d*tr;}
      const offs=k.o===1?[0]:k.o===2?[-5.5,5.5]:[-9,0,9],w=(k.o===1?8:6)*sc;
      for(const pass of [0,1])for(const o of offs){
        ctx.strokeStyle=pass?'#dfe7e3':'rgba(6,24,21,.55)';ctx.lineWidth=pass?w:w+3;
        ctx.beginPath();ctx.moveTo(ax+nx*o*sc,ay+ny*o*sc);ctx.lineTo(b.x+nx*o*sc,b.y+ny*o*sc);ctx.stroke();
      }
    }else if(it.t===1){
      ctx.strokeStyle='rgba(6,24,21,.5)';ctx.lineWidth=7*S*it.s;
      ctx.beginPath();ctx.moveTo(it.x1,it.y1);ctx.lineTo(it.x2,it.y2);ctx.stroke();
      ctx.strokeStyle='#ffd24a';ctx.lineWidth=4*S*it.s;
      ctx.beginPath();ctx.moveTo(it.x1,it.y1);ctx.lineTo(it.x2,it.y2);ctx.stroke();
    }else{
      const a=it.a,p=it.p,d=EL[a.e],r=R(a.e)*p.s,x=p.x,y=p.y;
      ctx.fillStyle='rgba(4,18,16,.3)';ctx.beginPath();ctx.arc(x+2.5,y+4,r,0,7);ctx.fill();
      const g=ctx.createRadialGradient(x-r*.35,y-r*.4,r*.08,x,y,r);
      g.addColorStop(0,d.c1);g.addColorStop(1,d.c2);
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
      ctx.fillStyle=d.ink;ctx.font=`600 ${Math.round(r*.95)}px "Barlow Condensed",sans-serif`;
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(a.e,x,y+1);
      if(view3&&p.z<0){ctx.fillStyle=`rgba(10,36,31,${Math.min(.42,-p.z/380)})`;ctx.beginPath();ctx.arc(x,y,r+.5,0,7);ctx.fill();}
      if(st.sel===a.id){
        ctx.strokeStyle='#ffd24a';ctx.lineWidth=3;ctx.setLineDash([7,6]);
        ctx.lineDashOffset=reduced?0:-now/45;
        ctx.beginPath();ctx.arc(x,y,r+6,0,7);ctx.stroke();ctx.setLineDash([]);
      }
    }
  }
  // 教學：亮起來的球
  for(const id of tut.hl.atoms){
    const a=atomBy(id),p=P.get(id);if(!a||!p||st.sel===id)continue;
    const r=R(a.e)*p.s+8+(reduced?0:2.5*Math.sin(now/220));
    ctx.strokeStyle='#ffd24a';ctx.lineWidth=3.5;ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.stroke();
    ctx.strokeStyle='rgba(255,210,74,.35)';ctx.lineWidth=7;ctx.beginPath();ctx.arc(p.x,p.y,r+5,0,7);ctx.stroke();
  }
  // 完成時的光圈
  fx=fx.filter(f=>now-f.t<900);
  for(const f of fx){
    const t=(now-f.t)/900;if(t<0)continue;
    ctx.strokeStyle=`rgba(255,210,74,${(1-t)*.8})`;ctx.lineWidth=4*(1-t)+1;
    ctx.beginPath();ctx.arc(f.x,f.y,30+t*Math.max(W,H)*.5,0,7);ctx.stroke();
  }
}
function tick(now){
  raf=0;
  const e=view3?step3():step();
  if(view3&&!reduced&&!drag&&st.sel==null&&now>spinHold)rot.y+=.007;
  draw(now);
  if(awake>0)awake--;
  if(titleOn)return;
  if(e>.02||awake>0||drag||fx.length||(view3&&!reduced)||(st.sel!=null&&!reduced)||(!reduced&&(tut.hl.atoms.length||tut.hl.bond))||st.atoms.some(a=>a.shake))raf=requestAnimationFrame(tick);
}
function kick(n){awake=Math.max(awake,n||60);if(!raf)raf=requestAnimationFrame(tick);}

/* ---------- 觸控 ---------- */
function pos(ev){const r=cv.getBoundingClientRect();return{x:ev.clientX-r.left,y:ev.clientY-r.top};}
function hitAtom(p){
  const P=project(),L=st.atoms.map((a,i)=>({a,q:P.get(a.id),i})).sort((u,v)=>(v.q.z-u.q.z)||(v.i-u.i));
  for(const {a,q} of L)if(Math.hypot(q.x-p.x,q.y-p.y)<R(a.e)*q.s+9)return a;
  return null;
}
function hitBond(p){
  const P=project();
  for(const k of st.bonds){
    const a=P.get(k.a),b=P.get(k.b),dx=b.x-a.x,dy=b.y-a.y,l2=dx*dx+dy*dy||1;
    const t=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/l2));
    if(Math.hypot(a.x+dx*t-p.x,a.y+dy*t-p.y)<14)return k;
  }
  return null;
}
cv.addEventListener('pointerdown',ev=>{
  const p=pos(ev),a=hitAtom(p);
  try{cv.setPointerCapture(ev.pointerId);}catch(e){}
  if(a)drag={id:a.id,sx:p.x,sy:p.y,lx:p.x,ly:p.y,ox:a.x-p.x,oy:a.y-p.y,moved:false};
  else drag={id:null,bond:hitBond(p),sx:p.x,sy:p.y,lx:p.x,ly:p.y,moved:false};
  kick();
});
cv.addEventListener('pointermove',ev=>{
  if(!drag)return;
  const p=pos(ev);
  if(!drag.moved&&Math.hypot(p.x-drag.sx,p.y-drag.sy)>8)drag.moved=true;
  if(drag.moved&&view3){
    rot.y+=(p.x-drag.lx)*.011;rot.x=Math.max(-1.5,Math.min(1.5,rot.x-(p.y-drag.ly)*.011));
    spinHold=performance.now()+2500;kick();
  }else if(drag.moved&&drag.id!=null){
    const a=atomBy(drag.id);
    if(a){a.x=p.x+drag.ox;a.y=p.y+drag.oy;clampAtom(a);kick();}
  }
  drag.lx=p.x;drag.ly=p.y;
});
function endDrag(ev,cancel){
  if(!drag)return;
  const d=drag;drag=null;
  if(!cancel&&!d.moved){
    if(d.id!=null)tapAtom(d.id);
    else if(d.bond&&st.bonds.includes(d.bond))cycle(d.bond);
    else if(st.sel!=null){st.sel=null;renderMeta();}
  }
  kick();
}
cv.addEventListener('pointerup',ev=>endDrag(ev,false));
cv.addEventListener('pointercancel',ev=>endDrag(ev,true));

async function pickPlayer(raw){
  const name=String(raw||'').replace(/\s+/g,' ').trim().slice(0,12);
  if(!name)return;
  const p=store.players.find(x=>x.name===name);
  if(p){
    if(p.ph&&name!==store.cur)askPin(name,p.ph,()=>enter(name));else enter(name);
    return;
  }
  $('whoMsg').textContent='正在查「'+name+'」有沒有玩過…';
  const rem=await savePull(name);
  $('whoMsg').textContent='';
  if(rem&&rem.best){
    const fin=()=>{mergePlayers(store.players,[{name,best:rem.best,up:rem.up,ph:rem.ph||null}]);enter(name);toast('接回「'+name+'」之前的紀錄');};
    if(rem.ph)askPin(name,rem.ph,fin);else fin();
    return;
  }
  const np={name,best:{},made:Date.now(),up:Date.now(),ph:null};store.players.push(np);
  if(store.legacy){grantLegacy(np,store.legacy);store.legacy=null;try{localStorage.removeItem('bskit-done');}catch(e){}}
  enter(name);
}

/* 自動雲端紀錄：開啟遊戲、過關、換人、回到前景、恢復連線時都會自己同步，不用按任何按鈕。

let syncState='idle',syncAt=0,syncBusy=false,syncAgain=false;

    off:'連不到雲端，紀錄先存在這台，連上後會自動同步',locked:'線上有同名且上鎖的紀錄，這份只存在這台裝置'}[syncState];

}
function setSync(v){syncState=v;if(v==='ok')syncAt=Date.now();renderSync();}
async function syncOne(p,force){
  const key=fbKey(p.name),r=await fetch(FBS+'/'+key+'.json');
  if(!r.ok)throw new Error('http '+r.status);
  const old=await r.json();
  if(old&&old.ph&&old.ph!==p.ph&&!force)return 'locked';
  const before=JSON.stringify(p.best);
  if(old&&old.best)mergePlayers([p],[{name:p.name,best:old.best,up:old.up}]);
  const now=JSON.stringify(p.best),pulled=now!==before;
  if(p.d||force||!old||JSON.stringify(old.best||{})!==now||(old.ph||null)!==(p.ph||null)){
    const put=async(u,d)=>{const x=await fetch(u,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d),keepalive:true});if(!x.ok)throw new Error('http '+x.status);};
    const row=boardRow(p);
    if(row.s||p.ph||old){
      await put(FBS+'/'+key+'.json',{n:p.name,best:p.best,ph:p.ph||null,up:Date.now()});
      if(row.s)await put(FB+'/'+key+'.json',row);
    }
  }
  p.d=0;
  return pulled?'pulled':'ok';
}
async function syncAll(force){
  if(!store.players.length)return;
  if(syncBusy){syncAgain=true;return;}
  syncBusy=true;setSync('busy');
  try{
    const cur=player();let pulled=false,locked=false;
    for(const p of store.players){
      if(p!==cur&&!p.d)continue;
      const r=await syncOne(p,force&&p===cur);
      if(r==='pulled')pulled=true;
      if(r==='locked'&&p===cur)locked=true;
    }
    save();
    if(pulled){if(!$('levels').hidden)openLevels(true);titleWho();}
    setSync(locked?'locked':'ok');
  }catch(e){save();setSync('off');}
  syncBusy=false;
  if(syncAgain){syncAgain=false;syncAll();}
}
function boardPush(force){
  clearTimeout(boardT);
  const p=player();if(p){p.d=1;save();}
  boardT=setTimeout(()=>syncAll(force),force?50:900);
}

function renderBoard(){
  const m=new Map();
  for(const k in boardRemote||{}){const r=boardRemote[k];if(r&&typeof r.n==='string'&&r.s>0)m.set(r.n,{n:r.n.slice(0,12),s:+r.s||0,st:+r.st||0,lv:+r.lv||0,ti:Math.max(0,Math.min(TITLES.length-1,+r.ti||0))});}
  for(const p of store.players){const r=boardRow(p),o=m.get(p.name);if(r.s>0&&(!o||r.s>=o.s))m.set(p.name,r);}
  const rows=[...m.values()].sort((a,b)=>b.s-a.s||b.st-a.st).slice(0,50);
  $('boardList').innerHTML=rows.length?rows.map((r,i)=>
    `<div class="rowp ${r.n===store.cur?'you':''}"><span class="rk">${i+1}</span><span class="nm"><b>${esc(r.n)}</b><small>${TITLES[r.ti].n}　${r.lv} 關　★ ${r.st}</small></span><span class="sc">${r.s}<small>分</small></span></div>`).join('')
    :'<p class="lead">還沒有人上榜。完成任何一關（不用教學）就會出現在這裡。</p>';
}

/* ---------- 雲端存檔：過關紀錄存成玩家自己 Google 雲端硬碟裡的隱藏 App 檔 ---------- */
const GCLIENT='267421312122-l2ggo7t35tqpf8ej5osqttt08ke30lr1.apps.googleusercontent.com';
const GFILE='ballstick.json',GAPI='https://www.googleapis.com';
let gTok=null,gTokExp=0,gFileId=null,gClient=null,gOn=false,gTimer=0;
const gNote=t=>{$('gNote').textContent=t;},gBtn=t=>{$('gBtn').textContent=t;};
const gLinked=()=>{try{return localStorage.getItem('bskit-g')==='1';}catch(e){return false;}};
const gTime=()=>new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
function gLoadLib(){return new Promise((ok,no)=>{
  if(window.google&&google.accounts&&google.accounts.oauth2)return ok();
  const sc=document.createElement('script');sc.src='https://accounts.google.com/gsi/client';
  sc.onload=()=>ok();sc.onerror=()=>no(new Error('lib'));document.head.appendChild(sc);
});}
async function gFetch(url,opt={}){
  if(!gTok||Date.now()>gTokExp)throw new Error('auth');
  const r=await fetch(url,Object.assign({},opt,{headers:Object.assign({Authorization:'Bearer '+gTok},opt.headers||{})}));
  if(r.status===401){gTok=null;throw new Error('auth');}
  if(!r.ok)throw new Error('http '+r.status);
  return r;
}
async function gFindFile(){
  const r=await gFetch(GAPI+'/drive/v3/files?spaces=appDataFolder&fields=files(id)&q='+encodeURIComponent("name='"+GFILE+"'"));
  const j=await r.json();return j.files&&j.files[0]?j.files[0].id:null;
}
async function gWrite(){
  const body=JSON.stringify({v:2,players:store.players,savedAt:Date.now()});
  if(gFileId)return gFetch(GAPI+'/upload/drive/v3/files/'+gFileId+'?uploadType=media',{method:'PATCH',keepalive:true,headers:{'Content-Type':'application/json'},body});
  const b='bskit'+Date.now(),meta=JSON.stringify({name:GFILE,parents:['appDataFolder']});
  const mp='--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+meta+'\r\n--'+b+'\r\nContent-Type: application/json\r\n\r\n'+body+'\r\n--'+b+'--';
  const r=await gFetch(GAPI+'/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:mp});
  gFileId=(await r.json()).id;
}
function gExpired(){gBtn('點這裡連回 Google');gNote('Google 連線過期了，進度先存在這台。點上面的按鈕重新連線，就會同步。');}
function gPush(){
  gTimer=0;
  if(!gOn)return;
  if(!gTok||Date.now()>gTokExp){gExpired();return;}
  gWrite().then(()=>{gBtn('已連上 Google 備份');gNote('已備份到 Google 雲端硬碟　'+gTime());})
    .catch(e=>{if(e.message==='auth')gExpired();else gNote('雲端同步失敗，進度先存在這台。稍後過關時會再試一次。');});
}
gQueue=()=>{
  if(gOn){clearTimeout(gTimer);gTimer=setTimeout(gPush,800);}
  else if(gLinked()&&st.won)setTimeout(()=>toast('紀錄先存在這台。到「關卡」連回 Google 就會備份'),60);
};
async function gAfterLogin(){
  gNote('正在讀取 Google 雲端的進度…');
  try{
    gFileId=await gFindFile();
    let d=null;
    if(gFileId){const r=await gFetch(GAPI+'/drive/v3/files/'+gFileId+'?alt=media');d=await r.json().catch(()=>null);}
    const cnt=()=>store.players.reduce((n,p)=>n+Object.keys(p.best).length,0),before=cnt();
    if(d&&Array.isArray(d.players))mergePlayers(store.players,d.players);
    if(d&&Array.isArray(d.done)){const p=player();if(p)grantLegacy(p,d.done);else store.legacy=(store.legacy||[]).concat(d.done);}
    save();gOn=true;
    try{localStorage.setItem('bskit-g','1');}catch(e){}
    if(!$('levels').hidden)openLevels(true);
    if(!$('who').hidden)renderWho();
    const got=cnt()-before;
    await gWrite();
    gBtn('已連上 Google 同步');
    gNote((got>0?`從雲端接回 ${got} 筆過關紀錄。`:'')+'已同步到 Google 雲端硬碟　'+gTime());
  }catch(e){
    if(e.message==='auth')gExpired();else gNote('讀取 Google 雲端失敗（'+e.message+'）。進度仍存在這台，請再點一次按鈕。');
  }
}
async function gLogin(){
  if(!(window.google&&google.accounts&&google.accounts.oauth2)){
    try{await gLoadLib();}catch(e){gNote('無法載入 Google 登入，請確認網路後再試。');return;}
  }
  if(!gClient)gClient=google.accounts.oauth2.initTokenClient({client_id:GCLIENT,scope:'https://www.googleapis.com/auth/drive.appdata',
    callback:t=>{
      if(t&&t.access_token){gTok=t.access_token;gTokExp=Date.now()+((+t.expires_in||3600)-120)*1000;gAfterLogin();}
      else gNote('Google 登入沒有完成，請再試一次。');
    },
    error_callback:()=>gNote('Google 登入被取消或被擋住了。請允許彈出視窗後再點一次。')});
  gClient.requestAccessToken({prompt:gLinked()?'':'consent'});
}
$('gBtn').addEventListener('click',gLogin);
/* 只有在能載入 Google 登入的地方（GitHub 版）才顯示同步區塊 */

const HERO={"a":[["N",132,164,-13],["C",126,126,-62],["C",109,153,40],["N",96,76,-56],["C",77,97,43],["N",117,193,88],["C",69,59,-2],["N",48,74,93],["N",33,8,18],["C",24,23,79],["C",10,-47,-10],["O",-38,-65,27],["C",-19,-60,-69],["C",-91,-87,-2],["C",-59,-111,-54],["O",19,-73,-118],["C",-130,-111,47],["O",-99,-136,-97],["O",-128,-76,99],["H",149,139,-111],["H",145,240,83],["H",96,185,138],["H",-3,-2,121],["H",57,-79,-11],["H",-48,-15,-88],["H",-129,-53,-26],["H",-28,-157,-45],["H",24,-35,-158],["H",-118,-163,63],["H",-185,-111,31],["H",-96,-126,-151],["H",-156,-29,102]],"b":[[0,1,1],[0,2,2],[1,3,2],[2,4,1],[2,5,1],[3,6,1],[4,7,1],[6,8,1],[7,9,2],[8,10,1],[10,11,1],[10,12,1],[11,13,1],[12,14,1],[12,15,1],[13,16,1],[14,17,1],[16,18,1],[6,4,2],[9,8,1],[13,14,1],[1,19,1],[5,20,1],[5,21,1],[9,22,1],[10,23,1],[12,24,1],[13,25,1],[14,26,1],[15,27,1],[16,28,1],[16,29,1],[17,30,1],[18,31,1]]};
(()=>{let x=0,y=0,z=0;const n=HERO.a.length;for(const a of HERO.a){x+=a[1]/n;y+=a[2]/n;z+=a[3]/n;}for(const a of HERO.a){a[1]-=x;a[2]-=y;a[3]-=z;}})();
const HEXT=Math.max(...HERO.a.map(a=>Math.hypot(a[1],a[2],a[3])))+26;
const HSTART=HERO.a.map((a,i)=>{const t=i*2.399963,r=520+60*(i%5);return[Math.cos(t)*r,Math.sin(t*1.7)*r*.8,Math.sin(t)*r];});
let tRaf=0,tRot={x:-.55,y:.3},tDrag=null,tT0=0;
function tBall(g,x,y,r,d,label){
  g.fillStyle='rgba(4,18,16,.3)';g.beginPath();g.arc(x+r*.12,y+r*.2,r,0,7);g.fill();
  const gr=g.createRadialGradient(x-r*.35,y-r*.4,r*.08,x,y,r);gr.addColorStop(0,d.c1);gr.addColorStop(1,d.c2);
  g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();
  if(label&&r>9){g.fillStyle=d.ink;g.font=`600 ${Math.round(r*.95)}px "Barlow Condensed",sans-serif`;g.textAlign='center';g.textBaseline='middle';g.fillText(label,x,y+1);}
}
function titleFrame(now){
  tRaf=0;if(!titleOn)return;
  const c=$('tcv'),w=c.clientWidth,h=c.clientHeight,d=Math.min(3,window.devicePixelRatio||1);
  if(w<10||h<10){tRaf=requestAnimationFrame(titleFrame);return;}
  if(c.width!==Math.round(w*d)||c.height!==Math.round(h*d)){c.width=Math.round(w*d);c.height=Math.round(h*d);}
  const g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,w,h);
  g.lineWidth=1;
  for(let x=0,i=0;x<=w;x+=28,i++){g.strokeStyle=i%5?'rgba(255,210,74,.05)':'rgba(255,210,74,.13)';g.beginPath();g.moveTo(x+.5,0);g.lineTo(x+.5,h);g.stroke();}
  for(let y=0,i=0;y<=h;y+=28,i++){g.strokeStyle=i%5?'rgba(255,210,74,.05)':'rgba(255,210,74,.13)';g.beginPath();g.moveTo(0,y+.5);g.lineTo(w,y+.5);g.stroke();}
  /* 主角分子放在標題和按鈕之間的空檔，偏右，可以蓋到標題右邊 */
  const bx=c.getBoundingClientRect(),d1=$('title').children[1].getBoundingClientRect(),d2=$('title').children[2].getBoundingClientRect();
  const y0=Math.max(40,d1.bottom-bx.top-d1.height*.45),y1=d2.top-bx.top+18,gap=Math.max(120,y1-y0);
  const cx=w*.63,cy=y0+gap/2,k=Math.min(w*.98,gap*1.12)/(2*HEXT);
  const gl=g.createRadialGradient(cx,cy,8,cx,cy,Math.min(w,h)*.6);gl.addColorStop(0,'rgba(255,210,74,.2)');gl.addColorStop(1,'rgba(255,210,74,0)');
  g.fillStyle=gl;g.fillRect(0,0,w,h);
  /* 背景裡慢慢飄的零件 */
  const tt=reduced?0:now/1000;
  g.globalAlpha=.4;
  for(let i=0;i<11;i++){
    const e=ORDER[i%6],r=5+(i%5)*3.2;
    const x=((i*137.5)%100)/100*w+Math.sin(tt*.35+i)*18,y=(((i*61)%100)/100*(h+80)+tt*(5+i%4*3))%(h+80)-40;
    tBall(g,x,y,r,EL[e]);
  }
  g.globalAlpha=1;
  if(!tDrag&&!reduced)tRot.y+=.006;
  const el=now-tT0,cyR=Math.cos(tRot.y),syR=Math.sin(tRot.y),cxR=Math.cos(tRot.x),sxR=Math.sin(tRot.x);
  const P=HERO.a.map((a,i)=>{
    const t=reduced?1:Math.max(0,Math.min(1,(el-200-i*26)/900)),q=1-Math.pow(1-t,3),s0=HSTART[i];
    const x=s0[0]+(a[1]-s0[0])*q,y=s0[1]+(a[2]-s0[1])*q,z=s0[2]+(a[3]-s0[2])*q;
    const x1=x*cyR+z*syR,z1=-x*syR+z*cyR,y2=y*cxR-z1*sxR,z2=y*sxR+z1*cxR,sc=k*900/(900-z2*k);
    return{x:cx+x1*sc,y:cy+y2*sc,s:sc,z:z2,e:a[0]};
  });
  const ba=reduced?1:Math.max(0,Math.min(1,(el-1150)/500));
  const items=HERO.b.map(b=>({b,z:(P[b[0]].z+P[b[1]].z)/2})).concat(P.map(p=>({p,z:p.z+.002}))).sort((u,v)=>u.z-v.z);
  g.lineCap='round';
  for(const it of items){
    if(it.b){
      if(ba<=0)continue;
      let a=P[it.b[0]],b=P[it.b[1]];if(a.z>b.z){const t=a;a=b;b=t;}
      const dx=b.x-a.x,dy=b.y-a.y,dd=Math.hypot(dx,dy)||1,nx=-dy/dd,ny=dx/dd,sc=(a.s+b.s)/2,o=it.b[2];
      const tr=Math.min(EL[a.e].r*a.s*.9,dd*.45),ax=a.x+dx/dd*tr,ay=a.y+dy/dd*tr;
      g.globalAlpha=ba;
      for(const pass of [0,1])for(const off of (o===1?[0]:[-5.5,5.5])){
        g.strokeStyle=pass?'#dfe7e3':'rgba(6,24,21,.55)';g.lineWidth=(o===1?8:6)*sc+(pass?0:3);
        g.beginPath();g.moveTo(ax+nx*off*sc,ay+ny*off*sc);g.lineTo(b.x+nx*off*sc,b.y+ny*off*sc);g.stroke();
      }
      g.globalAlpha=1;
    }else{
      const p=it.p,r=EL[p.e].r*p.s;
      tBall(g,p.x,p.y,r,EL[p.e],p.e);
      if(p.z<0){g.fillStyle=`rgba(10,36,31,${Math.min(.45,-p.z/330)})`;g.beginPath();g.arc(p.x,p.y,r+.5,0,7);g.fill();}
    }
  }
  if(!reduced||tDrag)tRaf=requestAnimationFrame(titleFrame);
}

function resize(){
  const r=$('stage').getBoundingClientRect();
  if(r.width<10||r.height<10)return;
  W=r.width;H=r.height;dpr=Math.min(3,window.devicePixelRatio||1);

function start(data){
  load();

  if(data&&typeof data.lvl==='number'&&Array.isArray(data.atoms)){
    st={lvl:data.lvl,atoms:data.atoms.map(a=>({id:a.id,e:a.e,x:a.x,y:a.y,vx:0,vy:0,comp:0})).filter(a=>EL[a.e]),

    goLevel(st.lvl,true);
  }else{

}
