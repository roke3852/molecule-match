/* 版面：和分子球棍組裝同一套像素風。上面是題目，中間是組裝桌，下面是 26 個字母的零件盒 */
:root{--ink:#14142b;--ink-2:#23284f;--mat:#2e3670;--paper:#f6ecc9;--mute:#a9adcf;--mark:#f2c14e;--bad:#ff9b85;--line:rgba(246,236,201,.28);
  --vow:#e86a5c;--con:#5b8def;--f:"Pixel16","Noto Sans TC","PingFang TC",sans-serif;--px:"Press Start 2P",ui-monospace,monospace;
  --sat:env(safe-area-inset-top,0px);--deco:18px;--top:calc(var(--sat) + var(--deco));color-scheme:dark}
:root.ios{--deco:46px}
*{box-sizing:border-box;touch-action:manipulation;font-weight:400!important}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--f);font-size:16px;line-height:1.5;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-synthesis:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto;position:relative}
.topdeco{position:absolute;top:var(--sat);left:0;right:0;height:var(--deco);z-index:25;pointer-events:none;background:#14142b}
.topdeco canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.btn{min-height:36px;padding:0 10px;border-radius:4px;border:2px solid #0b0b1c;background:#3b4a86;color:var(--paper);box-shadow:0 3px 0 #0b0b1c;font-size:16px;white-space:nowrap}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0b0b1c}
.btn.go,.btn[aria-pressed="true"]{background:var(--mark);color:#14142b}
.btn:disabled{opacity:.35;box-shadow:none;transform:none}
/* 題目 */
header{padding:calc(10px + var(--top)) 16px 10px;display:grid;gap:8px;border-bottom:3px solid #0b0b1c}
.q{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.emo{font-size:46px;line-height:1;width:58px;height:58px;display:grid;place-items:center;border-radius:6px;background:#23284f;border:2px solid #0b0b1c;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.word{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.word span{min-width:30px;height:40px;padding:0 4px;display:grid;place-items:center;font-size:32px;border-bottom:3px solid var(--line);color:var(--paper)}
.word span.ok{color:var(--mark);border-color:var(--mark)}
.zh{font-size:16px;color:var(--mute)}
.say{width:48px;height:48px;font-size:22px;display:grid;place-items:center}
.bar{display:flex;gap:6px;align-items:center}
.crumb{flex:1;min-width:0;font-size:16px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{margin:0;font-size:16px;color:var(--mute);min-height:1.5em}
.status.warn{color:var(--bad)}.status.good{color:var(--mark)}
/* 組裝桌 */
.stage{flex:1;min-height:0;position:relative;background:#14142b;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
.toast{position:absolute;left:12px;right:12px;bottom:12px;padding:8px 12px;border-radius:4px;border:2px solid #0b0b1c;background:rgba(20,20,43,.9);font-size:16px;pointer-events:none}
/* 字母盒 */
.tray{border-top:3px solid #0b0b1c;padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.key{height:46px;border-radius:4px;border:2px solid #0b0b1c;box-shadow:0 3px 0 #0b0b1c;background:var(--con);color:#fff;font-size:24px;line-height:1;display:grid;place-items:center;position:relative}
.key.v{background:var(--vow)}
.key small{position:absolute;right:4px;bottom:2px;font-size:12px;opacity:.85}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 #0b0b1c}
.key.tool{background:#3b4a86;font-size:16px}
.key.tool:disabled{opacity:.35}
/* 過關卡 */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:5;background:var(--paper);color:#14142b;border-top:4px solid #0b0b1c;box-shadow:0 -4px 0 #5b6ea8;padding:16px 18px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;animation:up .3s ease-out}
@keyframes up{from{transform:translateY(100%)}}
.sheet .tag{font-family:var(--px);font-size:10px;color:#5b6ea8;letter-spacing:.1em}
.sheet h2{margin:0;font-size:32px;display:flex;align-items:center;gap:12px}
.sheet h2 i{font-style:normal;font-size:44px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.sheet p{margin:0;font-size:16px}
.sheet .row{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:4px}
.sheet .row button{min-height:50px;border-radius:4px;border:2px solid #0b0b1c;box-shadow:0 3px 0 #0b0b1c;font-size:16px}
.sheet .next{background:#14142b;color:var(--paper)}
/* 全螢幕頁：關卡表、開始畫面 */
.overlay{position:absolute;inset:0;z-index:7;background:var(--ink);overflow-y:auto;padding:calc(14px + var(--top)) 16px 28px}
.overlay .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.overlay h2{margin:0;font-size:32px}
.lead{margin:6px 0 4px;font-size:16px;color:var(--mute);line-height:1.6}
.prog{margin:10px 0 2px;font-size:16px}.prog b{color:var(--mark);font-size:24px}
.sec{margin:18px 0 8px;display:flex;justify-content:space-between;font-size:16px;color:var(--mute)}
.sec b{color:var(--mark)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.lv{min-height:78px;border-radius:4px;border:2px solid #0b0b1c;box-shadow:0 3px 0 #0b0b1c;background:var(--ink-2);padding:6px 8px;text-align:left;display:grid;gap:2px;align-content:start}
.lv .e{font-size:24px;line-height:1.1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.lv .w{font-size:16px}
.lv .z{font-size:12px;color:var(--mute)}
.lv.done{background:var(--mat)}.lv.done .w{color:var(--mark)}
.lv.cur{box-shadow:0 0 0 2px var(--mark)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:22px}
.opts .btn{min-height:44px}
.title{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;justify-content:flex-end;padding:calc(22px + var(--top)) 18px calc(14px + env(safe-area-inset-bottom,0px));background:#14142b}
#tcv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.title>div{position:relative;z-index:1}
.pxbox{background:var(--paper);color:#14142b;border:3px solid #14142b;border-radius:6px;box-shadow:inset 0 0 0 2px var(--paper),inset 0 0 0 5px #5b6ea8,0 5px 0 rgba(8,8,24,.55)}
.menu{display:grid;padding:10px 12px}
.item{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 8px;font-size:32px;letter-spacing:.12em;text-align:left}
.item i{font-style:normal;font-size:16px;width:16px;visibility:hidden}
.item.sel i{visibility:visible;animation:blink 1s steps(1) infinite}
.item:active{background:#14142b;color:var(--paper)}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
.t-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:16px;color:var(--mute)}
.au-pill{min-height:34px;padding:0 12px;border-radius:4px;border:2px solid #0b0b1c;background:var(--paper);color:#14142b;box-shadow:0 3px 0 #0b0b1c}
.au-pill[aria-pressed="false"]{background:#3b4a86;color:var(--mute)}
.sig{text-align:center;font-size:12px;opacity:.6;margin-top:8px;letter-spacing:.08em}
@media (max-height:640px){.item{min-height:44px;font-size:24px}.emo{width:48px;height:48px;font-size:36px}.word span{height:34px;font-size:24px;min-width:24px}.key{height:40px}}
@media (prefers-reduced-motion:reduce){.sheet,.item.sel i{animation:none}}
</style>
</head>
<body>
<div class="app">
  <div class="topdeco" aria-hidden="true"><canvas id="decoCv"></canvas></div>
  <header>
    <div class="q">
      <div class="emo" id="emo" aria-hidden="true"></div>
      <div><div class="word" id="word" aria-label="要拼的單字"></div><div class="zh" id="zh"></div></div>
      <button class="btn say" id="btnSay" type="button" aria-label="再聽一次">🔊</button>
    </div>
    <p class="status" id="status" aria-live="polite"></p>
    <div class="bar">
      <button class="btn" id="btnLevels" type="button">關卡</button>
      <span class="crumb" id="crumb"></span>
      <button class="btn" id="btnCase" type="button" aria-pressed="false">大寫</button>
      <button class="btn" id="btnHint" type="button">提示</button>
    </div>
  </header>
  <main class="stage" id="stage">
    <canvas id="cv" aria-label="拼字組裝桌"></canvas>
    <p class="toast" id="toast" hidden></p>
  </main>
  <footer class="tray" id="tray"></footer>

  <section class="sheet" id="win" hidden>
    <span class="tag">GREAT!</span>
    <h2><i id="winEmo"></i><span id="winWord"></span></h2>
    <p id="winZh"></p>
    <div class="row"><button id="btnAgain" type="button">再拼一次</button><button class="next" id="btnNext" type="button">下一個</button></div>
  </section>

  <section class="overlay" id="levels" hidden>
    <div class="top"><h2>關卡</h2><span style="display:flex;gap:6px"><button class="btn" id="btnTitle" type="button">開始畫面</button><button class="btn" id="btnClose" type="button">回到桌上</button></span></div>
    <p class="prog" id="prog"></p>
    <div id="lvList"></div>
    <div class="opts">
      <button class="btn" type="button" data-au="m">音樂：開</button>
      <button class="btn" type="button" data-au="s">音效：開</button>
      <button class="btn" type="button" id="btnVoice">語音：開</button>
      <button class="btn" type="button" id="btnReset">清除紀錄</button>
    </div>
  </section>

  <section class="title" id="title">
    <canvas id="tcv" aria-hidden="true"></canvas>
    <div>
      <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">ABC 拼字組裝</h1>
      <div class="pxbox menu">
        <button class="item sel" id="tStart" type="button"><i>▶</i><span>開始遊戲</span></button>
        <button class="item" id="tLevels" type="button"><i>▶</i><span>選擇關卡</span></button>
      </div>
      <div class="t-foot"><span id="tProg"></span><button class="au-pill" type="button" data-au="c">♪ 全開</button></div>
      <div class="sig">Made by <b>Jim Lu</b></div>
    </div>
  </section>
</div>

<script>
/* ---------- 單字：先短後長，每個都配一張圖和中文 ---------- */
const SECTIONS=[
 {t:'三個字母・動物',w:'cat 🐱 貓|dog 🐶 狗|pig 🐷 豬|cow 🐮 牛|hen 🐔 母雞|fox 🦊 狐狸|bee 🐝 蜜蜂|ant 🐜 螞蟻|owl 🦉 貓頭鷹|bat 🦇 蝙蝠'},
 {t:'三個字母・生活',w:'sun ☀️ 太陽|cup ☕ 杯子|hat 🎩 帽子|bed 🛏️ 床|bus 🚌 公車|car 🚗 汽車|egg 🥚 蛋|pen 🖊️ 筆|box 📦 箱子|map 🗺️ 地圖'},
 {t:'四個字母',w:'fish 🐟 魚|frog 🐸 青蛙|duck 🦆 鴨子|bear 🐻 熊|lion 🦁 獅子|milk 🥛 牛奶|cake 🍰 蛋糕|ball ⚽ 球|book 📖 書|star ⭐ 星星|tree 🌳 樹|moon 🌙 月亮'},
 {t:'顏色與數字',w:'red 🔴 紅色|blue 🔵 藍色|pink 🌸 粉紅色|green 🟢 綠色|one 1️⃣ 一|two 2️⃣ 二|three 3️⃣ 三|four 4️⃣ 四|five 5️⃣ 五|ten 🔟 十'},
 {t:'五個字母',w:'apple 🍎 蘋果|horse 🐴 馬|mouse 🐭 老鼠|train 🚆 火車|water 💧 水|bread 🍞 麵包|chair 🪑 椅子|snake 🐍 蛇|zebra 🦓 斑馬|tiger 🐯 老虎'},
 {t:'長單字挑戰',w:'banana 🍌 香蕉|orange 🍊 柳橙|rabbit 🐰 兔子|monkey 🐵 猴子|flower 🌻 花|turtle 🐢 烏龜|pencil ✏️ 鉛筆|coffee ☕ 咖啡|penguin 🐧 企鵝|elephant 🐘 大象'}
];
const WORDS=[];
SECTIONS.forEach((s,si)=>s.w.split('|').forEach((x,i)=>{const [w,e,z]=x.split(' ');WORDS.push({w,e,z,si,i});}));
const VOW=new Set(['a','e','i','o','u']);
const $=id=>document.getElementById(id);
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let titleOn=true;
/* ---------- 音樂與音效：全部用 Web Audio 即時合成的 8-bit 晶片音樂，不需要載入音檔 ---------- */
const AU=(()=>{
  const MODES={maj:[0,2,4,5,7,9,11],min:[0,2,3,5,7,8,10],dor:[0,2,3,5,7,9,10]};
  const DG={};'1234567'.split('').forEach((c,i)=>DG[c]=[i,0]);'qwertyu'.split('').forEach((c,i)=>DG[c]=[i,1]);'zxcvbnm'.split('').forEach((c,i)=>DG[c]=[i,-1]);
  /* 每一首：調、調式、速度、主旋律音色、八小節和弦、八小節旋律（每格一個八分音符；1–7 中音，qwertyu 高八度，zxcvbnm 低八度，- 延長，. 休止） */
  const SONGS={
    title:{key:60,mode:'maj',bpm:116,lead:'p25',bass:'drive',arp:1,dr:'rock',ch:'1 5 6 4 1 5 4 5',
      mel:'1 - 3 5 q - 5 3  2 - 5 7 w - 7 5  3 - 6 q e - q 6  4 - 6 q r - e w  q - 5 q e - w q  7 - 5 7 w - - .  6 q 6 4 5 6 5 4  2 - 5 - 7 - - .'},
    tale:{key:60,mode:'maj',bpm:84,lead:'tri',bass:'calm',arp:0,dr:'none',ch:'1 5 6 4 1 5 4 5',
      mel:'1 - 3 5 q - 5 3  2 - 5 7 w - 7 5  3 - 6 q e - q 6  4 - 6 q r - e w  q - 5 q e - w q  7 - 5 7 w - - .  6 q 6 4 5 6 5 4  2 - 5 - 7 - - .'},
    st0:{key:65,mode:'maj',bpm:100,lead:'p25',bass:'calm',arp:1,dr:'soft',ch:'1 6 4 5 1 3 4 1',
      mel:'5 - - 6 5 - 3 -  6 - 5 - 3 - 2 -  4 - 5 - 6 - q -  5 - - - . . . .  5 - - 6 5 - q -  e - q - 7 - 3 -  6 - q - 4 - 5 -  1 - - - . . . .'},
    st1:{key:62,mode:'min',bpm:138,lead:'sq',bass:'drive',arp:0,dr:'rock',ch:'1 7 6 7 1 7 6 5M',
      mel:'1 . 1 5 . 5 4 3  2 . 2 7 . 7 6 5  6 . 6 3 . 3 4 5  7 - 5 - 2 - 7 -  q - 5 - 1 q w e  w - 7 - 5 7 w q  6 - 3 - 6 q w e  5 - 2 - 5 - - .'},
    st2:{key:67,mode:'maj',bpm:96,lead:'tri',bass:'walk',arp:1,dr:'soft',ch:'1 4 1 5 1 4 5 1',
      mel:'3 - 2 1 2 - 5 -  3 - - 2 1 - . .  5 - 6 5 3 - 1 -  2 - - - . . . .  3 - 2 1 2 - 5 -  6 - 5 3 q - - .  w - q 6 5 - 3 -  1 - - - . . . .'},
    st3:{key:62,mode:'maj',bpm:126,lead:'p25',bass:'walk',arp:1,dr:'rock',ch:'1 6 2 5 1 6 4 5',
      mel:'1 . 3 . 5 3 1 .  n . 1 . 3 1 n .  2 . 4 . 6 4 2 .  5 . 7 . w - - .  q 7 6 5 6 5 3 1  3 . 1 . n - 3 .  4 . 6 . q 6 4 6  5 - 7 - 5 - . .'},
    st4:{key:69,mode:'maj',bpm:108,lead:'p25',bass:'calm',arp:1,dr:'soft',ch:'1 4 6 5 1 4 5 1',
      mel:'5 - 1 - 3 - 5 -  6 - 4 - 6 - q -  3 - 6 - 5 - 3 -  2 - 5 - 7 - 5 -  5 - q - w - e -  r - q - 6 - 4 -  5 - 7 - w - 7 -  q - - - . . . .'},
    st5:{key:64,mode:'min',bpm:132,lead:'sq',bass:'drive',arp:0,dr:'rock',ch:'1 6 4 5M 1 6 4 5M',
      mel:'1 2 3 5 3 2 1 m  6 - 3 - 1 - 3 -  4 5 6 q 6 5 4 3  5 - - - 2 - 5 -  q - 5 - 3 5 q w  e - q - 6 - 3 -  4 - 6 - q - w -  5 - - - . . . .'},
    st6:{key:69,mode:'min',bpm:88,lead:'tri',bass:'calm',arp:1,dr:'none',ch:'1 6 3 7 1 6 7 5M',
      mel:'5 - - - 3 - 1 -  6 - - - 3 - 1 -  5 - 3 - 7 - 5 -  4 - - - 2 - - -  q - - - 5 - 3 -  6 - q - 3 - 6 -  7 - w - r - w -  5 - - - - - . .'},
    st7:{key:62,mode:'dor',bpm:104,lead:'p25',bass:'walk',arp:1,dr:'soft',ch:'1 4 1 7 1 4 3 5',
      mel:'1 - 3 - 5 - 6 -  6 - 4 - 1 - 4 -  5 - 3 - 1 - 3 -  2 - 4 - 7 - - -  q - 6 - 5 - 3 -  4 - 6 - q - 6 -  3 - 5 - 7 - q -  5 - - - - - . .'}
  };
  const semi=(mode,d)=>MODES[mode][((d%7)+7)%7]+12*Math.floor(d/7);
  function compile(s){
    const tok=s.mel.trim().split(/\s+/),lead=[];let last=null;
    tok.forEach((t,i)=>{
      if(t==='-'){if(last)last.len+=2;return;}
      if(t==='.'){last=null;return;}
      const [d,o]=DG[t];last={m:s.key+semi(s.mode,d)+12*o,len:2};lead[i*2]=last;
    });
    const chords=s.ch.split(' ').map(c=>{
      const r=parseInt(c)-1,M=c.endsWith('M'),root=semi(s.mode,r);
      return M?[root,root+4,root+7]:[root,semi(s.mode,r+2),semi(s.mode,r+4)];
    });
    return Object.assign({},s,{leadEv:lead,chords,len:tok.length*2});
  }
  for(const k in SONGS)SONGS[k]=compile(SONGS[k]);

  let ctx=null,master,mBus,sBus,waves={},noiseBuf=null,cur=null,curName='',step=0,nextT=0,duckUntil=0;
  const set={m:1,s:1};
  try{const v=localStorage.getItem('abc-au');if(v){set.m=v[0]==='1'?1:0;set.s=v[1]==='1'?1:0;}}catch(e){}
  const saveSet=()=>{try{localStorage.setItem('abc-au',''+set.m+set.s);}catch(e){}};
  function pulse(d){
    const n=32,re=new Float32Array(n),im=new Float32Array(n);
    for(let k=1;k<n;k++){re[k]=Math.sin(2*Math.PI*k*d)/(k*Math.PI);im[k]=(1-Math.cos(2*Math.PI*k*d))/(k*Math.PI);}
    return ctx.createPeriodicWave(re,im);
  }
  function init(){
    if(ctx)return true;
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
    try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}   /* iPhone 靜音鍵開著也照樣出聲 */
    try{ctx=new AC();}catch(e){return false;}
    const comp=ctx.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;
    master=ctx.createGain();master.gain.value=.8;master.connect(comp);comp.connect(ctx.destination);
    mBus=ctx.createGain();mBus.gain.value=set.m?.5:0;mBus.connect(master);
    sBus=ctx.createGain();sBus.gain.value=set.s?.9:0;sBus.connect(master);
    waves={p25:pulse(.25),p12:pulse(.125)};
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    return true;
  }
  function tone(t,f,dur,wave,vol,bus,f2){
    const o=ctx.createOscillator(),g=ctx.createGain();
    if(wave==='tri')o.type='triangle';else if(wave==='sq')o.type='square';else o.setPeriodicWave(waves[wave]||waves.p25);
    o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.004);
    g.gain.setTargetAtTime(vol*.6,t+.01,.09);g.gain.setTargetAtTime(0,t+dur,.025);
    o.connect(g);g.connect(bus||sBus);o.start(t);o.stop(t+dur+.2);
  }
  function noise(t,dur,vol,ftype,freq,bus){
    const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();
    s.buffer=noiseBuf;f.type=ftype;f.frequency.value=freq;
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    s.connect(f);f.connect(g);g.connect(bus||sBus);s.start(t,Math.random()*.5);s.stop(t+dur+.02);
  }
  const hz=m=>440*Math.pow(2,(m-69)/12);
  const LV={sq:.085,p25:.1,p12:.1,tri:.24};
  function playStep(S,s,t,spb){
    const pos=s%16,bar=Math.floor(s/16)%S.chords.length,ch=S.chords[bar],root=S.key-24+ch[0];
    const ev=S.leadEv[s];if(ev)tone(t,hz(ev.m),ev.len*spb*.92,S.lead,LV[S.lead],mBus);
    if(S.bass==='drive'){if(pos%2===0)tone(t,hz(root+(pos%4===2?12:0)),spb*1.7,'tri',.26,mBus);}
    else if(S.bass==='walk'){if(pos%4===0)tone(t,hz(root+[0,7,12,7][pos/4]),spb*3.4,'tri',.26,mBus);}
    else if(pos===0||pos===8)tone(t,hz(root+(pos?7:0)),spb*7,'tri',.24,mBus);
    if(S.arp)tone(t,hz(S.key+ch[s%3]+(pos>=8?12:0)),spb*.8,'p12',.025,mBus);
    if(S.dr==='rock'){
      if(pos===0||pos===8||pos===10)kick(t,.5);
      if(pos===4||pos===12)noise(t,.12,.16,'bandpass',1800,mBus);
      if(pos%2===0)noise(t,.03,.06,'highpass',7000,mBus);
    }else if(S.dr==='soft'){
      if(pos===0||pos===8)kick(t,.32);
      if(pos===4||pos===12)noise(t,.03,.05,'highpass',8000,mBus);
    }
  }
  function kick(t,v){
    const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';
    o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.11);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);
    o.connect(g);g.connect(mBus);o.start(t);o.stop(t+.2);
  }
  /* 依目前畫面決定要放哪一首：開始畫面、序章與結局、或這一站的曲子 */
  function want(){try{return titleOn?'title':['st0','st2','st3','st4','st7','st1'][W().si];}catch(e){return '';}}
  function tick(){
    if(!ctx||ctx.state!=='running')return;
    const now=ctx.currentTime;
    if(duckUntil&&now>duckUntil){duckUntil=0;if(set.m)mBus.gain.setTargetAtTime(.5,now,.25);}
    if(!set.m){cur=null;curName='';return;}
    const w=want();
    if(w!==curName){curName=w;cur=SONGS[w]||null;step=0;nextT=now+.06;}
    if(!cur)return;
    const spb=60/cur.bpm/4;
    if(nextT<now-.2)nextT=now+.02;
    while(nextT<now+.14){playStep(cur,step,nextT,spb);step=(step+1)%cur.len;nextT+=spb;}
  }
  setInterval(tick,30);
  function duck(sec){if(!set.m)return;const t=ctx.currentTime;mBus.gain.cancelScheduledValues(t);mBus.gain.setTargetAtTime(.1,t,.03);duckUntil=t+sec;}
  const PE={H:1046,C:523,N:659,O:784,S:440,Cl:392};
  const FX={
    place:(t,e)=>{const f=PE[e]||600;tone(t,f,.05,'p25',.16);tone(t+.045,f*1.5,.06,'p25',.13);},
    bond:t=>{tone(t,880,.04,'tri',.3);tone(t+.035,1318,.07,'sq',.07);},
    up2:t=>{[659,880,1046].forEach((f,i)=>tone(t+i*.045,f,.05,'p25',.13));},
    up3:t=>{[659,880,1046,1318].forEach((f,i)=>tone(t+i*.04,f,.05,'p25',.13));},
    unbond:t=>tone(t,880,.12,'sq',.11,null,330),
    remove:t=>{noise(t,.12,.22,'bandpass',1200);tone(t,420,.1,'p25',.14,null,140);},
    clear:t=>{noise(t,.28,.16,'lowpass',2600);tone(t,700,.25,'p25',.07,null,90);},
    error:t=>{tone(t,196,.08,'sq',.12);tone(t+.1,147,.15,'sq',.12);},
    select:t=>tone(t,1568,.035,'tri',.28),
    deselect:t=>tone(t,1175,.035,'tri',.24),
    fill:(t,n)=>{for(let i=0;i<Math.min(10,n||4);i++)tone(t+i*.035,1046+i*110,.03,'p25',.09);},
    tap:t=>tone(t,1318,.025,'p12',.1),
    page:t=>{tone(t,988,.03,'p25',.1);tone(t+.04,1318,.04,'p25',.1);},
    start:t=>{[523,659,784,1046].forEach((f,i)=>tone(t+i*.05,f,.05,'sq',.08));},
    hint:t=>{[1568,2093,2637].forEach((f,i)=>tone(t+i*.06,f,.07,'tri',.22));},
    blip:(t,f)=>tone(t,f||1046,.022,'sq',.024),
    win:t=>{duck(1.3);[523,659,784].forEach((f,i)=>tone(t+i*.09,f,.08,'sq',.1));
      tone(t+.27,1046,.42,'sq',.1);tone(t+.27,784,.42,'p25',.07);tone(t+.27,262,.45,'tri',.3);},
    fanfare:t=>{duck(2.4);[392,523,659,784].forEach((f,i)=>tone(t+i*.11,f,.1,'sq',.1));
      [[1046,659,523],[1175,784,392],[1318,784,523]].forEach((c,j)=>{const tt=t+.48+j*.32;tone(tt,c[0],j===2?.75:.26,'sq',.1);tone(tt,c[1],j===2?.75:.26,'p25',.07);tone(tt,c[2]/2,j===2?.8:.28,'tri',.3);});}
  };
  function sfx(n,a){
    if(!set.s||!ctx||ctx.state!=='running')return;
    const f=FX[n];if(f)try{f(ctx.currentTime+.01,a);}catch(e){}
  }
  function apply(){
    if(ctx){const t=ctx.currentTime;mBus.gain.cancelScheduledValues(t);mBus.gain.setTargetAtTime(set.m?.5:0,t,.05);sBus.gain.setTargetAtTime(set.s?.9:0,t,.02);}
    const lab=set.m&&set.s?'♪ 全開':set.s?'♪ 只有音效':'♪ 靜音';
    document.querySelectorAll('[data-au]').forEach(b=>{
      const k=b.dataset.au;b.textContent=k==='m'?'音樂：'+(set.m?'開':'關'):k==='s'?'音效：'+(set.s?'開':'關'):lab;
      b.setAttribute('aria-pressed',k==='m'?!!set.m:k==='s'?!!set.s:!!(set.m||set.s));
    });
  }
  function unlock(){
    if(!init())return;
    if(ctx.state!=='running')ctx.resume().catch(()=>{});
  }
  for(const ev of ['touchend','click','keydown'])document.addEventListener(ev,unlock,{capture:true,passive:true});
  document.addEventListener('visibilitychange',()=>{if(!ctx)return;if(document.hidden)ctx.suspend().catch(()=>{});else ctx.resume().catch(()=>{});});
  return{
    sfx,apply,songs:SONGS,
    toggle(k){set[k]=set[k]?0:1;saveSet();apply();if(k==='s'&&set.s){unlock();setTimeout(()=>sfx('start'),30);}},
    cycle(){if(set.m&&set.s){set.m=0;}else if(set.s){set.s=0;}else{set.m=1;set.s=1;}saveSet();apply();if(set.s)setTimeout(()=>sfx('start'),30);},

/* 觸控：點球選取、點兩顆球接棍子、點棍子拆開、拖曳移動 */
const pos=ev=>{const r=cv.getBoundingClientRect();return{x:ev.clientX-r.left,y:ev.clientY-r.top};};
function hitBall(p){for(let i=st.balls.length-1;i>=0;i--){const b=st.balls[i];if(Math.hypot(b.x-p.x,b.y-p.y)<R+8)return b;}return null;}
function hitBond(p){for(const k of st.bonds){const a=ball(k.a),b=ball(k.b),dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy||1,t=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/l));if(Math.hypot(a.x+dx*t-p.x,a.y+dy*t-p.y)<14)return k;}return null;}
cv.addEventListener('pointerdown',ev=>{const p=pos(ev),b=hitBall(p);try{cv.setPointerCapture(ev.pointerId);}catch(e){}
  drag=b?{id:b.id,sx:p.x,sy:p.y,ox:b.x-p.x,oy:b.y-p.y,moved:false}:{id:null,bond:hitBond(p),sx:p.x,sy:p.y,moved:false};kick();});
cv.addEventListener('pointermove',ev=>{if(!drag)return;const p=pos(ev);if(!drag.moved&&Math.hypot(p.x-drag.sx,p.y-drag.sy)>8)drag.moved=true;
  if(drag.moved&&drag.id!=null&&!st.won){const b=ball(drag.id);if(b){b.x=p.x+drag.ox;b.y=p.y+drag.oy;clampB(b);kick();}}});
function endDrag(cancel){if(!drag)return;const d=drag;drag=null;
  if(!cancel&&!d.moved){if(d.id!=null)tapBall(d.id);else if(d.bond&&st.bonds.includes(d.bond)&&!st.won){st.bonds.splice(st.bonds.indexOf(d.bond),1);SFX('unbond');changed();}
    else if(st.sel!=null){st.sel=null;render();}}
  kick();}
cv.addEventListener('pointerup',()=>endDrag(false));cv.addEventListener('pointercancel',()=>endDrag(true));

/* ---------- 字母盒 ---------- */
function buildTray(){
  $('tray').innerHTML='abcdefghijklmnopqrstuvwxyz'.split('').map(c=>`<button class="key ${VOW.has(c)?'v':''}" type="button" data-c="${c}" aria-label="${c.toUpperCase()}">${show(c)}<small>${upper?c:c.toUpperCase()}</small></button>`).join('')+
    '<button class="key tool" id="kDel" type="button">拿走</button><button class="key tool" id="kClr" type="button">清空</button>';
  $('kDel').addEventListener('click',removeSel);$('kClr').addEventListener('click',clearAll);
  render();
}
$('tray').addEventListener('click',ev=>{const k=ev.target.closest('[data-c]');if(k)addLetter(k.dataset.c);});

/* ---------- 按鈕 ---------- */
$('btnSay').addEventListener('click',()=>{const w=W().w;say(w,.75);setTimeout(()=>say(w.toUpperCase().split('').join(', '),.7),1300);});
$('btnCase').addEventListener('click',()=>{upper=!upper;save();$('btnCase').setAttribute('aria-pressed',upper);buildTray();kick();});
/* 提示：把下一個該放的字母在字母盒裡閃一下 */
$('btnHint').addEventListener('click',()=>{
  if(st.won)return;SFX('hint');
  const w=W().w,seq=readChain()||[],have=counts(st.balls.map(b=>b.ch)),need=counts([...w]);
  const extra=Object.keys(have).filter(ch=>(have[ch]||0)>(need[ch]||0));
  if(extra.length){toast('先把多的 '+extra.map(show).join('、')+' 拿走：點它，再按「拿走」');return;}
  let c=[...w].find(ch=>(have[ch]||0)<need[ch]);
  if(!c){toast('字母都在桌上了，把它們按順序接起來：'+[...w].map(show).join(' – '));return;}
  const k=document.querySelector(`.key[data-c="${c}"]`);if(k){k.animate([{transform:'scale(1)'},{transform:'scale(1.25)'},{transform:'scale(1)'}],{duration:350,iterations:3});}
  say(c.toUpperCase());toast('找找看 '+show(c));
});
$('btnNext').addEventListener('click',()=>{if(lvl+1<WORDS.length)goLevel(lvl+1);else openLevels();});
$('btnAgain').addEventListener('click',clearAll);
function openLevels(){
  const n=Object.keys(done).filter(w=>WORDS.some(x=>x.w===w)).length;
  $('prog').innerHTML=`已經拼好 <b>${n}</b> / ${WORDS.length} 個字`;
  $('lvList').innerHTML=SECTIONS.map((s,si)=>{
    const ws=WORDS.filter(x=>x.si===si),got=ws.filter(x=>done[x.w]).length;
    return `<div class="sec"><span>${s.t}</span><b>${got} / ${ws.length}</b></div><div class="grid">`+
      ws.map(x=>{const i=WORDS.indexOf(x);return `<button class="lv ${done[x.w]?'done':''} ${i===lvl?'cur':''}" type="button" data-i="${i}"><span class="e">${x.e}</span><span class="w">${done[x.w]?'✓ ':''}${upper?x.w.toUpperCase():x.w}</span><span class="z">${x.z}</span></button>`;}).join('')+'</div>';
  }).join('');
  $('btnVoice').textContent='語音：'+(voice?'開':'關');AU.apply();
  $('levels').hidden=false;
}
$('lvList').addEventListener('click',ev=>{const b=ev.target.closest('.lv');if(b){hideTitle();goLevel(+b.dataset.i);}});
$('btnLevels').addEventListener('click',openLevels);
$('btnClose').addEventListener('click',()=>{$('levels').hidden=true;});
$('btnTitle').addEventListener('click',()=>{$('levels').hidden=true;showTitle();});
$('btnVoice').addEventListener('click',()=>{voice=!voice;save();$('btnVoice').textContent='語音：'+(voice?'開':'關');if(voice)say('Hello!');});
let resetArm=0;
$('btnReset').addEventListener('click',()=>{
  if(Date.now()-resetArm>3000){resetArm=Date.now();$('btnReset').textContent='再按一次確認';return;}
  done={};save();$('btnReset').textContent='清除紀錄';openLevels();
});
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-au]');if(!b)return;const k=b.dataset.au;if(k==='c')AU.cycle();else AU.toggle(k);});
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b||b.matches('.key,[data-au],#tStart,#tLevels,#btnHint'))return;SFX('tap');});
/* 不要點兩下放大 */
document.addEventListener('dblclick',ev=>ev.preventDefault());
for(const t of ['gesturestart','gesturechange','gestureend'])document.addEventListener(t,ev=>ev.preventDefault());
document.addEventListener('touchmove',ev=>{if(ev.touches.length>1)ev.preventDefault();},{passive:false});

/* ---------- 開始畫面：像素風，標題是點陣字，月亮前面晃著一串 c-a-t ---------- */
const PW=208,G16={"拼": "1104108410881000fdfe108810881488188833fed08810881108110852082408", "字": "020001007ffe400280041fe0004000800100fffe010001000100010005000200", "組": "100011f8210825084508f9f8110821084908fdf805080108a908a90887fe0000", "裝": "242024203c2005fcfc20242024f846000100fffe05000c883450c530060e0400", "母": "00001ff01010121011101110fffe20102210211021103ffc0010001000a00040", "球": "00280024fc24102013fe102011207cb210b4106810a811241e22e02040a00040", "棍": "100011fc11041104fdfc1104310439fc5400551291d41118111011521192110e", "遊": "042042202fbe2440043c0784e488248824fe24882488288829a850108ffe0000", "戲": "08280f2408247f20492e4cf07920472440245f2840285f1051125f2a8a463f82"};
const g16=ch=>{const h=G16[ch],o=[];for(let y=0;y<16;y++)o.push(parseInt(h.slice(y*4,y*4+4),16));return o;};
let logoCv=null,tagCv=null,tRaf=0,tT0=0;
function buildLogo(){
  /* 第一行 ABC：8×16 字母放大三倍；第二行「拼字組裝」：16×16 放大兩倍 */
  const cells=[],sc1=3,sc2=2,w=Math.max(3*8*sc1+3*4,4*16*sc2)+10,hh=16*sc1+16*sc2+18;
  logoCv=document.createElement('canvas');logoCv.width=w;logoCv.height=hh;const g=logoCv.getContext('2d');
  const x1=Math.round((w-(3*8*sc1+2*4))/2);
  ['A','B','C'].forEach((ch,i)=>{const h=LG[ch];for(let y=0;y<16;y++){const row=parseInt(h.slice(y*2,y*2+2),16);for(let x=0;x<8;x++)if(row>>(7-x)&1)cells.push([x1+i*(8*sc1+4)+x*sc1,4+y*sc1,sc1,y,i]);}});
  const x2=Math.round((w-4*16*sc2)/2),y2=4+16*sc1+8;
  [...'拼字組裝'].forEach((ch,i)=>{const b=g16(ch);for(let y=0;y<16;y++)for(let x=0;x<16;x++)if(b[y]>>(15-x)&1)cells.push([x2+i*16*sc2+x*sc2,y2+y*sc2,sc2,y,9]);});
  g.fillStyle='rgba(8,8,24,.6)';for(const c of cells)g.fillRect(c[0]+1,c[1]+5,c[2]+2,c[2]);
  g.fillStyle=INK;for(const c of cells)g.fillRect(c[0]-2,c[1]-2,c[2]+4,c[2]+4);
  const ABC=[['#ffd0c4','#e86a5c','#b8404a'],['#d6e3ff','#5b8def','#3a5fb8'],['#fff3a8','#f2c14e','#d9952b']];
  for(const c of cells){
    const p=c[4]<3?ABC[c[4]]:['#ffffff','#f6ecc9','#c9b98f'];
    g.fillStyle=c[3]<5?p[0]:c[3]<11?p[1]:p[2];g.fillRect(c[0],c[1],c[2],c[2]);
  }
  const t2='字母球棍拼字遊戲',sp=17;tagCv=document.createElement('canvas');tagCv.width=t2.length*sp;tagCv.height=18;const g2=tagCv.getContext('2d');
  [...t2].forEach((ch,i)=>{const b=g16(ch);for(let y=0;y<16;y++)for(let x=0;x<16;x++)if(b[y]>>(15-x)&1){g2.fillStyle=INK;g2.fillRect(i*sp+x+1,y+2,1,1);g2.fillStyle='#f6ecc9';g2.fillRect(i*sp+x,y+1,1,1);}});
}
function titleFrame(now){
  tRaf=0;if(!titleOn)return;
  const c=$('tcv'),cw=c.clientWidth,chh=c.clientHeight;if(cw<10||chh<10){tRaf=requestAnimationFrame(titleFrame);return;}
  const PH=Math.round(PW*chh/cw),u=PW/cw;if(c.width!==PW||c.height!==PH){c.width=PW;c.height=PH;}
  if(!logoCv)buildLogo();
  const g=c.getContext('2d');g.imageSmoothingEnabled=false;const tt=reduced?0:now/1000;
  const bx=c.getBoundingClientRect(),menu=$('title').children[1].getBoundingClientRect(),dec=$('decoCv').getBoundingClientRect();
  const hz=Math.round(Math.min(PH-20,(menu.top-bx.top)*u+4)),band=hz/SKY.length;
  for(let i=0;i<SKY.length;i++){const y0=Math.round(i*band),y1=Math.round((i+1)*band);g.fillStyle=SKY[i];g.fillRect(0,y0,PW,y1-y0);
    if(i+1<SKY.length){g.fillStyle=SKY[i+1];for(let y=y1-3;y<y1;y++)for(let x=(y&1);x<PW;x+=(y===y1-3?4:2))g.fillRect(x,y,1,1);}}
  for(const s of STARS){const y=Math.round(s[1]*hz*.5),x=Math.round(s[0]*PW);if(Math.sin(tt*1.6+s[3])<-.55)continue;g.fillStyle=s[2]===2?'#fffbe6':'#c9cbe6';g.fillRect(x,y,1,1);}
  const ly0=Math.round((dec.bottom-bx.top)*u+10),drop=reduced?0:Math.max(0,1-(now-tT0)/450),ly=ly0-Math.round(drop*drop*70);
  g.drawImage(logoCv,Math.round((PW-logoCv.width)/2),ly);
  const ty=ly0+logoCv.height+4;g.drawImage(tagCv,Math.round((PW-tagCv.width)/2),ty);
  const top=ty+24,cyM=Math.round((top+hz-10)/2),cxM=Math.round(PW/2),mr=Math.round(Math.min(PW*.3,(hz-top)*.42));
  for(let dy=-mr;dy<=mr;dy++){const hw=Math.round(Math.sqrt(mr*mr-dy*dy));g.fillStyle='#f6ecc9';g.fillRect(cxM-hw,cyM+dy,hw*2,1);g.fillStyle='#e2d3a4';for(let x=cxM+Math.round(hw*.45)+((dy&1)?1:0);x<cxM+hw;x+=2)g.fillRect(x,cyM+dy,1,1);}
  for(let x=0;x<PW;x++){const y1=Math.round(hz-22-hill(x+tt*1.5,.045,7,.5)),y2=Math.round(hz-9-hill(x+60+tt*5,.07,5,2.1));
    g.fillStyle='#3b3f7a';g.fillRect(x,y1,1,PH-y1);g.fillStyle='#5b6ea8';g.fillRect(x,y1,1,1);g.fillStyle='#1d2148';g.fillRect(x,y2,1,PH-y2);}
  g.fillStyle=INK;g.fillRect(0,hz+2,PW,PH-hz);
  /* c-a-t 三顆字母球，一顆一顆掉進來再接上棍子，然後輕輕晃 */
  const r=Math.max(9,Math.round(mr*.3)),gap=Math.round(r*2.6),el=now-tT0;
  const P=['c','a','t'].map((ch,i)=>{const t=reduced?1:Math.max(0,Math.min(1,(el-300-i*220)/500)),q=1-Math.pow(1-t,3);
    return{ch,x:cxM+(i-1)*gap,y:cyM+Math.round(Math.sin(tt*2+i*1.3)*3)-Math.round((1-q)*(cyM+40)),t};});
  if(reduced||el>1300)for(let i=1;i<3;i++){pxLine(g,P[i-1].x,P[i-1].y,P[i].x,P[i].y,5,INK);pxLine(g,P[i-1].x,P[i-1].y,P[i].x,P[i].y,3,'#f6ecc9');}
  for(const p of P){if(p.t<=0)continue;pxDisc(g,p.x,p.y,r,PAL[VOW.has(p.ch)?'v':'c']);const s=r>=14?2:1;pxGlyph(g,p.ch,p.x+1,p.y+1,INK,s);pxGlyph(g,p.ch,p.x,p.y,'#ffffff',s);}
  if(!reduced)tRaf=requestAnimationFrame(titleFrame);
}
function showTitle(){
  titleOn=true;$('title').hidden=false;
  const n=Object.keys(done).filter(w=>WORDS.some(x=>x.w===w)).length;
  $('tProg').textContent=n?`已經拼好 ${n} / ${WORDS.length} 個字`:`${WORDS.length} 個單字等你來拼`;
  $('tStart').querySelector('span').textContent=n?'繼續遊戲':'開始遊戲';
  tT0=performance.now();if(!tRaf)tRaf=requestAnimationFrame(titleFrame);
}
function hideTitle(){if(!titleOn)return;titleOn=false;$('title').hidden=true;kick(60);setTimeout(()=>say(W().w,.8),300);}
$('tStart').addEventListener('click',()=>{SFX('start');hideTitle();});
$('tLevels').addEventListener('click',()=>{SFX('start');openLevels();});

if(/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1))document.documentElement.classList.add('ios');
new ResizeObserver(drawDeco).observe($('decoCv'));
$('btnCase').setAttribute('aria-pressed',upper);
buildTray();resize();goLevel(lvl);AU.apply();showTitle();
</script>
