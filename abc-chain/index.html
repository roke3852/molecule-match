:root{--bg:#fff0f7;--plum:#4a2350;--pink:#ff6fae;--pink-d:#d63f86;--pink-l:#ffd6ea;--lav:#b79cff;--lav-d:#7b5cd6;--lav-l:#ece4ff;--mint:#7fe0c3;--mint-l:#d6f8ec;--sun:#ffd166;
  --ink:var(--bg);--ink-2:#ffffff;--mat:var(--mint-l);--paper:#ffffff;--mute:#9b6f9e;--mark:var(--pink-d);--bad:#e0457b;--line:#f5c2dc;
  --vow:#ff6fae;--con:#9b7bff;--f:"Pixel16","Noto Sans TC","PingFang TC",sans-serif;--px:"Press Start 2P",ui-monospace,monospace;
  --sat:env(safe-area-inset-top,0px);--deco:18px;--top:calc(var(--sat) + var(--deco));color-scheme:light}
:root.ios{--deco:46px}
*{box-sizing:border-box;touch-action:manipulation;font-weight:400!important}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--plum);font-family:var(--f);font-size:16px;line-height:1.5;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-synthesis:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto;position:relative}
.topdeco{position:absolute;top:var(--sat);left:0;right:0;height:var(--deco);z-index:25;pointer-events:none;background:#ffd6ea}
.topdeco canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.btn{min-height:36px;padding:0 10px;border-radius:6px;border:2px solid var(--plum);background:var(--lav-l);color:var(--plum);box-shadow:0 3px 0 var(--plum);font-size:16px;white-space:nowrap}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--plum)}
.btn.go,.btn[aria-pressed="true"]{background:var(--pink);color:#fff;text-shadow:1px 1px 0 var(--pink-d)}
.btn:disabled{opacity:.35;box-shadow:none;transform:none}
/* 題目 */
header{padding:calc(10px + var(--top)) 16px 10px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;border-bottom:3px solid var(--plum);background:linear-gradient(#ffe3f0,#ffd6ea)}
.q{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.emo{width:62px;height:62px;display:grid;place-items:center;border-radius:8px;background:#fff;border:2px solid var(--plum);box-shadow:0 3px 0 var(--plum)}
.ico{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.emo .ico{width:54px;height:54px}
.word{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.word span{min-width:30px;height:40px;padding:0 4px;display:grid;place-items:center;font-size:32px;border-bottom:3px solid #f5a3c7;color:var(--plum)}
.word span.ok{color:var(--pink-d);border-color:var(--pink-d)}
.zh{font-size:16px;color:var(--mute)}
.say{width:48px;height:48px;font-size:22px;display:grid;place-items:center}
.bar{display:flex;gap:6px;align-items:center}
.crumb{flex:1;min-width:0;font-size:16px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{margin:0;font-size:16px;color:var(--mute);min-height:1.5em}
.status.warn{color:var(--bad)}.status.good{color:#14966b}
/* 組裝桌 */
.stage{flex:1;min-height:0;position:relative;background:#cfe3ff;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
.hi{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.toast{position:absolute;left:12px;right:12px;bottom:12px;padding:8px 12px;border-radius:8px;border:2px solid var(--plum);background:rgba(255,255,255,.95);color:var(--plum);font-size:16px;pointer-events:none;box-shadow:0 3px 0 var(--plum)}
/* 字母盒 */
.tray{border-top:3px solid var(--plum);background:#ffd6ea;padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.key{height:46px;border-radius:8px;border:2px solid var(--plum);box-shadow:0 3px 0 var(--plum),inset 0 3px 0 rgba(255,255,255,.45);background:var(--con);color:#fff;font-size:24px;line-height:1;display:grid;place-items:center;position:relative;text-shadow:2px 2px 0 rgba(74,35,80,.45)}
.key.v{background:var(--vow)}
.key small{position:absolute;right:4px;bottom:2px;font-size:12px;opacity:.85}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 var(--plum)}
.key.tool{background:#fff;color:var(--plum);font-size:16px;text-shadow:none}
.key.tool:disabled{opacity:.35}
/* 過關卡 */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:5;background:#fff;color:var(--plum);border-top:4px solid var(--plum);box-shadow:0 -6px 0 var(--pink);padding:16px 18px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;animation:up .3s ease-out}
@keyframes up{from{transform:translateY(100%)}}
.sheet .tag{font-family:var(--px);font-size:10px;color:var(--pink-d);letter-spacing:.1em}
.sheet h2{margin:0;font-size:32px;display:flex;align-items:center;gap:12px}
.sheet h2 i{display:block}
.sheet h2 .ico{width:54px;height:54px}
.sheet p{margin:0;font-size:16px}
.sheet .row{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:4px}
.sheet .row button{min-height:50px;border-radius:8px;border:2px solid var(--plum);box-shadow:0 3px 0 var(--plum);font-size:16px;background:var(--lav-l)}
.sheet .row .next{background:var(--pink);color:#fff;text-shadow:1px 1px 0 var(--pink-d)}
/* 全螢幕頁：關卡表、開始畫面 */
.overlay{position:absolute;inset:0;z-index:7;background:var(--bg);overflow-y:auto;padding:calc(14px + var(--top)) 16px 28px}
.overlay .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.overlay h2{margin:0;font-size:32px}
.lead{margin:6px 0 4px;font-size:16px;color:var(--mute);line-height:1.6}
.prog{margin:10px 0 2px;font-size:16px}.prog b{color:var(--pink-d);font-size:24px}
.sec{margin:18px 0 8px;display:flex;justify-content:space-between;font-size:16px;color:var(--mute)}
.sec b{color:var(--pink-d)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.lv{min-height:78px;border-radius:8px;border:2px solid var(--plum);box-shadow:0 3px 0 var(--plum);background:#fff;padding:6px 8px;text-align:left;display:grid;gap:2px;align-content:start}
.lv .e .ico{width:36px;height:36px}
.lv .w{font-size:16px}
.lv .z{font-size:12px;color:var(--mute)}
.lv.done{background:var(--mint-l)}.lv.done .w{color:#14966b}
.lv.cur{box-shadow:0 0 0 3px var(--pink)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:22px}
.opts #btnReset{grid-column:1/-1}
.opts .btn{min-height:44px}
.title{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;justify-content:flex-end;padding:calc(22px + var(--top)) 18px calc(14px + env(safe-area-inset-bottom,0px));background:#ffd6ea}
#tcv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.title>div{position:relative;z-index:1}
.pxbox{background:#fff;color:var(--plum);border:3px solid var(--plum);border-radius:10px;box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 5px #ffb3d4,0 5px 0 rgba(74,35,80,.35)}
.menu{display:grid;padding:10px 12px}
.item{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 8px;font-size:32px;letter-spacing:.12em;text-align:left}
.item i{font-style:normal;font-size:16px;width:16px;visibility:hidden}
.item.sel i{visibility:visible;animation:blink 1s steps(1) infinite}
.item:active{background:var(--pink);color:#fff}
.item i{color:var(--pink-d)}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
.t-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:16px;color:var(--mute)}
.au-pill{min-height:34px;padding:0 12px;border-radius:8px;border:2px solid var(--plum);background:var(--pink);color:#fff;box-shadow:0 3px 0 var(--plum)}
.au-pill[aria-pressed="false"]{background:#fff;color:var(--mute)}
.sig{text-align:center;font-size:12px;opacity:.6;margin-top:8px;letter-spacing:.08em}

.kid,.st-text,.bubble span,.bubble b,.st-who b{font-family:'Kid',var(--f);font-weight:600}
.bubble{position:absolute;left:10px;right:10px;top:10px;padding:8px 12px;text-align:left;display:grid;gap:2px;font-size:16px;line-height:1.5;z-index:2}
.bubble b{color:#e07b00;font-size:12px}
.bubble span{font-size:26px;line-height:1.3;color:#5b2a6e;letter-spacing:.01em}
@media (max-height:640px){.bubble span{font-size:20px}}
.treasure{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:8px;border:2px dashed var(--pink);border-radius:8px;background:#fff0f7}
.treasure canvas{width:96px;height:72px;image-rendering:pixelated}
.treasure b{display:block;color:#be185d}
#dex{z-index:12}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tab{min-height:38px;padding:0 12px;border-radius:8px;border:2px solid var(--plum);background:#fff;color:var(--plum);box-shadow:0 3px 0 var(--plum);font:inherit;font-size:16px}
.tab small{font-size:12px;color:var(--mute)}
.tab.on{background:var(--pink);color:#fff}.tab.on small{color:#fff}
.st-tools{display:flex;justify-content:flex-end;gap:6px}
.tre-btn{padding:0 6px}
#winTre{cursor:pointer}
#doll{z-index:11}#board{z-index:12}#who{z-index:13}#pin{z-index:14}
.rows{display:grid;gap:8px;margin-top:8px}
.rowp{display:grid;grid-template-columns:auto 48px 1fr auto;gap:10px;align-items:center;padding:6px 12px;border-radius:10px;background:#fff;border:2px solid var(--plum);box-shadow:0 3px 0 var(--plum);text-align:left;width:100%;color:var(--plum);font:inherit}
#whoList .rowp{grid-template-columns:48px 1fr}
.rowp.you{background:#ffe3f0;border-color:var(--pink-d);box-shadow:0 3px 0 var(--pink-d)}
.rowp .hd{width:48px;height:41px;image-rendering:pixelated}
.rowp .rk{min-width:22px;text-align:center;font-size:22px;color:var(--pink-d)}
.rowp .rk.top0{color:#d9952b}.rowp .rk.top1{color:#8b93a7}.rowp .rk.top2{color:#b4693c}
.rowp .nm{min-width:0}.rowp .nm b{display:block;font-size:18px;font-weight:normal;overflow-wrap:anywhere}.rowp .nm small{font-size:13px;color:var(--mute)}
.rowp .sc{font-size:24px;text-align:right;line-height:1.1}.rowp .sc small{display:block;font-size:12px;color:var(--mute)}
.tagx{display:inline-block;margin-left:6px;padding:0 6px;border-radius:6px;border:1px solid var(--mute);font-size:11px;color:var(--mute);vertical-align:middle}
.whosec{margin:14px 0 0;font-size:14px;color:var(--mute)}
.newp{display:flex;gap:8px;margin-top:12px}
.newp input{flex:1;min-width:0;min-height:46px;padding:0 12px;border-radius:8px;border:2px solid var(--plum);background:#fff;color:var(--plum);font:inherit;font-size:18px}
.btn.go{background:var(--pink);color:#fff;min-height:46px;padding:0 18px}
#title .menu{grid-template-columns:1fr 1fr;column-gap:4px}
#title .menu #tStart{grid-column:1/-1}
#title .menu .item:not(#tStart){font-size:22px;letter-spacing:.06em;min-height:44px;gap:6px}
.t-who{display:block;width:100%;margin-top:10px;padding:6px 10px;border-radius:8px;border:2px solid var(--plum);background:rgba(255,255,255,.85);color:var(--plum);font:inherit;font-size:16px;text-align:left}
.t-who b{color:var(--pink-d);font-weight:normal}
.coins{margin-left:auto;font-size:20px;color:var(--plum);display:flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--plum);border-radius:8px;padding:2px 10px}
.coin{display:inline-block;width:14px;height:14px;background:#f2c14e;border:2px solid #a67c1a;border-radius:50%;box-shadow:inset 2px 2px 0 #fff3a8;vertical-align:-2px}
.dstage{margin:12px auto 4px;width:200px;height:206px;border:3px solid var(--plum);border-radius:12px;box-shadow:0 4px 0 var(--plum);display:grid;place-items:center;
  background:radial-gradient(circle at 50% 38%,#fff 0 30%,transparent 31%),repeating-linear-gradient(45deg,#ffe3f0 0 8px,#ffd6ea 8px 16px)}
.dstage canvas{width:120px;height:186px;image-rendering:pixelated}
#doll h3{margin:16px 0 6px;font-size:18px}#doll h3 small{color:var(--mute);font-size:13px}
.sw{display:flex;flex-wrap:wrap;gap:22px 10px;padding-bottom:10px}
.swb{position:relative;width:44px;height:44px;border-radius:50%;border:3px solid var(--plum);box-shadow:0 3px 0 var(--plum)}
.swb.on{outline:3px solid var(--pink);outline-offset:3px}
.swb.lock{opacity:.55}.swb i{position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);font-style:normal;font-size:11px;color:var(--mute);white-space:nowrap}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px}
.dcell{display:grid;justify-items:center;gap:2px;padding:6px 4px;background:#fff;border:2px solid var(--plum);border-radius:10px;box-shadow:0 3px 0 var(--plum);color:var(--plum);font:inherit}
.dcell canvas{width:80px;height:124px;image-rendering:pixelated}
.dcell b{font-size:14px;font-weight:normal}.dcell small{font-size:11px;color:var(--mute);line-height:1.3}
.dcell.on{background:#ffe3f0;border-color:var(--pink-d);box-shadow:0 3px 0 var(--pink-d)}
.dcell.off b{color:var(--mute)}
.price{display:inline-flex;align-items:center;gap:4px;font-size:15px;color:var(--plum)}.price.no{color:#c0392b}
.jrow{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px}
.jb{flex:none;min-width:76px;display:grid;justify-items:center;gap:2px;padding:6px;background:#fff;border:2px solid var(--plum);border-radius:10px;box-shadow:0 3px 0 var(--plum);color:var(--plum);font:inherit;font-size:15px}
.jb canvas{width:64px;height:48px;image-rendering:pixelated}.jb small{font-size:11px}
.jb.on{background:#ffe3f0;border-color:var(--pink-d)}
.dnote{font-size:14px;color:var(--mute);margin:6px 0}
.dtoast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:30}
.wdoll{position:absolute;left:4px;top:-142px;width:96px;height:140px;image-rendering:pixelated;pointer-events:none}
.wcoin{margin:0;font-size:16px;color:#a16207}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.nk{border-radius:10px;border:2px solid var(--plum);box-shadow:0 3px 0 var(--plum);background:#fff;padding:8px;display:grid;gap:4px;justify-items:center;text-align:center}
.nk canvas{width:128px;height:96px;image-rendering:pixelated}
.nk b{font-size:16px}.nk small{font-size:12px;color:var(--mute)}
.nk.off b{color:var(--mute)}
.story{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;justify-content:space-between;padding:calc(18px + var(--top)) 16px calc(18px + env(safe-area-inset-bottom,0px))}
.story #scv,.story #scvHi{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:0}
.story>*{position:relative;z-index:1}
.story .st-tools{align-self:stretch}
.st-head{text-align:center;margin-bottom:auto;margin-top:4vh}
.st-eye{margin:0 0 6px;font-family:var(--px);font-size:10px;letter-spacing:.14em;color:#fff;text-shadow:2px 2px 0 var(--plum)}
.st-head h2{margin:0;font-size:32px;color:#fff;text-shadow:3px 3px 0 var(--plum),-1px -1px 0 var(--plum),2px -1px 0 var(--plum),-1px 2px 0 var(--plum)}
.st-box{position:relative;padding:12px 16px 26px;min-height:150px;width:100%;text-align:left;font:inherit}
.st-who{display:flex;align-items:center;gap:8px;min-height:30px;margin-bottom:4px}
.st-av{width:27px;height:27px;image-rendering:pixelated}
.st-who b{font-size:16px}
.st-text{display:block;font-size:30px;line-height:1.35;min-height:2.7em;color:#5b2a6e;letter-spacing:.01em}
.st-more{position:absolute;right:14px;bottom:6px;font-size:12px;animation:blink 1s steps(1) infinite}
.st-count{position:absolute;left:14px;bottom:6px;font-size:12px;color:var(--mute)}
@media (max-height:640px){.item{min-height:44px;font-size:24px}.emo{width:48px;height:48px;font-size:36px}.word span{height:34px;font-size:24px;min-width:24px}.key{height:40px}}
@media (prefers-reduced-motion:reduce){.sheet,.item.sel i{animation:none}}

<div class="app">

      <button class="btn" id="btnHint" type="button">提示</button>
      <button class="btn tre-btn" id="btnTre" type="button" aria-label="寶物圖鑑"><canvas class="ico" id="treIco" width="12" height="12" style="width:30px;height:30px"></canvas></button>
    </div>
  </header>
  <main class="stage" id="stage">

    <canvas id="cvHi" class="hi" aria-hidden="true"></canvas>
    <button class="bubble pxbox" id="bubble" type="button" hidden><b>Pip</b><span id="bubbleT"></span></button>
    <p class="toast" id="toast" hidden></p>
  </main>
  <footer class="tray" id="tray"></footer>

  <section class="sheet" id="win" hidden>
    <canvas class="wdoll" id="winDoll" width="48" height="70" aria-hidden="true"></canvas>

    <h2><i id="winEmo"></i><span id="winWord"></span></h2>
    <p id="winZh"></p>
    <p class="wcoin" id="winCoin"></p>
    <div class="treasure" id="winTre" hidden></div>
    <div class="row"><button id="btnAgain" type="button">再拼一次</button><button class="next" id="btnNext" type="button">下一個</button></div>
  </section>

  <section class="overlay" id="levels" hidden>
    <div class="top"><h2>關卡</h2><span style="display:flex;gap:6px"><button class="btn" id="btnTitle" type="button">開始畫面</button><button class="btn" id="btnClose" type="button">回到桌上</button></span></div>

    <div id="lvList"></div>
    <p class="dnote" data-sync></p>
    <div class="opts">
      <button class="btn" type="button" data-au="m">音樂：開</button>
      <button class="btn" type="button" data-au="s">音效：開</button>
      <button class="btn" type="button" id="btnVoice">語音：開</button>

      <div class="sig">Made by <b>Jim Lu</b></div>
    </div>
  </section>
</div>

/* ---------- 組裝桌：字母球、棍子、簡單物理 ---------- */
const cv=$('cv'),ctx=cv.getContext('2d'),PS=2;

const R=28,REST=86,MAXB=2;
const ball=id=>st.balls.find(b=>b.id===id);

function connect(a,b){

function removeSel(){

function clearAll(){if(st.balls.length)SFX('clear');st.balls=[];st.bonds=[];st.sel=null;st.won=false;st.clasp=null;$('win').hidden=true;changed();}
/* 檢查：桌上的字母剛好接成一條線，從一頭讀過去就是這個字 */
function readChain(){
  const n=st.balls.length;if(!n)return null;
  if(st.bonds.length!==n-1)return null;
  const adj=new Map(st.balls.map(b=>[b.id,[]]));
  for(const k of st.bonds){adj.get(k.a).push(k.b);adj.get(k.b).push(k.a);}
  if([...adj.values()].some(v=>v.length>2))return null;
  const start=n===1?st.balls[0].id:[...adj.keys()].find(id=>adj.get(id).length===1);
  if(start==null)return null;
  const seq=[start],seen=new Set([start]);
  while(seq.length<n){const nx=adj.get(seq[seq.length-1]).find(x=>!seen.has(x));if(nx==null)return null;seq.push(nx);seen.add(nx);}
  return seq;
}
function check(){
  const w=W().w,seq=readChain();if(!seq)return null;

function changed(){

function counts(arr){const c={};for(const x of arr)c[x]=(c[x]||0)+1;return c;}

function win(seq){

function goLevel(i){

/* 物理：棍子是彈簧，同一串的字母互相推開；拼好後往一直線的位置靠 */
function comps(){
  const p=new Map(st.balls.map(b=>[b.id,b.id]));const f=x=>{while(p.get(x)!==x)x=p.get(x);return x;};
  for(const k of st.bonds)p.set(f(k.a),f(k.b));for(const b of st.balls)b.c=f(b.id);
}
function step(){
  const A=st.balls,n=A.length,nowT=performance.now();comps();
  for(const a of A)if(a.fly)flyStep(a,nowT);
  for(const a of A){a.fx=0;a.fy=0;}
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){
    const a=A[i],b=A[j];if(a.fly||b.fly)continue;let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);if(d<.01){dx=Math.random()-.5;dy=Math.random()-.5;d=Math.hypot(dx,dy);}
    const ux=dx/d,uy=dy/d;let f=0;
    if(bondOf(a.id,b.id))f=(d-REST)*.12;
    else{if(a.c===b.c&&d<200)f-=Math.min(1.4,600/(d*d));const m=2*R+8;if(d<m)f-=(m-d)*.25;}
    if(st.won)f=bondOf(a.id,b.id)?f*.3:0;
    a.fx+=ux*f;a.fy+=uy*f;b.fx-=ux*f;b.fy-=uy*f;
  }
  let mx=0;
  for(const a of A){
    if(st.won&&a.tx!=null){a.fx+=(a.tx-a.x)*.08;a.fy+=(a.ty-a.y)*.08;}
    if(a.fly)continue;
    if(drag&&drag.moved&&drag.id===a.id){a.vx=a.vy=0;continue;}
    a.vx=(a.vx+a.fx)*.72;a.vy=(a.vy+a.fy)*.72;a.x+=a.vx;a.y+=a.vy;clampB(a);avoidDoll(a);mx=Math.max(mx,Math.abs(a.vx)+Math.abs(a.vy));

function draw(now){
  const g=ctx,w=cv.width,h=cv.height,q=1/PS,tt=reduced?0:now/1000;

  /* 線會因為重力往下垂一點 */
  for(const k of st.bonds){const a=ball(k.a),b=ball(k.b);cord(g,a.x*q,a.y*q,b.x*q,b.y*q);}
  if(st.won&&st.clasp){const c=st.clasp,a=ball(c.a),b=ball(c.b);if(a&&b){cord(g,a.x*q,a.y*q,c.x*q,c.y*q);cord(g,b.x*q,b.y*q,c.x*q,c.y*q);

    let x=b.x;if(b.shake){const t=now-b.shake;if(t<350)x+=Math.sin(t/22)*5*(1-t/350);else b.shake=0;}
    b.sc=b.fly?Math.min(1,.3+.7*Math.max(0,(now-b.fly.t0)/b.fly.d)):1;
    const v=VOW.has(b.ch),r=Math.max(3,Math.round(R*q*b.sc));

    g.fillStyle='#ffffff';g.fillRect(Math.round(x*q)-r+4,Math.round(b.y*q)-r+3,1,2);g.fillRect(Math.round(x*q)-r+3,Math.round(b.y*q)-r+4,2,1);
    b.dx=x;

  }

  const hg=hiPrep($('cvHi'));for(const b of st.balls)if(!(b.sc<.8))hiDraw(hg,show(b.ch),b.dx!=null?b.dx:b.x,b.y,b.sc<.97?'s':'l');

function cord(g,x0,y0,x1,y1){

/* 觸控：點球選取、點兩顆球接棍子、點棍子拆開、拖曳移動 */
const pos=ev=>{const r=cv.getBoundingClientRect();return{x:ev.clientX-r.left,y:ev.clientY-r.top};};

  const g=c.getContext('2d'),tt=reduced?0:now/1000,hz=Math.round(($('stBox').getBoundingClientRect().top-c.getBoundingClientRect().top)*PW/cw)-2;
  skyLand(g,PW,hz,PH,scene.h,tt);

  if(DOLL.made){const by=hz-DH+2+(reduced?0:Math.round(Math.sin(tt*2.2)*1));g.fillStyle='rgba(74,35,80,.18)';g.fillRect(16,hz+1,22,2);drawDoll(g,7,by,DOLL,1,false);}
  const hg=hiPrep($('scvHi')),k=cw/PW;
  for(let i=0;i<6;i++){const ch='pearls'[i],x=((i*61.7)%100)/100*(PW-30)+15+Math.sin(tt*.4+i)*8,y=hz*(.36+((i*37)%46)/100)+Math.sin(tt*.8+i*2)*4;

/* 背景：每個地方一種顏色的粉彩天空，飄著白雲，下面是兩層薄荷綠的山 */
function skyLand(g,w,hz,h,hue,tt){
  const nb=8,band=hz/nb;
  for(let i=0;i<nb;i++){const y0=Math.round(i*band),y1=Math.round((i+1)*band);g.fillStyle=`hsl(${hue+i*9} 85% ${80+i*1.6}%)`;g.fillRect(0,y0,w,y1-y0);
    if(i+1<nb){g.fillStyle=`hsl(${hue+(i+1)*9} 85% ${80+(i+1)*1.6}%)`;for(let y=y1-2;y<y1;y++)for(let x=(y&1);x<w;x+=(y===y1-2?4:2))g.fillRect(x,y,1,1);}}
  for(let i=0;i<4;i++){const cw=18+(i*7)%14,x=Math.round(((i*67+tt*(3+i))%(w+60))-30),y=Math.round(6+((i*29)%40)/100*hz);cloud(g,x,y,cw);}
  for(const s of STARS.slice(0,10)){if(Math.sin(tt*2+s[3])<.4)continue;const x=Math.round(s[0]*w),y=Math.round(s[1]*hz*.6);g.fillStyle='#ffffff';g.fillRect(x,y-1,1,3);g.fillRect(x-1,y,3,1);}
  for(let x=0;x<w;x++){const y1=Math.round(hz-14-hill(x+hue+tt*1.5,.045,6,.5)),y2=Math.round(hz-5-hill(x+60+hue*3+tt*4,.07,4,2.1));
    g.fillStyle='#a8e6cf';g.fillRect(x,y1,1,h-y1);g.fillStyle='#d4f7e7';g.fillRect(x,y1,1,1);g.fillStyle='#6cc9a1';g.fillRect(x,y2,1,h-y2);g.fillStyle='#8fdcb9';g.fillRect(x,y2,1,1);}
  g.fillStyle='#ffd6ea';g.fillRect(0,hz+2,w,h-hz);
}
function cloud(g,x,y,w){
  const h=Math.max(5,Math.round(w*.32));
  g.fillStyle='#e9e3ff';g.fillRect(x+2,y+h-1,w-2,2);
  g.fillStyle='#ffffff';g.fillRect(x,y+2,w,h-2);g.fillRect(x+3,y,Math.round(w*.4),3);g.fillRect(x+Math.round(w*.45),y-2,Math.round(w*.35),4);
}
/* 粉紅色的城堡：三座塔、尖屋頂、愛心窗；每一塊都有深紫色外框 */
function castle(g,cx,by,sc){
  const parts=[];const R=(x,y,w,h,c)=>parts.push([Math.round(cx+x*sc),Math.round(by-y*sc),Math.max(1,Math.round(w*sc)),Math.max(1,Math.round(h*sc)),c]);
  const Wl='#fff7fb',Sh='#f3d9ff',P='#ff6fae',Pd='#d63f86',Y='#ffd166',L='#9b7bff';
  R(-26,22,52,22,Wl);for(let x=-26;x<26;x+=6)R(x,25,3,3,Wl);
  for(const [tx,tw,th] of [[-34,12,36],[22,12,36],[-7,14,48]]){R(tx,th,tw,th,Wl);R(tx+tw-3,th,3,th,Sh);for(let i=0;i<tw/2;i++)R(tx+i,th+tw/2-i,tw-2*i,1,i<2?Pd:P);R(tx+tw/2-1,th-8,3,4,Y);}
  R(-5,12,10,12,L);R(-18,15,3,4,Y);R(15,15,3,4,Y);
  g.fillStyle='#4a2350';for(const p of parts)g.fillRect(p[0]-1,p[1]-1,p[2]+2,p[3]+2);
  for(const p of parts){g.fillStyle=p[4];g.fillRect(p[0],p[1],p[2],p[3]);}
}

  for(let i=1;i<pts.length;i++){pxLine(g,pts[i-1][0],pts[i-1][1],pts[i][0],pts[i][1],1,locked?'#e3d6f0':CORD);}
  pts.forEach((p,i)=>{if(i%2===0||i===n)return;const r=2;g.fillStyle=locked?'#e3d6f0':INK;g.fillRect(Math.round(p[0])-r,Math.round(p[1])-r+1,r*2+1,r*2-1);g.fillRect(Math.round(p[0])-r+1,Math.round(p[1])-r,r*2-1,r*2+1);

    const key=fbKey(PLY.cur),r=await fetch(FBV+'/'+key+'.json');if(!r.ok)throw new Error(r.status);
    const old=await r.json();
    if(old&&old.ph&&old.ph!==(m.ph||null)){setSync('locked');plyBusy=false;return;}
    let pulled=false;
    if(old&&old.s&&!m.force)pulled=mergeIn(old.s,old.up);
    const body={n:PLY.cur,ph:m.ph||null,s:snap(),up:m.up||Date.now()};
    if(m.dirty||m.force||!old||pulled||JSON.stringify(old.s)!==JSON.stringify(body.s)||(old.ph||null)!==(m.ph||null)){
      const put=async(u,d)=>{const x=await fetch(u,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d),keepalive:true});if(!x.ok)throw new Error(x.status);};
      await put(FBV+'/'+key+'.json',body);await put(FBP+'/'+key+'.json',boardRow());
    }
    m.dirty=0;m.force=0;savePLY();setSync('ok');
    if(pulled)refreshAfterPull();
  }catch(e){savePLY();setSync('off');}
  plyBusy=false;if(plyAgain){plyAgain=false;syncNow();}
}
function refreshAfterPull(){
  if(titleOn)showTitle();if(!$('levels').hidden)openLevels();if(!$('doll').hidden)renderDoll();
  dollCache.clear();kick(10);
}
addEventListener('online',()=>syncNow());
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-syncAt>30000)syncNow();});
setInterval(()=>{const m=me();if(!document.hidden&&m&&(syncState==='off'||m.dirty))syncNow();},60000);

/* ---------- 誰在玩？ ---------- */
const headCv=(d,cls)=>`<canvas class="hd ${cls||''}" width="40" height="34" data-head='${esc(JSON.stringify(d||{}))}'></canvas>`;
function paintHeads(root){root.querySelectorAll('canvas[data-head]').forEach(cv=>{const g=cv.getContext('2d');g.clearRect(0,0,40,34);g.imageSmoothingEnabled=false;
  const d=Object.assign({skin:0,hair:'long',hc:'brown',eye:'dark',outfit:'o1',shoes:'s1'},JSON.parse(cv.dataset.head));for(const k of ['head','clip','neck','wand','ring'])if(d[k]&&!treById(d[k]))d[k]=null;drawDoll(g,0,0,d,1,false,{face:'h'});});}
function renderWho(){
  const loc=Object.keys(PLY.list).map(n=>{const s=stateOf(n)||{},w=WORDS.filter(x=>(s.done||{})[x.w]).length,i=PLY.list[n];
    return `<button class="rowp ${n===PLY.cur?'you':''}" type="button" data-name="${esc(n)}">${headCv(s.doll)}<span class="nm"><b>${esc(n)}${i.ph?'<span class="tagx">有密碼</span>':''}</b><small>拼好 ${w} 個字${n===PLY.cur?'・正在玩':''}</small></span></button>`;});
  const far=[];
  for(const k in boardRemote||{}){const r=boardRemote[k];if(!r||typeof r.n!=='string'||PLY.list[r.n])continue;
    far.push([+r.s||0,`<button class="rowp" type="button" data-name="${esc(r.n.slice(0,12))}">${headCv(r.d)}<span class="nm"><b>${esc(r.n.slice(0,12))}${r.lk?'<span class="tagx">有密碼</span>':''}</b><small>拼好 ${+r.w||0} 個字</small></span></button>`]);}
  far.sort((a,b)=>b[0]-a[0]);
  $('whoList').innerHTML=(loc.length?'<p class="whosec">這台裝置玩過的人</p>'+loc.join(''):'')+(far.length?'<p class="whosec">在其他裝置玩過的人</p>'+far.slice(0,40).map(x=>x[1]).join(''):'');
  paintHeads($('whoList'));
  $('whoPin').hidden=!PLY.cur;if(PLY.cur)$('whoPin').textContent=(me().ph?'更改「':'幫「')+PLY.cur+(me().ph?'」的密碼':'」設定密碼');
}
async function openWho(after){
  whoAfter=after||null;$('whoName').value='';$('whoMsg').textContent='';$('who').hidden=false;renderWho();setSync(syncState);
  try{const r=await fetch(FBP+'.json');if(r.ok){boardRemote=await r.json()||{};if(!$('who').hidden)renderWho();}}catch(e){}
}
function closeWho(){$('who').hidden=true;$('pin').hidden=true;const a=whoAfter;whoAfter=null;if(a)a();}
async function pickPlayer(raw){
  const name=String(raw||'').replace(/\s+/g,' ').trim().slice(0,12);if(!name)return;
  if(name===PLY.cur){closeWho();return;}
  const loc=PLY.list[name];
  if(loc){if(loc.ph)askPin(name,loc.ph,()=>switchTo(name));else switchTo(name);return;}
  $('whoMsg').textContent='正在查「'+name+'」有沒有玩過…';
  let rem=null;try{const r=await fetch(FBV+'/'+fbKey(name)+'.json');if(r.ok)rem=await r.json();}catch(e){}
  $('whoMsg').textContent='';
  if(rem&&rem.s){const fin=()=>switchTo(name,rem.s,{ph:rem.ph||null,up:rem.up||Date.now()});if(rem.ph)askPin(name,rem.ph,fin);else fin();return;}
  if(!PLY.cur){   /* 第一位玩家：這台裝置之前沒有名字的進度，直接算在他身上 */
    PLY.cur=name;PLY.list[name]={up:Date.now()};savePLY();pushSoon();titleWho();closeWho();return;}
  switchTo(name,BLANK(),{up:Date.now()});
}
$('whoList').addEventListener('click',ev=>{const b=ev.target.closest('.rowp');if(b)pickPlayer(b.dataset.name);});
$('whoForm').addEventListener('submit',ev=>{ev.preventDefault();pickPlayer($('whoName').value);});
$('whoClose').addEventListener('click',()=>{whoAfter=null;$('who').hidden=true;});
let pinCtx=null;
function openPin(ctx,title,lead){pinCtx=ctx;$('pinTitle').textContent=title;$('pinLead').textContent=lead;$('pinErr').textContent='';$('pinIn').value='';$('pin').hidden=false;try{$('pinIn').focus();}catch(e){}}
function askPin(name,hash,ok){openPin({mode:'ask',name,hash,ok},'輸入密碼','「'+name+'」設了 4 碼密碼，輸入正確才能用這份紀錄。');}
$('whoPin').addEventListener('click',()=>{const m=me();if(!m)return;
  openPin({mode:'set'},m.ph?'更改密碼':'設定密碼','幫「'+PLY.cur+'」設 4 個數字的密碼，別人要選這個名字就得先輸入。'+(m.ph?'留空白再按確認，可以取消密碼。':'')+'這只是防止選錯人的簡單密碼，請不要用提款卡或手機的密碼。');});
$('pinForm').addEventListener('submit',ev=>{ev.preventDefault();const c=pinCtx,v=$('pinIn').value.trim();if(!c)return;
  if(c.mode==='ask'){if(pinHash(c.name,v)===c.hash){$('pin').hidden=true;c.ok();}else{$('pinErr').textContent='密碼不對，再試一次。';$('pinIn').value='';}return;}
  const m=me();if(v===''&&m.ph)m.ph=null;else if(/^[0-9]{4}$/.test(v))m.ph=pinHash(PLY.cur,v);else{$('pinErr').textContent='請輸入剛好 4 個數字。';return;}
  savePLY();pushSoon();$('pin').hidden=true;renderWho();toast2b(m.ph?'密碼設好了':'密碼已取消');});
$('pinClose').addEventListener('click',()=>{$('pin').hidden=true;});
function toast2b(m){const t=$('whoMsg');t.textContent=m;}
function titleWho(){const b=$('tWho');if(!b)return;b.innerHTML=PLY.cur?`玩家：<b>${esc(PLY.cur)}</b>　換人 ▸`:'還沒有名字　輸入名字 ▸';}

/* ---------- 排行榜：用賺到的金幣總數排名 ---------- */
function renderBoard(){
  const m=new Map();
  for(const k in boardRemote||{}){const r=boardRemote[k];if(r&&typeof r.n==='string'&&r.s>0)m.set(r.n,{n:r.n.slice(0,12),s:+r.s||0,w:+r.w||0,t:+r.t||0,d:r.d||{}});}
  if(PLY.cur){const r=boardRow(),o=m.get(r.n);if(r.s>0&&(!o||r.s>=o.s))m.set(r.n,r);}
  const rows=[...m.values()].sort((a,b)=>b.s-a.s||b.w-a.w).slice(0,50);
  $('boardList').innerHTML=rows.length?rows.map((r,i)=>`<div class="rowp ${r.n===PLY.cur?'you':''}"><span class="rk ${i<3?'top'+i:''}">${i+1}</span>${headCv(r.d)}<span class="nm"><b>${esc(r.n)}</b><small>拼好 ${r.w} 個字・寶物 ${r.t} 件</small></span><span class="sc">${r.s}<small>金幣</small></span></div>`).join('')
    :'<p class="dnote">還沒有人上榜。拼好一個字就會出現在這裡。</p>';
  paintHeads($('boardList'));
}
async function openBoard(){
  $('board').hidden=false;$('boardNote').textContent='正在讀取線上排行榜…';renderBoard();
  try{const r=await fetch(FBP+'.json');if(!r.ok)throw 0;boardRemote=await r.json()||{};$('boardNote').textContent='用拼字賺到的金幣總數排名（買東西花掉的也算在內）。這個榜是公開的，只會顯示名字、分數和公主的樣子。';}
  catch(e){$('boardNote').textContent='連不上線上排行榜，先顯示這台裝置的紀錄。';}
  renderBoard();
}
$('boardClose').addEventListener('click',()=>{$('board').hidden=true;});

$('btnBoard').addEventListener('click',openBoard);
$('btnWho').addEventListener('click',()=>openWho());
buildTray();resize();goLevel(lvl);AU.apply();showTitle();titleWho();
if(PLY.cur)setTimeout(syncNow,600);
try{if(sessionStorage.getItem('abc-go')){sessionStorage.removeItem('abc-go');setTimeout(hideTitle,80);}}catch(e){}
