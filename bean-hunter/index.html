<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>咖啡尋豆師</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
/* 版面概念：尋豆師的田野筆記本。生豆的灰綠紙色、深墨綠字、咖啡櫻桃紅做重點，數字用等寬字像杯測表。 */
:root{
  --paper:#e6ece2; --card:#f5f8f1; --ink:#1c2a23; --muted:#5a6a60; --line:#c5d0c3;
  --cherry:#b0252f; --leaf:#2c6a4d; --amber:#a66a12; --on-cherry:#fff; --land:#c3d0bf; --sea:#f5f8f1; --coffee:#5a3723;
  --display:"Noto Serif TC","Songti TC",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#131a16; --card:#1b2520; --ink:#e4ebe4; --muted:#93a399; --line:#2f3d36;
    --cherry:#ea6a72; --leaf:#72c39b; --amber:#e2b25c; --on-cherry:#1a0c0d; --land:#33443b; --sea:#1b2520; --coffee:#a9744f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#131a16; --card:#1b2520; --ink:#e4ebe4; --muted:#93a399; --line:#2f3d36;
  --cherry:#ea6a72; --leaf:#72c39b; --amber:#e2b25c; --on-cherry:#1a0c0d; --land:#33443b; --sea:#1b2520; --coffee:#a9744f; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;padding:0 16px 48px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:34px;font-weight:900;letter-spacing:.04em}
h2{font-size:21px}
h3{font-size:17px}
p{margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.hud{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:2px solid var(--ink);margin:0 -16px 16px;padding:10px 16px 8px}
.hud .cells{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hud .k{font-size:11px;color:var(--muted);letter-spacing:.08em}
.hud .v{font-family:var(--mono);font-weight:600;font-size:17px}
.daybar{height:4px;background:var(--line);margin-top:8px}
.daybar i{display:block;height:100%;background:var(--cherry)}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px}
.card.tap{cursor:pointer;border-left:4px solid var(--leaf)}
.card.off{opacity:.55}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.tag.in{background:var(--leaf);color:var(--card);border-color:var(--leaf)}
.tag.late{border-color:var(--amber);color:var(--amber)}
.tag.out{border-style:dashed;color:var(--muted)}
.tag.hit{border-color:var(--leaf);color:var(--leaf)}
.tag.bad{border-color:var(--cherry);color:var(--cherry)}
button{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--ink);border-radius:4px;padding:9px 14px;cursor:pointer;min-height:42px}
button:focus-visible,.card.tap:focus-visible{outline:3px solid var(--cherry);outline-offset:2px}
button.primary{background:var(--cherry);border-color:var(--cherry);color:var(--on-cherry);font-weight:700}
button.ghost{border-color:var(--line)}
button.sm{padding:4px 10px;min-height:34px;font-size:13px}
button:disabled{opacity:.4;cursor:not-allowed}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.acts button{padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.acts button span{font-size:11px;color:var(--muted)}
.msg{border-left:4px solid var(--cherry);background:var(--card);padding:10px 12px;font-size:14px}
.scale{position:relative;height:14px;background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 12.5%);border:1px solid var(--line)}
.scale i{position:absolute;top:0;bottom:0;background:var(--leaf);opacity:.85}
.scale i.s{background:var(--amber)}
.scale b{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--cherry)}
.attr{display:grid;grid-template-columns:4.5em 1fr 5.5em;gap:8px;align-items:center;font-size:13px}
.attr .scale{height:8px}
ul.notes{margin:0;padding-left:1.2em;font-size:14px}
ul.notes li+li{margin-top:4px}
hr{border:0;border-top:1px dashed var(--line);margin:4px 0}
.big{font-family:var(--mono);font-size:30px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{text-align:left;padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
details summary{cursor:pointer;font-weight:700}
.hero{padding:36px 0 8px}
.hero .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--cherry)}
ol.rules{margin:0;padding-left:1.4em}
ol.rules li+li{margin-top:6px}
.hud .cells.g4{grid-template-columns:repeat(3,1fr) auto;align-items:center}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:4px;background:var(--line)}
.steps i.on{background:var(--cherry)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.flow span{border:1px solid var(--ink);border-radius:4px;padding:2px 8px;background:var(--card)}
.flow em{font-style:normal;color:var(--muted)}
.tnav{display:grid;grid-template-columns:1fr 1fr;gap:8px}
svg{display:block;max-width:100%}
.map{width:100%;height:auto;background:var(--sea);border:1px solid var(--line);border-radius:4px}
.map .land{fill:var(--land)}
.map .belt{fill:var(--leaf);opacity:.09}
.map .beltl{stroke:var(--leaf);stroke-width:.6;stroke-dasharray:3 3;opacity:.6}
.map text{font-family:var(--body);font-size:11px;fill:var(--ink)}
.map .cap{font-size:8px;fill:var(--leaf);letter-spacing:.15em}
.map .lead{stroke:var(--muted);stroke-width:.6}
.map .pin{stroke:var(--sea);stroke-width:1.2}
.map .pin.in{fill:var(--leaf)} .map .pin.late{fill:var(--amber)} .map .pin.out{fill:var(--sea);stroke:var(--muted);stroke-dasharray:2 1.5}
.map .ring{fill:none;stroke:var(--cherry);stroke-width:1.6}
.map .here{fill:none;stroke:var(--cherry);stroke-width:1.2;animation:ping 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
.map .route{fill:none;stroke:var(--cherry);stroke-width:1.2;stroke-dasharray:4 3}
.map .hit{fill:transparent;cursor:pointer}
.map g[data-a]:focus-visible{outline:2px solid var(--cherry)}
@keyframes ping{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.2);opacity:0}}
@media (prefers-reduced-motion:reduce){.map .here{animation:none}}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.scene{width:100%;height:auto;border:1px solid var(--line);border-radius:4px;background:var(--sea)}
.tray{width:100%;height:auto;background:var(--paper);border:1px solid var(--line);border-radius:4px}
.beans{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.beans span{display:inline-flex;flex-direction:column;align-items:center;gap:2px}
.ttl{display:flex;align-items:center;gap:8px}
.bowls{display:inline-flex;gap:3px;vertical-align:middle}

.map .trail{fill:none;stroke:var(--cherry);stroke-width:1.1;opacity:.4}
.radar{width:100%;max-width:260px;height:auto;margin:0 auto}
.radar .grid{fill:none;stroke:var(--line);stroke-width:.8}
.radar text{font-family:var(--body);font-size:10px;fill:var(--muted)}
.cups{width:100%;max-width:300px;height:auto}
.cups.go .liq{transform-box:fill-box;transform-origin:center;animation:fillin .45s both;animation-delay:calc(var(--i)*.12s)}
@keyframes fillin{from{transform:scale(0)}}
.say{display:flex;gap:10px;align-items:flex-start}
.say.me{flex-direction:row-reverse}
.say .av{flex:none;width:40px;height:40px;border-radius:50%;overflow:hidden;border:1px solid var(--line)}
.say .sb{min-width:0;max-width:calc(100% - 50px)}
.say .who{font-size:12px;color:var(--muted);margin-bottom:2px}
.say.me .who{text-align:right}
.say .bub{background:var(--card);border:1px solid var(--line);border-radius:4px 12px 12px 12px;padding:8px 12px;font-size:14px}
.say.me .bub{border-radius:12px 4px 12px 12px;background:var(--land)}
.card .say .bub{background:var(--paper)}
.stamp{display:inline-block;font-family:var(--display);font-weight:700;font-size:13px;padding:1px 8px;border:2px solid;border-radius:3px;transform:rotate(-3deg);letter-spacing:.08em}
.stamp.ok{color:var(--leaf)} .stamp.warn{color:var(--amber)} .stamp.bad{color:var(--cherry)}
.pop{animation:pop .45s ease-out}
.pop .stamp{animation:thud .35s .9s both}
@keyframes pop{from{transform:translateY(-14px);opacity:0}}
@keyframes thud{from{transform:scale(2.2) rotate(-12deg);opacity:0}}
.swap{position:relative}
.swap .old{position:absolute;inset:0;animation:fade 1s .5s both}
@keyframes fade{to{opacity:0}}
.sea{width:100%;height:auto}
.sea .ship{animation:sail 1.6s ease-out both}
@keyframes sail{from{transform:translateX(-240px)}}
.share{background:var(--ink);color:var(--paper);padding:16px;border-radius:6px}
.share h2{color:var(--paper)} .share .big{color:var(--paper)}
.share .k{font-size:11px;opacity:.7;letter-spacing:.08em} .share .v{font-family:var(--mono);font-weight:600;font-size:17px}
.cells3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts button:disabled span{color:inherit}
@media (prefers-reduced-motion:reduce){.pop,.pop .stamp,.swap .old,.sea .ship,.cups.go .liq{animation:none}.swap .old{display:none}}

/* 開始畫面：固定的黎明山景，不跟主題切換 */
.title{position:relative;margin:0 -16px -48px;height:100vh;height:100dvh;min-height:600px;max-height:860px;overflow:hidden;background:#0c1a14;color:#fdf6e3;display:flex;flex-direction:column;justify-content:space-between}
.tscene{position:absolute;inset:0;width:100%;height:100%}
.thead{position:relative;padding:max(44px,9vh) 24px 0;text-align:center}
.teye{font-family:var(--mono);font-size:12px;letter-spacing:.34em;color:#f6d58a}
.title h1{white-space:nowrap;font-size:clamp(40px,13.5vw,66px);letter-spacing:.06em;margin-top:10px;color:#fdf6e3;text-shadow:0 2px 0 #0c1a14,0 6px 22px rgba(12,26,20,.7)}
.title h1 span{display:inline-block;animation:trise .7s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes trise{from{transform:translateY(26px);opacity:0}}
.trule{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px}
.trule i{width:54px;height:1px;background:#f6d58a;opacity:.8}
.ttag{margin-top:12px;font-size:15px;line-height:1.8;text-shadow:0 1px 8px rgba(12,26,20,.9)}
.tmenu{position:relative;padding:0 24px max(22px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.title button{background:rgba(12,26,20,.6);color:#fdf6e3;border-color:rgba(253,246,227,.5);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.title button:focus-visible{outline:3px solid #f6d58a}
.title button.primary{background:#c8323c;border-color:#c8323c;color:#fff;font-size:18px;min-height:56px;letter-spacing:.12em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;box-shadow:0 0 0 0 rgba(200,50,60,.6);animation:tpulse 2.4s ease-out infinite}
.title button.primary span{font-family:var(--mono);font-size:12px;letter-spacing:0;font-weight:500;opacity:.9}
@keyframes tpulse{70%{box-shadow:0 0 0 14px rgba(200,50,60,0)}100%{box-shadow:0 0 0 0 rgba(200,50,60,0)}}
.trow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trow button{font-size:14px;padding:9px 6px}
.tstat{font-size:12px;margin-top:2px}
.tstat .row{flex-wrap:nowrap}
.tbar{height:4px;background:rgba(253,246,227,.25);margin:5px 0}
.tbar i{display:block;height:100%;background:#f6d58a}
.tcloud{opacity:.7}
.tscene .tw{animation:ttw 3.6s ease-in-out infinite}
@keyframes ttw{50%{opacity:.15}}
.tscene .sun{animation:tsun 3.2s ease-out both}
@keyframes tsun{from{transform:translateY(46px)}}
.tscene .mist{animation:tmist 16s ease-in-out infinite alternate}
.tscene .mist.m2{animation-duration:22s;animation-direction:alternate-reverse}
@keyframes tmist{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
.tscene .plane{animation:tplane 22s linear infinite}
@keyframes tplane{from{transform:translate(-40px,250px) rotate(-8deg)}to{transform:translate(480px,170px) rotate(-8deg)}}
.tscene .branch{transform-box:fill-box;transform-origin:100% 100%;animation:tsway 5s ease-in-out infinite alternate}
@keyframes tsway{from{transform:rotate(-1.4deg)}to{transform:rotate(1.4deg)}}
.tscene .fb{opacity:0;animation:tfloat 12s linear infinite}
@keyframes tfloat{0%{transform:translateY(600px);opacity:0}15%{opacity:.55}85%{opacity:.4}100%{transform:translateY(260px);opacity:0}}
@media (prefers-reduced-motion:reduce){.title h1 span,.title button.primary,.tscene *{animation:none!important}.tscene .fb{display:none}.tscene .plane{transform:translate(120px,230px) rotate(-8deg)}}

input{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--ink);border-radius:4px;padding:10px 12px;min-height:44px;width:100%}
input:focus-visible{outline:3px solid var(--cherry);outline-offset:2px}
.prow{display:flex;gap:8px;align-items:stretch}
.pbtn{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;border-left:4px solid var(--leaf)}
.pbtn.you{border-left-color:var(--cherry)}
.title .tplayer{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:8px 14px;min-height:40px}
</style>
</head>
<body>

<script>
"use strict";
const R=(a,b)=>a+Math.random()*(b-a), RI=(a,b)=>Math.floor(R(a,b+1)), pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)), shuffle=a=>[...a].sort(()=>Math.random()-.5);
const r1=x=>Math.round(x*10)/10, fl=x=>Math.floor(x*2+1e-9)/2, cl=x=>Math.ceil(x*2-1e-9)/2;
const $=n=>(n<0?'−$':'$')+Math.abs(Math.round(n)).toLocaleString('en-US');
const rnd=(s,i)=>{let x=(i+1)*374761393|0;for(const c of s)x=Math.imul(x^c.charCodeAt(0),668265263);x^=x>>>13;x=Math.imul(x,1274126177);return((x^(x>>>16))>>>0)/4294967296};
const KG=60, SHIP=1, START=30000, DAYS=30;
const CAT={floral:'花香柑橘',fruit:'莓果熱帶',nutty:'堅果可可',herbal:'草本木質'};
const FLAV={floral:['茉莉花','佛手柑','檸檬','蜂蜜','白桃','伯爵茶'],fruit:['藍莓','草莓','芒果','黑醋栗','紅酒','烏梅'],nutty:['榛果','黑巧克力','焦糖','杏仁','紅糖','可可'],herbal:['雪松','草本','菸草','香料','黑巧克力','奶油']};
const ATTR=['香氣','酸質','甜度','醇厚','乾淨度','餘韻'];
const ORIGINS=[
 {id:'eth',name:'衣索比亞',region:'古吉・耶加雪菲',months:[11,12,1,2],cost:2200,td:3,lo:84,hi:90.5,pLo:6,pHi:13,alt:[1900,2300],bags:[8,30],note:'原生種的故鄉，花香與莓果',
  farms:['哈魯處理站','沃卡小農合作社','德里莎處理站','山霧莊園'],people:['阿貝貝','特斯法耶','梅塞雷特','哈娜'],
  bio:['我父親是這個處理站的第一個工人。他說咖啡是森林送給我們的，不是我們種出來的。','合作社有七百戶小農，每戶後院就幾十棵樹。我的工作是說服大家只摘紅的。','我在阿迪斯阿貝巴念完農學才回來。村裡的人花了三年才相信一個女人能管處理站。','這片山以前沒有路。我祖母揹著櫻桃走半天到市集，現在換我開卡車。'],
  tpl:[{v:'原生種 Heirloom',p:'水洗',cat:'floral'},{v:'原生種 Heirloom',p:'日曬',cat:'fruit'}]},
 {id:'ken',name:'肯亞',region:'涅里',months:[11,12,1,2],cost:2300,td:3,lo:85,hi:90.5,pLo:9,pHi:16,alt:[1700,2000],bags:[6,20],note:'明亮酸質，黑醋栗與烏梅',
  farms:['卡瑞尼處理廠','奇里雅合作社','紅土丘處理廠','姆溫加莊園'],people:['萬吉魯','卡馬烏','恩喬羅格','奧蒂諾'],
  bio:['我們照老方法做，發酵完再泡一夜清水。年輕人嫌麻煩，可是味道騙不了人。','我以前在拍賣場當過杯測員，每週四喝三百杯。回來才知道種比喝難多了。','這片紅土是火山給的。雨來得準，咖啡就甜；雨來得不準，我們就禱告。','我爺爺替殖民時期的莊園做工，一輩子沒喝過自己種的咖啡。現在我每天早上先喝一杯。'],
  tpl:[{v:'SL28・SL34',p:'水洗',cat:'fruit'}]},
 {id:'yem',name:'葉門',region:'哈拉茲',months:[10,11,12,1],cost:2400,td:3,lo:85,hi:91,pLo:28,pHi:70,alt:[1900,2400],bags:[1,5],note:'古老梯田，酒香與香料',lv:3,
  farms:['古城梯田小農','山巔合作社','石屋莊園','雲海小農'],people:['阿里','法蒂瑪','優素福','薩爾瑪'],
  bio:['這些梯田有五百年了。石牆倒了我們就再疊，像我父親和他的父親那樣。','山上缺水，每棵樹都是用陶罐一罐一罐澆大的。所以一顆豆子都不能浪費。','我們把櫻桃曬在屋頂上，夜裡收進屋。屋子裡一整季都是果乾的味道。','很多人改種卡特草，比較好賺。我留著咖啡樹，因為那是我母親的嫁妝。'],
  tpl:[{v:'葉門原生種',p:'日曬',cat:'fruit'}]},
 {id:'col',name:'哥倫比亞',region:'薇拉',months:[5,6,7,11,12],cost:2000,td:3,lo:82,hi:89,pLo:6,pHi:14,alt:[1600,2000],bags:[6,25],note:'一年兩收，風格多變',
  farms:['雲霧莊園','拉帕爾瑪莊園','聖荷西小農','三溪莊園'],people:['卡洛斯','瑪麗亞','胡安','路易莎'],
  bio:['我在這面坡上摔斷過兩次腿。可是你看這個日照，全薇拉找不到第二塊。','粉紅波旁是我從鄰居那裡要來的三棵苗。大家笑我種不活，現在他們來跟我買苗。','我十四歲開始幫人採收，四十歲才買下自己的三公頃地。','我在家裡車庫做厭氧發酵的實驗，炸過兩個桶子。我先生到現在還不讓我用廚房。'],

 ['序章　一本舊筆記',[['chen','陳師傅','坐。這本筆記你拿去。三十年，我跑過的每一座莊園、喝過的每一支豆子，都在裡面。'],['me','你','師傅，店裡的帳……'],['chen','陳師傅','我知道，撐不過明年。所以我跟銀行借了最後一筆，三萬美金，三十天。'],['chen','陳師傅','我的膝蓋爬不動山了，換你去。記住三件事：自己看、自己喝、自己驗。別人說的都只是故事。'],['me','你','如果我買錯了呢？'],['chen','陳師傅','那就記在筆記的最後一頁。我那一頁，寫得比誰都滿。']]],
 ['第一章　回頭的訂單',[['chen','陳師傅','周經理早上打電話來，沒找我，指名找你。'],['me','你','是上一季的豆子出了問題嗎？'],['chen','陳師傅','是沒出問題。做我們這一行，客人不打電話來罵，就是最大的稱讚。'],['chen','陳師傅','對了，我在巴西有個老朋友，喜拉朵那邊的。量大、便宜，配方豆去那裡找。地址我寫在筆記第四十頁。']]],
 ['第二章　葉門來信',[['chen','陳師傅','有一封信，寄了兩個月才到。哈拉茲山上的阿里寫的。'],['me','你','葉門？那裡現在還能買豆子？'],['chen','陳師傅','難買，所以才值得去。那是全世界最老的咖啡產地，梯田比我們的族譜還長。'],['chen','陳師傅','銀行那邊我也談過了。看了你這幾季的帳，他們願意多借五千。別亂花。']]],
 ['第三章　對手',[['lin','林曜','原來你就是陳師傅的徒弟。上個月巴拿馬那批競標，是我拿走的。'],['me','你','我記得你。你出的價，比那批豆子值的還多。'],['lin','林曜','貴不貴是客人決定的。你們這種小店慢慢喝、慢慢驗，我直接把整個產季包下來。'],['chen','陳師傅','別理他。會喊價的人很多，會說「這批我不要」的人很少。'],['chen','陳師傅','倒是有幾位講究的客人開始打聽你了。他們的門檻很高，出手也大方。']]],
 ['第四章　病樹',[['me','你','師傅，瑪麗亞的莊園染了葉鏽病，今年的產量剩不到一半。'],['chen','陳師傅','葉鏽病我看過三次。第一次在一九八幾年，整個山谷的葉子一個月內掉光。'],['me','你','她說要是撐不過今年，就把地賣了。'],['chen','陳師傅','那你打算怎麼辦？'],['me','你','我想先付她明年的訂金，讓她補種抗病的品種。就算明年的豆子沒那麼好。'],['chen','陳師傅','……你這個決定，筆記裡沒有教。很好。銀行那邊我再去說。']]],
 ['終章　鑰匙',[['chen','陳師傅','店的鑰匙，拿去。'],['me','你','師傅？'],['chen','陳師傅','別那個表情，我又不是要走。我只是不想再早起開門了。'],['chen','陳師傅','筆記的最後一頁，你自己寫的那些，我都看了。買錯的比我當年少，敢寫下來的比我當年多。'],['me','你','上個月有個年輕人來問，能不能跟著我去產地。'],['chen','陳師傅','那就帶他去。記得告訴他：自己看、自己喝、自己驗。']]]
];

/* ---------- 結算 ---------- */
function settle(){
  const lots=S.inv.map(l=>({f:l.f,bags:l.bags,price:l.price,arr:arrival(l.f),left:l.bags,sales:[],hit:false,spot:false}));
  const ods=[...S.orders].sort((a,b)=>b.pay-a.pay).map(o=>{let pay=o.pay,note='';if(o.rush){if(S.days>=o.rush){pay=r1(pay*1.12);note='趕上了，加價 12%'}else{pay=r1(pay*.95);note='沒趕上，減價 5%'}}return {...o,pay,note,got:0}});
  let rev=0;
  for(const od of ods){for(const l of lots.filter(l=>matches(od,l.f)&&l.arr>=od.min).sort((a,b)=>a.arr-b.arr)){
    const n=Math.min(l.left,od.bags-od.got);if(n<1)continue;l.left-=n;od.got+=n;const m=n*KG*od.pay;rev+=m;l.hit=true;l.sales.push(`${od.name} ${n} 袋，${$(m)}`)}}
  const spot=s=>s<80?2.5:s<82?4:s<84?5.5:s<86?7.5:s<88?10:s<90?14:22;
  for(const l of lots)if(l.left){const m=l.left*KG*spot(l.arr);rev+=m;l.spot=true;l.sales.push(`現貨市場 ${l.left} 袋，$${spot(l.arr)}/kg，${$(m)}`)}
  const profit=S.cash+rev-S.start, full=ods.filter(o=>o.got>=o.bags).length, m=save.meta, lv0=level();
  const title=!lots.length?'空手而回':profit<0?'繳了學費的一季':profit<4000?'小有收穫':profit<10000?'滿載而歸':profit<18000?'大豐收':'傳奇的一季';
  const r={lots,ods,rev,profit,full,title,open:0,fresh:-1};
  for(const f of allFarms()){if(f.auction)continue;const bought=S.inv.some(l=>l.f===f),d=f.closed?-2:bought?(f.dealt?1:2):f.hag?-1:0;if(d)m.rel[f.id]=clamp((m.rel[f.id]||0)+d,-2,5)}
  r.newDex=[];for(const l of lots){const k=`${l.f.o}|${l.f.v}|${l.f.p}`;if(!(k in m.dex))r.newDex.push(k);m.dex[k]=Math.max(m.dex[k]||0,Math.round(l.arr*10)/10)}
  r.newAch=ACH.filter(a=>!m.ach[a[0]]&&a[3](r));r.newAch.forEach(a=>m.ach[a[0]]=1);
  const ch=CH.find(x=>x[0]===S.ch);r.ch=ch[1];r.chOk=!!ch[2](r);
  r.parts=[['淨利',Math.max(0,Math.round(profit/100))],[`完成訂單 ×${full}`,25*full],['本季挑戰',r.chOk?40:0],[`新成就 ×${r.newAch.length}`,30*r.newAch.length],[`圖鑑新發現 ×${r.newDex.length}`,10*r.newDex.length]].filter(p=>p[1]>0);
  r.gain=r.parts.reduce((s,p)=>s+p[1],0);m.xp+=r.gain;r.lv0=lv0;r.lv1=level();
  save.seasons++;if(lots.length&&(save.best===null||profit>save.best))save.best=Math.round(profit);
  S.res=r;
}

const net={ready:(async()=>{try{if(window.claude){const d=await window.claude.use('db');if(d)dbc=d}}catch(e){}})(),
  async get(col,k){if(dbc){const s=await dbc.doc(col+'/'+k).get();return s.exists?JSON.parse(JSON.stringify(s.data())):null}
    const r=await fetch(`${FB}/${col}/${k}.json`);if(!r.ok)throw 0;return await r.json()},
  async set(col,k,d){if(dbc)return dbc.doc(col+'/'+k).set(d);
    const r=await fetch(`${FB}/${col}/${k}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});if(!r.ok)throw 0},
  async list(col){if(dbc){const q=await dbc.collection(col).limit(300).get();return q.docs.map(d=>JSON.parse(JSON.stringify(d.data())))}
    const r=await fetch(`${FB}/${col}.json`);if(!r.ok)throw 0;return Object.values(await r.json()||{})}};
const curP=()=>P.list.find(p=>p.k===P.cur)||null;
const saveP=()=>{try{localStorage.setItem(LSP,JSON.stringify(P))}catch(e){}};
const blank=()=>({best:null,seasons:0,game:null,at:0,meta:metaOf()});
const shape=d=>({best:typeof d.best==='number'?d.best:null,seasons:d.seasons||0,game:typeof d.game==='string'?d.game:null,at:d.at||0,meta:metaOf(d.meta)});
function readLocal(k){try{const d=JSON.parse(localStorage.getItem(lsKey(k))||'null');if(d&&typeof d==='object')return shape(d)}catch(e){}return null}
const writeLocal=()=>{if(P.cur)try{localStorage.setItem(lsKey(P.cur),JSON.stringify(save))}catch(e){}};
const pack=()=>S&&S.view!=='result'?JSON.stringify({view:S.view,month:S.month,cash:S.cash,start:S.start,days:S.days,loc:S.loc,orders:S.orders,trail:S.trail,event:S.event,evn:S.evn,calls:S.calls,dialog:S.dialog,ch:S.ch,
  origins:S.origins.map(o=>({id:o.id,season:o.season,list:o.list})),inv:S.inv.map(l=>({f:l.f.id,bags:l.bags,price:l.price}))}):null;
function unpack(j){const g=JSON.parse(j),origins=g.origins.map(x=>({...ORIGINS.find(o=>o.id===x.id),season:x.season,list:x.list.map(f=>({rel:0,asked:{},notes:[],...f}))})),all=origins.flatMap(o=>o.list);
  return {view:g.view==='brief'?'brief':g.loc&&g.view!=='world'?'origin':'world',month:g.month,cash:g.cash,start:g.start||START,days:g.days,loc:g.loc,farm:null,msg:'',say:null,offer:0,qty:1,sel:null,origins,
    trail:g.trail||[],event:g.event||'',evn:g.evn||0,calls:g.calls||0,dialog:g.dialog||null,ch:CH.some(c=>c[0]===g.ch)?g.ch:CH[0][0],fly:null,res:null,anim:null,
    orders:g.orders.map(o=>typeof o==='string'?{...ORDERS.find(x=>x.id===o)}:o),inv:g.inv.map(l=>({f:all.find(f=>f.id===l.f),bags:l.bags,price:l.price}))}}
const keyOf=()=>JSON.stringify([save.best,save.seasons,save.game,save.meta]);
function flush(force){const pl=curP();if(!pl)return;if(!force&&cloud.busy){cloud.dirty=true;return}if(!force)cloud.busy=true;
  const k=pl.k,body={n:pl.n,best:save.best,seasons:save.seasons,game:save.game,at:save.at,meta:JSON.parse(JSON.stringify(save.meta))},
    row={n:pl.n,ph:pl.ph||'',best:save.best,seasons:save.seasons,lv:level(),xp:save.meta.xp,at:save.at};
  net.ready.then(()=>Promise.all([net.set('saves',k,body),net.set('board',k,row)]))
   .then(()=>{if(P.cur===k&&cloud.state!=='ok'){cloud.state='ok';if(!S)render()}},()=>{if(P.cur===k)cloud.state='err'})
   .then(()=>{if(force)return;cloud.busy=false;if(cloud.dirty){cloud.dirty=false;flush()}})}
function persist(){if(!P.cur)return;if(S)save.game=pack();const k=keyOf();if(k===lastKey)return;lastKey=k;save.at=Date.now();
  writeLocal();clearTimeout(cloud.timer);cloud.timer=setTimeout(flush,900)}
function merge(d){const localNewer=save.at>(d.at||0),best=[save.best,d.best].filter(x=>typeof x==='number');
  save.best=best.length?Math.max(...best):null;save.seasons=Math.max(save.seasons,d.seasons||0);
  if(d.meta&&(+d.meta.xp||0)>=save.meta.xp&&!(S&&S.res))save.meta=metaOf(d.meta);
  if(!S&&!localNewer){save.game=typeof d.game==='string'?d.game:null;save.at=d.at||0}
  return localNewer||!!S}
async function pull(k){cloud.state='wait';
  try{await net.ready;const d=await net.get('saves',k);if(P.cur!==k)return;
    if(d){const push=merge(d),key=keyOf();if(key!==lastKey||push){lastKey=key;writeLocal();if(push)flush()}}else if(save.at)flush();
    cloud.state='ok'}catch(e){if(P.cur===k)cloud.state='off'}
  if(P.cur===k&&(!S||S.view==='world'))render()}
function usePlayer(k){clearTimeout(cloud.timer);if(P.cur&&P.cur!==k&&save.at)flush(true);
  P.cur=k;saveP();S=null;save=readLocal(k)||blank();lastKey=keyOf();return pull(k)}
async function login(name,pin){name=String(name||'').replace(/\s+/g,' ').trim().slice(0,12);pin=String(pin||'').trim();
  if(!name){PV.msg='請輸入名字。';return}
  if(pin&&!/^\d{4}$/.test(pin)){PV.msg='密碼要剛好 4 個數字，或是留空不設密碼。';return}
  const k=nameKey(name),ph=pinHash(k,pin);
  if(P.list.some(p=>p.k===k)){if(k!==P.cur)usePlayer(k);PV.on=false;PV.msg='';return}
  let row=null,online=true;try{await net.ready;row=await net.get('board',k)}catch(e){online=false}
  if(row&&row.ph&&row.ph!==ph){PV.msg=pin?'密碼不對，請再試一次。':'這個名字已經有人使用，而且設了密碼。請輸入密碼，或換一個名字。';return}
  if(row)P.list.push({k,n:row.n||name,ph:row.ph||ph});
  else{if(!P.list.length){try{const old=localStorage.getItem(LS);if(old){localStorage.setItem(lsKey(k),old);localStorage.removeItem(LS)}}catch(e){}}
    P.list.push({k,n:name,ph})}
  const pl=usePlayer(k);if(row)await pl;if(!row||(!row.ph&&ph)){save.at=save.at||Date.now();flush()}
  PV.on=false;PV.msg='';if(!online)cloud.state='off'}
function vPlayers(){const lvOf=xp=>LV.filter(x=>x<=xp).length, nw=PV.mode==='new';
  const mine=P.list.map(p=>{const s=p.k===P.cur?save:readLocal(p.k)||blank(),lv=lvOf(s.meta.xp);let g=null;try{g=s.game&&JSON.parse(s.game)}catch(e){}

    return `<div class="prow"><button class="pbtn ${p.k===P.cur?'you':''}" data-a="${nw?'newas':'pick'}" data-k="${p.k}"><span class="row between" style="width:100%"><b>${esc(p.n)}</b>${act}</span><span class="small muted">Lv ${lv} ${LVN[lv-1]}・完成 ${s.seasons} 季${s.best!==null?'・最佳 '+$(s.best):''}${p.ph?'・有密碼':''}</span><span class="small num">${sum}</span></button>${p.k===P.cur?'':`<button class="sm ghost" data-a="forget" data-k="${p.k}" aria-label="從這台裝置移除${esc(p.n)}">移除</button>`}</div>`}).join('');
  const rows=(PV.board||[]).filter(r=>r&&typeof r.n==='string').sort((a,b)=>(b.best??-1e9)-(a.best??-1e9)||(b.xp||0)-(a.xp||0)).slice(0,30);
  const board=PV.board===null?'<p class="small muted">讀取排行榜中…</p>':rows.length?`<table><tr><th>#</th><th>玩家</th><th class="r">最佳淨利</th><th class="r">季數</th></tr>${rows.map((r,i)=>{const lv=clamp(+r.lv||1,1,6),me=nameKey(r.n)===P.cur;

    :`<p class="small muted">${PV.berr?'連不上線上排行榜。':'還沒有人上榜。'}</p>`;
  return `<div class="stack" style="padding-top:20px"><div class="row between"><h2>${nw?'新遊戲':'繼續遊戲'}</h2><button class="sm ghost" data-a="pclose">返回</button></div>

  <table><tr><td>葉鏽病、天牛</td><td>袋數變少、開價變高</td></tr><tr><td>咖啡果小蠹</td><td>蟲孔豆多，驗豆會抓到</td></tr><tr><td>漿果病、椿象</td><td>批次不穩定，杯測可能喝到瑕疵杯</td></tr><tr><td>褐眼病</td><td>分數偏低、帶澀感</td></tr></table>
  <p class="small muted">每輪杯測是五杯。其中一杯變紅，就是瑕疵杯；這種批次到港會再扣 1.5 分。遇過的病蟲害會記在生涯頁的筆記裡。</p>`]);
TUT.push(['事件、競標與生涯',()=>`<ul class="notes"><li><b>產地快報</b>：抵達產地時可能碰上暴雨、罷工、豐收、霜害，或是有買家搶先一步。</li><li><b>客戶來電</b>：客戶可能臨時加量或要求趕件，你可以答應或婉拒。</li><li><b>競標批次</b>：每季有一兩支明星豆，要和對手喊價。出價超過對手的上限就得標；覺得太貴就退出。</li><li><b>莊園交情</b>：向同一座莊園買豆會累積愛心，下一季底價更低、耐心更多，三格以上還會替你留好批次。把人惹毛則會被記住。</li><li><b>生涯</b>：每季的淨利、完成的訂單、挑戰和成就都會換成經驗。升級可以解鎖巴西、葉門、更多資金、高價訂單和新的故事章節。</li></ul>`]);

function narrow(c,key,t,w){let lo=t-Math.random()*w,hi=lo+w;if(key==='score'){c.lo=Math.max(c.lo,lo);c.hi=Math.min(c.hi,hi)}
  else{const p=c.attrs[key]||[-99,99];c.attrs[key]=[Math.max(p[0],lo),Math.min(p[1],hi)]}}
function doCup(f,key){const c=f.cup[key]||(f.cup[key]={n:0,lo:-99,hi:199,attrs:{},odd:0,oddAt:-1}),b=key==='sample'?f.boost:0;
  narrow(c,'score',f.score+b,[6,3,1.2][c.n]);ATTR.forEach(k=>narrow(c,k,f.attrs[k]+b/6,[1.6,.8,.3][c.n]));
  c.oddAt=f.unstable&&Math.random()<.5?RI(0,4):-1;if(c.oddAt>=0)c.odd=(c.odd||0)+1;c.n++;return c}
function meet(k){if(!save.meta.pest[k])save.meta.pest[k]=1}
function arrive(o){S.event='';S.dialog=null;const fs=o.list.filter(f=>!f.auction),sc=m=>fs.forEach(f=>{f.ask=r1(f.ask*m);f.price=r1(f.price*m);f.floor*=m});
  if(Math.random()<.5){S.evn++;let k=pick(['rain','strike','fxg','fxb','rival','harvest','short','tip','intro','rust']);
    const free=fs.filter(f=>f.bags>0&&!S.inv.some(l=>l.f===f));if(k==='rival'&&!free.length)k='intro';
    if(k==='rain'){fs.forEach(f=>{f.moisture=r1(f.moisture+.7);if(f.inspected){f.inspected=false;f.notes.push('暴雨過後，之前的驗豆結果不準了，需要重驗。')}});S.event='抵達時正逢連日暴雨。這裡所有生豆的含水率都上升了，買之前最好驗一下。'}
    if(k==='strike'){S.days-=1;S.event='機場地勤罷工，你在轉機的城市多困了 1 天。'}
    if(k==='fxg'){S.cash+=400;S.event='當地貨幣貶值，這趟差旅省下了 $400。'}
    if(k==='fxb'){S.cash=Math.max(0,S.cash-400);S.event='美元走弱，換匯和差旅多花了 $400。'}
    if(k==='rival'){const f=pick(free);f.bags=0;f.notes.push('整批豆子已經被林曜包走。');S.event=`林曜早你一步，把${f.name}的豆子全包了。`}
    if(k==='harvest'){sc(.92);S.event='今年大豐收，全產地的開價下修了 8%。'}
    if(k==='short'){sc(1.1);S.event='高地霜害造成減產，全產地的開價上漲了 10%。'}
    if(k==='tip'){const f=[...fs].sort((a,b)=>b.score-a.score)[0];doCup(f,'sample');f.notes.push('出口商的杯測室裡，你免費試了一輪這支樣品。');S.event=`同行透露，${f.name}今年的批次很受矚目。你在出口商那裡免費試了一輪樣品。`}
    if(k==='intro'){fs.forEach(f=>f.mood++);S.event='出口商親自替你引薦，這裡的莊園主對你多了一分耐心。'}
    if(k==='rust'){fs.forEach(f=>{f.bags=Math.max(f.bags?1:0,Math.round(f.bags*.75))});sc(1.06);meet('rust');S.event='葉鏽病疫情在這個產區擴散。各莊園可售的袋數減少，開價上漲 6%。'}
  }else if(S.calls<2&&Math.random()<.5){S.calls++;const od=pick(S.orders);
    if(od.id==='chain'&&!od.rush)S.dialog={k:'rush',oid:od.id,who:`${od.who}・${od.name}`,text:'總公司要提前上架。你要是能在剩 8 天以上回國，整張單我加 12%；答應了卻趕不上，就要扣 5%。',yes:'答應趕件',no:'照原訂時間'};
    else if(od.id!=='chain'){const n=Math.max(1,Math.ceil(od.bags*.3));S.dialog={k:'more',oid:od.id,n,who:`${od.who}・${od.name}`,text:`是我。這一季的需求比預期多，你要是能多帶 ${n} 袋，整張單每公斤我加 8%。但要全部到齊才算完成。`,yes:`答應，多帶 ${n} 袋`,no:'維持原本的量'}}
  }}

 farm(d){S.farm=d.id;S.view='farm';S.msg='';S.say=null;const f=curF();S.offer=r1(f.price*.9);S.qty=Math.min(5,f.bags);window.scrollTo(0,0)},
 ask(d){const f=curF(),p=persOf(f.id),honest=p!=='精明';let t='';f.asked[d.q]=1;
  if(d.q==='harvest'){if(f.issue&&honest){t=ISSUE[f.issue].talk;f.seen=true;meet(f.issue);f.notes.push(`${f.who}承認今年有${ISSUE[f.issue].name}。`)}
   else if(f.issue)t=LINE.lie[p];else if(f.moisture>12&&honest)t='收成不錯，就是最後幾天一直下雨，豆子曬得有點趕。';else t=LINE.good[p]}
  if(d.q==='story'){t=ORIGINS.find(o=>o.id===f.o).bio[+f.id.slice(3)]||'……';f.mood=Math.min(5,f.mood+1)}
  if(d.q==='gossip'){const os=curO().list.filter(x=>x!==f&&!x.auction).sort((a,b)=>arrival(b)-arrival(a));
   if(!honest||!os.length)t='這一帶最好的當然是我們家，還用問嗎？';else{const b=os[0],w=os[os.length-1];t=`要我說，${b.name}今年的豆子真的不錯。`+(os.length>1&&arrival(w)<arrival(b)-2?`${w.name}嘛……你自己去看看就知道。`:'');f.notes.push(`${f.who}說${b.name}今年的豆子最好。`)}}
  S.say=[`${f.who}・${p}`,t]},
 visit(){const f=curF();f.visited=true;S.days-=1;f.mood=Math.min(5,f.mood+1);f.floor*=.96;S.say=null;
  f.notes.push(f.q>.6?'只摘全紅果，棚架上鋪得很薄，工人每小時翻動一次。':f.q>.3?'採收還算仔細，曬場乾淨，偶爾看到幾顆未熟果。':'紅果綠果混著採，曬場堆得很厚，角落有悶住的發酵味。');
  if(f.boost)f.notes.push('倉庫麻袋裡的豆子，顏色和桌上的樣品不太一樣，對方急著帶你離開。');
  if(f.past)f.notes.push('倉庫深處有幾疊麻袋積了灰，像是上一季留下的。');
  if(f.moisture>12)f.notes.push('這幾天午後都下雨，曬場上的豆子摸起來偏軟。');
  if(f.issue){f.seen=true;meet(f.issue);f.notes.push(ISSUE[f.issue].see)}
  S.msg=`你跟著${f.who}走了一圈莊園，交情變好了。現在可以從倉庫抽大貨杯測。`+(f.issue?`你注意到園子裡有${ISSUE[f.issue].name}。`:'')},
 cup(){const f=curF(),key=f.visited?'bulk':'sample',c=doCup(f,key),b=key==='sample'?f.boost:0;S.days-=.5;S.anim=key;
  S.msg=`第 ${c.n} 輪杯測：估分 ${fl(c.lo)}–${cl(c.hi)}。喝到${f.flav.slice(0,c.n>1?3:2).join('、')}${f.attrs['乾淨度']+b/6<7.4?'，尾段有點雜味':''}。`+(c.oddAt>=0?`第 ${c.oddAt+1} 杯的味道明顯不對，是瑕疵杯。`:'')},
 inspect(){const f=curF();f.inspected=true;S.days-=.5;const pen=penBase(f).reduce((s,x)=>s+x[0],0);
  f.notes.push(`含水率 ${f.moisture}%（理想 10–12%）・瑕疵豆 ${f.defects} 顆／350 g・${f.past?'過季老豆，顏色偏白':'當季新豆，顏色青綠'}`);
  if(f.issue==='cbb'){f.seen=true;meet('cbb');f.notes.push('不少豆子上有細小的蛀孔，是咖啡果小蠹留下的。')}
  S.msg=pen?`驗豆結果有疑慮，預估到港會掉 ${pen} 分。`:'驗豆結果良好，這批豆子耐得住海運。'},
 off(d){const f=curF();S.offer=Math.max(.5,Math.min(f.price,r1(S.offer*(1+ +d.d))))},
 bid(){const f=curF(),p=persOf(f.id),who=`${f.who}・${p}`;S.msg='';
  if(S.offer>=f.floor){f.price=S.offer;f.dealt=true;S.say=[who,LINE.ok[p]+`（成交價 $${f.price}/kg）`];return}

  a.cur=Math.min(a.max,r1(b*R(1.03,1.1)));S.say=['拍賣官',`這位出 $${b}。還有沒有更高的？`];S.msg=`${a.rival}立刻加到 $${a.cur}。`},
