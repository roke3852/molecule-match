<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>咖啡人物誌</title>
<style>
:root{
  --bg:#f6f1ea; --card:#fffdf9; --ink:#2b2018; --sub:#7a6a5c; --line:#e7ddd1;
  --brand:#7a4a2a; --brand2:#b9773f; --gold:#c9962c; --chip:#efe5d8; --green:#4f7a4a;
}
*{box-sizing:border-box}
html,body{margin:0;touch-action:manipulation;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:var(--brand)}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:84px}
header{position:sticky;top:0;z-index:5;background:rgba(246,241,234,.94);backdrop-filter:blur(8px);padding:14px 16px 10px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:20px;letter-spacing:.5px}
header p{margin:2px 0 0;color:var(--sub);font-size:12.5px}
main{padding:14px 16px}
h2{font-size:16px;margin:20px 0 10px}
.crop{position:fixed;inset:0;background:rgba(20,14,8,.82);z-index:30;display:none;align-items:center;justify-content:center;padding:16px}
.crop.on{display:flex}
.crop-in{background:var(--bg);border-radius:20px;padding:16px;width:100%;max-width:340px;text-align:center}
.crop-t{font-weight:800;margin-bottom:10px}
#cropC{width:280px;height:280px;border-radius:14px;touch-action:none;background:#222;max-width:100%}
.crop-h{font-size:12px;color:var(--sub);margin:8px 0}
#cropZ{width:100%}
.prow{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.prow .meta{flex:1;min-width:0}
.pbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pbtns .btn{padding:6px 10px;font-size:12.5px;border-radius:10px}
.pdone{font-size:11px;color:var(--green);font-weight:700}
.cloud{font-size:11.5px;padding:1px 7px;border-radius:8px;background:var(--chip);color:var(--sub);white-space:nowrap}
.cloud.ok{background:#e2ecdf;color:var(--green)}
.cloud.bad{background:#f3ddd6;color:#a0442f}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:15px;margin-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.sig-foot{text-align:center;color:var(--sub);font-size:12px;padding:8px 16px 24px}
.sig-foot .sig{font-family:"Noto Serif TC",serif;font-style:italic;font-size:15px;color:var(--brand);letter-spacing:.12em;margin-bottom:2px}
.chip{flex:none;padding:6px 12px;border-radius:999px;background:var(--chip);font-size:13px;white-space:nowrap}
.chip.on{background:var(--brand);color:#fff}
.list{display:flex;flex-direction:column;gap:10px}
.card{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;width:100%}
.card:active{transform:scale(.99)}
.av{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px}
.av2{flex:none;position:relative;border-radius:50%;overflow:hidden;display:grid;place-items:center;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.av2bg{position:absolute;inset:0;width:100%;height:100%}
.av2i{position:relative;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.av2n{position:absolute;right:4%;bottom:4%;background:#fffdf9;color:#2b2018;font-weight:800;font-size:11px;min-width:20px;height:20px;padding:0 4px;border-radius:10px;display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sq{flex:none;width:52px;height:52px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:22px}
.meta{min-width:0;flex:1}
.name{font-weight:700;font-size:15.5px}
.sub{color:var(--sub);font-size:12.5px;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--chip);color:var(--brand)}
.tag.gold{background:#f6e9c8;color:#8a6410}
.tag.inf{background:#e2ecdf;color:var(--green)}
.star{flex:none;font-size:18px;opacity:.35}
.star.on{opacity:1}
.hero{background:linear-gradient(135deg,#7a4a2a,#b9773f);color:#fff;border-radius:18px;padding:16px;margin-bottom:12px}
.hero small{opacity:.8;font-size:12px}
.hero .t{font-size:19px;font-weight:700;margin:4px 0}
.hero .d{font-size:13.5px;line-height:1.55;opacity:.95}
.hero button{margin-top:10px;background:rgba(255,255,255,.18);color:#fff;padding:7px 12px;border-radius:10px;font-size:13px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.quick button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;font-size:13px}
.quick b{display:block;font-size:20px;margin-bottom:2px}
.cityhead{display:flex;align-items:baseline;justify-content:space-between;margin:18px 0 8px}
.cityhead h3{margin:0;font-size:15px}
.cityhead span{color:var(--sub);font-size:12px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;max-width:560px;width:100%}
nav button{flex:1;padding:9px 0 10px;font-size:11.5px;color:var(--sub)}
nav button b{display:block;font-size:20px;line-height:1.2}
nav button.on{color:var(--brand);font-weight:700}
.sheet-bg{position:fixed;inset:0;background:rgba(30,20,10,.45);z-index:10;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;z-index:11;display:none;transform:translateY(100%);transition:transform .25s ease;max-width:560px;margin:0 auto;padding:0 18px 30px}
.sheet.open{transform:none}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:#d6c8b8;margin:10px auto 6px}
.sheet .close{position:sticky;top:0;float:right;margin-top:-4px;font-size:22px;padding:4px 8px;color:var(--sub)}
.dhead{display:flex;gap:14px;align-items:center;margin:8px 0 12px}
.dhead .av,.dhead .sq{width:64px;height:64px;font-size:21px}
.dname{font-size:20px;font-weight:800}
.dsub{color:var(--sub);font-size:13px;margin-top:3px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.sec h4{margin:0 0 6px;font-size:13px;color:var(--brand)}
.sec p{margin:0;font-size:14px;line-height:1.65}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;gap:10px;font-size:14px;padding:5px 0;border-bottom:1px dashed var(--line)}
.tl li:last-child{border:0}
.tl .y{flex:none;width:62px;white-space:nowrap;font-weight:700;color:var(--gold)}
.linkrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:12px;background:var(--brand);color:#fff;text-decoration:none;font-size:14px}
.btn.ghost{background:var(--chip);color:var(--brand)}
.mini{display:flex;flex-direction:column;gap:8px}
.mini .card{padding:9px}
.mini .av,.mini .sq{width:40px;height:40px;font-size:15px}
.empty{color:var(--sub);text-align:center;padding:30px 10px;font-size:14px;line-height:1.7}
.note{color:var(--sub);font-size:11.5px;margin-top:22px;line-height:1.6}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;padding:7px 0;border-radius:9px;font-size:14px}
.seg button.on{background:var(--card);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
</style>
</head>
<body>
<div class="app">
  <header><h1>☕ 咖啡人物誌</h1><p id="hsub">各國咖啡師 × 台日名店圖鑑　<span id="cloud" class="cloud">☁️ 連線中…</span></p></header>
  <main id="view"></main>
  <footer class="sig-foot"><div class="sig">— Jim Lu —</div><div>製作｜咖啡人物誌</div></footer>
</div>
<nav><div class="in">
  <button data-tab="home" class="on"><b>🏠</b>首頁</button>
  <button data-tab="people"><b>👤</b>咖啡師</button>
  <button data-tab="shops"><b>📍</b>名店</button>
  <button data-tab="photos"><b>🖼️</b>照片</button>
  <button data-tab="saved"><b>⭐</b>收藏</button>
</div></nav>
<input type="file" id="pf" accept="image/*" style="display:none">
<div class="crop" id="crop"><div class="crop-in">
  <div class="crop-t" id="cropT">調整照片</div>
  <canvas id="cropC" width="560" height="560"></canvas>
  <div class="crop-h">拖曳移動・滑桿縮放，圓圈內就是頭像</div>
  <input type="range" id="cropZ" min="1" max="4" step="0.01" value="1">
  <div class="linkrow" style="justify-content:center"><button class="btn ghost" id="cropX">取消</button><button class="btn" id="cropOK">使用這張</button></div>
</div></div>
<div class="sheet-bg" id="bg"></div>
<div class="sheet" id="sheet"></div>

/* ========== 照片挑選 ========== */
let pickFor=null, cImg=null, cS=1, cX=0, cY=0, cBase=1, cDrag=null;
const cropEl=document.getElementById("crop"), cC=document.getElementById("cropC"), cZ=document.getElementById("cropZ"), cx2=cC.getContext("2d");
function cClamp(){const w=cImg.width*cBase*cS,hh=cImg.height*cBase*cS;cX=Math.min(0,Math.max(560-w,cX));cY=Math.min(0,Math.max(560-hh,cY))}
function cDraw(){cClamp();cx2.fillStyle="#222";cx2.fillRect(0,0,560,560);cx2.drawImage(cImg,cX,cY,cImg.width*cBase*cS,cImg.height*cBase*cS);
  cx2.save();cx2.fillStyle="rgba(0,0,0,.45)";cx2.beginPath();cx2.rect(0,0,560,560);cx2.arc(280,280,278,0,Math.PI*2,true);cx2.fill("evenodd");cx2.restore();
  cx2.strokeStyle="rgba(255,255,255,.9)";cx2.lineWidth=3;cx2.beginPath();cx2.arc(280,280,278,0,Math.PI*2);cx2.stroke()}
document.getElementById("pf").onchange=e=>{
  const f=e.target.files&&e.target.files[0];if(!f||!pickFor)return;
  const url=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{cImg=im;cBase=560/Math.min(im.width,im.height);cS=1;cZ.value=1;cX=(560-im.width*cBase)/2;cY=Math.min(0,(560-im.height*cBase)/3);
    document.getElementById("cropT").textContent="調整照片："+P[pickFor].name;cropEl.classList.add("on");cDraw()};
  im.onerror=()=>{URL.revokeObjectURL(url);cropMsg("這個檔案讀不出來，請換一張 JPG 或 PNG")};
  im.src=url;
};
function cropMsg(m){const el=document.getElementById("hsub");const old=el.innerHTML;el.textContent="⚠️ "+m;setTimeout(()=>{el.innerHTML=old;setCloud(cloudState)},3500)}
cZ.oninput=()=>{const ns=+cZ.value,k=ns/cS;cX=280-(280-cX)*k;cY=280-(280-cY)*k;cS=ns;cDraw()};
cC.onpointerdown=e=>{cC.setPointerCapture(e.pointerId);cDrag={x:e.clientX,y:e.clientY,ox:cX,oy:cY}};
cC.onpointermove=e=>{if(!cDrag)return;const r=560/cC.getBoundingClientRect().width;cX=cDrag.ox+(e.clientX-cDrag.x)*r;cY=cDrag.oy+(e.clientY-cDrag.y)*r;cDraw()};
cC.onpointerup=cC.onpointercancel=()=>{cDrag=null};
document.getElementById("cropX").onclick=()=>{cropEl.classList.remove("on");cImg=null};
document.getElementById("cropOK").onclick=()=>{
  if(!cImg||!pickFor)return;
  const o=document.createElement("canvas");o.width=o.height=240;const k=240/560;
  o.getContext("2d").drawImage(cImg,cX*k,cY*k,cImg.width*cBase*cS*k,cImg.height*cBase*cS*k);
  const data=o.toDataURL("image/jpeg",0.82),id=pickFor;
  photos[id]=data;savePhotosLocal();cropEl.classList.remove("on");cImg=null;render();
  if(cloudCol){setCloud("saving");cloudCol.doc("photo-"+id).set({img:data,updatedAt:new Date().toISOString()}).then(()=>setCloud("ok")).catch(()=>setCloud("bad"))}
};
function savePhotosLocal(){try{localStorage.setItem("bg_photos",JSON.stringify(photos))}catch(e){}}
function removePhoto(id){delete photos[id];savePhotosLocal();render();
  if(cloudCol){cloudCol.doc("photo-"+id).delete().then(()=>setCloud("ok")).catch(()=>setCloud("bad"))}}
async function cloudPhotos(){
  const q=await cloudCol.get(), remote={};
  q.docs.forEach(d=>{if(d.id.startsWith("photo-")){const v=d.data();if(v&&typeof v.img==="string"&&v.img.startsWith("data:image/"))remote[d.id.slice(6)]=v.img}});
  if(!store.get("bg_psynced",false)){ // 第一次同步：本機有、雲端沒有的照片補上傳
    for(const id of Object.keys(photos)) if(!remote[id]){await cloudCol.doc("photo-"+id).set({img:photos[id],updatedAt:new Date().toISOString()});remote[id]=photos[id]}
    store.set("bg_psynced",true);
  }
  photos=remote;savePhotosLocal();
}

/* ========== 雲端存檔 ========== */
let cloudCol=null;
let cloudState="wait", cloudDoc=null, saving=false, dirty=false;
function setCloud(s){cloudState=s;const el=document.getElementById("cloud");if(el){el.className="cloud "+(s==="ok"?"ok":(s==="wait"||s==="local")?"":"bad");el.textContent=s==="ok"?"☁️ 已同步":s==="saving"?"☁️ 儲存中…":s==="wait"?"☁️ 連線中…":s==="local"?"📱 存在本機":"⚠️ 僅存本機";if(s==="saving")el.className="cloud"}if((tab==="saved"||tab==="photos")&&s!=="saving")render()}
const clean=a=>Array.isArray(a)?[...new Set(a.filter(x=>typeof x==="string"))]:[];
async function cloudSave(){
  if(!cloudDoc)return;
  if(saving){dirty=true;return}
  saving=true;setCloud("saving");
  try{
    do{dirty=false;await cloudDoc.set({fav,visited,updatedAt:new Date().toISOString()})}while(dirty);
    setCloud("ok");
  }catch(e){
    try{await new Promise(r=>setTimeout(r,800+Math.random()*800));await cloudDoc.set({fav,visited,updatedAt:new Date().toISOString()});setCloud("ok")}
    catch(e2){setCloud("bad")}
  }
  saving=false;
}
async function cloudLoad(){
  const snap=await cloudDoc.get();
  if(snap.exists){
    const d=snap.data()||{};let f=clean(d.fav),v=clean(d.visited);
    if(!store.get("bg_synced",false)){ // 這台裝置第一次同步：把本機原有的紀錄併進雲端
      const f2=[...new Set([...f,...fav])],v2=[...new Set([...v,...visited])];
      const changed=f2.length!==f.length||v2.length!==v.length;f=f2;v=v2;
      fav=f;visited=v;if(changed)await cloudDoc.set({fav,visited,updatedAt:new Date().toISOString()});
    }else{fav=f;visited=v}
  }else{
    await cloudDoc.set({fav,visited,updatedAt:new Date().toISOString()});
  }
  store.set("bg_fav",fav);store.set("bg_visit",visited);store.set("bg_synced",true);
}
async function cloudInit(){
  if(!window.claude||!window.claude.use){setCloud("local");return}
  const timer=setTimeout(()=>{if(cloudState==="wait")setCloud("bad")},10000);
  try{
    if(!window.claude||!window.claude.use)throw 0;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user)throw 0;
    const id=await user.id();if(!id)throw 0;
    cloudDoc=db.doc("data/users/"+id+"/save");
    cloudCol=db.collection("data/users/"+id);
    await cloudLoad();
    try{await cloudPhotos()}catch(e){}
    clearTimeout(timer);setCloud("ok");render();if(openKey)openSheet(openKey);
  }catch(e){clearTimeout(timer);cloudDoc=null;cloudCol=null;setCloud("bad")}
}
document.addEventListener("visibilitychange",async()=>{
  if(document.visibilityState!=="visible"||!cloudDoc||saving)return;
  try{await cloudLoad();setCloud("ok");render()}catch(e){}
});
render();
cloudInit();
</script>
