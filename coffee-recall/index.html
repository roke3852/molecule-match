<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>咖啡記憶卡</title>
<style>
:root{--bg:#f6f1ea;--card:#fffdf9;--ink:#2b2119;--mute:#7a6a5c;--line:#e6dccf;--acc:#8a4b2a;--acc2:#c8793f;--ok:#3f7d4e;--okbg:#e6f1e7;--bad:#b0402f;--badbg:#f8e3df;--chip:#efe6da}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;touch-action:manipulation}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
h1{font-size:22px;margin:0;letter-spacing:.5px}
h1 small{display:block;font-size:12px;color:var(--mute);font-weight:400;letter-spacing:0;margin-top:2px}
.icon{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 10px;font-size:13px}
.hero{background:linear-gradient(135deg,#5a2f1b,#8a4b2a 60%,#c8793f);color:#fff7ee;border-radius:18px;padding:18px;margin-bottom:16px}
.hero .n{font-size:40px;font-weight:700;line-height:1}
.hero .row{display:flex;gap:18px;align-items:flex-end;margin:6px 0 14px}
.hero .lab{font-size:12px;opacity:.85}
.hero .go{width:100%;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:700;background:#fff7ee;color:#5a2f1b}
.hero .go:disabled{opacity:.55}
.hero .sub{font-size:12px;opacity:.85;margin-top:8px;text-align:center}
h2{font-size:15px;margin:20px 0 8px;color:var(--mute);font-weight:600}
.deck{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.deck .em{font-size:22px;width:30px;text-align:center}
.deck .info{flex:1;min-width:0}
.deck .t{font-weight:600;font-size:15px}
.deck .s{font-size:12px;color:var(--mute);margin-top:2px}
.bar{height:6px;background:var(--chip);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc2);border-radius:3px}
.sw{width:46px;height:28px;border-radius:14px;background:#d9cdbf;border:0;position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px #0003}
.sw[aria-pressed=true]{background:var(--acc)}
.sw[aria-pressed=true]::after{left:21px}
.set{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;font-size:14px}
.step{display:flex;align-items:center;gap:10px}
.step button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--chip)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top .x{border:0;background:none;font-size:22px;padding:4px 8px;color:var(--mute)}
.prog{flex:1;height:8px;background:var(--chip);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc2);transition:width .3s}
.cnt{font-size:13px;color:var(--mute);min-width:44px;text-align:right}
.q{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}
.tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:999px;background:var(--chip);color:var(--acc);font-weight:600;margin-bottom:10px}
.tag.new{background:#fde9c8;color:#8a5a0a}
.ask{font-size:13px;color:var(--mute);margin-bottom:6px}
.ask.solo{font-size:18px;color:var(--ink);font-weight:600;line-height:1.5;margin:0}
.prompt{font-size:17px;line-height:1.6}
.prompt .flv{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.prompt .flv span{background:#f3e7d8;border-radius:8px;padding:4px 9px;font-size:15px}
.prompt dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14px}
.prompt dt{color:var(--mute)}.prompt dd{margin:0}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font-size:15px;line-height:1.45}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{opacity:1}
.fb{margin-top:12px;border-radius:14px;padding:14px;font-size:14px;line-height:1.6}
.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.fb b{display:block;font-size:15px;margin-bottom:4px}
.next{width:100%;margin-top:12px;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;background:var(--acc);color:#fff}
.done{text-align:center;padding:30px 10px}
.done .big{font-size:56px}
.done .sc{font-size:28px;font-weight:700;margin:8px 0}
.done p{color:var(--mute);font-size:14px}
.miss{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:16px;font-size:14px}
.miss li{margin:4px 0}
.sheet{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;justify-content:center;z-index:9}
.sheet.on{display:flex}
.sheet .in{background:var(--bg);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px 28px}
.sheet textarea{width:100%;height:90px;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12px;font-family:monospace}
.sheet .btns{display:flex;gap:8px;margin-top:10px}
.sheet .btns button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px}
.sheet .btns .pri{background:var(--acc);color:#fff;border:0}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#2b2119;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:10}
#toast.on{opacity:1}
.sig{text-align:center;color:var(--mute);font-size:12px;margin-top:28px;letter-spacing:1px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="sheet" id="sheet"><div class="in">
 <h3 style="margin:0 0 6px">備份進度</h3>
 <p style="font-size:13px;color:var(--mute);margin:0 0 10px">進度只存在這台裝置。複製備份碼存起來，換手機時貼回來就能接著背。</p>
 <textarea id="code"></textarea>
 <div class="btns"><button id="cp">複製備份碼</button><button id="im" class="pri">貼上後匯入</button></div>
 <div class="btns"><button id="close">關閉</button></div>
</div></div>
<div id="toast"></div>
<script>
const D={"origins":[{"zh":"衣索比亞","en":"Ethiopia","c":"非洲","alt":"1,700–2,300 m","vars":"原生種（Heirloom／74110、74112 等）","proc":"水洗、日曬","fl":["茉莉花","柑橘","莓果","紅茶感"]},{"zh":"肯亞","en":"Kenya","c":"非洲","alt":"1,500–2,100 m","vars":"SL28、SL34、Ruiru 11、Batian","proc":"肯亞式水洗（雙重發酵）","fl":["黑醋栗","番茄","烏梅","明亮酸質"]},{"zh":"盧安達","en":"Rwanda","c":"非洲","alt":"1,500–2,000 m","vars":"紅波旁","proc":"水洗為主","fl":["紅茶","紅蘋果","柑橘","焦糖"]},{"zh":"巴拿馬","en":"Panama","c":"中南美","alt":"1,400–2,000 m","vars":"藝伎、卡杜艾、鐵比卡","proc":"水洗、日曬、厭氧","fl":["茉莉","佛手柑","水蜜桃","蜂蜜"]},{"zh":"哥倫比亞","en":"Colombia","c":"中南美","alt":"1,200–2,200 m","vars":"卡杜拉、卡斯提優、粉紅波旁、藝伎","proc":"水洗；近年厭氧與特殊發酵興盛","fl":["焦糖","紅蘋果","柑橘","均衡"]},{"zh":"瓜地馬拉","en":"Guatemala","c":"中南美","alt":"1,300–2,000 m","vars":"波旁、卡杜拉、帕卡瑪拉、藝伎","proc":"水洗為主","fl":["可可","堅果","柑橘","煙燻感"]},{"zh":"哥斯大黎加","en":"Costa Rica","c":"中南美","alt":"1,200–1,900 m","vars":"卡杜拉、卡杜艾、薇拉沙奇、藝伎","proc":"蜜處理、水洗、日曬","fl":["蜂蜜","杏桃","柑橘","乾淨甜感"]},{"zh":"巴西","en":"Brazil","c":"中南美","alt":"800–1,300 m","vars":"黃波旁、新世界、卡杜艾","proc":"日曬、去皮日曬","fl":["堅果","巧克力","低酸","厚實"]},{"zh":"印尼","en":"Indonesia","c":"亞太","alt":"1,100–1,600 m","vars":"鐵比卡、Ateng、Tim Tim","proc":"濕剝法（Giling Basah）","fl":["草本","杉木","香料","厚重低酸"]},{"zh":"葉門","en":"Yemen","c":"亞太","alt":"1,500–2,500 m","vars":"古老地方品種（Udaini、Dawairi、Jaadi）","proc":"傳統日曬","fl":["酒香","果乾","香料","巧克力"]},{"zh":"台灣","en":"Taiwan","c":"亞太","alt":"600–1,400 m","vars":"鐵比卡、SL34、藝伎","proc":"水洗、蜜處理、日曬、厭氧","fl":["茶感","蔗糖","柑橘","花香"]},{"zh":"牙買加","en":"Jamaica","c":"中南美","alt":"900–1,700 m","vars":"鐵比卡","proc":"水洗","fl":["溫和","乾淨","堅果","均衡"]},{"zh":"夏威夷","en":"Hawaii","c":"亞太","alt":"150–900 m","vars":"可娜鐵比卡","proc":"水洗","fl":["堅果","奶油","紅糖","柔和酸"]}],"vars":[{"zh":"鐵比卡","en":"Typica","g":"鐵比卡系","from":"衣索比亞 → 葉門 → 爪哇 → 傳遍全球","fl":["清甜","乾淨","柔和酸"],"d":"最古老的栽培品種之一，許多品種的祖先。樹高、頂葉常呈古銅色，產量低、易染葉鏽病。藍山、可娜都是鐵比卡的名產地。"},{"zh":"象豆","en":"Maragogipe","g":"鐵比卡系","from":"巴西巴伊亞州","fl":["溫和","花香","輕盈"],"d":"鐵比卡的巨型突變種，葉、果、豆都特別大，產量低。是帕卡瑪拉的親本之一。"},{"zh":"波旁","en":"Bourbon","g":"波旁系","from":"葉門 → 留尼旺島（舊稱波旁島）","fl":["甜感","圓潤","焦糖"],"d":"與鐵比卡並列兩大古老品系。豆形較圓、甜度高，有紅、黃、橘等果色。盧安達、薩爾瓦多、巴西都很常見。"},{"zh":"卡杜拉","en":"Caturra","g":"波旁系","from":"巴西米納斯吉拉斯","fl":["明亮酸","柑橘","中等醇厚"],"d":"20 世紀初發現的波旁矮種突變。植株矮、可密植、產量高，是中美洲與哥倫比亞的主力，也是許多混種的親本。"},{"zh":"尖身波旁","en":"Laurina / Bourbon Pointu","g":"波旁系","from":"留尼旺島","fl":["細緻","甜","低苦"],"d":"波旁的突變種，豆形尖長，咖啡因含量約只有一般阿拉比卡的一半，是天然低因品種。"},{"zh":"SL28／SL34","en":"SL28 / SL34","g":"波旁系","from":"肯亞 Scott 農業實驗室（1930 年代）","fl":["黑醋栗","烏梅","強烈酸質"],"d":"SL 是 Scott Laboratories 的縮寫。SL28 耐旱、風味出眾；SL34 適應高海拔多雨環境。兩者是肯亞風味的核心。"},{"zh":"卡杜艾","en":"Catuaí","g":"混種","from":"巴西 IAC 育種","fl":["堅果","甜","均衡"],"d":"新世界（Mundo Novo）× 卡杜拉。矮株、高產、果實不易被風雨打落，有紅、黃兩種果色，巴西與中美洲廣泛種植。"},{"zh":"帕卡瑪拉","en":"Pacamara","g":"混種","from":"薩爾瓦多","fl":["複雜果酸","熱帶水果","草本"],"d":"帕卡斯（Pacas，波旁矮種突變）× 象豆。豆子非常大，風味複雜多變，常見於瓜地馬拉與薩爾瓦多的競賽批次。"},{"zh":"卡蒂莫","en":"Catimor","g":"混種","from":"葡萄牙育種","fl":["厚實","草本","較高苦味"],"d":"卡杜拉 × 提摩混種（Timor Hybrid，阿拉比卡與羅布斯塔的天然雜交）。帶有羅布斯塔基因，抗葉鏽病、高產，風味通常較粗獷。"},{"zh":"藝伎／瑰夏","en":"Geisha / Gesha","g":"衣索比亞系","from":"衣索比亞 Gesha 森林 → 坦尚尼亞 → 哥斯大黎加 → 巴拿馬","fl":["茉莉花","佛手柑","水蜜桃","蜂蜜"],"d":"1930 年代在衣索比亞西南部採集，輾轉傳到中美洲，原本因抗病被引進。2004 年翡翠莊園在 Best of Panama 以它奪冠，從此成為最昂貴的品種。豆形細長，高海拔才有典型花香。"},{"zh":"衣索比亞原生種","en":"Ethiopian Landrace (Heirloom)","g":"衣索比亞系","from":"衣索比亞","fl":["花香","柑橘","莓果"],"d":"成千上萬野生與地方品種的統稱。吉馬農業研究中心（JARC）選育的 74110、74112、74158 等編號品種，是古吉、耶加雪菲常見的品種。"},{"zh":"粉紅波旁","en":"Pink Bourbon","g":"衣索比亞系","from":"哥倫比亞薇拉","fl":["花香","粉紅葡萄柚","甜"],"d":"果實成熟時呈粉橘色。名字雖有波旁，但基因研究顯示它更接近衣索比亞原生種，所以帶花香與明亮果酸。"},{"zh":"希爪","en":"Sidra","g":"衣索比亞系","from":"厄瓜多","fl":["花香","紅色水果","葡萄酒感"],"d":"來源說法不一，基因上接近衣索比亞原生種。甜度高、果香濃，近年在世界咖啡大賽中很常見。"},{"zh":"Wush Wush","en":"Wush Wush","g":"衣索比亞系","from":"衣索比亞西南部","fl":["熱帶水果","香料","花香"],"d":"以發源地命名的衣索比亞地方品種，後來被引進哥倫比亞種植，產量低、風味濃郁奔放。"},{"zh":"索恩娜","en":"So'ngna","g":"衣索比亞系","from":"台灣阿里山（鄒築園發現，衣索比亞原生種）","fl":["荔枝","柑橘皮","雞蛋花","蜜桃"],"d":"方政倫在一批藝伎苗裡發現幾十棵嫩芽是古銅色的植株，送驗後確認是未命名的衣索比亞原生種，取鄒語「最好」命名。2020 年阿里山交流會的蜜處理批次被描述有荔枝、柑橘皮、雞蛋花，奇異果般的酸與蜜桃甜。"},{"zh":"台農 1 號","en":"Tainung No.1","g":"台灣育成","from":"農業部農業試驗所嘉義分所","fl":["本土品種","中低海拔"],"d":"台灣自己育成的咖啡品種，2021 年取得品種權，2025 年正式亮相。適合中低海拔、產量穩定；節間短、葉片小，也適合盆栽，葉片富含綠原酸，可以做咖啡葉茶。"},{"zh":"尤金諾伊狄絲","en":"Coffea eugenioides","g":"其他物種","from":"東非高地","fl":["極高甜感","低酸","穀物甜"],"d":"不是阿拉比卡，而是它的親本之一（另一個是羅布斯塔）。咖啡因低、苦味極低、甜感突出，產量非常少。"},{"zh":"羅布斯塔","en":"Coffea canephora (Robusta)","g":"其他物種","from":"中西非","fl":["厚重","麥茶","苦"],"d":"另一個咖啡物種，也是阿拉比卡的親本之一。耐熱抗病、咖啡因約為阿拉比卡的兩倍，常用於義式配方與即溶咖啡；近年也有精品等級的羅布斯塔。"}],"farms":[{"zh":"翡翠莊園","en":"Hacienda La Esmeralda","c":"巴拿馬","loc":"波奎特","d":"Peterson 家族經營。2004 年以藝伎在 Best of Panama 奪冠，開啟藝伎時代；依地塊與海拔分成不同系列批次販售。","t":["藝伎","水洗／日曬"]},{"zh":"艾利達莊園","en":"Elida Estate","c":"巴拿馬","loc":"波奎特 Alto Quiel","d":"Lamastus 家族經營，部分園區位於巴魯火山國家公園內，海拔極高。Best of Panama 常勝軍，多次刷新競標價紀錄。","t":["藝伎","厭氧慢乾日曬"]},{"zh":"九十+ 藝伎莊園","en":"Ninety Plus Gesha Estates","c":"巴拿馬","loc":"沃肯","d":"Joseph Brodsky 創立，在森林遮蔭下種植藝伎，以獨家發酵處理與風味導向的批次命名聞名，世界賽選手愛用。","t":["藝伎","創新處理"]},{"zh":"黛博拉莊園","en":"Finca Deborah","c":"巴拿馬","loc":"沃肯","d":"Jamison Savage 創立，海拔約 1,900 m 以上。以碳浸漬（CM）與氮氣發酵等精密控制的處理法著稱。","t":["藝伎","碳浸漬"]},{"zh":"茵赫特莊園","en":"Finca El Injerto","c":"瓜地馬拉","loc":"薇薇特南果","d":"Aguirre 家族經營，瓜地馬拉卓越杯（COE）多次冠軍，帕卡瑪拉與摩卡小圓豆批次很有名。","t":["帕卡瑪拉","水洗"]},{"zh":"聖費麗莎莊園","en":"Finca Santa Felisa","c":"瓜地馬拉","loc":"阿卡特南果","d":"百年家族莊園，由 Meneses 家族經營，以藝伎與多樣化的實驗性發酵批次著稱。","t":["藝伎","實驗發酵"]},{"zh":"天堂莊園","en":"Finca El Paraíso","c":"哥倫比亞","loc":"考卡 Piendamó","d":"Diego Bermúdez 經營，以「熱衝擊」（thermal shock）雙重厭氧處理聞名，風味像荔枝、玫瑰、水蜜桃般強烈。","t":["卡斯提優","熱衝擊厭氧"]},{"zh":"棕櫚樹與大嘴鳥","en":"La Palma y El Tucán","c":"哥倫比亞","loc":"昆迪納馬卡 Zipacón","d":"推動「鄰居與作物」計畫，收購周邊小農果實集中處理；以乳酸發酵等處理法與生態友善種植聞名。","t":["藝伎／希爪","乳酸發酵","合作社"]},{"zh":"希望莊園","en":"Café Granja La Esperanza","c":"哥倫比亞","loc":"考卡山谷","d":"旗下有 Cerro Azul、Las Margaritas、Potosí 等園區。很早就把巴拿馬藝伎帶回哥倫比亞種植，競賽常客。","t":["藝伎","多園區"]},{"zh":"迪維索莊園","en":"Finca El Diviso","c":"哥倫比亞","loc":"薇拉 Pitalito","d":"Lasso 家族的年輕一代經營，以希爪、Ombligon 等品種搭配精密厭氧發酵，近年在世界咖啡師大賽中受到矚目。","t":["希爪","厭氧"] 卡。","t":["鐵比卡","產區導覽"]},{"zh":"泥妲咖啡","en":"Nida Coffee","c":"台灣","loc":"花蓮","d":"戴豐秋經營，2025 年第 9 屆花蓮縣精品咖啡評鑑以 86.06 分拿下有機組特等獎。","t":["有機","花蓮評鑑特等"]},{"zh":"金土咖莊園","en":"Jintuka Coffee","c":"台灣","loc":"台東太麻里 華源","d":"廖添成在海拔約 420 m、俯瞰華源海灣的坡地種了約 3,000 棵咖啡；白天海霧、晚上山風，喝起來帶一點海風感。曾獲 2013 年台灣精品咖啡豆評鑑頭等獎。","t":["有機","海霧咖啡"]},{"zh":"格林威爾農場","en":"Greenwell Farms","c":"夏威夷","loc":"可娜 Kealakekua","d":"1850 年創立的可娜老牌農場，可參觀導覽，了解可娜咖啡從採收到處理的流程。","t":["可娜鐵比卡","水洗"]},{"zh":"克里夫頓山莊園","en":"Clifton Mount Estate","c":"牙買加","loc":"藍山 Newcastle","d":"藍山歷史最悠久且仍在運作的莊園之一，海拔約 1,300 m，是藍山咖啡的代表。","t":["鐵比卡","水洗"]}],"procs":[{"zh":"日曬","en":"Natural","sum":"整顆果實帶皮曬乾，果肉的糖分與發酵風味留在豆子裡：莓果、熱帶水果、酒香，甜感與厚度高，但乾淨度較難控制。最古老、最省水的方法，常見於衣索比亞、巴西、葉門。"},{"zh":"水洗","en":"Washed","sum":"先去掉果皮果肉，再靠發酵把果膠分解洗掉，風味最能反映品種與產地本身：酸質明亮、乾淨、花香與柑橘調清楚。需要大量用水。肯亞、哥倫比亞、中美洲的主流。"},{"zh":"蜜處理","en":"Honey","sum":"去皮後「保留果膠」直接乾燥，介於水洗與日曬之間：甜感、稠度比水洗高，又比日曬乾淨。果膠留得越多、乾燥越慢，顏色越深、發酵感越重。哥斯大黎加發揚光大。"},{"zh":"濕剝","en":"Wet-hulled","sum":"印尼蘇門答臘的傳統做法（Giling Basah）。因為氣候潮濕，趁豆子還濕軟就脫去羊皮層再曬，乾燥時間大幅縮短。帶來草本、杉木、泥土調與厚重口感，酸質低；生豆呈深綠色，容易出現裂開的「羊蹄豆」。"},{"zh":"厭氧／碳浸漬","en":"Anaerobic / Carbonic Maceration","sum":"把果實或去皮豆放進密封容器，在缺氧環境下發酵，由不同的微生物族群主導，產生強烈的熱帶水果、酒香、肉桂、乳酸感。碳浸漬（CM）借自葡萄酒：整顆果實入桶並灌入二氧化碳。風味誇張、辨識度高，但控制不好容易有過度發酵的味道。"},{"zh":"共同發酵","en":"Co-fermentation（哥倫比亞）","sum":"把咖啡果實或去皮的豆子，和其他材料一起放進密封槽發酵，讓外來的糖、酸、香氣與微生物進到豆子裡。哥倫比亞是目前共同發酵產量最大、能見度最高的國家，巴拿馬、哥斯大黎加、巴西也有生產者跟進。代表人物有天堂莊園的 Diego Bermúdez、Granja Paraíso 92 的 Wilton Benítez，以及米蘭莊園背後的 Cofinet。"}],"gear":[{"n":"Comandante C40 MK4","b":"Comandante・德國","cat":"磨豆機","sub":"手搖","d":"手沖界的參考基準，許多比賽配方直接以「C40 幾格」標示刻度。","sp":[["刀盤","39mm 錐刀，高氮不鏽鋼 Nitro Blade"],["調整","內調段數，每格約 30 微米"],["粉倉","玻璃罐"]],"f":"風味均衡、甜感與厚度兼具，細粉帶來層次。"},{"n":"1Zpresso ZP6 Special","b":"1Zpresso・台灣","cat":"磨豆機","sub":"手搖","d":"專為手沖設計的錐刀，以細粉少、乾淨度高聞名。","sp":[["刀盤","48mm 七角錐刀"],["調整","上方外調，每格約 22 微米"],["用途","手沖專用，不適合義式"]],"f":"清晰明亮、茶感、風味分離度接近平刀。"},{"n":"1Zpresso K-Ultra","b":"1Zpresso・台灣","cat":"磨豆機","sub":"手搖","d":"手沖與義式都能應付的全能型手搖磨。","sp":[["刀盤","48mm 錐刀"],["調整","外調環 function newLeft(){return Math.max(0,ST.newPerDay-(ST.newDone[today()]||0))}
function buildSession(){
 const on=CARDS.filter(c=>ST.decks[c.deck]);
 const due=on.filter(isDue).sort((a,b)=>ST.cards[a.id].due-ST.cards[b.id].due).slice(0,30);
 let fresh=on.filter(isNew);
 // 依牌組輪流挑新卡，菜單牌組優先
 const by={};fresh.forEach(c=>(by[c.deck]=by[c.deck]||[]).push(c));
 const order=DECKS.map(d=>d.id).filter(id=>by[id]);const pick=[];let n=newLeft();
 while(n>0&&order.some(id=>by[id].length)){for(const id of order){if(n<=0)break;if(by[id].length){pick.push(by[id].shift());n--}}}
 const all=due.concat(pick);
 for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]]}
 return all;
}
function streak(){let s=0,d=today();if(!ST.days[d])d--;while(ST.days[d]){s++;d--}return s}
/* ---------- 畫面 ---------- */
const $=s=>document.querySelector(s);
let S=null;
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),1600)}
function home(){
 S=null;
 const on=CARDS.filter(c=>ST.decks[c.deck]);
 const due=on.filter(isDue).length,nl=Math.min(newLeft(),on.filter(isNew).length);
 const total=due+nl;
 $("#app").innerHTML=`
 <header><h1>咖啡記憶卡<small>豆子 × 器材，每天背一點</small></h1><div style="display:flex;gap:6px"><button class="icon" data-act="share">🔗 分享</button><button class="icon" data-act="backup">☁ 備份</button></div></header>
 <div class="hero">
  <div class="row"><div><div class="n">${total}</div><div class="lab">今日待背</div></div><div><div class="n" style="font-size:26px">${due}</div><div class="lab">複習</div></div><div><div class="n" style="font-size:26px">${nl}</div><div class="lab">新卡</div></div><div style="margin-left:auto;text-align:right"><div class="n" style="font-size:26px">🔥${streak()}</div><div class="lab">連續天數</div></div></div>
  <button class="go" data-act="start" ${total?"":"disabled"}>${total?"開始今天的複習":"今天都背完了 ☕"}</button>
  <div class="sub">${total?"答錯的卡會在這一輪最後再出一次，明天也會再出現":"明天再來，或在下面多開一點新卡"}</div>
 </div>
 <h2>牌組</h2>
 ${DECKS.map(d=>{const cs=CARDS.filter(c=>c.deck===d.id);const learned=cs.filter(c=>ST.cards[c.id]).length;const mast=cs.filter(c=>ST.cards[c.id]&&ST.cards[c.id].box>=3).length;
  return `<div class="deck"><div class="em">${d.em}</div><div class="info"><div class="t">${d.name}</div><div class="s">${d.desc}・已學 ${learned}/${cs.length}・熟記 ${mast}</div><div class="bar"><i style="width:${cs.length?mast/cs.length*100:0}%"></i></div></div><button class="sw" data-act="deck" data-v="${d.id}" aria-pressed="${!!ST.decks[d.id]}" aria-label="${d.name}"></button></div>`}).join("")}
 <h2>設定</h2>
 <div class="set"><span>每天新卡數</span><div class="step"><button data-act="np" data-v="-5">−</button><b>${ST.newPerDay}</b><button data-act="np" data-v="5">＋</button></div></div>
 <div class="set"><span>多背一輪新卡（今天）</span><button class="icon" data-act="more">＋10 張</button></div>
 <div class="sig">Made by Jim Lu</div>`;
}
function start(){const q=buildSession();if(!q.length){toast("目前沒有要背的卡");return}S={q,i:0,right:0,wrong:[],answered:false,retry:new Set()};card()}
function opts(c){
 const pool=[...new Set(c.pool.filter(x=>x!==c.answer))];
 for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
 // 莊園題優先同國家
 const o=[c.answer,...pool.slice(0,3)];
 for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]]}
 return o;
}
function card(){
 const c=S.q[S.i];S.answered=false;S.opts=opts(c);
 const d=DECKS.find(x=>x.id===c.deck);
 $("#app").innerHTML=`
 <div class="top"><button class="x" data-act="home" aria-label="離開">✕</button><div class="prog"><i style="width:${S.i/S.q.length*100}%"></i></div><div class="cnt">${S.i+1}/${S.q.length}</div></div>
 <div class="q"><span class="tag ${isNew(c)?"new":""}">${d.em} ${d.name}${isNew(c)?"・新卡":""}</span>
  <div class="ask ${c.prompt?"":"solo"}">${esc(c.ask)}</div>${c.prompt?`<div class="prompt">${c.prompt}</div>`:""}</div>
 <div class="opts">${S.opts.map((o,i)=>`<button class="opt" data-act="pick" data-v="${i}">${esc(o)}</button>`).join("")}</div>
 <div id="after"></div>`;
}
function pick(i){
 if(S.answered)return;S.answered=true;
 const c=S.q[S.i],ok=S.opts[i]===c.answer,t=today();
 document.querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true;if(S.opts[k]===c.answer)b.classList.add("ok");else if(k===i)b.classList.add("bad")});
 const firstTime=!S.retry.has(c.id);
 if(firstTime){
  const st=ST.cards[c.id];
  if(!st){ST.newDone[t]=(ST.newDone[t]||0)+1}
  let box=st?st.box:0;
  box=ok?Math.min(box+1,IV.length-1):Math.max(1,Math.floor(box/2));
  ST.cards[c.id]={box,due:t+(ok?IV[box]:1)};
  if(ok)S.right++;else{S.wrong.push(c);S.retry.add(c.id);S.q.push(c)}
  ST.days[t]=1;save();
 }
 $("#after").innerHTML=`<div class="fb ${ok?"ok":"bad"}"><b>${ok?"答對了":"答案是："+esc(c.answer)}</b>${esc(c.explain)}</div><button class="next" data-act="next">${S.i+1<S.q.length?"下一題":"看結果"}</button>`;
 $("#after").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function next(){S.i++;if(S.i<S.q.length)card();else done()}
function done(){
 const n=S.q.length-S.wrong.length,pct=n?Math.round(S.right/n*100):0;
 $("#app").innerHTML=`<div class="done"><div class="big">${pct>=80?"🏆":pct>=50?"☕":"🌱"}</div><div class="sc">${S.right} / ${n}</div><p>答對率 ${pct}%・連續 ${streak()} 天</p>
 ${S.wrong.length?`<div class="miss"><b>今天答錯的</b><ul>${S.wrong.map(c=>`<li>${esc(c.answer)}</li>`).join("")}</ul><div style="color:var(--mute);font-size:12px">明天會再出現</div></div>`:""}
 <button class="next" data-act="home">回首頁</button></div>`;
}
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,v=b.dataset.v;
 if(a==="start")start();
 else if(a==="home")home();
 else if(a==="pick")pick(+v);
 else if(a==="next")next();
 else if(a==="deck"){ST.decks[v]=!ST.decks[v];save();home()}
 else if(a==="np"){ST.newPerDay=Math.max(0,Math.min(50,ST.newPerDay+ +v));save();home()}
 else if(a==="more"){const t=today();ST.newDone[t]=(ST.newDone[t]||0)-10;save();home();toast("今天多開 10 張新卡")}
 else if(a==="share"){navigator.clipboard.writeText(location.href.split("#")[0]).then(()=>toast("已複製連結"),()=>toast("無法複製，請從網址列複製"))}
 else if(a==="backup"){$("#code").value=btoa(unescape(encodeURIComponent(JSON.stringify(ST))));$("#sheet").classList.add("on")}
});
$("#close").onclick=()=>$("#sheet").classList.remove("on");
$("#cp").onclick=()=>navigator.clipboard.writeText($("#code").value).then(()=>toast("已複製備份碼"),()=>toast("請長按文字框手動複製"));
$("#im").onclick=()=>{try{const o=JSON.parse(decodeURIComponent(escape(atob($("#code").value.trim()))));if(!o.cards)throw 0;Object.assign(ST,o);save();$("#sheet").classList.remove("on");home();toast("已匯入進度")}catch(e){toast("備份碼格式不對")}};
let lastT=0;document.addEventListener("touchend",e=>{const n=Date.now();if(n-lastT<300)e.preventDefault();lastT=n},{passive:false});
home();
</script>
<script>/*offline*/if("serviceWorker"in navigator)navigator.serviceWorker.register("../sw.js",{scope:"../"}).catch(function(){});</script>
</body>
</html>
