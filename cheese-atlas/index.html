<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta charset="utf-8">
<meta name="author" content="Jim Lu">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b2118">
<title>起司品飲圖鑑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f0e2;--card:#fffbf1;--ink:#2b2118;--mut:#7d6a55;--line:#e6dabf;--rind:#d9932b;--wine:#8a2a3b;--herb:#5d7547;--blue:#3f6688}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;font-size:15px;line-height:1.65;padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:"Noto Serif TC",serif;margin:0;line-height:1.3}
header{padding:calc(16px + env(safe-area-inset-top,0px)) 16px 8px;max-width:760px;margin:auto;display:flex;align-items:flex-end;gap:10px;background:linear-gradient(180deg,#efe2c4,transparent)}
header .grow{flex:1}
header h1{font-size:25px;font-weight:900;letter-spacing:.04em}
header h1 span{color:var(--rind)}
header p{margin:2px 0 0;color:var(--mut);font-size:13px}
header svg{width:58px;flex:none}
#share{border:1px solid var(--line);background:var(--card);border-radius:99px;font-size:15px;width:36px;height:36px;cursor:pointer;flex:none}
main{max-width:760px;margin:auto;padding:0 12px}
section.view{display:none}section.view.on{display:block}
.vt{font-size:19px;margin:18px 4px 2px}.vs{color:var(--mut);font-size:13px;margin:0 4px 10px}
.chips{display:flex;position:relative;gap:6px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:5px 13px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.s{font-size:12.5px;padding:4px 11px}.chip.s.on{background:var(--rind);border-color:var(--rind)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.card>button.hd{display:flex;width:100%;text-align:left;background:none;border:0;padding:8px 12px 8px 6px;font:inherit;color:inherit;cursor:pointer;gap:8px;align-items:center}
.hd .nm{font-family:"Noto Serif TC",serif;font-weight:600;font-size:17px;display:block}
.hd .en{color:var(--mut);font-size:12px;display:block;line-height:1.35}
.hd .grow{flex:1;min-width:0}
.hd .arr{color:var(--mut);transition:transform .2s;font-size:20px}
.hd .tt{font-size:11.5px;padding:2px 8px;border-radius:99px;flex:none;font-weight:700}
.hd .ck{color:var(--herb);font-weight:700}
.card.open .arr{transform:rotate(90deg)}
.bd{display:none;padding:0 14px 14px}.card.open .bd{display:block}
svg.mini{width:64px;height:45px;flex:none}
svg.tiny{width:52px;height:36px;flex:none}
svg.big{width:100%;max-width:320px;display:block;margin:auto}
.hero{border-radius:12px;padding:8px;margin-bottom:8px}
.kv{display:grid;grid-template-columns:3.4em 1fr;gap:2px 8px;font-size:13.5px;margin:8px 0}
.kv dt{color:var(--mut)}.kv dd{margin:0}
.bd h4{margin:14px 0 6px;font-size:13px;color:var(--wine);letter-spacing:.08em}
.bd p{margin:6px 0}
.note{background:#fbf1dc;border-left:3px solid var(--rind);padding:9px 12px;border-radius:0 10px 10px 0;font-size:13.5px;margin:0 0 12px}
.two{display:grid;grid-template-columns:1fr;gap:4px;align-items:center}
@media(min-width:520px){.two{grid-template-columns:240px 1fr}}
.radar{width:100%;max-width:240px;display:block;margin:auto}
.bars{display:grid;grid-template-columns:3em 1fr;gap:6px 8px;font-size:13px;align-items:center;margin:8px 0}
.bar{height:9px;background:var(--line);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--rind);border-radius:5px;transition:width .4s}
.brands{display:grid;gap:6px}
.brand{background:#f6eedc;border-radius:10px;padding:8px 11px;font-size:13.5px}
.brand b{display:block;font-size:14px;color:#5a3a1a}
.brand span{color:#4a3a2a}
ol.flow{counter-reset:f;list-style:none;padding:0;margin:0 0 10px;position:relative}
ol.flow li{counter-increment:f;position:relative;padding:4px 0 8px 36px;font-size:14px}
ol.flow li::before{content:counter(f);position:absolute;left:0;top:3px;width:24px;height:24px;border-radius:50%;background:var(--rind);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
ol.flow li:not(:last-child)::after{content:"";position:absolute;left:11px;top:28px;bottom:-2px;width:2px;background:#ead7b2}
.minipair{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.mp{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px 6px;font:inherit;text-align:left;cursor:pointer;color:inherit}
.mp b{font-size:13px;display:block;line-height:1.3}.mp small{font-size:11px;color:var(--mut);display:block;line-height:1.3}
.btn{border:0;border-radius:10px;background:var(--ink);color:#fff;font:inherit;font-weight:500;padding:9px 16px;cursor:pointer}
.btn.sec{background:#ecdfc6;color:var(--ink)}.btn:disabled{opacity:.4}
.btn.sm{padding:6px 12px;font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rate{display:flex;align-items:center;justify-content:space-between;margin:2px 0 4px}
.tried{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}
.tried.on{background:var(--herb);color:#fff;border-color:var(--herb)}
.stars button{border:0;background:none;font-size:22px;color:#e0d4bb;cursor:pointer;padding:0 1px}.stars button.on{color:var(--rind)}
/* guide */
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.step .n{color:var(--wine);font-size:12px;letter-spacing:.1em}
.step h3{font-size:20px;margin:2px 0 6px}
.scene{width:100%;max-width:400px;display:block;margin:4px auto;background:#fbf3e2;border-radius:12px}
.pg{display:flex;gap:4px;margin:10px 0}.pg i{flex:1;height:4px;border-radius:2px;background:var(--line)}.pg i.on{background:var(--rind)}
.types{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(min-width:600px){.types{grid-template-columns:repeat(4,1fr)}}
.type{border:0;border-radius:14px;padding:8px 10px 10px;text-align:left;font:inherit;cursor:pointer;color:var(--ink);display:flex;flex-direction:column}
.type svg{width:100%;height:70px}
.type b{font-family:"Noto Serif TC",serif;font-size:17px}.type small{font-size:11px;color:var(--mut)}
.type span{font-size:12px;line-height:1.45;color:#4a3a2a;margin-top:3px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
svg.map{width:100%;display:block}
.pt{cursor:pointer}
.map-panel{padding:10px 8px 8px}.maphd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:0 4px 2px}.maphd b{font-family:"Noto Serif TC",serif;font-size:16px}.maphd span{font-size:11.5px;color:var(--mut)}
.selbar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fbe9c6;border-radius:10px;padding:6px 8px 6px 12px;margin:0 0 10px;font-size:13.5px}
.lgd{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mut);margin-top:6px}
.lgd i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.tbar{display:grid;grid-template-columns:4em 1fr 3.4em;gap:7px 8px;align-items:center;font-size:13px}.tbar b{text-align:right;font-variant-numeric:tabular-nums}
.cuts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
@media(min-width:600px){.cuts{grid-template-columns:repeat(3,1fr)}}
.cut{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column}
.cut svg{width:100%;height:84px;background:#fbf3e2;border-radius:10px;margin-bottom:6px}
.cut b{font-size:14px}.cut span{font-size:12.5px;color:#4a3a2a;line-height:1.5}
.tips{margin:8px 0 0;padding-left:1.2em;font-size:14px}.tips li{margin:3px 0}
.jp{display:grid;gap:0}.jp div{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px 2px;border-bottom:1px dashed var(--line);font-size:13.5px}.jp div:last-child{border:0}.jp b{font-weight:500;color:#5a3a1a}
/* pair */
.seg{display:flex;background:#ecdfc6;border-radius:12px;padding:3px;margin:0 0 12px}
.seg button{flex:1;border:0;background:none;font:inherit;font-size:14px;padding:7px 0;border-radius:9px;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--card);font-weight:700;box-shadow:0 1px 3px #0001}
.picker{display:flex;position:relative;gap:6px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}.picker::-webkit-scrollbar{display:none}
.pk{flex:none;display:flex;flex-direction:column;align-items:center;width:76px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:4px 2px 6px;font:inherit;font-size:11.5px;line-height:1.3;cursor:pointer;color:var(--ink);text-align:center}
.pk.on{border-color:var(--rind);background:#fbe9c6;box-shadow:inset 0 0 0 1.5px var(--rind)}
.sel{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px;margin-bottom:6px}.sel .pk{width:auto}
.ptitle{font-size:14px;color:var(--mut);margin-bottom:4px}.ptitle b{font-family:"Noto Serif TC",serif;font-size:17px;color:var(--ink)}
svg.board{width:100%;display:block}
.glasses{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:6px}
h3.sub{font-size:15px;margin:14px 4px 6px;color:var(--wine)}
.rank{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 10px 8px 4px;margin-bottom:6px;cursor:pointer}
.rank.first{border-color:var(--rind);background:#fff6e2}
.rank.bad{opacity:.85;cursor:default;background:#f7ecea}
.rank .grow{flex:1;min-width:0}.rank small{font-size:12px;color:#5a4a3a;display:block;line-height:1.45}
.rt{display:flex;justify-content:space-between;align-items:center}.rt b{font-size:14.5px}
.lv{font-size:11px;padding:1px 8px;border-radius:99px;font-weight:700}
.lv.l4{background:#8a2a3b;color:#fff}.lv.l3{background:#d9932b;color:#fff}.lv.l2{background:#ecdfc6;color:#5a3a1a}.lv.l1,.lv.l0{background:#eee;color:#777}
.sbar{height:5px;background:var(--line);border-radius:3px;margin:3px 0 2px;overflow:hidden}.sbar i{display:block;height:100%;background:linear-gradient(90deg,#e8c27a,#8a2a3b)}
.ppl{justify-content:center;margin-top:6px}.ppl b{min-width:3.4em;text-align:center}
ol.order{margin:0 0 8px;padding-left:1.4em}ol.order li{margin:4px 0}ol.order small{display:block;color:var(--mut);font-size:12.5px}
.warn{background:#fdf3dc;border-radius:10px;padding:8px 12px;font-size:13.5px}.warn div{margin:2px 0}
.ok{background:#e6efdc;color:#3f5a2e;border-radius:10px;padding:8px 12px;font-size:13.5px}
/* say */
.say{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:4px 0 6px}.say b{font-size:15px;font-family:Georgia,serif;margin-right:auto}
.say button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 11px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--ink)}.say button:first-child{background:var(--ink);color:#fff;border-color:var(--ink)}
.say{flex-wrap:wrap}.say b{order:-1;width:100%}
/* sheet */
#sheet{position:fixed;inset:0;z-index:20;display:none}#sheet.on{display:block}
.shbg{position:absolute;inset:0;background:#0006}
#sheetBody{position:absolute;left:0;right:0;bottom:0;max-height:86vh;overflow-y:auto;background:var(--card);border-radius:18px 18px 0 0;padding:0 14px calc(18px + env(safe-area-inset-bottom,0px));max-width:760px;margin:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.shtop{position:sticky;top:0;background:var(--card);display:flex;align-items:center;gap:8px;padding:10px 0 8px;z-index:1;border-bottom:1px solid var(--line);margin-bottom:8px}
.shtop b{font-family:"Noto Serif TC",serif;font-size:18px;display:block}.shtop small{font-size:12px;color:var(--mut)}.shtop .grow{flex:1;min-width:0}
.shx{border:0;background:#ecdfc6;width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer}
/* learn */
.prog{display:flex;align-items:center;gap:10px;font-size:13.5px;margin:0 4px 10px}.prog .bar{flex:1}
.path{display:grid;gap:8px;position:relative}
.course{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:8px 10px 8px 8px;font:inherit;color:inherit;cursor:pointer}
.course .num{width:28px;height:28px;border-radius:50%;background:#ecdfc6;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.course.ok .num{background:var(--herb);color:#fff}.course.next{border-color:var(--rind);box-shadow:0 0 0 2px #d9932b33;background:#fff6e2}.course.next .num{background:var(--rind);color:#fff}
.course .grow{flex:1;min-width:0}.course b{font-family:"Noto Serif TC",serif;font-size:16px;display:block}.course small{display:block;font-size:12px;color:var(--mut);line-height:1.45}.course .st{color:var(--wine)}
.cbar{display:block;height:4px;background:var(--line);border-radius:2px;margin:4px 0 2px;overflow:hidden}.cbar i{display:block;height:100%;background:var(--rind)}
.lhead{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);margin:12px 0 2px}
.lesson h3{margin-bottom:8px}.lesson>p{font-size:15px}.hint{font-size:12.5px!important;color:var(--mut)}
.nav2{margin-top:10px}.nav2 .btn:last-child{flex:1}
.prow{display:flex;align-items:center;gap:2px;background:#fbf3e2;border-radius:12px;padding:6px;overflow-x:auto}.prow .ar{color:var(--mut);font-size:18px}svg.pmini{width:72px;height:50px;flex:none}
.tmini{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.tmini button{border:0;border-radius:10px;padding:4px 2px 6px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.25}.tmini b{font-size:13px}.tmini small{font-size:10.5px;color:var(--mut)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cmp button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 8px;font:inherit;text-align:left;cursor:pointer;color:inherit}.cmp b{display:block;font-family:"Noto Serif TC",serif}.cmp small{color:var(--mut);font-size:11.5px}.cmp .bars{font-size:11.5px;grid-template-columns:2.6em 1fr;gap:3px 6px}svg.cmpa{width:100%;height:auto}
.lcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}.lcards button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 8px 8px;font:inherit;text-align:left;cursor:pointer;color:inherit;display:flex;flex-direction:column}.lcards b{font-family:"Noto Serif TC",serif;font-size:15px}.lcards small{color:var(--mut);font-size:11.5px}.lcards span{font-size:12px;color:#6a4a2a;margin-top:2px}svg.lart{width:100%;height:76px}
.lcards.sm{grid-template-columns:repeat(4,1fr);margin:8px 0}.lcards.sm button{align-items:center;text-align:center;padding:4px}.lcards.sm b{font-size:12px}.lcards.sm small{font-size:10px}
.cuts.one{grid-template-columns:1fr}.cuts.one svg{height:120px}
.qz{margin:10px 0}.qz>b{font-size:15px}.opts{display:grid;gap:6px;margin-top:6px}.opts button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font:inherit;text-align:left;cursor:pointer;color:inherit}
.opts .right{background:#e3eed7;border-color:var(--herb);font-weight:700}.opts .wrong{background:#f6dcd6;border-color:#c8402c}.opts .dim{opacity:.5}
.exp{font-size:13px;background:#fbf1dc;border-radius:8px;padding:6px 10px;margin-top:6px}.score{text-align:center;font-family:"Noto Serif TC",serif;font-size:20px;margin:10px 0}
/* game */
.ghud{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin:0 4px 8px}
.gsec{margin-bottom:8px}.glab{font-size:12px;color:var(--wine);letter-spacing:.08em;margin:0 2px 4px}
.gtiles{display:flex;flex-wrap:wrap;gap:6px;min-height:40px}
.gt{border:0;border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;box-shadow:0 2px 0 #0002;animation:pop .2s}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.gt.zh{background:#f6dfc0;font-family:"Noto Serif TC",serif;font-weight:600}.gt.en{background:#dce8f2;font-family:Georgia,serif}.gt.fd{background:#e6efdc;font-size:13px}
.gboard{background:#3a2c20;border-radius:16px;padding:12px;margin:10px 0;display:flex;flex-direction:column;align-items:center;gap:6px}
.gpair{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;width:100%}.eq{color:#e8c27a;font-size:20px}.gdown{color:#e8c27a;line-height:1}
.slot{min-height:54px;width:100%;border:2px dashed #8a7058;background:#4a3828;border-radius:12px;color:#fff;font:inherit;font-size:15px;cursor:pointer;padding:6px;transition:.2s}
.slot small{color:#b9a48a;font-size:12px}.slot.fill{border-style:solid;border-color:#e8c27a;background:#5a4430}.slot.en{font-family:Georgia,serif}.slot i{font-style:normal;margin-left:6px}
.slot.fd{max-width:70%}.slot.good{background:#5d7547;border-color:#b9d89a}.slot.bad{background:#8a2a3b;border-color:#f0a0a0;animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#gmsg{color:#f6c0b0;font-size:13px;min-height:18px}
.gdone{display:flex;gap:6px;overflow-x:auto;padding:4px 0}.gdone button{flex:none;display:flex;align-items:center;gap:4px;border:1px solid #b9d89a;background:#eef6e6;border-radius:10px;padding:2px 8px 2px 2px;font:inherit;font-size:12.5px;cursor:pointer;text-align:left}.gdone small{display:block;font-size:10.5px;color:var(--mut)}
.gwin{background:var(--card);border:2px solid var(--rind);border-radius:16px;padding:14px;text-align:center}.stars3{font-size:34px;color:var(--rind);letter-spacing:4px}.stars3 span{color:#e6dabf}
/* proc */
.why{background:#eef3e6;border-left:3px solid var(--herb);border-radius:0 10px 10px 0;padding:8px 12px;font-size:13.5px;margin:6px 0}.why b{display:block;color:var(--herb);font-size:12.5px;letter-spacing:.06em}
.story{display:grid;gap:8px}.sc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}.sc p{margin:4px 0;font-size:14px}
.sh{font-family:"Noto Serif TC",serif;font-weight:600;font-size:16px;display:flex;align-items:center;gap:9px}
.bdg{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1px #0000000d}.bdg .ic{width:18px;height:18px}
.bdg.b1{background:#fbe9c6;color:#b8741c}.bdg.b2{background:#f3e1e3;color:#8a2a3b}.bdg.b3{background:#e6eedd;color:#4f6a3a}
.ic{width:1.1em;height:1.1em;display:inline-block;vertical-align:-.18em;flex:none}.ic.in{margin-right:5px;color:var(--rind)}
.say button{display:inline-flex;align-items:center;gap:4px}#share{display:grid;place-items:center;color:var(--ink)}#share .ic{width:17px;height:17px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.tags span{font-size:12px;padding:2px 10px;border-radius:99px;background:#f3e2c3;color:#7a4a20}
.avr{text-align:center}.avr .radar{max-width:200px}.avr small{color:var(--mut);font-size:11.5px}
.pscene{background:#fbf3e2;border-radius:12px;padding:6px}
svg.pbig{width:100%;max-width:300px;display:block;margin:auto}
.strip{display:flex;position:relative;gap:6px;overflow-x:auto;padding:10px 2px;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}
.strip button{flex:none;width:92px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:4px;font:inherit;font-size:11.5px;line-height:1.3;cursor:pointer;color:var(--ink)}

 fresh:{info:{"why": "不熟成，就是要喝到牛奶最新鮮的味道。不用熟成室、不用等，做好當天就能吃，是最省時間、最不浪費的保存牛奶方法。", "hist": "最古老的起司型態。波蘭出土約七千年前的陶製濾器上留有乳脂殘留，被認為是早期做新鮮起司的工具。馬斯卡彭則是 16–17 世紀倫巴底一帶用鮮奶油做出來的。", "fl": "乾淨的奶香、微酸、淡甜，口感濕潤綿密。因為沒有熟成，幾乎沒有鹹味、鮮味或菇味。", "tags": ["牛奶", "優格", "鮮奶油", "微酸"]},g:"cheese",n:"新鮮起司",steps:[["milk","生乳","牛奶先殺菌，加熱到適合菌種活動的溫度。"],["culture","加乳酸菌","乳酸菌吃掉乳糖產生乳酸，牛奶慢慢變酸。"],["rennet","凝固","加凝乳酶（或酸），牛奶在 30–60 分鐘內凝成豆花狀。"],["drain","排出乳清","把凝乳放進布或籃子，讓黃綠色的乳清流掉。"],["salt","調味包裝","輕輕加鹽、裝杯冷藏，不熟成。"]]},
 filata:{info:{"why": "義大利南部天氣熱，起司容易壞。凝乳泡熱水拉扯，會把乳清擠出去、殺掉部分雜菌，同時讓蛋白質排列成纖維，做出有彈性、不容易散的起司。", "hist": "「mozzarella」這個字出現在 1570 年教皇御廚斯卡皮（Bartolomeo Scappi）的食譜裡，名字來自 mozzare（用手掐斷）。坎帕尼亞從中世紀就養水牛。布拉塔則是 20 世紀初在普利亞的安德里亞誕生，用剩下的凝乳碎片加鮮奶油包起來，避免浪費。", "fl": "牛奶甜味、淡淡的酸，口感 Q 彈多汁；水牛奶版本更濃、更有奶油香。加熱會牽絲。", "tags": ["鮮奶", "奶油", "微酸", "彈牙"]},g:"cheese",n:"拉絲起司（莫札瑞拉）",steps:[["milk","生乳","牛奶或水牛奶。"],["rennet","凝固","加乳酸菌與凝乳酶。"],["cut","切凝乳","切開凝乳、排出乳清，讓凝乳變酸到剛好能拉絲。"],["stretch","熱水拉絲","凝乳泡進約 90°C 熱水，用木棒反覆拉、折，形成纖維。"],["ball","搓圓","趁熱搓成球，泡冷水定型，再泡淡鹽水。"]]},
 whey:{info:{"why": "做起司時，大約九成的牛奶會變成乳清流掉。乳清裡還有一些蛋白質，凝乳酶抓不住，但加熱加酸就會凝結。再煮一次，就能把最後的營養撈回來。", "hist": "ricotta 就是義大利文「再煮一次」。這種不浪費乳清的做法在義大利的牧羊人和農家流傳了好幾百年，羊奶瑞可塔是羅馬一帶的傳統。", "fl": "很淡、微甜，口感像雲一樣鬆、帶細顆粒，脂肪低。適合加蜂蜜、果醬或入菜。", "tags": ["牛奶", "淡甜", "鬆軟"]},g:"cheese",n:"乳清起司（瑞可塔）",steps:[["whey","收集乳清","做其他起司剩下的乳清裡還有蛋白質。"],["heat","再加熱","加熱到約 90°C（ri-cotta＝再煮）。"],["float","蛋白質浮起","乳清蛋白凝成雪花般的小塊浮上來。"],["drain","撈起瀝乾","放進籃子，鬆軟的瑞可塔就完成了。"]]},
 white:{info:{"why": "小尺寸、不壓榨，所以水分多；表面的白黴分泌酵素，從外往內把蛋白質分解，幾週內就能變得軟滑。適合諾曼第這種牛奶豐富、需要快速消化產量的地方。", "hist": "傳說 1791 年諾曼第卡門貝爾村的瑪麗・哈雷爾（Marie Harel）向一位來自布里地區的神父學會做法。1890 年發明的薄木盒讓它能長途運送，一次大戰時又被當成法軍配給，從此全國聞名。布里歷史更早，1815 年維也納會議的起司比賽被選為「起司之王」。", "fl": "奶油、蘑菇、生菇根、溫熱牛奶的香氣；越熟越軟、越有菇味，太熟會出現氨味。外皮微苦、帶土味。", "tags": ["奶油", "蘑菇", "乾草", "堅果"]},g:"cheese",n:"白黴起司（卡門貝爾）",steps:[["milk","生乳","諾曼第的牛奶。"],["rennet","凝固","加乳酸菌與凝乳酶，凝成柔軟凝乳。"],["ladle","舀入模具","不怎麼切，大片凝乳一勺一勺舀進圓模。"],["drain","自然排水","不加壓，靠重力慢慢滴乾，所以水分多、口感軟。"],["spray","撒鹽、噴白黴","撒鹽後噴上白黴菌（Penicillium candidum）。"],["mold","長出白黴","約一週後外皮長滿白色絨毛。"],["age","熟成 3–5 週","白黴分解蛋白質，起司由外往內變軟。"]]},
 blue:{info:{"why": "藍黴菌需要氧氣才能長。起司不壓榨，凝乳之間留縫，再用針戳出通道，空氣進去，藍黴就沿著洞長出藍紋。大量的鹽則讓其他雜菌長不起來，只留下耐鹽的藍黴。", "hist": "傳說是牧羊人把麵包和羊奶起司忘在洞穴裡，幾週後長滿藍黴。1666 年土魯斯議會就規定只有孔巴盧山洞穴熟成的才能叫洛克福；1925 年它成為法國第一個受保護產地的起司。過去藍黴菌是從發霉的裸麥麵包取得的。", "fl": "藍黴分解脂肪，產生甲基酮類（例如 2-庚酮），就是那股辛辣、像藍紋的味道；分解蛋白質讓口感綿滑。鹹、辣、濃郁，帶一點甜。", "tags": ["辛辣", "鹹", "奶油", "菇味", "堅果"]},g:"cheese",n:"藍黴起司",steps:[["milk","生乳","牛奶或羊奶，加入藍黴菌（Penicillium roqueforti）。"],["rennet","凝固","凝乳切成大塊。"],["ladle","入模","不壓榨，讓凝乳之間留有縫隙。"],["salt","鹽漬","抹鹽，鹽多是藍黴起司鹹的原因。"],["pierce","戳洞","用長針戳出許多通道，讓空氣進去。"],["blue","藍紋生長","藍黴需要氧氣，沿著洞和縫隙長出藍綠紋。"],["cave","洞穴熟成","在涼爽潮濕處熟成 2 個月以上。"]]},
 wash:{info:{"why": "熟成時反覆用鹽水、啤酒或白蘭地擦洗外皮，讓耐鹽的橘紅色細菌（亞麻短桿菌）長滿表面，擋住其他黴菌，同時從外往內分解起司，讓內部變得柔軟。", "hist": "洗浸起司大多起源於中世紀的修道院。修士們在齋戒日不能吃肉，這種味道濃厚、帶「肉味」的起司就成了重要的蛋白質來源。塔雷吉歐則在倫巴底的塔雷吉歐山谷洞穴熟成，已有上千年歷史。", "fl": "外皮聞起來很重，像牛棚、臭襪子、煙燻肉；裡面卻是溫和的奶油、果香和堅果味，口感黏軟。俗話說「聞起來臭，吃起來香」。", "tags": ["牛棚", "肉香", "奶油", "果香"]},g:"cheese",n:"洗浸起司",steps:[["milk","生乳","牛奶。"],["rennet","凝固、切凝乳","切成核桃大小。"],["ladle","入模排水","輕壓或不壓。"],["salt","鹽漬","抹鹽或泡鹽水。"],["wash","洗外皮","每隔幾天用鹽水、啤酒或白蘭地擦洗外皮。"],["age","熟成","外皮長出橘紅色細菌，帶來強烈氣味。"]]},
 semi:{info:{"why": "壓榨把乳清擠掉，起司變得紮實、能放得久、也方便運送。切達的「切達化」讓凝乳變酸、變緊密；高達的「洗凝乳」把部分乳清換成熱水，帶走乳糖，所以比較甜、不會太酸。", "hist": "切達村旁的峽谷洞穴很適合熟成；12 世紀英王亨利二世就有大量採購切達的紀錄。19 世紀約瑟夫・哈定（Joseph Harding）把製程標準化，被稱為「切達之父」。高達則以荷蘭高達鎮的起司市集命名，靠荷蘭的海上貿易賣到全世界。", "fl": "年輕時溫和、奶香；熟成越久越濃：切達帶酸和堅果味、有脆脆的結晶，熟成高達則像焦糖和奶油糖。", "tags": ["奶油", "堅果", "焦糖", "微酸"]},g:"cheese",n:"半硬質起司（切達、高達）",steps:[["milk","生乳","牛奶。"],["rennet","凝固","加乳酸菌與凝乳酶。"],["cut","切凝乳","切成玉米粒大小，排出更多乳清。"],["heat","加溫攪拌","加熱到約 38°C 攪拌，凝乳收縮變紮實。"],["cheddaring","切達化／洗凝乳","切達：凝乳塊疊起翻轉；高達：用熱水替換部分乳清。"],["press","入模壓榨","壓出剩下的乳清，形成紮實的起司。"],["brine","鹽漬","泡鹽水或拌鹽。"],["age","熟成","數週到兩年，越久越濃。"]]},
 hard:{info:{"why": "阿爾卑斯山區夏天草多、牛奶多，冬天卻什麼都沒有。凝乳切得很細、加熱到 50°C 以上排水，再強力壓成大輪，水分少，可以放過整個冬天。大輪起司要很多牛奶，所以村民把牛奶集中在一起做。", "hist": "侏羅山區的起司合作社（fruitière）從 13 世紀就存在，農家把牛奶集中做成大輪的康堤。瑞士的艾曼塔與格呂耶爾也是山區合作做起司的傳統。艾曼塔的孔洞是丙酸菌產生的二氧化碳，丙酸同時帶來甜甜的堅果味。", "fl": "堅果、焦糖、烤奶油、高湯般的鮮味；熟成久的會有白色結晶與水果香。艾曼塔偏甜溫和，格呂耶爾和康堤更濃。", "tags": ["榛果", "焦糖", "高湯", "水果"]},g:"cheese",n:"硬質起司（艾曼塔、康堤）",steps:[["milk","生乳","高山牧場的生乳，在銅鍋中處理。"],["rennet","凝固","加菌種與凝乳酶。"],["harp","切成米粒","用起司豎琴把凝乳切得很細。"],["heat","加熱到 50°C 以上","高溫讓凝乳排出大量水分。"],["cloth","用布撈起","把凝乳撈起放進大模具。"],["press","強力壓榨","壓一整天。"],["brine","泡鹽水","泡 1–3 天，形成外皮。"],["cave","熟成","數月到數年，期間刷洗、翻面。艾曼塔會先放溫暖室產生孔洞。"]]},
 xhard:{info:{"why": "把凝乳打成米粒大、加熱到 55°C，排出最多水分，再熟成一年以上，水分極少，可以保存好幾年，是很值錢、能遠途交易的「財產」。", "hist": "中世紀時，帕爾瑪一帶的本篤會與熙篤會修士開墾平原、養牛，做出這種大輪起司。14 世紀薄伽丘的《十日談》就提到一座磨碎帕瑪森堆成的山。今天每輪仍要通過檢查，合格才烙上印記。", "fl": "長時間熟成把蛋白質分解成大量胺基酸，麩胺酸帶來強烈鮮味，酪胺酸形成脆脆的白色結晶；還有堅果、鳳梨般的果香、肉湯味。", "tags": ["鮮味", "堅果", "果香", "結晶"]},g:"cheese",n:"超硬質起司（帕瑪森）",steps:[["milk","生乳","前晚的牛奶靜置脫脂，與早上的牛奶混合。"],["rennet","凝固","在倒鐘形銅鍋中加入前一天的乳清菌與凝乳酶。"],["harp","切成米粒","用 spino 把凝乳打碎成米粒大小。"],["heat","加熱到 55°C","凝乳沉到鍋底結成一大團。"],["cloth","撈起分兩輪","一鍋做兩輪，用布撈起。"],["press","入模","在模具中翻面，外皮印上字樣與編號。"],["brine","泡鹽水約 20 天","鹽分慢慢滲入。"],["cave","熟成 12 個月以上","在高架上熟成，定期刷洗翻面；檢查合格才烙印。"]]},
 proc:{info:{"why": "把天然起司加熱、加乳化鹽重組，再殺菌，微生物不再作用：不用冷藏也能放很久、味道一致、好切好融化，還能用掉形狀不好看的起司邊角。", "hist": "1911 年瑞士人格伯（Walter Gerber）與史泰特勒發明了加工起司；1916 年美國的詹姆斯・卡夫取得專利，一次大戰時大量供應軍隊。日本因為氣候潮濕、早期冷藏不普及，長期以加工起司為主流。", "fl": "溫和的牛奶與奶油味、微鹹，口感滑順均勻，加熱融化時不出油。", "tags": ["牛奶", "奶油", "溫和"]},g:"cheese",n:"加工起司",steps:[["select","挑選天然起司","混合切達、高達等不同熟成度的起司。"],["grind","磨碎","切小、磨碎。"],["melt","加乳化鹽加熱","加熱到 80°C 以上融化，乳化鹽讓油水不分離。"],["fill","填充成形","趁熱倒進模具或切片。"],["pack","冷卻包裝","加熱殺菌後微生物不再作用，味道固定。"]]},
 ham:{g:"meat",n:"生火腿",steps:[["leg","選腿","挑選指定產區、重量足夠的豬後腿。"],["saltleg","抹鹽","用海鹽覆蓋表面，鹽會慢慢把水分拉出來。"],["rest","冷藏靜置","在低溫中靜置約 2–3 個月，讓鹽分均勻滲入。"],["wash","清洗晾乾","洗掉表面的鹽，掛起來乾燥。"],["lard","抹豬油","切面抹上豬油、米粉調成的麵糊，防止外層太乾。"],["hang","風乾熟成","掛在通風的熟成室 12 個月以上，酵素分解蛋白質產生鮮甜味。"],["needle","馬骨針檢驗","把馬骨針插進幾個位置聞香，確認熟成狀態。"],["brand","烙印","合格才烙上產區標誌。"]]},

Object.entries({"fresh": ["殺菌讓起司更安全，也讓之後加的菌種成為主角。", "乳酸讓牛奶變酸，蛋白質比較容易凝結，也帶來清爽的酸味。", "凝乳酶切斷酪蛋白，讓它們連成網、抓住脂肪。", "排得越少越濕潤，瑞可塔、茅屋起司就是這樣。", "不熟成，保留最新鮮的奶味。"], "filata": ["水牛奶脂肪和蛋白質都比牛奶多，做出來更濃。", "凝乳酶讓蛋白質結成網。", "酸度要剛剛好：太低拉不開，太高會碎掉。", "熱水讓蛋白質變軟、排成一條條纖維，這就是彈牙口感的來源。", "泡冷水定型、泡鹽水調味。"], "whey": ["乳清裡的白蛋白、球蛋白，凝乳酶抓不住。", "這些蛋白質要靠高溫才會凝結。", "加一點酸，蛋白質就凝成小花浮上來。", "瀝的時間決定濕潤或扎實。"], "white": ["諾曼第的牧草讓牛奶富含脂肪與香氣。", "凝乳越軟、越完整，保留的水分越多。", "不切碎、輕輕舀，是為了保留水分與柔軟。", "不壓榨，水分多，白黴才有東西分解，起司才會變軟。", "鹽調味，也幫助形成外皮；白黴菌是熟成的主角。", "白黴蓋住表面，擋住其他雜菌。", "白黴的酵素從外往內分解蛋白質，所以外層先軟、中心最後熟。"], "blue": ["菌種一開始就混在牛奶裡，才會長在起司內部。", "大塊凝乳之間留下縫隙，藍黴之後可以長進去。", "不壓榨，讓內部保持鬆散、有空隙。", "大量的鹽讓雜菌長不起來，也是藍黴起司鹹的原因。", "藍黴需要氧氣，戳洞是幫它開「通風管」。", "藍紋沿著針孔和縫隙長，所以切面常看到一條條的線。", "洞穴的涼爽與高濕度最適合藍黴慢慢生長。"], "wash": ["。", "切小一點，排出較多水分。", "輕壓保留柔軟度。", "鹽水讓外皮適合耐鹽細菌生長。", "反覆擦洗，讓橘紅色細菌長滿外皮，擋住其他黴菌。", "細菌從外往內分解，味道在外皮最濃。"], "semi": ["。", "乳酸菌決定之後的酸度與風味。", "切得越小，排的乳清越多，起司越硬。", "加溫讓凝乳收縮、吐出水分。", "切達化讓凝乳變酸變緊密；洗凝乳帶走乳糖，讓高達偏甜。", "壓榨做出紮實、好保存的起司。", "鹽抑制雜菌、調味、形成外皮。", "熟成越久，蛋白質分解越多，越濃越有鮮味。"], "hard": ["銅鍋導熱均勻，傳說銅離子也影響風味。", "高山生乳帶有牧草與花的香氣。", "切到米粒大，排水最多，起司才會硬。", "高溫讓凝乳排出大量水分，也篩選出耐熱的菌種。", "布撈起整團凝乳，直接放進大模具。", "壓整天，做出紮實、低水分的大輪。", "鹽水慢慢滲入，形成保護外皮。", "溫暖室讓丙酸菌產氣（孔洞）；涼室慢慢熟成出堅果味。"], "xhard": ["脫脂讓脂肪少一點，適合長期熟成、不易變質。", "前一天的乳清帶著當地特有的菌種，延續風味。", "切到米粒大，排水最多。", "高溫讓凝乳收縮，沉到鍋底黏成一團。", "一鍋分成兩輪，每輪約 40 公斤。", "印上字樣與編號，證明產地與日期。", "大輪起司需要很久鹽分才能滲透。", "一年以上的熟成讓蛋白質大量分解，產生鮮味和結晶。"], "proc": ["混合不同熟成度的起司，調出想要的味道。", "磨碎才能均勻融化。", "乳化鹽讓油和水不分離，融化時才不會出油。", "趁熱成形，冷卻後就固定。", "加熱殺菌後菌種不再作用，所以味道不會再變。"]}).forEach(([k,L])=>L.forEach((w,i)=>{if(w&&w!=="。"&&PROCS[k].steps[i])PROCS[k].steps[i][3]=w}));

/* 插圖：每個 art 函式畫在 200×140 的框內 */
function rng(seed){let s=0;for(const ch of String(seed))s=(s*31+ch.charCodeAt(0))>>>0;return()=>{s=(s*1103515245+12345)>>>0;return(s>>>8)/16777216}}
function shade(hex,p){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=v=>Math.max(0,Math.min(255,Math.round(p<0?v*(1+p):v+(255-v)*p)));return"#"+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,"0")).join("")}

function wedge(o){
  const p=o.paste||"#f5e3a8",r=o.rind||"#c99a4a",top=shade(p,.25),fr=p,rn=g=>`<path d="${g}" fill="${r}"/>`;

  s+=`<path d="M28 74 L176 44 L160 96 Z" fill="${top}"/>`;
  s+=`<path d="M176 44 L160 96" stroke="${r}" stroke-width="6" stroke-linecap="round"/>`;
  if(o.holes){s+=[[60,92,7,4],[96,104,10,5],[132,108,6,3.5],[80,70,8,3],[124,66,6,2.5],[146,80,5,2]].map(h=>`<ellipse cx="${h[0]}" cy="${h[1]}" rx="${h[2]}" ry="${h[3]}" fill="${shade(p,-.18)}"/>`).join("")}
  if(o.veins){const v=o.dark?"#3c5a6e":"#5a8094";s+=`<g stroke="${v}" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".85"><path d="M40 86 q8 6 4 12 q10 -2 14 6"/><path d="M70 92 q6 -6 14 2 q4 8 12 4"/><path d="M104 100 q10 4 8 12"/><path d="M126 104 q6 -8 14 -2 q2 8 10 10"/><path d="M60 68 q10 2 14 -4"/><path d="M100 64 q8 6 18 2"/><path d="M138 62 q4 8 12 10"/></g><g fill="${v}" opacity=".7">${[[52,96],[88,100],[118,112],[146,114],[84,72],[128,72]].map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="3"/>`).join("")}</g>`}
  if(o.crys){const R=rng("crys");for(let i=0;i<26;i++){const x=34+R()*120,y=78+R()*36+(x-28)*.16;s+=`<circle cx="${x}" cy="${Math.min(y,124)}" r="${1+R()*1.3}" fill="#fff8e6"/>`}}
  if(o.zig){s+=`<path d="M162 100 l6 -10 l6 10 l-6 10 z M162 116 l6 -10 l6 10 l-6 10 z" fill="none" stroke="${shade(r,.3)}" stroke-width="1.5"/>`}
  return s}
function wheel(o){
  const big=o.big,rx=big?84:68,ry=big?20:22,h=big?18:28,cy=big?70:66,rt=o.top||"#fbf8f0",rs=o.side||"#efe9da",paste=o.paste||"#f7e9b6";
  let s=`<ellipse cx="96" cy="${cy+h+8}" rx="${rx+6}" ry="${ry}" fill="#0001"/>`;
  s+=`<path d="M${96-rx} ${cy} L${96-rx} ${cy+h} A${rx} ${ry} 0 0 0 ${96+rx} ${cy+h} L${96+rx} ${cy} Z" fill="${rs}" stroke="${shade(rs,-.12)}" stroke-width="1.5"/><ellipse cx="96" cy="${cy}" rx="${rx}" ry="${ry}" fill="${rt}" stroke="${shade(rs,-.12)}" stroke-width="1.5"/>`;
  if(o.kombu){s+=`<g stroke="#6f7a3a" stroke-width="1.6" fill="none" opacity=".8"><path d="M${40} ${cy-6} q20 8 40 0 t40 0 t36 2"/><path d="M${44} ${cy+8} q20 8 40 0 t40 0 t34 2"/><path d="M40 ${cy+h+2} q20 6 40 0 t40 0 t36 0"/></g><path d="M96 ${cy-ry} L96 ${cy+ry}" stroke="#3a4220" stroke-width="3" opacity=".5"/>`}
  else if(o.bloom){const R=rng("bloom"+rx);for(let i=0;i<40;i++){const a=R()*6.28,d=Math.sqrt(R());s+=`<circle cx="${96+Math.cos(a)*d*(rx-6)}" cy="${cy+Math.sin(a)*d*(ry-4)}" r="${1+R()*1.6}" fill="#e6dfcd"/>`}}

  for(let i=0;i<n;i++){const[x,y]=P(i,R),[lx,ly]=P(i,R+16);s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#e6dabf"/><text x="${lx}" y="${ly+4}" text-anchor="middle" font-size="11" fill="#7d6a55">${FL_AX[i]}</text>`}
  s+=`<polygon points="${v.map((x,i)=>P(i,R*x/5).join(",")).join(" ")}" fill="${col}55" stroke="${col}" stroke-width="2.2" stroke-linejoin="round"/>`;
  v.forEach((x,i)=>{const[px,py]=P(i,R*x/5);s+=`<circle cx="${px}" cy="${py}" r="3" fill="${col}"/>`});return s+`</svg>`}

/* 學習：課程＋對對碰；彈出卡片 */
function openSheet(id){const it=BY[id];if(!it)return;const sh=$("#sheet"),b=$("#sheetBody");b.innerHTML=`<div class="shtop">${artSvg(it,"mini")}<div class="grow"><b>${it.n}</b><small>${it.jp}・${it.en}</small></div><button class="shx" data-shx>✕</button></div>`+(it.k==="cheese"?cheeseBody(it):itemBody(it));sh.classList.add("on");b.scrollTop=0;document.body.style.overflow="hidden";
 bindBody(b,true);b.querySelector("[data-shx]").onclick=closeSheet}
function closeSheet(){$("#sheet").classList.remove("on");document.body.style.overflow=""}

/* ---------- 課程 ---------- */
let LM="course",CUR=null;
function cDone(c){const d=ST.done[c.id]||{};return d}
function renderLearn(){const v=$("#v-learn");
 const seg=`<div class="seg">${[["course","課程"],["game","對對碰"]].map(([k,n])=>`<button class="${LM===k?"on":""}" data-lm="${k}">${n}</button>`).join("")}</div>`;
 if(LM==="game"){v.innerHTML=`<h2 class="vt">對對碰</h2><p class="vs">把中文、英文${G.mode===3?"、風味描述":""}放進中間的格子，三樣是同一個就配對成功</p>`+seg+`<div id="game"></div>`;bindSeg(v);renderGame();return}
 if(CUR){renderLesson(v,seg);return}
 const total=COURSES.length,fin=COURSES.filter(c=>cDone(c).quiz!=null).length,next=COURSES.find(c=>cDone(c).quiz==null);
 v.innerHTML=`<h2 class="vt">起司學習課程</h2><p class="vs">照順序上課就不會不知道從哪開始；每課 5 頁＋3 題小測驗</p>${seg}
 <div class="prog"><div><b>${fin}</b> / ${total} 課完成</div><div class="bar"><i style="width:${fin/total*100}%"></i></div></div>
 <div class="path">${COURSES.map((c,i)=>{const d=cDone(c),seen=(d.seen||[]).length,ok=d.quiz!=null;return`<button class="course ${ok?"ok":""} ${next===c?"next":""}" data-co="${i}"><span class="num">${ok?"✓":i+1}</span>${artSvg(BY[c.icon],"mini")}<span class="grow"><b>${c.n}</b><small>${c.d}</small><span class="cbar"><i style="width:${seen/c.L.length*100}%"></i></span><small class="st">${ok?`完成・測驗 ${d.quiz}/${c.Q.length}`:next===c?"▶ 建議從這裡開始":seen?`看到第 ${seen} 頁`:"尚未開始"}</small></span></button>`}).join("")}</div>`;
 bindSeg(v);v.querySelectorAll("[data-co]").forEach(b=>b.onclick=()=>{const c=COURSES[+b.dataset.co],d=cDone(c);CUR={c:+b.dataset.co,i:d.quiz!=null?0:Math.min((d.seen||[]).length,c.L.length-1),ans:{}};renderLearn();window.scrollTo(0,0)})}
function bindSeg(v){v.querySelectorAll("[data-lm]").forEach(b=>b.onclick=()=>{LM=b.dataset.lm;renderLearn()})}
function visHtml(vis){let h="";
 if(vis.pico)h+=`<div class="prow">${vis.pico.map((k,i)=>`${i?'<span class="ar">›</span>':""}${picoSvg(k,"pmini")}`).join("")}</div>`;
 if(vis.types)h+=`<div class="tmini">${Object.entries(TYPES).map(([k,T])=>{const ex=CHEESES.find(c=>c.t===k);return`<button data-sh="${ex.id}" style="background:${T.c}">${artSvg(ex,"tiny")}<b style="color:${T.ink}">${T.n}</b><small>${ex.n}</small></button>`}).join("")}</div>`;
 if(vis.board)h+=board(vis.board.map(id=>BY[id]).map(x=>x.k?x:{...x,k:"cheese"}));
 if(vis.cmp){const[a,b]=vis.cmp.map(id=>BY[id]);h+=`<div class="cmp">${[a,b].map(x=>`<button data-sh="${x.id}">${artSvg(x,"cmpa")}<b>${x.n}</b><small>${x.en}</small>${x.k==="cheese"?bars(x):ibars(x)}</button>`).join("")}</div>`}
 if(vis.pr!=null)h+=`<div class="cuts one">${principleCards()[vis.pr]}</div>`;
 if(vis.ids)h+=`<div class="lcards">${vis.ids.map(id=>{const x=BY[id];return`<button data-sh="${id}">${artSvg(x,"lart")}<b>${x.n}</b><small>${x.en}</small><span>${FD[id]||""}</span></button>`}).join("")}</div>`;
 return h}
function renderLesson(v,seg){const c=COURSES[CUR.c],N=c.L.length,i=CUR.i;ST.done[c.id]=ST.done[c.id]||{};
 let h=`<div class="lhead"><button class="btn sec sm" data-back>‹ 課程列表</button><span>第 ${CUR.c+1} 課・${c.n}</span></div><div class="pg">${[...Array(N+1)].map((_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div>`;
 if(i<N){const[t,d,vis]=c.L[i];const seen=new Set(ST.done[c.id].seen||[]);seen.add(i);ST.done[c.id].seen=[...seen];save();
  h+=`<div class="step lesson"><div class="n">第 ${i+1} 頁 / ${N}</div><h3>${t}</h3>${visHtml(vis)}<p>${d}</p>${vis.ids||vis.cmp||vis.types?`<p class="hint">${ic("tap","in")}點圖片可以看詳細介紹與發音</p>`:""}${vis.proc?`<button class="btn sec sm" data-lproc="${vis.proc}">看「${PROCS[vis.proc].n}」製程圖解 →</button>`:""}${vis.plate?`<button class="btn sm" data-lplate>到「組拼盤」試試看 →</button>`:""}<div class="row nav2"><button class="btn sec" data-lp ${i?"":"disabled"}>上一頁</button><button class="btn" data-ln>${i<N-1?"下一頁":"小測驗 →"}</button></div></div>`}
 else{const A=CUR.ans,all=c.Q.every((_,k)=>A[k]!=null),sc=c.Q.filter((q,k)=>A[k]===q[2]).length;
  h+=`<div class="step lesson"><div class="n">小測驗</div><h3>${c.n}・3 題</h3>${c.Q.map((q,k)=>`<div class="qz"><b>${k+1}. ${q[0]}</b><div class="opts">${q[1].map((o,j)=>`<button data-q="${k}" data-o="${j}" class="${A[k]==null?"":j===q[2]?"right":A[k]===j?"wrong":"dim"}" ${A[k]!=null?"disabled":""}>${o}</button>`).join("")}</div>${A[k]!=null?`<div class="exp">${A[k]===q[2]?"✓ 答對了！":"✗ 再記一下："}${q[3]}</div>`:""}</div>`).join("")}
  ${all?`<div class="score">答對 ${sc} / ${c.Q.length}</div><div class="row nav2"><button class="btn sec" data-lp>回到上一頁</button><button class="btn" data-fin>${CUR.c<COURSES.length-1?"完成，下一課 →":"完成全部課程"}</button></div>`:`<div class="row nav2"><button class="btn sec" data-lp>上一頁</button></div>`}</div>`}
 v.innerHTML=h;
 v.querySelector("[data-back]").onclick=()=>{CUR=null;renderLearn()};
 v.querySelectorAll("[data-sh]").forEach(b=>b.onclick=()=>openSheet(b.dataset.sh));
 v.querySelectorAll(".lesson .pt").forEach(g=>g.onclick=()=>openSheet(g.dataset.goitem||g.dataset.goch));
 const lp=v.querySelector("[data-lp]");if(lp)lp.onclick=()=>{CUR.i--;renderLearn();window.scrollTo(0,0)};
 const ln=v.querySelector("[data-ln]");if(ln)ln.onclick=()=>{CUR.i++;renderLearn();window.scrollTo(0,0)};
 v.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{CUR.ans[+b.dataset.q]=+b.dataset.o;keep(renderLearn)});
 const fn=v.querySelector("[data-fin]");if(fn)fn.onclick=()=>{const sc=c.Q.filter((q,k)=>CUR.ans[k]===q[2]).length;ST.done[c.id].quiz=Math.max(sc,ST.done[c.id].quiz||0);save();toast(`第 ${CUR.c+1} 課完成！`);CUR=CUR.c<COURSES.length-1?{c:CUR.c+1,i:0,ans:{}}:null;renderLearn();window.scrollTo(0,0)};
 const pr=v.querySelector("[data-lproc]");if(pr)pr.onclick=()=>openProc(pr.dataset.lproc);
 const pl=v.querySelector("[data-lplate]");if(pl)pl.onclick=()=>{PAIR.mode="plate";go("pair")};}

/* ---------- 對對碰 ---------- */
const GSCOPE={all:"全部",cheese:"起司",meat:"風乾肉",snack:"餅乾配料",drink:"酒"};
const G={scope:"cheese",mode:3,items:[],slot:{},done:[],miss:0,shuffle:{}};
function gPool(){const s=G.scope;return ALL.filter(x=>s==="all"||(s==="snack"?["cracker","extra"].includes(x.k):x.k===s))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newRound(){const pool=gPool(),wrong=shuffle(pool.filter(x=>(ST.wrong||{})[x.id])).slice(0,2),rest=shuffle(pool.filter(x=>!wrong.includes(x)));G.items=[...wrong,...rest].slice(0,4);G.slot={};G.done=[];G.miss=0;G.shuffle={zh:shuffle(G.items),en:shuffle(G.items),fd:shuffle(G.items)}}
function renderGame(){const el=$("#game");if(!G.items.length)newRound();const gs=ST.game||{pairs:0,rounds:0,best:{}};
 const left=k=>G.shuffle[k].filter(x=>!G.done.includes(x.id)&&G.slot[k]!==x.id);
 const tile=(k,x)=>`<button class="gt ${k}" data-gk="${k}" data-gi="${x.id}">${k==="zh"?x.n:k==="en"?x.en:FD[x.id]}</button>`;

/* ---------- 搭配引擎 ---------- */
const CLASSIC=[["camembert","beaujolais","低單寧的果香紅酒配白黴起司，不會苦",3],["brie","beaujolais","法國人秋冬的日常組合",2],["camembert","parma","生火腿的鹹香配白黴的奶油感",2],["brie","parma","法式拼盤常見的組合",1],["roquefort","sauternes","法國最經典的鹹甜組合",5],["manchego","membrillo","西班牙的國民吃法",5],["manchego","iberico","同在西班牙中部長大的老搭檔",2],["burrata","parma","布拉塔配生火腿是義大利開胃菜經典",3],["mozzarella","parma","義式開胃拼盤的基本款",2],["gouda","port","熟成高達的焦糖味配波特酒的果乾香",3],["cheddar","ipa","英國酒館的經典：切達配啤酒",2],["mimolette","yebisu","像烏魚子的鮮味配厚實麥香",2],["kombu","sake","昆布鮮味遇上日本酒",4],["comte","chardonnay","侏羅和勃根地相鄰，在地經典",3],["gruyere","chardonnay","瑞士起司配清爽白酒，起司火鍋也這樣配",2],["mascarpone","fig","抹餅乾再加無花果醬，就是一道甜點",3],["ricotta","honey","瑞可塔淋蜂蜜是義大利家常甜點",3],["process","ritz","小孩最愛的組合",2],["colbyjack","maeda","溫和配奶油香，小孩會喜歡",2],["brie","baguette","法國人的日常吃法",3],["camembert","baguette","諾曼第式吃法",2],["camembert","levain","鹽粒帶出卡門貝爾的奶香",2],["emmental","speck","阿爾卑斯山的鄰居",2],["parmigiano","champagne","鮮味結晶配細緻氣泡",2],["parmigiano","honey","帕瑪森淋蜂蜜是義大利的吃法",2],["pecorino","honey","鹹羊奶起司配蜂蜜",2],["gorgonzola","walnut","藍黴配核桃，再淋點蜂蜜更好",2],["taleggio","crisp","洗浸起司配穀物香",1],["mozzarella","olive","地中海的清爽組合",2]];
const CTRY=s=>(s||"").split(/[・／ ]/).filter(x=>x&&!/各地|地中海/.test(x));
function sameCountry(a,b){const A=CTRY(a.c),B=CTRY(b.c);return A.some(x=>B.includes(x))}
function score(c,x){let s=6;const why=[];
 if(x.k==="cracker"){
  s+=x.int<=c.int?2:-1;
  if(c.salt>=4&&x.salt>=3){s-=3;why.push("兩者都鹹，選減鹽或無鹽的餅乾比較好")}
  else if(c.salt>=4&&x.salt<=1){s+=2;why.push("不加鹽的餅乾，讓鹹起司不會過頭")}
  if(c.tex<=2&&c.salt<=3&&x.salt>=2&&x.fat<4){s+=1;why.push("一點鹽味帶出軟起司的奶香")}
  if(x.fat>=4&&c.int>=3){s-=2;why.push("奶油味重，會跟濃郁起司搶味")}
  if(x.fat>=4&&c.int<=2){s+=1;why.push("奶油香襯托溫和起司")}
  if(c.t==="fresh"&&c.fat>=4&&x.id!=="baguette"){s-=1;why.push("濕軟的起司放薄餅上會變軟，麵包更適合")}
  if(c.t==="fresh"&&x.id==="baguette"){s+=3;why.push("軟綿的新鮮起司最適合抹麵包")}
  if(x.id==="water"){s+=1;why.push("幾乎無味，完全讓起司當主角")}
 }else{
  const d=Math.abs(c.int-x.int);s-=d*1.5;
  if(d<=1)why.push("濃淡相當，誰也不蓋過誰");else if(x.int>c.int)why.push("味道比起司重，份量少一點");else why.push("味道比起司輕，起司會是主角");
 }
 if(x.k==="drink"){
  if(x.bub&&c.fat>=4&&!x.bit){s+=3;why.push("氣泡和酸度把油脂洗掉，越吃越清爽")}
  else if(x.acid>=4&&c.fat>=3){s+=2;why.push("酸度切開起司的油脂")}
  if(c.salt>=4&&x.sw>=4){s+=4;why.push("鹹甜對比：甜酒包住起司的鹹與辣")}
  if(x.tan>=4&&["white","blue","fresh","wash"].includes(c.t)){s-=4;why.push("單寧遇到軟質或藍黴起司容易變苦、有金屬味")}
  if(x.tan>=3&&c.tex>=4){s+=2;why.push("硬質起司的油脂和蛋白質能柔化單寧")}
  if(x.bit>=4&&c.int>=4){s+=2;why.push("苦味壓得住重口味起司")}
  if(x.bit>=2&&x.bit<4&&c.tex>=3&&c.t!=="blue"){s+=1;why.push("麥香和起司的堅果味相呼應")}
  if(x.id==="sake"&&c.fl[2]>=4){s+=2;why.push("日本酒的鮮味和起司的鮮味疊加")}
  if(c.t==="fresh"&&x.int>=4)s-=2;
 }
 if(x.k==="meat"){s+=1.5;
  if(c.salt>=4&&x.salt>=4){s-=2;why.push("鹹上加鹹，兩樣都少放一點")}
  if(c.fat>=4&&x.fat<=1){s+=2;why.push("瘦肉配濃郁起司，油脂剛好互補")}
  if(c.t==="fresh"&&x.salt>=3){s+=2;why.push("火腿的鹹香替清淡起司調味")}
 }
 if(x.k==="extra"){
  if(x.sw>=4&&c.salt>=4){s+=4;why.push("鹹甜對比，經典組合")}
  else if(x.sw>=4&&c.t==="fresh"){s+=2;why.push("甜味讓新鮮起司變成甜點")}
  if(x.salt>=4&&c.salt>=4){s-=2;why.push("兩者都鹹")}
  if(x.acid>=3&&c.fat>=4){s+=1;why.push("酸甜能清口")}
  if(x.id==="walnut"&&(c.t==="blue"||c.t==="white"||c.tex>=4)){s+=2;why.push("核桃微苦的油香和起司很合")}
  if(x.id==="olive"&&c.t==="fresh")s+=2;
 }
 if(x.k!=="cracker"&&x.k!=="extra"&&sameCountry(c,x)){s+=x.k==="drink"?1:2;why.unshift("同一個國家的風味，在地組合")}
 const cl=CLASSIC.find(p=>p[0]===c.id&&p[1]===x.id);if(cl){s+=cl[3];why.unshift("★ "+cl[2])}
 return{s:Math.max(0,Math.min(12,Math.round(s*10)/10)),why:[...new Set(why)].slice(0,3)}}
function best(c,kind,n=4){return ITEMS.filter(x=>x.k===kind).map(x=>({x,...score(c,x)})).sort((a,b)=>b.s-a.s).slice(0,n)}
function bestCheese(x,n=4){return CHEESES.map(c=>({c,...score(c,x)})).sort((a,b)=>b.s-a.s).slice(0,n)}
const lvl=s=>s>=10?"絕配":s>=8?"很搭":s>=6?"可以":s>=4?"普通":"不建議";

function warn(sel){const w=[],ch=sel.filter(x=>x.k==="cheese"),cr=sel.filter(x=>x.k==="cracker"),dr=sel.filter(x=>x.k==="drink");

 if(ch.some(c=>c.salt>=4)&&cr.length&&cr.every(x=>x.salt>=3))w.push("有偏鹹的起司，建議加一款減鹽或無鹽餅乾。");
 if(dr.some(d=>d.tan>=4)&&ch.some(c=>["white","blue"].includes(c.t)))w.push("厚重紅酒配白黴、藍黴起司容易苦，可以改配氣泡酒或甜酒。");
 if(!cr.length&&ch.length)w.push("還沒有餅乾或麵包。");
 if(ch.some(c=>c.salt>=4)&&!sel.some(x=>x.sw>=4))w.push("加一樣甜的（蜂蜜、果醬、甜酒）可以平衡鹹起司。");
 return w.length?`<div class="warn">${w.map(t=>`<div>${ic("tip","in")}${t}</div>`).join("")}</div>`:`<div class="ok">${ic("check","in")}這盤組合很平衡</div>`}

 v.querySelectorAll("[data-tz]").forEach(im=>im.onclick=()=>{let z=$("#tsZoom");if(!z){z=document.createElement("div");z.id="tsZoom";z.onclick=()=>z.classList.remove("on");document.body.appendChild(z)}z.innerHTML=`<img src="${im.src}" alt="">`;z.classList.add("on")})}
function renderTaste(){const v=$("#v-taste"),S=TSETS.find(x=>x.id===TSID);ST.taste=ST.taste||{};const D=ST.taste[S.id]||{};
 const done=S.L.filter(c=>D[c.id]&&D[c.id].done).length,best=S.L.filter(c=>D[c.id]&&D[c.id].s).sort((a,b)=>D[b.id].s-D[a.id].s)[0];
 v.innerHTML=`<h2 class="vt">試吃專區</h2><p class="vs">一包一包照順序試吃，每顆先看風味提示，再寫下自己的感覺</p>
 <div class="chips">${TSETS.map(x=>`<button class="chip ${x.id===TSID?"on":""}" data-ts="${x.id}">${esc(x.name)}</button>`).join("")}</div>
 <div class="ts-head"><b>${esc(S.name)}</b><div class="ts-sub">${esc(S.sub)}</div><div class="ts-sub">${esc(S.when)}</div>
 <div class="ts-prog"><div style="width:${done/S.L.length*100}%"></div></div><div class="ts-sub">已試吃 <b>${done}</b> / ${S.L.length}${best?`・目前最愛：<b>${esc(best.n)}</b> ${"★".repeat(D[best.id].s)}`:""}</div>
 <p class="note">💡 ${esc(S.tip)}</p></div>
 ${S.L.map((c,i)=>{const d=D[c.id]||{n:"",s:0,tags:[],done:0};return`<div class="ts-card${d.done?" done":""}" data-tc="${c.id}">
  <div class="ts-top"><span class="ts-no">${i+1}</span><div class="grow"><b>${esc(c.n)}</b> <span class="ts-jp">${esc(c.jp)}</span><div class="ts-sub">${c.o}・${esc(c.t)}</div></div><span class="ts-lv lv${c.lv}">${LVN[c.lv]}</span></div>
  <div class="ts-bar"><i style="width:${c.lv*20}%"></i></div>
  <div class="ts-hint"><b>👅 風味提示</b>${esc(c.hint)}<div class="ts-sub">👀 ${esc(c.look)}　🔍 ${esc(c.try)}</div></div>
  ${c.ref&&BY[c.ref]?`<button class="ts-more" data-tref="${c.ref}">📖 看「${esc(BY[c.ref].n)}」的完整介紹（產地・品牌・製程・搭配）</button>`:""}
  ${tphHtml(S,c)}
  <div class="ts-me"><div class="ts-row"><button class="ts-done ${d.done?"on":""}" data-tdone="${c.id}">${d.done?"✓ 吃過了":"＋ 吃過了"}</button><span class="ts-star">${[1,2,3,4,5].map(n=>`<button data-tst="${c.id}" data-n="${n}" class="${d.s>=n?"on":""}">★</button>`).join("")}</span></div>
  <div class="ts-tags">${TTAGS.map(t=>`<button class="${(d.tags||[]).includes(t)?"on":""}" data-ttag="${c.id}" data-t="${t}">${t}</button>`).join("")}</div>
  <textarea data-tnote="${c.id}" placeholder="我的筆記：吃起來像什麼？跟上一顆比起來呢？">${esc(d.n||"")}</textarea></div></div>`}).join("")}
 <button class="ts-copy" data-tcopy="1">📋 複製我的試吃筆記</button>`;
 v.querySelectorAll("[data-ts]").forEach(b=>b.onclick=()=>{TSID=b.dataset.ts;renderTaste()});
 tphBind(v);
 v.querySelectorAll("[data-tref]").forEach(b=>b.onclick=()=>openSheet(b.dataset.tref));
 v.querySelectorAll("[data-tdone]").forEach(b=>b.onclick=()=>{const d=tget(S.id,b.dataset.tdone);d.done=d.done?0:1;save();renderTaste()});
 v.querySelectorAll("[data-tst]").forEach(b=>b.onclick=()=>{const d=tget(S.id,b.dataset.tst),n=+b.dataset.n;d.s=d.s===n?0:n;if(d.s)d.done=1;save();renderTaste()});
 v.querySelectorAll("[data-ttag]").forEach(b=>b.onclick=()=>{const d=tget(S.id,b.dataset.ttag),t=b.dataset.t;d.tags=d.tags||[];d.tags=d.tags.includes(t)?d.tags.filter(x=>x!==t):[...d.tags,t];save();b.classList.toggle("on")});
 v.querySelectorAll("[data-tnote]").forEach(a=>a.oninput=()=>{const d=tget(S.id,a.dataset.tnote);d.n=a.value;clearTimeout(a._t);a._t=setTimeout(save,300)});
 v.querySelector("[data-tcopy]").onclick=()=>{const D2=ST.taste[S.id]||{};const txt=S.name+"\n"+S.L.map((c,i)=>{const d=D2[c.id]||{};return`${i+1}. ${c.n}（${c.jp}）${d.s?" "+"★".repeat(d.s):""}${d.tags&&d.tags.length?"｜"+d.tags.join("、"):""}${d.n?"\n   "+d.n:""}`}).join("\n");
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("已複製，可以直接貼給 Claude"),()=>toast("無法複製"))}}


/* ---------- 由左往右滑＝上一步 ---------- */
const VHIST=[];
(function(){let sx=0,sy=0,st=0,ok=false;
 const vis=e=>e&&!e.disabled&&e.offsetParent!==null;
 function back(){const z=$("#tsZoom");if(z&&z.classList.contains("on")){z.classList.remove("on");return 1}
  if($("#sheet").classList.contains("on")){closeSheet();return 1}
  const v=$("#v-"+VIEW);for(const q of["[data-lp]","#gp","#pp","[data-back]"]){const b=v&&v.querySelector(q);if(vis(b)){b.click();return 1}}
  if(VHIST.length){const p=VHIST.pop();go(p,1);return 1}return 0}
 document.addEventListener("touchstart",e=>{const t=e.touches[0];ok=e.touches.length===1&&!e.target.closest("textarea,input,select,.chips,.hscroll,[data-noswipe]");
  let el=e.target;while(ok&&el&&el!==document.body){if(el.scrollWidth>el.clientWidth+4&&getComputedStyle(el).overflowX.match(/auto|scroll/)){ok=false;break}el=el.parentElement}
  sx=t.clientX;sy=t.clientY;st=Date.now()},{passive:true});
 document.addEventListener("touchend",e=>{if(!ok)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(dx>70&&Math.abs(dy)<Math.min(60,dx*.6)&&Date.now()-st<700){if(back())toast("↩ 上一步")}},{passive:true});
 window.swipeBack=back})();
/* ---------- 導航 ---------- */
let VIEW="guide";const R={learn:renderLearn,guide:renderGuide,cheese:renderCheese,items:renderItems,pair:renderPair,proc:renderProc,taste:renderTaste};
function go(v,fromBack){if(!fromBack&&typeof VIEW!=='undefined'&&VIEW!==v&&$("#v-"+VIEW)&&$("#v-"+VIEW).classList.contains('on')){VHIST.push(VIEW);if(VHIST.length>20)VHIST.shift()}if(v!=="proc")stopP();closeSheet();VIEW=v;$$("section.view").forEach(s=>s.classList.toggle("on",s.id==="v-"+v));$$("nav a").forEach(a=>a.classList.toggle("on",a.dataset.v===v));R[v]();window.scrollTo(0,0);try{history.replaceState(null,"","#"+v)}catch(e){}}
$$("nav a").forEach(a=>a.onclick=e=>{e.preventDefault();go(a.dataset.v)});
$("#share").onclick=()=>{const u=location.href.split("#")[0];(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast("已複製連結"),()=>toast("請從網址列複製"))};
go(R[location.hash.slice(1)]?location.hash.slice(1):"learn");

document.getElementById("logo").innerHTML=art(BY.camembert);document.getElementById("share").innerHTML=ic("link");
</script>
