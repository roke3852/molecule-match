<script>
/* ============ 名詞 ============ */
const GL={
 '薇薇特南果':'Huehuetenango（ウエウエテナンゴ）。瓜地馬拉西北部、靠近墨西哥邊境的省分，是瓜地馬拉最高、最乾燥的咖啡產區之一，以明亮的酸質和果香出名。',
 '溪谷':'薇薇特南果多是深谷和高原。從墨西哥平原吹來的熱風讓這裡不容易結霜，咖啡才能種到海拔 2,000 公尺左右。',
 '海拔':'海拔越高、氣溫越低，咖啡果實熟得越慢，豆子密度越高，糖分和酸質發展得更完整，喝起來通常更乾淨、更有層次。這支豆子種在 1,900–2,000 m。',
 'Villa Sarchi':'ヴィジャ・サルチ。阿拉比卡的一個品種，1950 年代在哥斯大黎加西部 Sarchí 被發現，是波旁（Bourbon）的自然突變矮株，以明亮細緻的酸質和花果香著稱。',
 '波旁':'Bourbon。阿拉比卡的經典老品種，名字來自印度洋的波旁島（今留尼旺）。很多中南美的優秀品種都是它的後代。',
 '水洗':'Washed（水洗式）。採收後先去掉果皮果肉，讓豆子在水槽裡發酵，把黏黏的果膠分解掉，再用清水洗淨、曬乾。味道最乾淨、酸質清楚，最能喝出產區和品種本來的樣子。',
 '全水洗':'Fully Washed。完整走完去果肉、發酵、洗淨、乾燥的水洗流程，和只洗一部分的半水洗不同。',
 '果膠':'包在咖啡豆外面、黏黏甜甜的一層（mucilage）。水洗就是靠發酵把它分解掉；蜜處理則是故意留下一部分果膠一起曬乾。',
 '發酵槽':'水洗處理用的水泥或磁磚水槽。去完果肉的豆子在裡面放 12–48 小時，讓微生物把果膠分解，時間要靠經驗判斷。',
 '日曬':'Natural。整顆咖啡果實直接曬乾再去殼，果香濃厚、帶發酵感。這家店的 KURUME 衣索比亞就是日曬。',
 '蜜處理':'Honey Process。去掉果皮，但保留部分果膠一起乾燥，甜感和厚度介於水洗與日曬之間。',
 '微批次':'Micro lot（マイクロロット）。把不同區塊、不同採收日、不同品種的咖啡分開處理和販售，讓每一批的個性能被看見；以前很多小農的咖啡都混在一起賣。',
 '第六代':'Axel Palacios 是家族種咖啡的第 6 代。Palacios 家族從 1930 年左右開始種咖啡，Axel 的兩個兒子也一起投入，打算接手成為第 7 代。',
 'Xinabajul':'Xinabajul Project。薇薇特南果省內小規模生產者的合作計畫：各地區的鄰居組成小社群，一起改善、提升品質，目標是把高品質的薇薇特南果咖啡送到全世界。',
 'ROSMA':'ROSMA 農園。Morales 家族的農園，園主 Freddy（フレディ）是 Xinabajul Project 的帶領者。',
 'Los Suspiros':'ロス・ススピロス。西班牙文的「嘆息」。據說是取自看著這一帶壯闊的溪谷、深深吸一口新鮮空氣的樣子。',
 'Altamia':'Axel 管理的另一座農園。他目前管理 Altamia 和 Los Suspiros 兩座農園。',
 '淺焙':'Light Roast（浅煎り）。烘得淺，保留豆子本身的酸質、花香和果香，苦味低。',
 '杯測':'Cupping。用統一的研磨度、水溫和時間泡咖啡，一匙一匙嚐，評估香氣、酸質、甜感和乾淨度，是挑選生豆的標準方法。',
 'COFFEE COUNTY':'コーヒーカウンティ。從福岡縣久留米起家的自家烘焙咖啡店，到產地挑豆、直接購買，以淺焙單品為主；福岡店在藥院（高砂）。',
 '生豆':'還沒烘焙的咖啡豆，綠色、硬、沒有香氣。產地處理好的生豆會裝進麻袋或真空袋，飄洋過海運到消費國。',
 'BOT':'最佳臺灣咖啡公開賽（Best of Taiwan）。台灣的精品咖啡生豆競賽，得名的批次會拿去國際競標，名次越前面、價格越高。',
 '總統獎':'台灣咖啡競賽中頒給頂尖名次的榮譽獎項；這罐鄒築園藝伎標示「BOT 第 2 名・總統獎」。',
 '競標批次':'比賽得獎、拿去拍賣的那一批生豆，數量很少，通常一場拍賣後就買不到了。',
 '藝伎':'Geisha／Gesha。源自衣索比亞 Gesha 山區的品種，在巴拿馬一戰成名，以茉莉花、柑橘、佛手柑般的香氣聞名，是精品咖啡裡的名貴品種。',
 '鄒族':'台灣原住民族之一，主要生活在阿里山一帶。方政倫是鄒族人，「鄒築園」的鄒就是鄒族。',
 '樂野村':'阿里山鄉的鄒族部落，鄒築園就在這裡，海拔約 1,200 公尺，雲霧多、日照剛好。',
 '索恩娜':'So’ngna。方政倫在買進的藝伎樹苗中，發現長得不一樣的植株，送 DNA 鑑定後發現是衣索比亞原生種，用鄒族語「最好的」為它命名。',
 '八八風災':'2009 年 8 月的莫拉克颱風，重創南台灣山區，阿里山的交通和觀光中斷很久。',
 '十大神農':'台灣農業部門頒給傑出農民的獎項，方政倫在 2017 年獲獎。',
 'SL34':'1930 年代在肯亞由 Scott 實驗室（Scott Laboratories）選育出來的品種，名字的 SL 就是實驗室縮寫；酸質明亮、果汁感強，在阿里山一帶種得很多。',
 '竹崎鄉':'嘉義縣的山區鄉鎮，緊鄰阿里山，珍5吉咖啡莊園在這裡海拔約 1,150 公尺的地方。',
 'COE':'Cup of Excellence 卓越盃。國際性的精品咖啡競賽與拍賣，台灣也有舉辦；珍5吉的 SL34 蜜處理曾在 2024 年台灣 COE 拿下第 12 名。',
 '愛玉':'台灣特有的植物，種子搓洗後會凝成透明的愛玉凍。珍5吉也賣野生愛玉籽。',
 '乾淨度':'Clean cup。喝起來沒有雜味、沒有混濁感，每個味道清清楚楚。通常和處理是否細心、果實是否熟透有關。'
};

/* ============ 風味卡 ============ */
const ITEMS={
 kumquat:['🍊','金桔','熱的時候最先跳出來的明亮柑橘'],
 loquat:['🟠','枇杷','溫和多汁的黃色果實甜'],

function loop(ts){const t=ts/1000;if($('game').classList.contains('on')){(BGS[curBg]||BGS.cafe)(sg,t)}else{BGS.valley(tg,t);tg.fillStyle='rgba(16,25,21,.0)';}requestAnimationFrame(loop)}
requestAnimationFrame(loop);
function portrait(cv,id){const p=PEOPLE[id],g=cv.getContext('2d');g.clearRect(0,0,16,16);if(!p||id==='nar'){g.fillStyle='#22342c';g.fillRect(0,0,16,16);g.fillStyle='#8fc29a';g.fillRect(6,5,4,1);g.fillRect(5,8,6,1);g.fillRect(6,11,4,1);return}
 g.fillStyle='#22342c';g.fillRect(0,0,16,16);g.fillStyle=p.shirt;g.fillRect(2,12,12,4);if(p.apron){g.fillStyle=p.apron;g.fillRect(5,13,6,3)}g.fillStyle=p.skin;g.fillRect(4,4,8,8);g.fillRect(7,11,2,2);
 g.fillStyle=p.hair;g.fillRect(4,3,8,2);g.fillRect(3,4,1,4);g.fillRect(12,4,1,4);if(id==='staff'){g.fillRect(3,4,1,7);g.fillRect(12,4,1,7)}if(p.hat){g.fillStyle=p.hat;g.fillRect(2,3,12,1);g.fillRect(4,1,8,2)}
 g.fillStyle='#111';g.fillRect(6,7,1,1);g.fillRect(9,7,1,1);g.fillStyle='#a0524a';g.fillRect(7,10,2,1)}
/* ============ 聲音 ============ */
let AC=null,MU=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null}}if(AC.state==='suspended')AC.resume();return AC}
function blip(f,d,type,v){if(!DB.snd)return;const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type||'square';o.frequency.value=f;g.gain.setValueAtTime(v||.05,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+d+.02)}
let lastTick=0;function tick(sp){const now=performance.now();if(now-lastTick<45)return;lastTick=now;const p=PEOPLE[sp]||{};blip((p.pitch||500)*(0.95+Math.random()*.1),.04,'square',.035)}
const SCALE=[0,2,4,7,9,12,14];const THEME={cafe:[57,0.55],valley:[62,0.7],farm:[60,0.6],school:[64,0.5],meeting:[55,0.65],wet:[59,0.6],dry:[62,0.55],sea:[57,0.75],roast:[52,0.6],cup:[60,0.7]};
function musicStart(){if(MU||!DB.mus)return;const a=ac();if(!a)return;const mg=a.createGain();mg.gain.value=.05;mg.connect(a.destination);let step=0;
 MU={g:mg,timer:setInterval(()=>{if(!DB.mus)return;const th=THEME[curBg]||[60,.6];const base=th[0];const t=a.currentTime;const pat=[0,4,2,5,3,6,4,1];const n=base+SCALE[pat[step%8]];
  const o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=440*Math.pow(2,(n-69)/12);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(1,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+th[1]*1.6);o.connect(g).connect(mg);o.start(t);o.stop(t+th[1]*1.7);
  if(step%4===0){const b=a.createOscillator(),bg=a.createGain();b.type='sine';b.frequency.value=440*Math.pow(2,(base-12-69)/12);bg.gain.setValueAtTime(.0001,t);bg.gain.linearRampToValueAtTime(.8,t+.05);bg.gain.exponentialRampToValueAtTime(.0001,t+2);b.connect(bg).connect(mg);b.start(t);b.stop(t+2.1)}
  step++},650)}}
function musicStop(){if(MU){clearInterval(MU.timer);try{MU.g.disconnect()}catch(e){}MU=null}}
/* ============ 名詞連結 ============ */
const GKEYS=Object.keys(GL).sort((a,b)=>b.length-a.length);
const GRE=new RegExp(GKEYS.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g');
function termChips(s){const el=$('terms');if(!el)return;const seen=[];(s||'').replace(GRE,m=>{if(!seen.includes(m))seen.push(m);return m});el.innerHTML=seen.map(k=>`<button class="tchip" data-chip="${esc(k)}">📖 ${esc(k)}</button>`).join('')}
function linkify(s){return esc(s).replace(GRE,m=>`<span class="term" data-g="${m}">${m}</span>`)}
function popup(el,k){const pp=$('pop');pp.innerHTML=`<b>${esc(k)}</b>${esc(GL[k])}`;pp.style.display='block';const r=el.getBoundingClientRect();const w=Math.min(300,innerWidth-20);pp.style.maxWidth=w+'px';let x=Math.max(10,Math.min(innerWidth-w-10,r.left));pp.style.left=x+'px';const ph=pp.offsetHeight;pp.style.top=(r.top-ph-8>10?r.top-ph-8:r.bottom+8)+'px';blip(880,.06,'sine',.05)}
document.addEventListener('click',e=>{const tm=e.target.closest('.term,[data-chip]');if(tm){e.stopPropagation();popup(tm,tm.dataset.g||tm.dataset.chip);return}if(!e.target.closest('#pop'))$('pop').style.display='none'},true);
/* ============ 劇情引擎 ============ */
let typing=null,waiting=false,busy=false,curText='',curSp='nar',hist=[];
function mark(i){if(hist[hist.length-1]!==i)hist.push(i);const b=$('bBack');if(b)b.disabled=hist.length<2}
function setBg(b,loc){curBg=b;curLoc=loc||'';$('loc').textContent=loc||'';}
function chapterCard(ci,cb){const c=CHS[ci];const cc=$('chapCard');cc.innerHTML=`<b>${esc(c.t)}</b><h2>${esc(c.n)}</h2><p>${esc(c.sub)}</p>`;cc.classList.add('on');busy=true;blip(523,.15,'triangle',.06);setTimeout(()=>blip(784,.25,'triangle',.06),160);setTimeout(()=>{cc.classList.remove('on');busy=false;cb()},1900)}
function startChapter(ci,fresh){DB.ch=ci;DB.i=0;hist=[];$('bBack').disabled=true;save();$('terms').innerHTML='';show('game');musicStart();const c=CHS[ci];$('chName').textContent=c.t+'・'+c.n;setBg(c.bg,'');$('txt').innerHTML='';$('nm').innerHTML='';$('opts').innerHTML='';portrait($('pf'),'nar');chapterCard(ci,step)}
function resume(){const c=CHS[DB.ch];show('game');musicStart();$('chName').textContent=c.t+'・'+c.n;let bg=c.bg,loc='';for(let k=0;k<DB.i;k++){const n=c.nodes[k];if(n.bg){bg=n.bg;loc=n.loc}}setBg(bg,loc);
 // 回到最近一句台詞
 let k=DB.i-1;while(k>=0&&!(c.nodes[k].t!==undefined))k--;DB.i=Math.max(0,k);hist=[];step()}
function step(){const c=CHS[DB.ch];$('opts').innerHTML='';
 while(DB.i<c.nodes.length){const n=c.nodes[DB.i];
  if(n.bg){setBg(n.bg,n.loc);DB.i++;continue}
  if(n.get){DB.i++;getItem(n.get);continue}
  if(n.end){DB.i++;save();finale();return}
  if(n.c){mark(DB.i);showChoice(n);return}
  mark(DB.i);DB.i++;save();showLine(n);return}
 chapterDone()}
function showLine(n){const p=PEOPLE[n.s]||PEOPLE.nar;curSp=n.s;portrait($('pf'),n.s);$('nm').innerHTML=n.s==='nar'?'':`${esc(p.n)}<small>${esc(p.sub)}</small>`;
 $('terms').innerHTML='';const tx=$('txt');tx.className=n.s==='nar'?'nar':'';curText=n.t;let i=0;tx.textContent='';waiting=true;$('nxt').style.visibility='hidden';clearInterval(typing);
 typing=setInterval(()=>{i++;tx.textContent=curText.slice(0,i);if(n.s!=='nar'&&/\S/.test(curText[i-1]||''))tick(n.s);if(i>=curText.length)finishType()},38)}
function finishType(){clearInterval(typing);typing=null;$('txt').innerHTML=linkify(curText);termChips(curText);$('nxt').style.visibility='visible'}
function goBack(){if(busy||$('game').classList.contains('on')===false)return;if(hist.length<2){toast('已經是這一章的第一句');return}
 clearInterval(typing);typing=null;$('pop').style.display='none';hist.pop();const prev=hist.pop();const c=CHS[DB.ch];
 let bg=c.bg,loc='';for(let k=0;k<prev;k++){const n=c.nodes[k];if(n.bg){bg=n.bg;loc=n.loc}}setBg(bg,loc);DB.i=prev;save();blip(440,.05,'sine',.04);step()}
function advance(){if(busy)return;if(!waiting)return;if(typing){finishType();return}waiting=false;step()}
function showChoice(n){waiting=false;$('nxt').style.visibility='hidden';portrait($('pf'),'me');$('nm').innerHTML=`${esc(PEOPLE.me.n)}<small>想一想</small>`;$('txt').className='';$('txt').innerHTML=linkify(n.c);termChips(n.c+' '+n.o.map(o=>o.t).join(' '));
 const box=$('opts');box.innerHTML=n.o.map((o,i)=>`<button class="opt" data-o="${i}">${esc(o.t)}</button>`).join('');
 box.querySelectorAll('[data-o]').forEach(b=>b.onclick=e=>{e.stopPropagation();const o=n.o[+b.dataset.o];if(o.ok){blip(660,.08,'triangle',.07);setTimeout(()=>blip(990,.14,'triangle',.07),90);
   termChips(o.r);box.innerHTML=`<div class="fb">⭕ ${linkify(o.r)}</div><button class="opt" id="goOn">繼續故事 ▶</button>`;$('goOn').onclick=ev=>{ev.stopPropagation();DB.i++;save();step()}}
  else{blip(220,.2,'sawtooth',.04);b.classList.add('bad');b.disabled=true;let f=box.querySelector('.fb');if(!f){f=document.createElement('div');box.appendChild(f)}termChips(o.r);f.className='fb no';f.innerHTML='🤔 '+linkify(o.r)+'<br><small style="color:var(--sub)">再選一次看看</small>'}})}
function getItem(k){if(!DB.got.includes(k)){DB.got.push(k);save();const it=ITEMS[k];toast(`${it[0]} 獲得風味卡：${it[1]}`);blip(784,.1,'triangle',.06);setTimeout(()=>blip(1046,.18,'triangle',.06),110)}}
function beanHTML(b){return`<div class="tasting"><b>🫘 ${esc(b.name)}</b><div class="sub" style="margin-top:4px">${esc(b.proc)}・售價 ${esc(b.price)}</div><div class="bars">${Object.entries(b.sc).map(([k,v])=>`<span>${k}</span><i><u style="width:${v*20}%"></u></i><b>${v}</b>`).join('')}</div><p class="sub">風味：${esc(b.fl)}</p></div>`}
function sideCard(){openCard(`<h3>🇹🇼 外傳：台灣的兩支得獎豆</h3><p class="sub">在旅途中的台灣咖啡攤位遇到的兩罐競標批次。</p><div class="clist">${CHS.map((c,i)=>c.side?`<button class="ci ${DB.done.includes(i)?'done':''}" data-sd="${i}"><span class="n">${DB.done.includes(i)?'✓':'外'}</span><div style="text-align:left"><b>${esc(c.t)}・${esc(c.n)}</b><div class="sub">${esc(c.sub)}</div></div></button>`:'').join('')}</div>`);
 document.querySelectorAll('[data-sd]').forEach(b=>b.onclick=()=>{closeCard();ac();startChapter(+b.dataset.sd)})}
function chapterDone(){if(!DB.done.includes(DB.ch))DB.done.push(DB.ch);save();const nx=DB.ch+1;const cur=CHS[DB.ch];
 if(cur.side){DB.ch=0;DB.i=0;save();blip(523,.2,'triangle',.07);setTimeout(()=>blip(784,.3,'triangle',.07),200);
  openCard(`<h3>✔ ${esc(cur.t)}・${esc(cur.n)} 完成</h3>${beanHTML(cur.bean)}<p class="sub">風味卡 ${DB.got.length} / ${Object.keys(ITEMS).length}</p><div class="menu" style="max-width:none"><button class="mbtn pri" id="sMore">🇹🇼<div>看另一篇外傳</div></button><button class="mbtn" id="cHome">☰<div>回到標題</div></button></div>`);
  $('sMore').onclick=()=>{closeCard();sideCard()};$('cHome').onclick=()=>{closeCard();toTitle()};return}
 if(nx<CHS.length){openCard(`<h3>✔ ${esc(CHS[DB.ch].t)}・${esc(CHS[DB.ch].n)} 完成</h3><p class="sub">風味卡 ${DB.got.length} / ${Object.keys(ITEMS).length}</p><div class="menu" style="max-width:none"><button class="mbtn pri" id="cNext">▶<div>下一章<small>${esc(CHS[nx].t)}：${esc(CHS[nx].n)}</small></div></button><button class="mbtn" id="cHome">☰<div>回到標題</div></button></div>`);
  $('cNext').onclick=()=>{closeCard();startChapter(nx)};$('cHome').onclick=()=>{closeCard();toTitle()};DB.ch=nx;DB.i=0;save()}}
function finale(){if(!DB.done.includes(DB.ch))DB.done.push(DB.ch);DB.ch=0;DB.i=0;DB.fin=1;save();blip(523,.2,'triangle',.07);setTimeout(()=>blip(659,.2,'triangle',.07),200);setTimeout(()=>blip(784,.4,'triangle',.07),400);
 openCard(`<h3>🌄 嘆息之谷・完</h3><p>山谷的空氣、六代人的樹、高中同學、Xinabajul 的鄰居們、水洗的一夜、跨過太平洋的生豆，最後變成你手上的這一杯。</p>${tastingHTML()}<h3 style="margin-top:14px">🎴 風味收集冊 ${DB.got.length} / ${Object.keys(ITEMS).length}</h3>${itemsHTML()}<div class="menu" style="max-width:none"><button class="mbtn" id="fHome">☰<div>回到標題</div></button></div>`);

function tastingHTML(){const bar=(k,v)=>`<span>${k}</span><i><u style="width:${v*20}%"></u></i><b>${v}</b>`;
 return `<div class="tasting"><b>☕ 你的品飲筆記</b><div class="sub">COFFEE COUNTY Fukuoka（藥院）・2026/11/27・手沖</div>
 <div class="sub" style="margin-top:6px">Guatemala Los Suspiros・Villa Sarchi・Fully Washed・Light Roast<br>生產者 Axel Palacios・薇薇特南果 La Libertad Palmira・1,900–2,000 m</div>

function itemsHTML(){return `<div class="items">${Object.entries(ITEMS).map(([k,v])=>{const h=DB.got.includes(k);return`<div class="it ${h?'':'no'}"><b>${h?v[0]:'？'}</b>${h?esc(v[1]):'未收集'}${h?`<div class="sub" style="font-size:11px;margin-top:2px">${esc(v[2])}</div>`:''}</div>`}).join('')}</div>`}
