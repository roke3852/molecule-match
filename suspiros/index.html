.mapsvg .pin{stroke:#0e1a1f;stroke-width:1.2}.mapsvg .pin.farm{fill:var(--gold)}.mapsvg .pin.city{fill:var(--mist)}.mapsvg .pin.port{fill:#6fb0d0}.mapsvg .pin.lab{fill:var(--leafL)}.mapsvg .pin.home{fill:var(--cherry)}
.mapsvg .ping{fill:none;stroke:var(--gold);stroke-width:1.2;animation:ping 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
.mapsvg g[data-pin]{cursor:pointer}.mapsvg g.on text{fill:var(--gold);font-weight:700}
@keyframes ping{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.4);opacity:0}}
.mtabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.mtab{border:1px solid var(--line);background:var(--ink);border-radius:16px;padding:5px 11px;font-size:13px}.mtab.on{background:var(--gold);color:#1b1408;border-color:var(--gold);font-weight:700}
.pinfo{margin-top:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--ink);font-size:14px;line-height:1.7;min-height:52px}.pinfo b{color:var(--gold)}
.plist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.plist button{border:1px solid var(--line);background:var(--ink3);border-radius:8px;padding:4px 8px;font-size:12.5px}
.prof{width:100%;height:auto;display:block;margin-top:8px;background:#0e1a1f;border:1px solid var(--line);border-radius:10px}.prof text{font-size:9px;fill:var(--cream)}.prof .ax{font-size:8px;fill:var(--sub)}
@media (prefers-reduced-motion:reduce){.mapsvg .ping{animation:none}}

 <div class="credit">故事根據 COFFEE COUNTY 的豆卡改編；人物對話為想像重現，生產者、產區、品種與風味描述依照店家卡片。<br>品飲紀錄：Roke，2026/11/27 於 COFFEE COUNTY Fukuoka<br>外傳依鄒築園、珍5吉咖啡莊園的公開報導與罐上標示改編。<br>外傳三依 Rufous Chelbesa 豆袋標示與你的沖煮筆記改編；阿貝貝、緹吉絲特、達維特為想像人物。</div>

<script>
/* ============ 名詞 ============ */
const GL={
 '薇薇特南果':'Huehuetenango（ウエウエテナンゴ）。瓜地馬拉西北部、靠近墨西哥邊境的省分，是瓜地馬拉最高、最乾燥的咖啡產區之一，以明亮的酸質和果香出名。',
 '溪谷':'薇薇特南果多是深谷和高原。從墨西哥平原吹來的熱風讓這裡不容易結霜，咖啡才能種到海拔 2,000 公尺左右。',
 '海拔':'海拔越高、氣溫越低，咖啡果實熟得越慢，豆子密度越高，糖分和酸質發展得更完整，喝起來通常更乾淨、更有層次。這支豆子種在 1,900–2,000 m。',
 'Villa Sarchi':'ヴィジャ・サルチ。阿拉比卡的一個品種，1950 年代在哥斯大黎加西部 Sarchí 被發現，是波旁（Bourbon）的自然突變矮株，以明亮細緻的酸質和花果香著稱。',
 '波旁':'Bourbon。阿拉比卡的經典老品種，名字來自印度洋的波旁島（今留尼旺）。很多中南美的優秀品種都是它的後代。',
 '水洗':'Washed（水洗式）。採收後先去掉果皮果肉，讓豆子在水槽裡發酵，把黏黏的果膠分解掉，再用清水洗淨、曬乾。味道最乾淨、酸質清楚，最能喝出產區和品種本來的樣子。',
 '全水洗':'Fully Washed。完整走完去果肉、發酵、洗淨、乾燥的水洗流程，和只洗一部分的半水洗不同。',
 '果膠':'包在咖啡豆外面、黏黏甜甜的一層（mucilage）。水洗就是靠發酵把它分解掉；蜜處理則是故意留下一部分果膠一起曬乾。',
 '發酵槽':'水洗處理用的水泥或磁磚水槽。去完果肉的豆子在裡面放 12–48 小時，讓微生物把果膠分解，時間要靠經驗判斷。',
 '日曬':'Natural。整顆咖啡果實直接曬乾再去殼，果香濃厚、帶發酵感。這家店的 KURUME 衣索比亞就是日曬。',
 '蜜處理':'Honey Process。去掉果皮，但保留部分果膠一起乾燥，甜感和厚度介於水洗與日曬之間。',
 '微批次':'Micro lot（マイクロロット）。把不同區塊、不同採收日、不同品種的咖啡分開處理和販售，讓每一批的個性能被看見；以前很多小農的咖啡都混在一起賣。',
 '第六代':'Axel Palacios 是家族種咖啡的第 6 代。Palacios 家族從 1930 年左右開始種咖啡，Axel 的兩個兒子也一起投入，打算接手成為第 7 代。',
 'Xinabajul':'Xinabajul Project。薇薇特南果省內小規模生產者的合作計畫：各地區的鄰居組成小社群，一起改善、提升品質，目標是把高品質的薇薇特南果咖啡送到全世界。',
 'ROSMA':'ROSMA 農園。Morales 家族的農園，園主 Freddy（フレディ）是 Xinabajul Project 的帶領者。',
 'Los Suspiros':'ロス・ススピロス。西班牙文的「嘆息」。據說是取自看著這一帶壯闊的溪谷、深深吸一口新鮮空氣的樣子。',
 'Altamia':'Axel 管理的另一座農園。他目前管理 Altamia 和 Los Suspiros 兩座農園。',
 '淺焙':'Light Roast（浅煎り）。烘得淺，保留豆子本身的酸質、花香和果香，苦味低。',
 '杯測':'Cupping。用統一的研磨度、水溫和時間泡咖啡，一匙一匙嚐，評估香氣、酸質、甜感和乾淨度，是挑選生豆的標準方法。',
 'COFFEE COUNTY':'コーヒーカウンティ。從福岡縣久留米起家的自家烘焙咖啡店，到產地挑豆、直接購買，以淺焙單品為主；福岡店在藥院（高砂）。',
 '生豆':'還沒烘焙的咖啡豆，綠色、硬、沒有香氣。產地處理好的生豆會裝進麻袋或真空袋，飄洋過海運到消費國。',
 'BOT':'最佳臺灣咖啡公開賽（Best of Taiwan）。台灣的精品咖啡生豆競賽，得名的批次會拿去國際競標，名次越前面、價格越高。',
 '總統獎':'台灣咖啡競賽中頒給頂尖名次的榮譽獎項；這罐鄒築園藝伎標示「BOT 第 2 名・總統獎」。',
 '競標批次':'比賽得獎、拿去拍賣的那一批生豆，數量很少，通常一場拍賣後就買不到了。',
 '藝伎':'Geisha／Gesha。源自衣索比亞 Gesha 山區的品種，在巴拿馬一戰成名，以茉莉花、柑橘、佛手柑般的香氣聞名，是精品咖啡裡的名貴品種。',
 '鄒族':'台灣原住民族之一，主要生活在阿里山一帶。方政倫是鄒族人，「鄒築園」的鄒就是鄒族。',
 '樂野村':'阿里山鄉的鄒族部落，鄒築園就在這裡，海拔約 1,200 公尺，雲霧多、日照剛好。',
 '索恩娜':'So’ngna。方政倫在買進的藝伎樹苗中，發現長得不一樣的植株，送 DNA 鑑定後發現是衣索比亞原生種，用鄒族語「最好的」為它命名。',
 '八八風災':'2009 年 8 月的莫拉克颱風，重創南台灣山區，阿里山的交通和觀光中斷很久。',
 '十大神農':'台灣農業部門頒給傑出農民的獎項，方政倫在 2017 年獲獎。',
 'SL34':'1930 年代在肯亞由 Scott 實驗室（Scott Laboratories）選育出來的品種，名字的 SL 就是實驗室縮寫；酸質明亮、果汁感強，在阿里山一帶種得很多。',
 '竹崎鄉':'嘉義縣的山區鄉鎮，緊鄰阿里山，珍5吉咖啡莊園在這裡海拔約 1,150 公尺的地方。',
 'COE':'Cup of Excellence 卓越盃。國際性的精品咖啡競賽與拍賣，台灣也有舉辦；珍5吉的 SL34 蜜處理曾在 2024 年台灣 COE 拿下第 12 名。',
 '愛玉':'台灣特有的植物，種子搓洗後會凝成透明的愛玉凍。珍5吉也賣野生愛玉籽。',
 'Chelbesa':'切爾貝薩（chell BEH-suh）。衣索比亞南部 Gedeb 的一個咖啡社區（kebele），屬於廣義的耶加雪菲；咖啡來自上千戶小農，交給當地的處理站統一處理。',

$('ov').onclick=e=>{if(e.target.id==='ov')closeCard()};
function toTitle(){show('title');refreshTitle()}
function refreshTitle(){const has=DB.i>0||DB.ch>0;$('bCont').disabled=!has;$('sCont').textContent=has?`${CHS[DB.ch].t}：${CHS[DB.ch].n}`:'還沒有進度';$('sStart').textContent=DB.fin?'已看完全篇・從序章重新開始':'序章：藥院的一杯咖啡'}
function chapSel(){openCard(`<h3>📖 章節選擇</h3><div class="clist">${CHS.map((c,i)=>{if(c.side)return'';const ok=i===0||DB.done.includes(i)||DB.done.includes(i-1)||DB.fin;return`<button class="ci ${DB.done.includes(i)?'done':''} ${ok?'':'lock'}" data-cs="${i}" ${ok?'':'disabled'}><span class="n">${DB.done.includes(i)?'✓':i}</span><div style="text-align:left"><b>${esc(c.t)}・${esc(c.n)}</b><div class="sub">${esc(c.sub)}</div></div></button>`}).join('')}</div><p class="sub">看完上一章，下一章就會解鎖。</p>`);
 document.querySelectorAll('[data-cs]').forEach(b=>b.onclick=()=>{closeCard();ac();startChapter(+b.dataset.cs)})}
function glossCard(){openCard(`<h3>📚 咖啡小辭典</h3><div class="gl">${Object.entries(GL).map(([k,v])=>`<div><b>${esc(k)}</b><br>${esc(v)}</div>`).join('')}</div>`)}
function bagCard(){openCard(`<h3>🎴 風味收集冊 ${DB.got.length} / ${Object.keys(ITEMS).length}</h3><p class="sub">故事裡會一張一張收集到這支咖啡的風味。</p>${itemsHTML()}${DB.fin?tastingHTML():''}${CHS.filter((c,i)=>c.side&&DB.done.includes(i)).map(c=>beanHTML(c.bean)).join('')}`)}
$('bStart').onclick=()=>{ac();DB.fin=DB.fin||0;startChapter(0,1)};
$('bCont').onclick=()=>{ac();resume()};
$('bChap').onclick=chapSel;$('bSide').onclick=sideCard;$('bGloss').onclick=glossCard;$('bItems').onclick=bagCard;
$('bHome').onclick=e=>{e.stopPropagation();clearInterval(typing);typing=null;toTitle()};
$('bBag').onclick=e=>{e.stopPropagation();bagCard()};
$('bMap').onclick=e=>{e.stopPropagation();const ks=mapSetOf(DB.ch);openMap(ks,ks[0])};
$('bMapT').onclick=()=>openMap(MAPSETS.title,'all');
function sndUI(){$('bSnd').textContent=DB.snd?'🔊':'🔇';$('bMus').style.opacity=DB.mus?1:.4}
$('bSnd').onclick=e=>{e.stopPropagation();DB.snd=DB.snd?0:1;save();sndUI()};
$('bMus').onclick=e=>{e.stopPropagation();DB.mus=DB.mus?0:1;save();if(DB.mus)musicStart();else musicStop();sndUI()};
$('bBack').onclick=e=>{e.stopPropagation();goBack()};
(function(){let sx=0,sy=0,st=0,on=false;const g=$('game');
 g.addEventListener('touchstart',e=>{if(e.touches.length!==1){on=false;return}const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now();on=!e.target.closest('.top,#ov')},{passive:true});
 g.addEventListener('touchend',e=>{if(!on)return;on=false;const t=e.changedTouches[0];const dx=t.clientX-sx,dy=t.clientY-sy;if(Date.now()-st>700||Math.abs(dx)<60||Math.abs(dy)>Math.abs(dx)*.6)return;if(dx>0)goBack();else if(!$('opts').children.length)advance()},{passive:true})})();
const pin=()=>{if(window.scrollX||window.scrollY)window.scrollTo(0,0)};window.addEventListener('scroll',pin,{passive:true});if(window.visualViewport){visualViewport.addEventListener('resize',pin);visualViewport.addEventListener('scroll',pin)}
$('box').addEventListener('click',e=>{if(e.target.closest('button,.term'))return;advance()});
document.querySelector('.scene').addEventListener('click',e=>advance());
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
sndUI();refreshTitle();
</script>
<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("../sw.js",{scope:"../"}).catch(function(){});</script>
</body>
</html>
