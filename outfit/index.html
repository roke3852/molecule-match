<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta charset="utf-8">
<meta name="author" content="Jim Lu">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="穿搭試衣間">
<meta name="theme-color" content="#2f3a4a">
<meta name="app-version" content="1.15">
<title>穿搭試衣間</title>
<style>
:root{--bg:#f4f1ec;--card:#fff;--ink:#23201d;--mute:#857b70;--line:#e5ddd2;--accent:#2f3a4a;--hot:#c8553d;--soft:#ece6dc;--ok:#2f8f5b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:15px;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:8;background:var(--accent);color:#fff;padding:calc(9px + env(safe-area-inset-top)) 14px 9px;display:flex;align-items:center;gap:10px}
header a{color:#fff;text-decoration:none;font-size:22px;opacity:.85;line-height:1}
header h1{font-size:17px;margin:0;flex:1}
header button{font:inherit;font-size:13px;background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:16px;padding:5px 11px;cursor:pointer}
header .cb{font-size:11.5px;padding:4px 8px;background:rgba(255,255,255,.12)}header .cb.ok{background:rgba(70,190,120,.35)}header .cb.busy,header .cb.wait{background:rgba(255,200,80,.35)}header .cb.off,header .cb.err{background:rgba(230,90,80,.5)}
main{max-width:720px;margin:0 auto;padding:10px 12px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:9;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;font:inherit;font-size:11px;color:var(--mute);padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
nav button .i{font-size:21px}
nav button.on{color:var(--hot);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
h2{font-size:14px;margin:16px 2px 8px;color:var(--mute);font-weight:600}
.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.hot{background:var(--hot);border-color:var(--hot);color:#fff;font-weight:600}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:9px}
.btn.big{width:100%;padding:12px;font-size:16px}
.btn.del{color:#b91c1c;border-color:#f3c9c9}
.muted{color:var(--mute);font-size:12.5px;line-height:1.5}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:16px;padding:5px 11px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip.s2.on{background:var(--hot);border-color:var(--hot)}
.stage{position:sticky;top:calc(44px + env(safe-area-inset-top));z-index:5;background:linear-gradient(#e9e4dc,#f7f4ef 70%,#e2dbd0);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:8px}
.stage svg.fig{display:block;width:100%;height:46vh;min-height:300px}
.stage .side{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.stage .side button{font:inherit;font-size:12px;border:1px solid var(--line);background:rgba(255,255,255,.92);border-radius:10px;padding:6px 8px;cursor:pointer;min-width:54px}
.stage .side button.on{background:var(--accent);color:#fff}
.stage .turn{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:rgba(255,255,255,.94);border-radius:16px;padding:6px 14px;cursor:pointer}
.stage svg.flip{animation:flip .45s ease}
@keyframes flip{0%{transform:scaleX(1)}50%{transform:scaleX(.02)}100%{transform:scaleX(1)}}
.stage .who{position:absolute;left:10px;top:8px;font-size:12px;color:var(--mute);background:rgba(255,255,255,.8);border-radius:10px;padding:3px 8px}
.rail{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px}
.it{flex:none;width:92px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:4px;cursor:pointer;text-align:center;position:relative}
.it.on{border-color:var(--hot)}
.it svg,.it img{width:100%;height:84px;display:block;border-radius:8px;background:#f6f3ee;object-fit:cover}
.it .n{font-size:11.5px;line-height:1.25;margin-top:3px;height:29px;overflow:hidden}
.it .p{font-size:11px;color:var(--hot);font-weight:700}
.it .bd{position:absolute;left:6px;top:6px;font-size:9.5px;background:var(--accent);color:#fff;border-radius:6px;padding:0 4px}
.sw{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.sw button{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #cfc6b9;cursor:pointer;padding:0}
.sw button.on{box-shadow:0 0 0 2.5px var(--hot)}
.sw input[type=color]{width:34px;height:30px;border:0;background:none;padding:0}
.worn{display:flex;flex-wrap:wrap;gap:6px}
.worn span{font-size:12.5px;background:var(--soft);border-radius:14px;padding:4px 6px 4px 10px;display:inline-flex;align-items:center;gap:4px}
.worn span i{font-style:normal;width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.15)}
.worn span button{border:0;background:none;font-size:14px;color:var(--mute);cursor:pointer;padding:0 3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.g{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:5px}
.g svg,.g img.ph{width:100%;height:120px;border-radius:10px;background:#f6f3ee;object-fit:cover;display:block}
.g .two{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.g .two svg,.g .two img.ph{height:104px}
.g .nm{font-size:13.5px;font-weight:700;line-height:1.3}
.g .br{font-size:11.5px;color:var(--mute)}
.g .pr{font-size:14px;color:var(--hot);font-weight:700}
.g .row{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto}
.tag{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:7px;background:var(--soft);color:#6b5d4f;margin-right:3px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar .r{margin-left:auto}
.sum{background:#fff7ed;border:1px solid #f1d9b5;border-radius:12px;padding:9px 12px;font-size:13.5px;line-height:1.6;margin-bottom:10px}
.sum b{color:var(--hot)}
.fld{display:grid;grid-template-columns:64px 1fr 78px;gap:8px;align-items:center;margin:7px 0;font-size:13.5px}
.fld input[type=range]{width:100%}
.fld input[type=number]{width:78px;padding:7px 6px}
input[type=text],input[type=number],input[type=url],input[type=password],select{font:inherit;font-size:15px;border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:#fff;color:var(--ink);min-width:0}
label.f{display:block;font-size:12.5px;color:var(--mute);margin:10px 0 4px}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(30,25,20,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 6px;font-size:17px;display:flex;align-items:center}
.sheet h3 button{margin-left:auto;border:0;background:none;font-size:22px;color:var(--mute);cursor:pointer}
.login{max-width:440px;margin:0 auto;padding:26px 16px}
.login h2{font-size:24px;color:var(--ink);margin:0 0 4px}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin:14px 0}
.names button{font:inherit;font-size:16px;font-weight:700;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 8px;cursor:pointer}
.names button small{display:block;font-weight:400;font-size:11px;color:var(--mute);margin-top:3px}
.game{position:relative;max-width:520px;margin:0 auto;padding:14px 8px 30px;min-height:calc(100vh - 60px);overflow:hidden}
.game .deco{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.game .deco span{position:absolute;bottom:-40px;font-size:26px;opacity:.28;animation:rise 10s linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(-12deg)}100%{transform:translateY(-105vh) rotate(18deg)}}
.game .logo{position:relative;text-align:center;font-size:44px;font-weight:900;letter-spacing:2px;margin-top:10px}
.game .logo b{display:inline-block;background:linear-gradient(#c8553d,#e59a3c);-webkit-background-clip:text;background-clip:text;color:transparent;animation:hop 1.6s ease-in-out infinite}
@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-9px)}}
.game .tag{text-align:center;font-size:12px;letter-spacing:5px;color:var(--mute);margin-top:2px}
.game .h{position:relative;text-align:center;font-size:26px;font-weight:900;margin:8px 0 2px}
.runway{position:relative;margin:14px auto 6px;height:46vh;min-height:280px;max-width:420px;border-radius:22px;background:linear-gradient(#2f3a4a,#465469 60%,#6d5a4e);overflow:hidden;box-shadow:0 10px 30px rgba(47,58,74,.25)}
.runway .spot{position:absolute;left:50%;top:-30%;width:150%;height:130%;transform:translateX(-50%);background:radial-gradient(ellipse at 50% 100%,rgba(255,240,200,.38),rgba(255,240,200,0) 62%);animation:glow 3s ease-in-out infinite}
@keyframes glow{50%{opacity:.6}}
.runway .rw{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;gap:2px;padding:0 6px 4px}
.runway .pose{flex:1;height:96%;animation:bob 2.2s ease-in-out infinite}
.runway .pose svg{width:100%;height:100%}
.runway .pose.pl{background:none;border:0;padding:0;font:inherit;cursor:pointer;position:relative;height:90%;margin-bottom:26px}
.runway .pn{position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);white-space:nowrap;font-size:13px;font-weight:800;color:#fff;background:rgba(0,0,0,.35);border-radius:10px;padding:2px 9px}
.runway .rwcap{position:absolute;top:10px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:700;color:#fff;letter-spacing:1px;background:rgba(40,20,70,.55);border-radius:12px;padding:3px 12px}
.runway .pose.pop svg{animation:pop .45s ease}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes pop{0%{transform:scale(.86);opacity:.2}100%{transform:scale(1);opacity:1}}
.start{position:relative;display:block;width:100%;max-width:340px;margin:16px auto 0;font:inherit;font-size:20px;font-weight:900;color:#fff;background:linear-gradient(#e0694f,#c8553d);border:0;border-radius:18px;padding:14px;box-shadow:0 6px 0 #9c3d2a;cursor:pointer;animation:pulse 1.4s ease-in-out infinite}
.start:active{transform:translateY(4px);box-shadow:0 2px 0 #9c3d2a}
@keyframes pulse{50%{filter:brightness(1.12)}}
.chars,.types{position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;margin-top:14px}
.types{grid-template-columns:repeat(4,1fr);gap:6px}
.char,.type{font:inherit;background:#fff;border:2px solid var(--line);border-radius:16px;padding:6px 4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;position:relative;animation:drop .4s ease backwards;box-shadow:0 4px 0 var(--line)}
.char:active,.type:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.char svg{width:100%;height:150px}.type svg{width:100%;height:110px}
.char .nm,.type .nm{font-weight:800;font-size:15px;margin-top:2px}
.char .lk{position:absolute;top:6px;right:8px;font-size:13px;color:var(--hot)}
.char .last{position:absolute;top:6px;left:8px;font-size:10.5px;background:var(--hot);color:#fff;border-radius:8px;padding:1px 6px;font-weight:700}
.char.new{justify-content:center;border-style:dashed;min-height:186px}.char.new .plus{font-size:44px;color:var(--hot);line-height:1}
.type.on{border-color:var(--hot);box-shadow:0 4px 0 var(--hot);background:#fff6f1}
@keyframes drop{0%{transform:translateY(-18px);opacity:0}}
.game.ti{background:linear-gradient(120deg,#ffe3ec,#fff3d6,#dff6ef,#e3ecff,#ffe3ec);background-size:400% 400%;animation:bgmove 14s ease infinite;border-radius:0 0 26px 26px;max-width:560px;margin-top:-10px;padding-top:18px}
@keyframes bgmove{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.game.ti .deco span{opacity:.55;font-size:30px}
.game.ti .logo{font-size:48px;filter:drop-shadow(0 4px 0 rgba(47,58,74,.18))}
.game.ti .logo b{background:none;-webkit-background-clip:initial;background-clip:initial;-webkit-text-stroke:1.5px #fff;paint-order:stroke fill;animation:hop 1.4s ease-in-out infinite,wig 2.8s ease-in-out infinite}
@keyframes wig{0%,100%{rotate:-3deg}50%{rotate:3deg}}
.game .logo .sp{position:absolute;font-style:normal;color:#f2b705;animation:twk 1.2s ease-in-out infinite}
.game .logo .s1{left:6%;top:-6px;font-size:22px}.game .logo .s2{right:7%;top:2px;font-size:18px;animation-delay:-.5s;color:#ff5a7a}.game .logo .s3{right:16%;bottom:-8px;font-size:15px;animation-delay:-.8s;color:#5a8dff}
@keyframes twk{0%,100%{transform:scale(.5) rotate(0);opacity:.4}50%{transform:scale(1.25) rotate(40deg);opacity:1}}
.game.ti .tag{color:#7a5a8a;font-weight:700}
.runway.big{height:52vh;min-height:330px;max-width:460px;border:4px solid #fff;box-shadow:0 12px 30px rgba(122,47,107,.35)}
.runway .scene{position:absolute;inset:0;width:100%;height:100%}
.scene .tw{animation:twk 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.scene .win{animation:blink 5s steps(1) infinite}
@keyframes blink{0%,70%{opacity:1}71%,85%{opacity:.35}86%,100%{opacity:1}}
.scene .cloud{animation:drift 26s linear infinite}
@keyframes drift{0%{transform:translateX(-140px)}100%{transform:translateX(420px)}}
.scene .flag{animation:sway 1.6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
.scene .bulb{animation:bulb 1s ease-in-out infinite}
@keyframes bulb{0%,100%{opacity:.35}50%{opacity:1}}
.scene .sweep{animation:sweep 5s ease-in-out infinite}
@keyframes sweep{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}}
.scene .flash{opacity:0;animation:flash 4.2s linear infinite}
@keyframes flash{0%,93%{opacity:0}94%{opacity:.95}97%{opacity:.2}100%{opacity:0}}
.scene .conf{animation:conf 7s linear infinite}
@keyframes conf{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(480px) rotate(540deg)}}
.scene .wave{animation:wave 3.2s linear infinite}
@keyframes wave{0%{transform:translateX(0)}100%{transform:translateX(40px)}}
.scene .steam{animation:steam 2s ease-in-out infinite}
@keyframes steam{0%{opacity:0;transform:translateY(4px)}50%{opacity:.8}100%{opacity:0;transform:translateY(-8px)}}
.bgs{position:relative;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.bgs .chip.on{background:#ff4f7a;border-color:#ff4f7a}
.runway.big .rw{padding:0 14% 9%}
.runway.big .pose{height:74%;filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))}
.runway.big .pose.pl{height:70%}
.game.ti .start{font-size:22px;background:linear-gradient(#ff7a8a,#ff4f7a);box-shadow:0 6px 0 #c22f58,0 12px 20px rgba(255,79,122,.35);animation:pulse 1.4s ease-in-out infinite,bounce 1.4s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-4px) scale(1.02)}}
.blink{animation:bulb 1s ease-in-out infinite}
.scene .spin{animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.scene .swimx{animation:swimx 16s linear infinite}
@keyframes swimx{0%{transform:translateX(-460px)}100%{transform:translateX(460px)}}
.scene .swimr{animation:swimr 19s linear infinite}
@keyframes swimr{0%{transform:translateX(460px)}100%{transform:translateX(-460px)}}
.scene .up{animation:up 11s linear infinite}
@keyframes up{0%{transform:translateY(460px)}100%{transform:translateY(-460px)}}
.scene .fall{animation:fall 10s linear infinite}
@keyframes fall{0%{transform:translate(0,-460px)}50%{transform:translate(12px,0)}100%{transform:translate(-4px,460px)}}
.scene .paddle{animation:paddle 5s ease-in-out infinite alternate}
@keyframes paddle{0%{transform:translateX(-26px)}100%{transform:translateX(26px)}}
.scene .nod{animation:nod 3.2s ease-in-out infinite}
@keyframes nod{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
.scene .bob{animation:bob 2.4s ease-in-out infinite}
.scene .flut{animation:flut 7s ease-in-out infinite}
@keyframes flut{0%,100%{transform:translate(0,0)}25%{transform:translate(20px,-14px)}50%{transform:translate(40px,4px)}75%{transform:translate(16px,12px)}}
.outhead{display:flex;align-items:center;gap:10px;margin:4px 2px 10px}.outhead .stampct{margin-left:auto;font-weight:900;font-size:16px;background:#fff7ed;border:1px solid #f1d9b5;border-radius:14px;padding:6px 10px;white-space:nowrap}
.mini{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px 10px;margin-bottom:10px}.mini svg{width:64px;height:120px}
.places{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.place{position:relative;border:0;border-radius:16px;padding:12px 12px 10px;color:#fff;text-align:left;font:inherit;cursor:pointer;min-height:104px;display:flex;flex-direction:column;gap:2px;box-shadow:0 4px 0 rgba(0,0,0,.14);text-shadow:0 1px 2px rgba(0,0,0,.35)}
.place:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.14)}
.place .em{font-size:30px;line-height:1.1}.place .nm{font-weight:900;font-size:17px}.place .ds{font-size:11.5px;opacity:.95;line-height:1.35}
.place .stamp{position:absolute;right:8px;top:8px;background:#fff;color:#c8553d;border-radius:10px;font-size:10.5px;padding:2px 6px;font-weight:800;transform:rotate(8deg);text-shadow:none}
.runway.out{margin-top:0}
.runway .rw.one{justify-content:center;padding:0 0 4%}
.runway .outfig{height:80%;width:56%;animation:walkin 1.2s ease-out both}
.runway .outfig svg{width:100%;height:100%;filter:drop-shadow(0 6px 6px rgba(0,0,0,.3));animation:bob 2.4s ease-in-out 1.2s infinite}
@keyframes walkin{0%{transform:translateX(-130%)}100%{transform:translateX(0)}}
.runway .shot{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}.runway .shot.go{animation:shot .5s ease-out}
@keyframes shot{0%{opacity:.95}100%{opacity:0}}
.outcard .score{font-size:20px;color:var(--hot)}.outcard .stars{color:#f2b705;font-size:18px;letter-spacing:1px}
.outcard ul.cm{margin:0;padding:0;list-style:none;font-size:14px;line-height:1.55}.outcard ul.cm li.bad{color:#b45309}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.album .ph{position:relative;border-radius:14px;padding:4px 4px 6px;color:#fff;text-align:center;cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.album .ph svg{width:100%;height:132px}.album .ph .cap{font-size:11.5px;font-weight:700;line-height:1.3}
.album .ph .x{position:absolute;right:4px;top:2px;border:0;background:rgba(0,0,0,.3);color:#fff;border-radius:50%;width:22px;height:22px;font-size:14px;line-height:1;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--accent);color:#fff;font-size:14px;padding:9px 16px;border-radius:20px;z-index:30;max-width:90vw;text-align:center}
.pal i{display:inline-block;width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.12);margin-right:3px;vertical-align:middle}
.look svg{width:100%;height:190px;background:linear-gradient(#ece7df,#f7f4ef);border-radius:10px;display:block}
.facebox{display:flex;justify-content:center;margin:8px -12px;padding:6px 0;position:sticky;top:calc(44px + env(safe-area-inset-top));z-index:4;background:var(--card);border-bottom:1px solid var(--line)}.facebox svg{width:170px;height:170px;border-radius:50%;background:linear-gradient(#e9e4dc,#f7f4ef);border:1px solid var(--line)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px}
.kv b{font-weight:600}
</style>

<script>
/* ===== 繪圖引擎：依身形數據畫人形與衣服 ===== */
const K=2.7,FLOOR=585;
const lerp=(a,b,t)=>a+(b-a)*t,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const f1=n=>Math.round(n*10)/10;
function sp(pts,closed=true){const n=pts.length;let d='M'+f1(pts[0][0])+','+f1(pts[0][1]);const m=closed?n:n-1;
  for(let i=0;i<m;i++){let p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];
    if(!closed){if(i===0)p0=p1;if(i+2>=n)p3=p2;}
    let c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6],c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
    if(p1[2])c1=p1;if(p2[2])c2=p2;
    d+='C'+f1(c1[0])+','+f1(c1[1])+' '+f1(c2[0])+','+f1(c2[1])+' '+f1(p2[0])+','+f1(p2[1]);}
  return d+(closed?'Z':'');}
function mir(pts){const r=pts.slice();for(let i=pts.length-1;i>=0;i--)if(Math.abs(pts[i][0])>1e-6)r.push([-pts[i][0],pts[i][1],pts[i][2]]);return r;}
function hex2rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return[0,2,4].map(i=>parseInt(h.substr(i,2),16));}
function shade(h,a){const c=hex2rgb(h).map(v=>Math.round(a<0?v*(1+a):v+(255-v)*a));return'#'+c.map(v=>clamp(v,0,255).toString(16).padStart(2,'0')).join('');}
function lum(h){const[r,g,b]=hex2rgb(h);return(.299*r+.587*g+.114*b)/255;}
const strokeOf=c=>lum(c)<.22?shade(c,.3):shade(c,-.26);
function hsl(h){let[r,g,b]=hex2rgb(h).map(v=>v/255);const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;let hh=0,s=0;
  if(d){s=d/(1-Math.abs(2*l-1));hh=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;hh=(hh*60+360)%360;}return[hh,s,l];}
const P=(d,fill,st,sw=1.1,extra='')=>`<path d="${d}" fill="${fill}" stroke="${st||'none'}" stroke-width="${sw}" stroke-linejoin="round" ${extra}/>`;
const SH=(d,g='sh-h')=>`<path d="${d}" fill="url(#${g})"/>`;
const DS=d=>`<path d="${d}" transform="translate(0,2.6)" fill="#000" opacity=".16"/>`;
const FD=(d,st,op=.5)=>`<path d="${d}" fill="none" stroke="${st}" stroke-width=".9" stroke-linecap="round" opacity="${op}"/>`;
const LN=(x1,y1,x2,y2,st,sw=1,extra='')=>`<line x1="${f1(x1)}" y1="${f1(y1)}" x2="${f1(x2)}" y2="${f1(y2)}" stroke="${st}" stroke-width="${sw}" stroke-linecap="round" ${extra}/>`;

function geom(b){
  const bmi=b.w/Math.pow(b.h/100,2),f=clamp((bmi-22)/22,-.3,.9),s=clamp(b.h/170,.55,1.2),g={b,bmi,f};
  g.top=FLOOR-b.h*K;g.headW=b.head*.27*K;g.headH=b.head*.40*K;g.chin=g.top+g.headH;
  g.neckW=g.headW*.5*(1+f*.3);g.shY=g.chin+b.h*.03*K;
  g.crotch=Math.max(FLOOR-b.leg*K,g.shY+b.h*.2*K);
  const T=g.crotch-g.shY;g.chestY=g.shY+T*.28;g.waistY=g.shY+T*.62;g.hipY=g.shY+T*.9;
  g.sh=b.shoulder/2*K;g.ch=b.chest*.165*K;g.wa=b.waist*.168*K;g.hi=b.hip*.172*K;
  g.ua=(8.5+6*f)*K*s;g.fa=(7+4*f)*K*s;g.wr=(5+2*f)*K*s;
  g.slope=5.2*K*s;g.armX=g.sh-g.ua/2;g.armY=g.shY+g.slope+g.ua*.3;g.AL=b.arm*K;
  const a=7*Math.PI/180,dx=Math.sin(a),dy=Math.cos(a);
  g.arm=t=>[g.armX+dx*g.AL*t,g.armY+dy*g.AL*t];
  g.armW=t=>t<.47?lerp(g.ua,g.fa*1.03,t/.47):lerp(g.fa,g.wr,(t-.47)/.53);
  g.hand=b.h*.1*K;
  g.kneeY=FLOOR-(FLOOR-g.crotch)*.6;g.ankY=FLOOR-b.h*.04*K;g.cfY=g.kneeY+(g.ankY-g.kneeY)*.3;
  g.thW=g.hi-.6*K;g.thX=g.hi/2+.3*K;
  g.knW=(10.5+5.5*f)*K*s;g.cfW=(11+5.5*f)*K*s;g.anW=(6.5+2.5*f)*K*s;
  g.knX=Math.max(g.hi*.5,g.knW/2+.8*K);g.anX=Math.max(g.hi*.42,g.anW/2+1.5*K);
  g.LS=[[g.hipY,g.thX,g.thW],[g.crotch,g.thX,g.thW*.97],[g.kneeY,g.knX,g.knW],[g.cfY,lerp(g.knX,g.anX,.35),g.cfW],[g.ankY,g.anX,g.anW]];
  g.legAt=y=>{const L=g.LS;if(y<=L[0][0])return{x:L[0][1],w:L[0][2]};for(let i=1;i<L.length;i++)if(y<=L[i][0]){const t=(y-L[i-1][0])/(L[i][0]-L[i-1][0]);return{x:lerp(L[i-1][1],L[i][1],t),w:lerp(L[i-1][2],L[i][2],t)};}
    return{x:L[4][1],w:L[4][2]};};
  g.ftW=b.foot*.4*K;return g;}

const HS={oval:[1,.96,.62],round:[1.04,1.04,.78],square:[1,1,.88],heart:[1.03,.9,.5],long:[.93,.9,.6],v:[1,.9,.36]};
function headPath(g,shape){const t=g.top,w=g.headW/2,h=g.headH,S=HS[shape]||HS.oval;
  return sp(mir([[0,t],[w*S[0]*.8,t+h*.07],[w*S[0],t+h*.34],[w*S[1],t+h*.62],[w*S[2],t+h*.88],[0,t+h]]));}
function drawFace(g,p,skin){
  const t=g.top,w=g.headW,h=g.headH,o=[],ey=t+h*.52,ex=w*.215,hc=p.hairColor||'#2b2420',ec=p.eyeColor||'#3a2f2a',ink='#2e2622',S=HS[p.faceShape]||HS.oval;
  const eye=p.eye||'round',big=eye==='big',R=w*(big?.105:.085),my=t+h*.79,mw=w*.15,bd=p.beard||'none',lash=p.lash===true?'nat':(p.lash||'none');

  const must=`<path d="M${f1(-w*.17)},${f1(my-h*.03)} Q0,${f1(my-h*.085)} ${f1(w*.17)},${f1(my-h*.03)} Q0,${f1(my-h*.045)} ${f1(-w*.17)},${f1(my-h*.03)}Z" fill="${hc}"/>`;
  if(bd==='stubble'||bd==='full')o.push(`<path d="${sp(mir([[0,t+h*1.0],[w*.5*S[2],t+h*.88],[w*.5*S[1]*.99,t+h*.6,1],[w*.36,t+h*.72],[w*.2,t+h*.7],[0,t+h*.7]]))}" fill="${hc}" opacity="${bd==='full'?.92:.2}"/>`);
  if(bd==='chin')o.push(`<path d="${sp(mir([[0,my+h*.045],[w*.13,my+h*.055],[w*.17,t+h*.95],[0,t+h*1.0]]))}" fill="${hc}" opacity=".85"/>`);
  if(bd==='goatee')o.push(`<path d="${sp(mir([[0,my+h*.035],[w*.1,my+h*.05],[w*.09,t+h*.96],[0,t+h*.995]]))}" fill="${hc}"/>`);
  if(bd==='mustache'||bd==='goatee'||bd==='full')o.push(must);
  if(p.blush)for(const s of[1,-1])o.push(`<ellipse cx="${f1(s*w*.3)}" cy="${f1(t+h*.67)}" rx="${f1(w*.1)}" ry="${f1(w*.06)}" fill="#f07f86" opacity=".38"/>`);
  if(p.freckle)for(const[a,b]of[[.2,.63],[.27,.66],[.33,.63],[.24,.69]])for(const s of[1,-1])o.push(`<circle cx="${f1(s*w*a)}" cy="${f1(t+h*b)}" r=".55" fill="#9a6a4a" opacity=".7"/>`);
  if(p.mole)o.push(`<circle cx="${f1(w*.2)}" cy="${f1(t+h*.84)}" r=".9" fill="#5a3a2a"/>`);
  for(const s of[1,-1]){const cx=s*ex;
    if(SHD&&eye!=='dot')o.push(`<ellipse cx="${f1(cx+s*R*.15)}" cy="${f1(ey-R*.55)}" rx="${f1(R*1.4)}" ry="${f1(R*.78)}" fill="${SHD}" opacity=".55"/>`);
    if(eye==='dot')o.push(`<circle cx="${f1(cx)}" cy="${f1(ey)}" r="${f1(w*.04)}" fill="${ec}"/>`);
    else if(eye==='smile')o.push(`<path d="M${f1(cx-R)},${f1(ey+R*.25)} Q${f1(cx)},${f1(ey-R*.95)} ${f1(cx+R)},${f1(ey+R*.25)}" fill="none" stroke="${ink}" stroke-width="1.4" stroke-linecap="round"/>`);
    else{const AL=eye==='almond'||eye==='sharp'||eye==='droopy',tl=eye==='sharp'?-R*.5:eye==='droopy'?R*.38:0,up=eye==='sharp'?R*.8:R*1.15,dn=eye==='sharp'?R*.55:R*.85;
      const ix=cx-s*R*1.2,ox=cx+s*R*1.2,iy=ey+R*.1,oy=ey+R*.1+tl;
      const lid=AL?`M${f1(ix)},${f1(iy)} Q${f1(cx)},${f1(ey-up+tl*.3)} ${f1(ox)},${f1(oy)}`:`M${f1(cx-R)},${f1(ey-R*.15)} Q${f1(cx)},${f1(ey-R*1.25)} ${f1(cx+R)},${f1(ey-R*.15)}`;
      o.push(AL?`<path d="${lid} Q${f1(cx)},${f1(ey+dn+tl*.3)} ${f1(ix)},${f1(iy)}Z" fill="#fff"/>`:`<ellipse cx="${f1(cx)}" cy="${f1(ey)}" rx="${f1(R)}" ry="${f1(R*.86)}" fill="#fff"/>`);
      const ir=R*(AL?(eye==='sharp'?.46:.52):.64),iy2=ey+(AL?-R*.05+tl*.25:0);o.push(`<circle cx="${f1(cx)}" cy="${f1(iy2)}" r="${f1(ir)}" fill="${ec}"/><circle cx="${f1(cx)}" cy="${f1(iy2)}" r="${f1(ir*.5)}" fill="#17110e"/><circle cx="${f1(cx-R*.22)}" cy="${f1(iy2-R*.28)}" r="${f1(R*(big?.24:.17))}" fill="#fff"/>`);
      o.push(`<path d="${lid}" fill="none" stroke="${ink}" stroke-width="${lash==='long'?1.9:lash==='nat'?1.5:1}" stroke-linecap="round"/>`);
      const lx=AL?ox:cx+s*R*1.02,ly=AL?oy-R*.25:ey-R*.2;
      if(lash==='nat')o.push(`<path d="M${f1(lx)},${f1(ly)} l${f1(s*R*.5)},${f1(-R*.5)} M${f1(cx+s*R*.7)},${f1(ly-R*.5)} l${f1(s*R*.3)},${f1(-R*.45)}" stroke="${ink}" stroke-width=".9" stroke-linecap="round" fill="none"/>`);
      if(lash==='long')o.push(`<path d="M${f1(lx)},${f1(ly)} l${f1(s*R*.75)},${f1(-R*.55)} M${f1(cx+s*R*.75)},${f1(ly-R*.5)} l${f1(s*R*.5)},${f1(-R*.7)} M${f1(cx+s*R*.3)},${f1(ly-R*.75)} l${f1(s*R*.25)},${f1(-R*.65)}" stroke="${ink}" stroke-width="1.1" stroke-linecap="round" fill="none"/>`);}
    const br=p.brow||'soft';if(br==='sword'){const by=ey-w*(big?.2:.165),L=w*.12;o.push(`<path d="M${f1(cx-s*L)},${f1(by+w*.03)} L${f1(cx+s*L)},${f1(by-w*.045)}" fill="none" stroke="${shade(hc,-.15)}" stroke-width="2.4" stroke-linecap="round"/>`);}
    else if(br!=='none'){const by=ey-w*(big?.2:.165),L=w*.115,k={soft:w*.03,thick:w*.03,thin:w*.025,arch:w*.075,flat:0}[br]||0,sw={soft:1.4,thick:2.5,thin:.8,arch:1.4,flat:1.6}[br]||1.4;
      o.push(`<path d="M${f1(cx-s*L)},${f1(by+w*.012)} Q${f1(cx+s*L*.2)},${f1(by-k)} ${f1(cx+s*L)},${f1(by+(br==='arch'?w*.02:0))}" fill="none" stroke="${shade(hc,-.15)}" stroke-width="${sw}" stroke-linecap="round"/>`);}}
  const ny=t+h*.665,nc=shade(skin,-.32),nz=p.nose||'dot';
  if(nz==='dot')o.push(`<path d="M${f1(-w*.035)},${f1(ny)} q${f1(w*.035)},${f1(w*.035)} ${f1(w*.07)},0" fill="none" stroke="${nc}" stroke-width="1" stroke-linecap="round"/>`);
  if(nz==='line')o.push(`<path d="M${f1(w*.012)},${f1(ny-h*.1)} l${f1(-w*.04)},${f1(h*.1)} l${f1(w*.06)},0" fill="none" stroke="${nc}" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>`);
  const lp=p.lip||'none',lc={none:'#a0584e',nude:'#b9806e',pink:'#d9707e',coral:'#e8735e',red:'#c2383b',berry:'#9c2f4f'}[lp]||'#a0584e',lw=lp==='none'?1.3:2,mo=p.mouth||'smile';
  if(mo==='smile')o.push(`<path d="M${f1(-mw)},${f1(my-1)} Q0,${f1(my+mw*.75)} ${f1(mw)},${f1(my-1)}" fill="none" stroke="${lc}" stroke-width="${lw}" stroke-linecap="round"/>`);
  if(mo==='grin')o.push(`<path d="M${f1(-mw)},${f1(my-1.2)} Q0,${f1(my+mw*1.25)} ${f1(mw)},${f1(my-1.2)}Z" fill="#fff" stroke="${lc}" stroke-width="${Math.max(1.1,lw*.7)}" stroke-linejoin="round"/>`);
  if(mo==='flat')o.push(LN(-mw*.8,my,mw*.8,my,lc,lw));
  if(mo==='small')o.push(`<path d="M${f1(-mw*.5)},${f1(my-.5)} Q0,${f1(my+mw*.45)} ${f1(mw*.5)},${f1(my-.5)}" fill="none" stroke="${lc}" stroke-width="${lw}" stroke-linecap="round"/>`);
  if(mo==='smirk')o.push(`<path d="M${f1(-mw)},${f1(my)} Q${f1(mw*.1)},${f1(my+mw*.55)} ${f1(mw)},${f1(my-mw*.4)}" fill="none" stroke="${lc}" stroke-width="${lw}" stroke-linecap="round"/>`);
  if(mo==='open')o.push(`<ellipse cx="0" cy="${f1(my)}" rx="${f1(mw*.5)}" ry="${f1(mw*.55)}" fill="#7a3136" stroke="${lc}" stroke-width="${Math.max(1,lw*.6)}"/>`);
  const er=p.ear||'none',eco=p.earColor||'#c9a84c',ly=t+h/2+6.2;
  if(er!=='none')for(const s of[1,-1]){const x=s*(w/2+.3);
    if(er==='stud')o.push(`<circle cx="${f1(x)}" cy="${f1(ly)}" r="1.4" fill="${eco}" stroke="${shade(eco,-.3)}" stroke-width=".4"/>`);
    if(er==='pearl')o.push(`<circle cx="${f1(x)}" cy="${f1(ly+.6)}" r="2" fill="#f7f3ea" stroke="#cbbfa9" stroke-width=".5"/><circle cx="${f1(x-.6)}" cy="${f1(ly)}" r=".6" fill="#fff"/>`);
    if(er==='hoop')o.push(`<circle cx="${f1(x)}" cy="${f1(ly+2.6)}" r="3" fill="none" stroke="${eco}" stroke-width="1.2"/>`);
    if(er==='drop')o.push(`<line x1="${f1(x)}" y1="${f1(ly)}" x2="${f1(x)}" y2="${f1(ly+4)}" stroke="${eco}" stroke-width=".8"/><path d="M${f1(x)},${f1(ly+3.6)} q2.2,2.6 0,5 q-2.2,-2.4 0,-5z" fill="${eco}"/>`);}
  return o.join('');}
function drawBody(g,skin,p){
  const st=shade(skin,-.14),o=[];
  for(const s of[1,-1]){const L=[],R=[];g.LS.forEach(([y,x,w])=>{L.push([s*x-w/2,y]);R.push([s*x+w/2,y]);});
    {const dd=sp([...L,...R.reverse()]);o.push(P(dd,skin,st,.8),SH(dd));}

  if(B&&det.includes('spikes'))for(let y=ny+2*K;y<hemY-3*K;y+=3.8*K)o.push(`<path d="M${f1(-2.2*K)},${f1(y+3.4*K)} L0,${f1(y)} L${f1(2.2*K)},${f1(y+3.4*K)} Z" fill="#ffcf3a" stroke="#c99a12" stroke-width=".7" stroke-linejoin="round"/>`);
  if(det.includes('sideline'))for(const s of[1,-1])o.push(LN(s*(apx-1.5*K),apy+1*K,s*(hemW-1.5*K),hemY-1,lt,1.6));
  if(det.includes('belt')){o.push(`<rect x="${f1(-waW-.5)}" y="${f1(g.waistY-.9*K)}" width="${f1(2*waW+1)}" height="${f1(1.9*K)}" fill="${dk}" stroke="${st}"/>`);if(!B)o.push(`<rect x="${f1(-1.4*K)}" y="${f1(g.waistY-1.2*K)}" width="${f1(2.8*K)}" height="${f1(2.5*K)}" rx="1" fill="none" stroke="${lum(c)<.3?'#ddd':'#5a4a3a'}" stroke-width="1.3"/>`);}

  return o.join('');}

function drawBottom(g,it,c){
  const B=g.back,st=strokeOf(c),o=[],det=(it.det||[]).filter(x=>!B||x!=='drawstring'),fit=it.fit||'regular';
  const wy=g.waistY-(it.high?3*K:0),e={slim:.3,regular:.9,tapered:1.1,wide:2.6,flare:.7}[fit]*K||.9*K;
  const waW=g.wa+e*.5,lt=lum(c)>.8?shade(c,-.3):'#fff';
  if(it.kind==='skirt'){
    const hemY=wy+(g.ankY-wy)*it.len;
    let hemW=fit==='pencil'?Math.max(g.hi*.93,g.legAt(hemY).x+g.legAt(hemY).w/2+.8*K):g.hi+e+Math.max(0,hemY-g.hipY)*(it.flare==null?.3:it.flare);
    const d=sp(mir([[0,wy],[waW,wy,1],[g.hi+e*.8,g.hipY],[hemW,hemY,1]]));o.push(P(d,c,st),SH(d));if(fit!=='pencil'&&!det.includes('pleat'))for(const q of[-.55,.2,.6])o.push(FD(`M${f1(waW*q)},${f1(g.hipY)} L${f1(hemW*q*1.05)},${f1(hemY-1)}`,st,.3));
    if(det.includes('floral'))o.push(P(d,'url(#p-floral)','none'));if(det.includes('plaid'))o.push(P(d,'url(#p-plaid)','none'));for(const q of['stars','hearts','dots'])if(det.includes(q))o.push(P(d,`url(#p-${q})`,'none'));
    if(det.includes('pleat'))for(let i=-4;i<=4;i++)if(i)o.push(LN(waW*i/5,wy+2*K,hemW*i/5,hemY-1,st,.8,'opacity=".7"'));
    if(det.includes('slit'))o.push(LN(hemW*.35,hemY-7*K,hemW*.35,hemY,st,1));
  }else{
    const endY=g.crotch+(g.ankY+1*K-g.crotch)*it.len,thWd=g.thW+e*1.3;
    const wAt=y=>{const t=clamp((y-g.crotch)/(g.ankY-g.crotch),0,1),b=g.legAt(y);
      if(fit==='slim')return b.w+e*2+.5*K;if(fit==='tapered')return lerp(thWd,g.anW+3*K,t);if(fit==='wide')return lerp(thWd*1.02,thWd*.9,t);
      if(fit==='flare')return t<.5?lerp(thWd,g.knW+2.5*K,t/.5):lerp(g.knW+2.5*K,g.knW*2,(t-.5)/.5);
      return lerp(thWd,g.knW+3*K,Math.min(1,t/.55));};
    const mi=fit==='wide'?2.2*K:fit==='slim'?.4*K:1.1*K;
    const edge=y=>{const b=g.legAt(y),w=wAt(y);let inn=Math.max(b.x-b.w/2-Math.min((w-b.w)/2,mi),.35*K);return[inn,Math.max(inn+w,b.x+b.w/2+.4*K)];};
    const ys=[g.crotch,g.kneeY,g.cfY,g.ankY].filter(y=>y<endY-5).concat([endY]),n=ys.length;
    for(const s of[1,-1]){const pts=[[0,wy,1],[s*waW,wy,1],[s*(g.hi+e*.8),g.hipY]];
      ys.forEach((y,i)=>pts.push([s*edge(y)[1],y,i===n-1?1:0]));
      for(let i=n-1;i>=0;i--)pts.push([s*edge(ys[i])[0],ys[i],i===n-1||i===0?1:0]);
      pts.push([0,g.crotch-1.5*K,1]);
      const d=sp(pts);o.push(P(d,c,st));if(det.includes('plaid'))o.push(P(d,'url(#p-plaid)','none'));for(const q of['stars','hearts','dots'])if(det.includes(q))o.push(P(d,`url(#p-${q})`,'none'));o.push(SH(d,s>0?'sh-r':'sh-l'));
      o.push(FD(`M${f1(s*.8*K)},${f1(g.crotch+.5*K)} q${f1(s*3*K)},${f1(-.6*K)} ${f1(s*5.5*K)},${f1(-2.6*K)}`,st,.4),FD(`M${f1(s*.9*K)},${f1(g.crotch+2*K)} q${f1(s*2.6*K)},${f1(0)} ${f1(s*4.6*K)},${f1(-1.2*K)}`,st,.3));
      if(endY>g.kneeY+3*K&&fit!=='wide'){const[ka,kb]=edge(g.kneeY);o.push(FD(`M${f1(s*(ka+1))},${f1(g.kneeY-1.5*K)} q${f1(s*(kb-ka)*.4)},${f1(1.8*K)} ${f1(s*(kb-ka)*.75)},${f1(.4*K)}`,st,.35));}
      if(endY>g.ankY-2*K&&fit!=='slim'){const[ha,hb]=edge(endY);o.push(FD(`M${f1(s*(ha+1))},${f1(endY-2.4*K)} q${f1(s*(hb-ha)*.5)},${f1(1.5*K)} ${f1(s*(hb-ha-2))},${f1(-.4*K)}`,st,.35));}
      const mid=y=>{const[a,b]=edge(y);return s*(a+b)/2;};
      if(det.includes('crease'))o.push(LN(mid(g.crotch),g.hipY+2*K,mid(endY),endY-1,st,.8,'opacity=".6"'));
      if(det.includes('cargo')&&endY>g.kneeY){const y=lerp(g.crotch,g.kneeY,.35),x=edge(y+3*K)[1];o.push(`<rect x="${f1(s>0?x-5.2*K:-x+.4*K)}" y="${f1(y)}" width="${f1(4.8*K)}" height="${f1(6*K)}" rx="1.5" fill="${shade(c,-.07)}" stroke="${st}"/>`);}
      if(det.includes('sidestripe'))o.push(`<path d="${sp(ys.map(y=>[s*(edge(y)[1]-1.4*K),y]),false)}" fill="none" stroke="${lt}" stroke-width="2"/>`);
      if(det.includes('cuff')){const[a,b]=edge(endY);o.push(`<rect x="${f1(s>0?a:-b)}" y="${f1(endY-2.2*K)}" width="${f1(b-a)}" height="${f1(2.2*K)}" fill="${shade(c,-.1)}" stroke="${st}"/>`);}
      if(det.includes('denim'))o.push(`<path d="M${f1(s*waW*.5)},${f1(wy+2.2*K)} Q${f1(s*g.hi*.82)},${f1(wy+3*K)} ${f1(s*(g.hi+e*.5))},${f1(g.hipY-1.5*K)}" fill="none" stroke="${lum(c)<.3?'#888':'#c9a15a'}" stroke-width=".9"/>`);
      if(det.includes('kneeseam')&&endY>g.kneeY)o.push(LN(s*edge(g.kneeY)[0],g.kneeY-2*K,s*edge(g.kneeY)[1],g.kneeY-2*K,st,.8));
    }
    if(B&&fit!=='slim'&&it.len>.15&&!det.includes('sidestripe'))for(const s of[1,-1])o.push(`<path d="M${f1(s*g.hi*.2)},${f1(g.hipY-3.6*K)} h${f1(s*g.hi*.5)} v${f1(4*K)} l${f1(-s*g.hi*.25)},${f1(1.3*K)} l${f1(-s*g.hi*.25)},${f1(-1.3*K)} Z" fill="none" stroke="${st}" stroke-width=".9" opacity=".75"/>`);
    if(B&&det.includes('bib')){const bw=g.ch*.34,by=g.waistY-(g.waistY-g.chestY)*.55;
      for(const s of[1,-1])o.push(`<path d="M${f1(-s*bw*.6)},${f1(by+2)} L${f1(s*(g.neckW/2+2.4*K))},${f1(g.shY+g.slope*.25)}" stroke="${c}" stroke-width="${f1(1.7*K)}" stroke-linecap="round" fill="none"/>`);
      o.push(`<rect x="${f1(-bw)}" y="${f1(by)}" width="${f1(2*bw)}" height="${f1(wy-by+2)}" rx="2.5" fill="${c}" stroke="${st}"/>`);}
    if(!B&&det.includes('bib')){const bw=g.ch*.56,by=g.chestY-.5*K;
      for(const s of[1,-1])o.push(`<path d="M${f1(s*bw*.8)},${f1(by+1)} L${f1(s*(g.neckW/2+2.4*K))},${f1(g.shY+g.slope*.25)}" stroke="${c}" stroke-width="${f1(1.7*K)}" stroke-linecap="round" fill="none"/>`);
      o.push(`<rect x="${f1(-bw)}" y="${f1(by)}" width="${f1(2*bw)}" height="${f1(wy-by+2)}" rx="2.5" fill="${c}" stroke="${st}"/><rect x="${f1(-bw*.5)}" y="${f1(by+(wy-by)*.3)}" width="${f1(bw)}" height="${f1((wy-by)*.4)}" rx="1.5" fill="none" stroke="${st}" opacity=".7"/>`);
      for(const s of[1,-1])o.push(`<circle cx="${f1(s*bw*.78)}" cy="${f1(by+1.2*K)}" r="1.6" fill="#d9c58a" stroke="${st}" stroke-width=".5"/>`);}
    if(det.includes('drawstring'))for(const s of[1,-1])o.push(LN(s*.8*K,wy+1.6*K,s*1.4*K,wy+6*K,lt,1.3));
  }
  o.push(`<rect x="${f1(-waW)}" y="${f1(wy)}" width="${f1(2*waW)}" height="${f1(2*K)}" rx="1.5" fill="${shade(c,lum(c)<.22?.1:-.06)}" stroke="${st}"/>`);
  return{svg:o.join(''),wy};}

function drawShoes(g,it,c){
  const st=strokeOf(c),o=[],sole=(it.sole||1.1)*K,W=g.ftW+(it.kind==='chunky'?2.6:1.3)*K,aw=g.anW,by=FLOOR-sole;
  const sc=it.dark?shade(c,-.45):'#f3f0e9',lt=lum(c)>.75?shade(c,-.35):'#fff';
  for(const s of[1,-1]){const X=u=>s*(g.anX+g.ftW*.06+u);
    if(it.kind==='sandal'){o.push(P(sp([[X(-W*.47),by,1],[X(W*.6),by,1],[X(W*.6),FLOOR,1],[X(-W*.47),FLOOR,1]]),c,st));
      o.push(`<path d="M${f1(X(-W*.42))},${f1(by)} Q${f1(X(0))},${f1(by-4.6*K)} ${f1(X(W*.5))},${f1(by)}" fill="none" stroke="${c}" stroke-width="${f1(1.7*K)}"/>`);
      o.push(LN(X(-aw/2-1),g.ankY,X(aw/2+1),g.ankY,c,1.2*K));continue;}
    if(it.kind==='pump'){o.push(P(sp([[X(-W*.42),by-3.4*K,1],[X(0),by-2*K],[X(W*.5),by-3.4*K,1],[X(W*.54),by,1],[X(-W*.44),by,1]]),c,st));
      o.push(`<rect x="${f1(Math.min(X(-W*.44),X(W*.54)))}" y="${f1(by)}" width="${f1(W*.98)}" height="${f1(sole)}" fill="${shade(c,-.3)}"/>`);continue;}
    const shaft=(it.shaft||0)*K,topY=shaft?g.ankY-shaft:g.ankY+.4*K;
    const pts=[[X(-aw/2-.7*K),topY,1],[X(aw/2+.7*K),topY,1]];
    if(shaft)pts.push([X(aw/2+1.1*K),g.ankY+.5*K]);
    pts.push([X(W*.6),by-2.2*K],[X(W*.6),by,1],[X(-W*.46),by,1],[X(-W*.46),by-2.2*K]);
    if(shaft)pts.push([X(-aw/2-1.1*K),g.ankY+.5*K]);
    {const dd=sp(pts);o.push(P(dd,c,st),SH(dd,s>0?'sh-r':'sh-l'));}
    o.push(`<rect x="${f1(Math.min(X(-W*.48),X(W*.62)))}" y="${f1(by)}" width="${f1(W*1.1)}" height="${f1(sole)}" rx="2" fill="${sc}" stroke="${st}" stroke-width=".8"/>`);
    const det=g.back?[]:(it.det||[]);
    if(g.back)o.push(LN(X(-.2*K),topY+1,X(-.2*K),by-1,st,.9,'opacity=".5"'));
    if(det.includes('toecap'))o.push(`<path d="M${f1(X(-W*.4))},${f1(by)} Q${f1(X(W*.08))},${f1(by-4.4*K)} ${f1(X(W*.55))},${f1(by)} Z" fill="#f3f0e9" stroke="${st}" stroke-width=".7"/>`);
    if(det.includes('laces'))for(let y=topY+1.2*K,i=0;y<by-2.6*K&&i<6;y+=1.7*K,i++)o.push(LN(X(-1.3*K),y,X(1.6*K),y,lt,1.1));
    if(det.includes('stripe'))o.push(LN(X(W*.1),by-3.6*K,X(W*.45),by-.6*K,lt,1.8));
    if(det.includes('gore')&&shaft)o.push(`<rect x="${f1(Math.min(X(aw/2-.6*K),X(aw/2+.6*K)))}" y="${f1(topY+1)}" width="${f1(1.2*K)}" height="${f1(shaft*.75)}" fill="${shade(c,.25)}"/>`);
    if(det.includes('strap'))o.push(LN(X(-W*.35),by-3.2*K,X(W*.5),by-3.2*K,shade(c,-.3),1.6));
    if(det.includes('light'))['#ff4d6d','#4ade80','#60a5fa','#ffd45a'].forEach((lc,i)=>o.push(`<circle class="blink" cx="${f1(X(-W*.32+i*W*.27))}" cy="${f1(by+sole*.5)}" r="${f1(Math.max(1,sole*.32))}" fill="${lc}" style="animation-delay:${-i*.25}s"/>`));
    if(det.includes('penny'))o.push(LN(X(-W*.2),by-3*K,X(W*.36),by-3*K,shade(c,lum(c)<.22?.3:-.3),2));
  }
  return o.join('');}

function drawSocks(g,c,h){const st=strokeOf(c),o=[],y0=g.ankY-h*K;
  for(const s of[1,-1]){const L=[],R=[];[y0,(y0+g.ankY)/2,g.ankY+.5*K].forEach((y,i)=>{const b=g.legAt(y);L.push([s*b.x-b.w/2-.5*K,y,i===0?1:0]);R.push([s*b.x+b.w/2+.5*K,y,i===0?1:0]);});
    const X=u=>s*(g.anX+g.ftW*.06+u),W=g.ftW;
    o.push(P(sp([...L,[X(-W*.47),FLOOR-4],[X(-W*.45),FLOOR,1],[X(W*.56),FLOOR,1],[X(W*.6),FLOOR-4],...R.reverse()].map(p=>p)),c,st,.9));}
  return o.join('');}

function drawHat(g,it,c){
  const t=g.top,w=g.headW,h=g.headH,st=strokeOf(c),dk=shade(c,lum(c)<.22?.2:-.15),o=[],hw=w*.5+1.2*K;

    o.push(P(sp(mir([[0,t-2.6*K],[w*.22,t-3.4*K],[hw-.3*K,t-1.4*K],[hw+.2*K,t+h*.3,1]])),c,st));o.push(`<rect x="${f1(-hw-.2*K)}" y="${f1(t+h*.2)}" width="${f1(2*hw+.4*K)}" height="${f1(h*.1)}" fill="${it.kind==='straw'?'#3a2f2a':shade(c,-.45)}"/>`);}

    o.push(`<path d="M${f1(-2.4*K)},${f1(y-h*.01)} L0,${f1(y-4.6*K)} L${f1(2.4*K)},${f1(y-h*.01)} Z M${f1(-6*K)},${f1(y+h*.02)} L${f1(-4.6*K)},${f1(y-2.4*K)} L${f1(-3.2*K)},${f1(y)} Z M${f1(6*K)},${f1(y+h*.02)} L${f1(4.6*K)},${f1(y-2.4*K)} L${f1(3.2*K)},${f1(y)} Z" fill="${c}" stroke="${dk2}" stroke-width=".7" stroke-linejoin="round"/><circle cx="0" cy="${f1(y-1.6*K)}" r="${f1(.9*K)}" fill="#ff7aa8" stroke="#fff" stroke-width=".5"/><circle cx="${f1(-4.6*K)}" cy="${f1(y-.6*K)}" r="${f1(.5*K)}" fill="#7ad0ff"/><circle cx="${f1(4.6*K)}" cy="${f1(y-.6*K)}" r="${f1(.5*K)}" fill="#7ad0ff"/>`);}

function outScore(pl){const o=U.outfit,W=wornList(),ids=W.map(x=>x.e.t),msgs=[];let s=50;
  if(!o.top&&!o.dress){s-=30;msgs.push(['bad','還沒穿上衣！']);}
  if(!o.dress&&!o.bottom){s-=35;msgs.push(['bad','還沒穿褲子或裙子！']);}
  if(!o.shoes){s-=20;msgs.push(['bad','光腳出門？記得穿鞋。']);}
  let m=0,n=0;W.forEach(x=>{if(x.slot==='acc')return;n++;if(ITEM[x.e.t].st.some(t=>pl.st.includes(t)))m++;});
  if(n){s+=Math.round(22*m/n);if(m/n>=.6&&pl.id!=='studio')msgs.push(['good',`整體風格很適合${pl.name}`]);}
  let gc=0;for(const[list,msg]of pl.good)if(gc<3&&ids.some(i=>list.includes(i))){s+=8;gc++;msgs.push(['good',msg]);}
  for(const[list,msg]of pl.bad)if(ids.some(i=>list.includes(i))){s-=15;msgs.push(['bad',msg]);}
  const w=ids.reduce((a,i)=>a+warmOf(i),0);
  if(w<pl.warm[0]){s-=18;msgs.push(['bad',pl.cold||'穿太少了會冷，加件外套吧']);}
  else if(w>pl.warm[1]){s-=15;msgs.push(['bad',pl.hot||'穿太多會熱，脫掉外套或換短袖吧']);}
  else if(pl.id!=='studio')msgs.push(['good','冷熱剛剛好 👍']);
  const ac=o.acc.length+(o.hat?1:0);if(pl.acc&&ac){s+=Math.min(9,ac*3);msgs.push(['good','配件加分 ✨']);}
  s=clamp(Math.round(s),0,100);return{s,stars:starsOf(s),msgs};}

  <div class="bar" style="margin-top:14px"><button class="btn pri" style="flex:1" data-act="edsave">儲存</button>${ED.id?'<button class="btn del" data-act="eddel">刪除</button>':''}</div>`);}
function readEd(){document.querySelectorAll('#sheet [data-ed]').forEach(e=>{const k=e.dataset.ed;if(k==='name'||k==='brand')ED[k]=e.value.trim();if(k==='price')ED.price=+e.value||0;});}
function setImgFile(f){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,360/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);
  const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(im,0,0,cv.width,cv.height);readEd();ED.img=cv.toDataURL('image/jpeg',.72);drawEdit();};im.src=r.result;};r.readAsDataURL(f);}

/* --- 事件 --- */
document.addEventListener('click',async ev=>{
  const nb=ev.target.closest('#nav button');if(nb){if(nb.dataset.tab==='out')outPlace=null;return go(nb.dataset.tab);}
  if(ev.target.id==='userBtn'||ev.target.id==='cloudBadge')return go('me');
  const el=ev.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,d=el.dataset,o=U&&U.outfit;
  if(a==='sheetbg'){if(ev.target===el)sheet('');return;}
  if(a==='close')return sheet('');
  if(a==='pick'){const k=d.k;if(DB.known[k].pin)return askPin(k);return enter(k);}
  if(a==='pinok'){const k=d.k,v=$('#pinIn').value;if(hash(k+':'+v)!==DB.known[k].pin)return toast('密碼不對');sheet('');return enter(k);}
  if(a==='register')return register();
  if(a==='lgstart'){lgStep=Object.keys(DB.known).length?'select':'new';return loginView();}
  if(a==='bg'){DB.bg=d.v;saveLocal();return loginView();}
  if(a==='lgnew'){lgStep='new';return loginView();}
  if(a==='lgback'){lgStep='select';return loginView();}
  if(a==='lgtype'){const n=$('#nName').value,p=$('#nPin').value;lgType=d.v;loginView();$('#nName').value=n;$('#nPin').value=p;return;}
  if(!U)return;
  if(a==='src'){U.ui.src=d.v;save();}
  else if(a==='slot'){U.ui.slot=d.v;save();}
  else if(a==='style'){U.ui.style=d.v;save();}
  else if(a==='wear'){const en=entries(U.ui.slot,U.ui.src).find(e=>e.k===d.k);if(en)wear(U.ui.slot,en);}
  else if(a==='color'){const s=U.ui.slot,e=s==='acc'?o.acc[Math.min(accSel,o.acc.length-1)]:o[s];if(e){e.c=d.c;save();}}
  else if(a==='off'){if(d.s==='acc')o.acc.splice(+d.i,1);else delete o[d.s];save();}
  else if(a==='turn'){viewBack=!viewBack;flipNow=true;}
  else if(a==='syncnow'){if(dirty)await push();else{await pull();toast(cloud);}return;}
  else if(a==='goouttab'||a==='outlist'){outPlace=null;return go('out');}
  else if(a==='gotry')return go('try');
  else if(a==='goout'){outPlace=d.v;const r=outScore(PL(d.v)),old=U.stamps[d.v];U.stamps[d.v]=Math.max(old||0,r.s);save();if(old==null)toast(`🏅 獲得「${PL(d.v).name}」章！（${Object.keys(U.stamps).length}/${PLACES.length}）`);go('out');return;}
  else if(a==='outphoto'){const r=outScore(PL(outPlace));U.album.unshift({p:outPlace,o:JSON.parse(JSON.stringify(U.outfit)),b:JSON.parse(JSON.stringify(U.body)),s:r.s,t:Date.now()});if(U.album.length>24)U.album.length=24;save();shotNow=true;toast('📸 已收進出遊相簿');}
  else if(a==='outdl'){exportPhoto();return;}
  else if(a==='albumdel'){ev.stopPropagation();U.album.splice(+d.i,1);save();}
  else if(a==='albumgo'){const al=U.album[+d.i];if(al){U.outfit=JSON.parse(JSON.stringify(al.o));U.outfit.acc=U.outfit.acc||[];outPlace=al.p;save();go('out');return;}}
  else if(a==='random')randomLook();
  else if(a==='tuck'){o.tuck=!o.tuck;save();}
  else if(a==='clear'){U.outfit={acc:[]};save();}
  else if(a==='savelook'){U.saved.unshift({name:'穿搭 '+(U.saved.length+1),o:JSON.parse(JSON.stringify(o))});save();toast('已收藏，在「靈感」分頁可以找到');}
  else if(a==='wishall'){d.ids.split(',').forEach(id=>addFromShop(id,'wish'));toast('已加入想買清單');}
  else if(a==='cview')closetView=d.v;
  else if(a==='aslot')addSlot=d.v;
  else if(a==='quick'){const it=ITEM[d.t];addCloset({base:it.id,name:it.name,color:it.col[0]});toast('已加入衣櫃：'+it.name);}
  else if(a==='add')return editSheet(null);
  else if(a==='edit')return editSheet(U.closet.find(c=>c.id===d.id));
  else if(a==='bought'){const c=U.closet.find(c=>c.id===d.id);c.status='own';save();toast('已移到「我有的」');}
  else if(a==='tryc'){const c=U.closet.find(c=>c.id===d.id),s=ITEM[c.base].slot,en={k:'c:'+c.id,t:c.base,c:c.color};const on=s==='acc'?o.acc.some(x=>x.k===en.k):o[s]&&o[s].k===en.k;if(!on)wear(s,en);U.ui.slot=s;U.ui.src=c.status==='wish'?'wish':'closet';save();return go('try');}
  else if(a==='trys'){const s=SHOPMAP[d.id],sl=ITEM[s.t].slot,en={k:'s:'+s.id,t:s.t,c:s.c};const on=sl==='acc'?o.acc.some(x=>x.k===en.k):o[sl]&&o[sl].k===en.k;if(!on)wear(sl,en);U.ui.slot=sl;U.ui.src='shop';save();return go('try');}
  else if(a==='wish'){addFromShop(d.id,'wish');toast('已加入想買清單');}
  else if(a==='have'){addFromShop(d.id,'own');toast('已加入我的衣櫃');}
  else if(a==='sbrand')shopBrand=d.v;
  else if(a==='sslot')shopSlot=d.v;
  else if(a==='load'){U.outfit=JSON.parse(JSON.stringify(U.saved[+d.i].o));save();return go('try');}
  else if(a==='dellook'){U.saved.splice(+d.i,1);save();}
  else if(a==='preset'){U.outfit=presetLook(d.s);save();return go('try');}
  else if(a==='browse'){U.ui.style=d.s;U.ui.src='cat';save();return go('try');}
  else if(a==='sex'||a==='age'){const b=U.body,ns=a==='sex'?d.v:b.sex,nk=a==='age'?d.v==='1':!!b.kid;
    if(ns!==b.sex||nk!==!!b.kid){const e0=defBody(b.sex,b.kid),untouched=FIELDS.every(f=>b[f[0]]===e0[f[0]]),reset=untouched||nk!==!!b.kid;
      if(reset)U.body=Object.assign({},defBody(ns,nk),{skin:b.skin,hairColor:b.hairColor});else{b.sex=ns;if(ns==='f')b.beard='none';}sanitizeFace(U.body);
      U.ui.allG=false;save();toast('已改為推薦'+gName()+(reset?'':'；身形數據保留不變'));}}
  else if(a==='allg'){U.ui.allG=d.v==='1';save();}
  else if(a==='est'){Object.assign(U.body,est(U.body.sex,U.body.h,U.body.w));save();toast('已依身高體重估算');}
  else if(a==='fset'){U.body[d.k]=d.v;save();}
  else if(a==='ftog'){U.body[d.k]=!U.body[d.k];save();}
  else if(a==='frand'){randFace();save();}
  else if(a==='fpre'){const P=fpre(U.body)[+d.i];Object.assign(U.body,P[1]);sanitizeFace(U.body);save();toast('已套用：'+P[0]);}
  else if(a==='setpin'||a==='nopin'){const v=a==='nopin'?'':$('#newPin').value.trim();if(a==='setpin'&&!/^\d{4}$/.test(v))return toast('請輸入四個數字');
    DB.known[UK]={name:U.name,pin:v?hash(UK+':'+v):'',av:{b:U.body,o:U.outfit}};saveLocal();
    try{await fetch(FB+'/names/'+UK+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:U.name,pin:DB.known[UK].pin,up:Date.now(),av:DB.known[UK].av})});toast(v?'密碼已設定':'已取消密碼');}catch(e){toast('離線中，密碼只存在這台裝置');}}
  else if(a==='logout'){await push();DB.cur=null;saveLocal();lgStep='select';loginView();fetchNames().then(()=>{if(!U)loginView();});return;}
  else if(a==='edcolor'){readEd();ED.color=d.c;return drawEdit();}
  else if(a==='edst'){readEd();ED.status=d.v;return drawEdit();}
  else if(a==='noimg'){readEd();ED.img='';return drawEdit();}
  else if(a==='edsave'){readEd();if(!ED.name)ED.name=ITEM[ED.base].name;if(ED.id){const i=U.closet.findIndex(c=>c.id===ED.id);U.closet[i]=ED;save();}else{delete ED.id;addCloset(ED);}closetView=ED.status;sheet('');toast('已儲存');}
  else if(a==='eddel'){U.closet=U.closet.filter(c=>c.id!==ED.id);for(const[s]of SLOTS){if(s==='acc')o.acc=o.acc.filter(x=>x.k!=='c:'+ED.id);else if(o[s]&&o[s].k==='c:'+ED.id)delete o[s];}save();sheet('');}
  render();});
document.addEventListener('input',ev=>{const e=ev.target;if(!U)return;
  if(e.dataset.body){const k=e.dataset.body,v=+e.value;if(!v)return;U.body[k]=v;document.querySelectorAll(`[data-body="${k}"]`).forEach(x=>{if(x!==e)x.value=v;});
    const st=app.querySelector('.stage');if(st)st.outerHTML=stage(true);const sb=$('#sizeBox');if(sb)sb.innerHTML=sizeBox();save();}
  if(e.dataset.chg==='color'){const s=U.ui.slot,o=U.outfit,x=s==='acc'?o.acc[Math.min(accSel,o.acc.length-1)]:o[s];if(x){x.c=e.value;const st=app.querySelector('.stage');if(st)st.outerHTML=stage(true);save();}}});
document.addEventListener('change',ev=>{const e=ev.target;if(!U)return;
  if(e.dataset.chg==='budget'){U.budget=+e.value||0;save();render();}
  if(e.dataset.chg==='lname'){U.saved[+e.dataset.i].name=e.value.trim()||'穿搭';save();}
  if(e.dataset.chg==='edcolor'){readEd();ED.color=e.value;drawEdit();}
  if(e.dataset.chg==='color')render();
  if(e.dataset.body){const k=e.dataset.body,f=FIELDS.find(x=>x[0]===k);U.body[k]=clamp(+e.value||f[2],f[2],f[3]);save();render();}
  const k=e.dataset.ed;if(!k)return;
  if(k==='slot'){readEd();ED.base=CATALOG.find(i=>i.slot===e.value).id;ED.color=ITEM[ED.base].col[0];drawEdit();}
  if(k==='base'){readEd();ED.base=e.value;drawEdit();}
  if(k==='file')setImgFile(e.files[0]);
  if(k==='url'){const v=e.value.trim();readEd();if(!v){return;}if(!/^https?:\/\//.test(v))return toast('請貼上 http 開頭的圖片網址');const im=new Image();im.onload=()=>{ED.img=v;drawEdit();};im.onerror=()=>toast('這個網址讀不到圖片，請改用「複製圖片網址」或存圖後上傳');im.src=v;}
  if(k==='name'||k==='brand'){readEd();const it=ITEM[ED.base],l=$('#imgSearch');if(l)l.href=gUrl([ED.brand,ED.name||it.name,COL[ED.color]?ED.color+'色':''].filter(Boolean).join(' '),true);}});
document.addEventListener('paste',ev=>{if(!ED||!$('#sheet .sheet'))return;const it=[...(ev.clipboardData||{}).items||[]].find(i=>i.type.startsWith('image/'));if(it){ev.preventDefault();setImgFile(it.getAsFile());}});
/* 取消按兩下放大：主要靠 CSS touch-action:manipulation；這行處理桌機雙擊 */
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
window.addEventListener('pagehide',()=>{if(U&&dirty)push();});
document.addEventListener('visibilitychange',()=>{if(!U)return;if(document.visibilityState==='hidden'){if(dirty)push();}else pull();});
window.addEventListener('online',()=>{if(U){if(dirty)push();else pull();}});
window.addEventListener('focus',()=>{if(U)pull();});
setInterval(()=>{if(U&&document.visibilityState==='visible'){if(dirty&&!pushT)push();else pull();}},45000);

(async function init(){
  loginView();await fetchNames();if(!U&&lgStep!=='new')loginView();
})();
</script>
