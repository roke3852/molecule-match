<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>咖啡器材圖鑑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* 版面想法：器材型錄 + 工程藍圖。全頁安靜的鋼灰紙面，唯一大膽處是藍圖色的原理圖板。 */
:root{
  --bg:#e8ebe9; --surface:#f6f7f5; --ink:#172026; --muted:#55626a; --line:#c3cac7;
  --accent:#1d4ed0; --accent-ink:#ffffff; --brass:#8f6216;
  --bp-bg:#173a8f; --bp-line:#e2eaff; --bp-dim:#8fa8e6; --bp-hot:#ffb869;
  --ok:#1f7a4d; --bad:#b3372f;
  --f-display:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1519; --surface:#172029; --ink:#e5ebee; --muted:#93a1a9; --line:#2b3843;
    --accent:#86abff; --accent-ink:#0b1430; --brass:#dba95a;
    --bp-bg:#10286a; --bp-line:#dfe8ff; --bp-dim:#7f98da; --bp-hot:#ffb869;
    --ok:#5fcf95; --bad:#ff8d85; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1519; --surface:#172029; --ink:#e5ebee; --muted:#93a1a9; --line:#2b3843;
  --accent:#86abff; --accent-ink:#0b1430; --brass:#dba95a;
  --bp-bg:#10286a; --bp-line:#dfe8ff; --bp-dim:#7f98da; --bp-hot:#ffb869;
  --ok:#5fcf95; --bad:#ff8d85; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
header.top{padding:22px 0 10px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;color:var(--brass);text-transform:uppercase}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(30px,8vw,46px);line-height:1.1;margin:4px 0 6px;letter-spacing:.02em;text-wrap:balance}
.lede{color:var(--muted);margin:0;max-width:34em;font-size:15px}
.search{margin:14px 0 0;display:flex;gap:8px}
.search input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 12px}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:2px solid var(--ink);margin-top:14px}
nav.tabs .wrap{display:flex;gap:0;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;overscroll-behavior:contain;scrollbar-width:none}
nav.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:none;border:0;padding:12px 14px 10px;font-weight:700;font-size:15px;color:var(--muted);border-bottom:4px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding:18px 0 110px}
h2{font-family:var(--f-display);font-weight:900;font-size:22px;margin:0 0 4px;text-wrap:balance}
h3{font-size:16px;margin:0}
.sec-note{color:var(--muted);font-size:14px;margin:0 0 12px}
section + section{margin-top:28px}

/* 原理圖板 */
.bp{background:var(--bp-bg);color:var(--bp-line);border-radius:6px;overflow:hidden}
.bp-tabs{display:flex;flex-wrap:wrap;gap:6px;padding:12px 12px 0}
.bp-tab{background:transparent;border:1px solid var(--bp-dim);color:var(--bp-line);border-radius:3px;padding:6px 12px;font-size:14px;font-weight:500}
.bp-tab[aria-pressed="true"]{background:var(--bp-line);color:var(--bp-bg);border-color:var(--bp-line);font-weight:700}
.bp-body{display:grid;grid-template-columns:1fr;gap:4px;padding:8px 12px 14px}
@media(min-width:680px){.bp-body{grid-template-columns:320px 1fr;gap:18px;align-items:center}}
.bp svg{width:100%;height:auto;display:block;max-width:360px;margin:0 auto}
.bp svg text{font-family:var(--f-mono);font-size:10.5px;fill:var(--bp-line)}
.bp h3{font-size:18px;font-weight:900;margin-bottom:4px}
.bp p{margin:0 0 8px;font-size:14.5px;line-height:1.7}
.bp ul{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.bp li{font-size:13.5px;display:grid;grid-template-columns:4.6em 1fr;gap:8px;border-top:1px solid rgba(226,234,255,.22);padding-top:4px}
.bp li b{font-family:var(--f-mono);font-weight:500;color:var(--bp-hot)}
.bp .cap{font-family:var(--f-mono);font-size:11px;color:var(--bp-dim);margin-top:6px}

/* 篩選 */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.count{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin:0 0 8px}

/* 器材卡 */
.list{display:grid;gap:10px}
@media(min-width:680px){.list{grid-template-columns:1fr 1fr;align-items:start}}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ink);border-radius:4px;padding:12px 14px}
.card.fav{border-left-color:var(--brass)}
.card .meta{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);letter-spacing:.03em}
.card h3{font-weight:900;font-size:17.5px;line-height:1.3;margin:2px 0 4px}
.pills{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 6px}
.pill{font-size:12px;border:1px solid var(--line);border-radius:3px;padding:0 7px;color:var(--muted)}
.pill.tier{border-color:var(--brass);color:var(--brass)}
.card p{margin:0;font-size:14.5px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.btn{background:transparent;border:1px solid var(--ink);border-radius:3px;padding:5px 11px;font-size:13.5px;font-weight:500}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.fav[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:var(--bg)}
.btn.solid{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
a.btn{text-decoration:none;color:inherit;display:inline-block}
.photos{display:flex;gap:6px;overflow-x:auto;margin:8px 0 0}
.photos button{flex:0 0 auto;padding:0;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:none}
.photos img{display:block;width:88px;height:88px;object-fit:cover}
.viewer{position:fixed;inset:0;z-index:12;background:var(--bg);overflow:auto;padding:16px 0 40px}
.viewer img{display:block;max-width:100%;max-height:70vh;margin:0 auto;border:1px solid var(--line);border-radius:4px}
.toast{position:fixed;left:16px;right:16px;bottom:76px;z-index:14;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:4px;font-size:14px;text-align:center}
.cloudrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:10px}
.cloudrow span{font-size:13px;color:var(--muted)}
.cloudrow .btn.on{border-color:var(--ok);color:var(--ok)}
.cloudrow .btn.err{border-color:var(--bad);color:var(--bad)}
.detail{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
dl.spec{margin:0 0 8px;display:grid;grid-template-columns:5.2em 1fr;gap:2px 10px;font-size:13.5px}
dl.spec dt{font-family:var(--f-mono);color:var(--muted);font-size:12.5px;padding-top:1px}
dl.spec dd{margin:0}
.detail h4{margin:8px 0 0;font-size:12.5px;font-family:var(--f-mono);font-weight:500;color:var(--brass);letter-spacing:.06em}
.empty{color:var(--muted);padding:24px 0;text-align:center}

/* 比較列與面板 */
.cmpbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--ink);color:var(--bg);padding:10px 0;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.cmpbar .wrap{display:flex;align-items:center;gap:10px;justify-content:space-between}
.cmpbar span{font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmpbar .btn{border-color:var(--bg);color:var(--bg);flex:0 0 auto}
.cmpbar .btn.solid{background:var(--bg);color:var(--ink)}
.sheet{position:fixed;inset:0;z-index:10;background:var(--bg);overflow:auto;padding:16px 0 40px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:13.5px}
th,td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
thead th{font-weight:900;font-size:15px;border-bottom:2px solid var(--ink)}
tbody th{font-family:var(--f-mono);font-weight:500;color:var(--muted);font-size:12px;width:5.5em;white-space:nowrap}

/* 測驗 */
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px}
.quiz .prog{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.quiz h3{font-size:18px;font-weight:900;margin:6px 0 12px;line-height:1.45}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px 12px;font-size:15px}
.opt.right{border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.wrong{border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.explain{margin:12px 0 0;font-size:14.5px;border-left:3px solid var(--brass);padding-left:10px}
.score{font-family:var(--f-mono);font-size:44px;font-weight:600;line-height:1.1}
footer{color:var(--muted);font-size:12.5px;margin-top:30px;border-top:1px solid var(--line);padding-top:10px}
@media (prefers-reduced-motion:no-preference){.bp svg .flow{animation:dash 1.6s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}}
</style>
</head>

function shrink(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const k=Math.min(1,1100/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.82))};
  im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}

/* ---------- 畫面 ---------- */
function renderTabs(){
  $("#tabs").innerHTML=CATS.map(c=>`<button class="tab" role="tab" aria-selected="${S.cat===c.id}" data-act="cat" data-v="${c.id}">${c.name}</button>`).join("")+`<button class="tab" role="tab" aria-selected="${S.cat==="quiz"}" data-act="cat" data-v="quiz">小測驗</button>`;
}
function card(it,showCat){
  const open=!!S.open[it.id],fav=S.favs.has(it.id),cmp=S.cmp.includes(it.id);
  const ph=PH[it.id]||[];
  const subLabel=(it.cat.subs.find(s=>s[0]===it.s)||[])[1]||"";
  return `<article class="card${fav?" fav":""}">
    <div class="meta">${esc(it.b)}${showCat?"　／　"+it.cat.name:""}</div>
    <h3>${esc(it.n)}</h3>
    <div class="pills"><span class="pill">${subLabel}</span><span class="pill tier">${TIERS[it.t]}</span></div>
    <p>${esc(it.d)}</p>
    ${ph.length?`<div class="photos">${ph.map((p,i)=>`<button data-act="view" data-v="${it.id}" data-i="${i}" aria-label="放大第 ${i+1} 張照片"><img src="${p.u}" alt="${esc(it.n)} 照片 ${i+1}"></button>`).join("")}</div>`:""}
    ${open?`<div class="detail"><dl class="spec">${it.sp.map(r=>`<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd>`).join("")}</dl><h4>特色</h4><p>${esc(it.f)}</p><h4>適合</h4><p>${esc(it.w)}</p></div>`:""}
    <div class="acts">
      <button class="btn" data-act="open" data-v="${it.id}" aria-expanded="${open}">${open?"收合":"看規格"}</button>
      <button class="btn fav" data-act="fav" data-v="${it.id}" aria-pressed="${fav}">${fav?"★ 已收藏":"☆ 收藏"}</button>
      <button class="btn" data-act="cmp" data-v="${it.id}" aria-pressed="${cmp}">${cmp?"✓ 比較中":"＋ 比較"}</button>
      <button class="btn" data-act="addphoto" data-v="${it.id}">＋ 加照片</button>
      <a class="btn" href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(it.n+" 咖啡")}" target="_blank" rel="noopener">搜尋照片 ↗</a>
    </div></article>`;
}
function match(it,q){return (it.n+it.b+it.d+it.f+it.w+it.sp.flat().join("")+it.cat.name+TIERS[it.t]).toLowerCase().includes(q)}
function renderCat(){
  const q=S.q.trim().toLowerCase();
  if(q){
    const hits=ALL.filter(it=>match(it,q));
    return `<section><h2>搜尋「${esc(S.q.trim())}」</h2><p class="count">${hits.length} 項符合，涵蓋全部分類</p>${hits.length?`<div class="list">${hits.map(it=>card(it,true)).join("")}</div>`:`<p class="empty">找不到符合的器材。試試品牌名、刀盤類型或產地。</p>`}</section>`;
  }
  const c=CATS.find(x=>x.id===S.cat);
  const pi=S.prin[c.id]||0,p=c.principles[pi];
  let items=c.items.filter(it=>(S.sub==="all"||it.s===S.sub)&&(!S.favOnly||S.favs.has(it.id)));
  return `<section><h2>${c.title}</h2><p class="sec-note">${c.note}</p>
    <div class="bp"><div class="bp-tabs">${c.principles.map((x,i)=>`<button class="bp-tab" data-act="prin" data-v="${i}" aria-pressed="${i===pi}">${x.label}</button>`).join("")}</div>
    <div class="bp-body"><div>${DIAG[p.k]()}</div><div><h3>${p.h}</h3><p>${p.p}</p><ul>${p.pts.map(r=>`<li><b>${r[0]}</b><span>${r[1]}</span></li>`).join("")}</ul><div class="cap">示意圖，僅說明結構與趨勢</div></div></div></div>
  </section>
  <section><h2>代表器材</h2><p class="sec-note">點「看規格」展開細節，點「＋ 比較」最多選 3 項並排。每項器材都可以加上自己的照片。</p>
    <div class="filters"><button class="chip" data-act="sub" data-v="all" aria-pressed="${S.sub==="all"}">全部</button>${c.subs.map(s=>`<button class="chip" data-act="sub" data-v="${s[0]}" aria-pressed="${S.sub===s[0]}">${s[1]}</button>`).join("")}<button class="chip" data-act="favonly" aria-pressed="${S.favOnly}">★ 只看收藏</button></div>
    <p class="count">${items.length} 項</p>
    ${items.length?`<div class="list">${items.map(it=>card(it)).join("")}</div>`:`<p class="empty">${S.favOnly?"這個分類還沒有收藏。":"沒有符合的器材。"}</p>`}
  </section>
  <footer>規格為各機型常見版本的概略資料，改款後可能不同。風味描述是一般傾向，實際結果仍取決於豆子與沖煮方式。</footer>`;
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newQuiz(){S.quiz={qs:shuffle(QUIZ.map((_,i)=>i)).slice(0,8),i:0,score:0,pick:null}}
function renderQuiz(){
  if(!S.quiz)newQuiz();
  const z=S.quiz,best=store.get("gear-quiz-best",0);
  if(z.i>=z.qs.length){
    return `<section><h2>器材小測驗</h2><div class="quiz"><div class="prog">完成</div><div class="score">${z.score} / ${z.qs.length}</div><p>${z.score===z.qs.length?"全對，可以去當器材顧問了。":z.score>=6?"基礎很穩，再看一次原理圖就能全對。":"回到各分類看看原理圖，再來挑戰一次。"}</p><p class="prog">最佳紀錄 ${Math.max(best,z.score)} / 8</p><div class="acts"><button class="btn solid" data-act="quiznew">再玩一次</button></div></div></section>`;
  }
  const Q=QUIZ[z.qs[z.i]],done=z.pick!==null;
  return `<section><h2>器材小測驗</h2><p class="sec-note">每回合從題庫隨機抽 8 題。</p><div class="quiz"><div class="prog">第 ${z.i+1} 題／共 ${z.qs.length} 題　目前 ${z.score} 分</div><h3>${Q.q}</h3>
   <div class="opts">${Q.o.map((o,i)=>`<button class="opt${done&&i===Q.a?" right":done&&i===z.pick?" wrong":""}" data-act="ans" data-v="${i}" ${done?"disabled":""}>${o}</button>`).join("")}</div>
   ${done?`<p class="explain">${z.pick===Q.a?"答對了。":"答錯了。"}${Q.e}</p><div class="acts"><button class="btn solid" data-act="next">${z.i+1<z.qs.length?"下一題":"看成績"}</button></div>`:""}</div></section>`;
}
function renderCmp(){
  const its=S.cmp.map(id=>ALL.find(x=>x.id===id)).filter(Boolean);
  $("#cmpbar").innerHTML=its.length?`<div class="cmpbar"><div class="wrap"><span>比較：${its.map(i=>esc(i.n)).join("、")}</span><span style="display:flex;gap:6px;flex:0 0 auto"><button class="btn" data-act="cmpclear">清除</button><button class="btn solid" data-act="sheet">並排比較（${its.length}）</button></span></div></div>`:"";
  if(!S.sheet||!its.length){$("#sheet").innerHTML="";S.sheet=false;return}
  const keys=[];its.forEach(i=>i.sp.forEach(r=>{if(!keys.includes(r[0]))keys.push(r[0])}));
  const row=(h,f)=>`<tr><th>${h}</th>${its.map(i=>`<td>${esc(f(i)||"—")}</td>`).join("")}</tr>`;
  $("#sheet").innerHTML=`<div class="sheet" role="dialog" aria-label="並排比較"><div class="wrap"><div class="sheet-head"><h2>並排比較</h2><button class="btn solid" data-act="sheetclose">關閉</button></div>
   <div class="tblwrap"><table><thead><tr><th></th>${its.map(i=>`<th>${esc(i.n)}</th>`).join("")}</tr></thead><tbody>
   ${row("分類",i=>i.cat.name)}${row("類型",i=>(i.cat.subs.find(s=>s[0]===i.s)||[])[1])}${row("定位",i=>TIERS[i.t])}${row("品牌",i=>i.b)}
   ${keys.map(k=>row(k,i=>(i.sp.find(r=>r[0]===k)||[])[1])).join("")}${row("特色",i=>i.f)}${row("適合",i=>i.w)}
   </tbody></table></div></div></div>`;
}
function render(){
  renderTabs();
  $("#app").innerHTML=(S.cat==="quiz"&&!S.q.trim())?renderQuiz():renderCat();
  renderCmp();
  renderViewer();
}

/* ---------- 事件 ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,v=b.dataset.v;
  if(a==="cat"){S.cat=v;S.sub="all";S.favOnly=false;S.q="";$("#q").value="";try{history.replaceState(null,"","#"+v)}catch(_){location.hash=v}window.scrollTo(0,0)}
  else if(a==="sub")S.sub=v;
  else if(a==="favonly")S.favOnly=!S.favOnly;
  else if(a==="prin")S.prin[S.cat]=+v;
  else if(a==="open")S.open[v]=!S.open[v];
  else if(a==="fav"){FAVM[v]={on:!S.favs.has(v),t:Date.now()};saveFavs();CLOUD.changed()}
  else if(a==="cmp"){const i=S.cmp.indexOf(v);if(i>=0)S.cmp.splice(i,1);else{if(S.cmp.length>=3)S.cmp.shift();S.cmp.push(v)}}
  else if(a==="cmpclear"){S.cmp=[];S.sheet=false}
  else if(a==="sheet")S.sheet=true;
  else if(a==="sheetclose")S.sheet=false;
  else if(a==="addphoto"){phTarget=v;$("#file").click();return}
  else if(a==="view")S.view={id:v,i:+b.dataset.i};
  else if(a==="viewclose")S.view=null;
  else if(a==="viewstep"){const n=PH[S.view.id].length;S.view.i=(S.view.i+ +v+n)%n}
  else if(a==="photodel"){const p=PH[S.view.id],x=p.splice(S.view.i,1)[0];DEL[x.id]=Date.now();store.set("gear-phdel",DEL);phSave(S.view.id);CLOUD.changed();if(!p.length)S.view=null;else S.view.i=Math.min(S.view.i,p.length-1)}
  else if(a==="quiznew")newQuiz();
  else if(a==="ans"){const z=S.quiz;if(z.pick===null){z.pick=+v;if(z.pick===QUIZ[z.qs[z.i]].a)z.score++}}
  else if(a==="next"){const z=S.quiz;z.i++;z.pick=null;if(z.i>=z.qs.length){const best=store.get("gear-quiz-best",0);if(z.score>best){store.set("gear-quiz-best",z.score);CLOUD.changed()}}}
  render();
});
$("#q").addEventListener("input",e=>{S.q=e.target.value;renderTabs();$("#app").innerHTML=(S.cat==="quiz"&&!S.q.trim())?renderQuiz():renderCat()});
$("#file").addEventListener("change",async e=>{
  const files=[...e.target.files],id=phTarget;if(!id||!files.length)return;
  let bad=0;PH[id]=PH[id]||[];
  for(const f of files){try{PH[id].push({id:rid(),u:await shrink(f),t:Date.now()})}catch(_){bad++}}
  const saved=phSave(id);CLOUD.changed();e.target.value="";render();
  if(bad)toast(`有 ${bad} 張照片讀不出來，請改用 JPG 或 PNG。`);
  else if(!saved)toast("照片已加入，但這個瀏覽器無法儲存，關閉頁面後會消失。");
});
/* ---------- Google 雲端同步：存在你自己 Google 雲端硬碟的隱藏 App 資料夾（只在 GitHub 網址啟用） ---------- */
const CLOUD=(function(){
  const ui=(cls,b,n)=>{const e=$("#cloud");e.className="btn "+cls;e.textContent=b;$("#cloudnote").textContent=n};
  if(!/github\.io$/.test(location.hostname||"")){
    $("#cloud").onclick=()=>toast("雲端儲存要用 roke3852.github.io 的網址打開才能用");
    return {changed(){}};
  }
  const GCLIENT="267421312122-l2ggo7t35tqpf8ej5osqttt08ke30lr1.apps.googleusercontent.com";
  const GAPI="https://www.googleapis.com",META="gear-atlas.json",SCOPE="https://www.googleapis.com/auth/drive.appdata";
  let tok=null,exp=0,client=null,on=false,files={},timer=null,busy=false,again=false;
  const flag=()=>store.get("gear-g",0)===1;
  try{const t=JSON.parse(sessionStorage.getItem("gear-gtok")||"null");if(t&&t.exp>Date.now()){tok=t.tok;exp=t.exp}}catch(e){}
  function lib(){return new Promise((ok,no)=>{if(window.google&&google.accounts&&google.accounts.oauth2)return ok();const sc=document.createElement("script");sc.src="https://accounts.google.com/gsi/client";sc.onload=()=>ok();sc.onerror=()=>no();document.head.appendChild(sc)})}
  async function gf(url,opt={}){
    if(!tok||Date.now()>exp)throw new Error("auth");
    const r=await fetch(url,Object.assign({},opt,{headers:Object.assign({Authorization:"Bearer "+tok},opt.headers||{})}));
    if(r.status===401){tok=null;throw new Error("auth")}
    if(!r.ok)throw new Error("http "+r.status);
    return r;
  }
  async function up(name,body,ct){
    if(files[name]){await gf(GAPI+"/upload/drive/v3/files/"+files[name]+"?uploadType=media",{method:"PATCH",headers:{"Content-Type":ct},body});return}
    const b="ga"+Date.now()+Math.random().toString(36).slice(2),meta=JSON.stringify({name,parents:["appDataFolder"]});
    const mp="--"+b+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+meta+"\r\n--"+b+"\r\nContent-Type: "+ct+"\r\n\r\n"+body+"\r\n--"+b+"--";
    const r=await gf(GAPI+"/upload/drive/v3/files?uploadType=multipart&fields=id",{method:"POST",headers:{"Content-Type":"multipart/related; boundary="+b},body:mp});
    files[name]=(await r.json()).id;
  }
  const expired=()=>ui("err","☁ 點這裡連回 Google","連線已過期，資料先存在這台裝置");
  async function sync(manual){
    if(!on)return;
    if(busy){again=true;return}
    if(!tok||Date.now()>exp){expired();return}
    busy=true;ui("","☁ 同步中…","正在和 Google 雲端硬碟同步");
    try{
      files={};let pt="";
      do{const j=await (await gf(GAPI+"/drive/v3/files?spaces=appDataFolder&pageSize=1000&fields=nextPageToken,files(id,name)"+(pt?"&pageToken="+encodeURIComponent(pt):""))).json();
        (j.files||[]).forEach(f=>files[f.name]=f.id);pt=j.nextPageToken||""}while(pt);
      let rem=null;
      if(files[META])rem=await (await gf(GAPI+"/drive/v3/files/"+files[META]+"?alt=media")).json().catch(()=>null);
      rem=Object.assign({favs:{},photos:{},best:0},rem||{});
      /* 收藏：每筆取較新的 */
      for(const k in rem.favs){const a=FAVM[k],b=rem.favs[k];if(b&&typeof b.t==="number"&&(!a||b.t>a.t))FAVM[k]={on:!!b.on,t:b.t}}
      saveFavs();
      const best=Math.max(+rem.best||0,store.get("gear-quiz-best",0));store.set("gear-quiz-best",best);
      /* 照片：一張一個檔案，索引記在 META */
      const idx=rem.photos||{},loc={};
      for(const item in PH)PH[item].forEach(p=>loc[p.id]={item,p});
      for(const id in DEL)if(!idx[id]||!idx[id].del)idx[id]={item:(idx[id]||{}).item||"",t:DEL[id],del:true};
      let got=0,sent=0;
      for(const id of Object.keys(idx)){
        const e=idx[id],fn="gp-"+id;
        if(e.del){
          if(loc[id]){const it=loc[id].item;PH[it]=PH[it].filter(p=>p.id!==id);phSave(it);delete loc[id]}
          if(files[fn]){await gf(GAPI+"/drive/v3/files/"+files[fn],{method:"DELETE"});delete files[fn]}
        }else if(!loc[id]){
          if(files[fn]&&ALL.some(x=>x.id===e.item)){
            const u=await (await gf(GAPI+"/drive/v3/files/"+files[fn]+"?alt=media")).text();
            if(u.startsWith("data:image/")){(PH[e.item]=PH[e.item]||[]).push({id,u,t:e.t});phSave(e.item);got++}
          }else if(!files[fn])delete idx[id];
        }
      }
      for(const id in loc)if(!idx[id]){await up("gp-"+id,loc[id].p.u,"text/plain");idx[id]={item:loc[id].item,t:loc[id].p.t||Date.now()};sent++}
      await up(META,JSON.stringify({v:1,favs:FAVM,photos:idx,best}),"application/json");
      DEL={};store.set("gear-phdel",DEL);
      const hm=new Date().toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit",hour12:false});
      ui("on","☁ 已同步 "+hm,"收藏與照片已存到你的 Google 雲端硬碟，點按鈕可立即同步");
      if(manual||got)toast("已同步"+(got?"，下載 "+got+" 張照片":"")+(sent?"，上傳 "+sent+" 張照片":""));
      render();
    }catch(e){if(e.message==="auth")expired();else ui("err","☁ 同步失敗，點此重試","資料先存在這台裝置")}
    finally{busy=false;if(again){again=false;sync()}}
  }
  function login(){
    const go=()=>{
      if(!client)client=google.accounts.oauth2.initTokenClient({client_id:GCLIENT,scope:SCOPE,
        callback:t=>{if(t&&t.access_token){tok=t.access_token;exp=Date.now()+((+t.expires_in||3600)-120)*1000;try{sessionStorage.setItem("gear-gtok",JSON.stringify({tok,exp}))}catch(e){}on=true;store.set("gear-g",1);sync(true)}else ui("err","☁ 用 Google 帳號同步","Google 登入沒有完成")},
        error_callback:()=>ui("err","☁ 用 Google 帳號同步","登入被取消或被擋，請允許彈出視窗後再試")});
      client.requestAccessToken({prompt:flag()?"":"consent"});
    };
    lib().then(go,()=>ui("err","☁ 用 Google 帳號同步","無法載入 Google 登入，請確認網路"));
  }
  $("#cloud").onclick=()=>{if(on&&tok&&Date.now()<exp)sync(true);else login()};
  document.addEventListener("visibilitychange",()=>{if(document.hidden&&timer){clearTimeout(timer);timer=null;sync()}});
  setTimeout(()=>lib().catch(()=>{}),600);
  return {changed(){if(!on)return;clearTimeout(timer);timer=setTimeout(()=>{timer=null;sync()},1500)},
    boot(){if(!flag())return;if(tok){on=true;sync()}else expired()}};
})();
function fromHash(){const h=location.hash.slice(1);if(h==="quiz"||CATS.some(c=>c.id===h)){S.cat=h;S.sub="all"}}
window.addEventListener("hashchange",()=>{fromHash();render()});
function start(d){
  if(d&&d.cat){Object.assign(S,{cat:d.cat,sub:d.sub||"all",cmp:d.cmp||[],open:d.open||{},prin:d.prin||{},quiz:d.quiz||null})}
  fromHash();render();
  phOpen().then(()=>{render();CLOUD.boot&&CLOUD.boot()});
}
window.claude?.hot?.snapshot?.(()=>({cat:S.cat,sub:S.sub,cmp:S.cmp,open:S.open,prin:S.prin,quiz:S.quiz}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
