<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta charset="utf-8">
<meta name="author" content="Jim Lu">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>沖煮筆記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one phone-width column, instrument-style readouts in mono, bottom tab bar, full-screen sheets for entry */
  --bg:#F2F5F3; --surface:#FFFFFF; --sunken:#E8EDEA; --ink:#1B2421; --muted:#5C6965; --line:#D5DDD8;
  --accent:#9E2B45; --accent-ink:#FFFFFF; --accent-soft:#F4E1E6;
  --good:#2B7A57; --warn:#A8690F; --cold:#33689A;
  --display:"Noto Serif TC","Songti TC",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111615; --surface:#1A211F; --sunken:#232C29; --ink:#E7ECE9; --muted:#98A6A1; --line:#2D3835;
    --accent:#E57A92; --accent-ink:#22090F; --accent-soft:#3A1F27;
    --good:#6BC49B; --warn:#E2B35F; --cold:#82B4E0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111615; --surface:#1A211F; --sunken:#232C29; --ink:#E7ECE9; --muted:#98A6A1; --line:#2D3835;
  --accent:#E57A92; --accent-ink:#22090F; --accent-soft:#3A1F27;
  --good:#6BC49B; --warn:#E2B35F; --cold:#82B4E0; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
header{padding:14px 16px 8px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
header h1{font-family:var(--display);font-size:22px;margin:0;letter-spacing:.04em}
#sync{font-size:12px;color:var(--muted);text-align:right}
main{flex:1;overflow-y:auto;padding:4px 16px 24px;display:flex;flex-direction:column;gap:12px}
nav{display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;gap:4px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
nav a{text-align:center;padding:9px 4px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:500}
nav a.on{color:var(--accent);background:var(--accent-soft)}
.fab{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:9px 18px;font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
button.card{text-align:left;width:100%}
h2{font-size:13px;font-weight:700;color:var(--muted);margin:8px 0 0;letter-spacing:.08em}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.between{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.title{font-weight:700;font-size:16px}
.sub{color:var(--muted);font-size:13px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.good{color:var(--good)}.pill.warn{color:var(--warn)}.pill.cold{color:var(--cold)}.pill.muted{color:var(--muted)}
.tag{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--sunken)}
.chg{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--sunken);color:var(--ink)}
.bc{display:block;width:100%;text-align:left}.bc-meta{font-size:12px;color:var(--muted)}.bc-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bc-p{font-size:13px;color:var(--muted);margin:6px 0 4px}.bc-l{display:flex;gap:8px;font-size:13.5px;line-height:1.5;margin-top:3px}.bc-k{flex:0 0 auto;font-size:12px;color:var(--muted);padding-top:1px;width:28px}
.bc-l b.up,.bc-l b.dn{font-weight:700;margin-left:1px}.bc-l b.up{color:var(--good)}.bc-l b.dn{color:var(--cold)}
.bc-tags{margin-top:6px}.bc-next{margin-top:8px;padding-top:7px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score.hi{background:var(--accent);color:#fff}.score.hi small{color:#fff;opacity:.8}.score.lo,.score.dim{background:var(--sunken);color:var(--muted)}
.calt{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}.calt th{font-weight:500;color:var(--muted);text-align:left;font-size:12px}.calt td,.calt th{padding:3px 4px;border-bottom:1px solid var(--line)}
.score{font-family:var(--mono);font-weight:600;font-size:20px;min-width:44px;text-align:center;padding:4px 6px;border-radius:8px;background:var(--accent-soft);color:var(--accent)}
.score small{display:block;font-size:10px;font-weight:400;font-family:var(--body);color:var(--muted)}
.banner{border:1px dashed var(--warn);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.tile b{display:block;font-family:var(--mono);font-size:20px}
.tile span{font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px;font-weight:500}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--accent)}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:10;display:none}
.sheet.on{display:block}
.sheet-in{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.sheet-head b{font-family:var(--display);font-size:18px}
.sheet-body{flex:1;overflow-y:auto;padding:12px 16px 24px;display:flex;flex-direction:column;gap:14px}
.sheet-foot{padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface);display:flex;gap:8px}
.sheet-foot .btn{flex:1}
fieldset{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px 12px;margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
legend{font-size:13px;font-weight:700;color:var(--muted);padding:0 6px;letter-spacing:.06em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{width:100%;min-width:0;padding:8px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:15px;color:var(--ink)}
label.f input.mono{font-family:var(--mono)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{flex:1;min-width:30px;padding:7px 0;border:1px solid var(--line);background:var(--bg);border-radius:8px;font-family:var(--mono)}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.seg.txt button{font-family:var(--body);padding:7px 10px}
.srow{display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:center}
.srow>span{font-size:13px}
.grp{font-size:11px;color:var(--muted);letter-spacing:.1em;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.rlib{border-left:4px solid var(--rc,var(--accent))}.rlib.sel{box-shadow:0 0 0 2px var(--rc)}
.cdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:1px}
.gearline{font-size:12.5px;color:var(--muted);margin:4px 0 6px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 6px}
.tl{background:var(--sunken);border-radius:10px;padding:6px 7px 5px;min-width:0}
.tlh{font-size:10.5px;color:var(--muted);letter-spacing:.05em}.tlv{font-family:var(--mono);font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tls{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tlx{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);line-height:1.2}
.mtr{position:relative;height:6px;border-radius:3px;background:var(--line);margin:4px 0 2px}.mtr .mk{position:absolute;top:-3px;width:4px;height:12px;border-radius:2px;margin-left:-2px}.mtr .bd{position:absolute;top:0;height:6px;border-radius:3px;opacity:.45}
.psvg,.lmap{width:100%;height:auto;display:block}.psvg .gl,.lmap .gl,.dstrip .gl{stroke:var(--line);stroke-width:1}
.psvg .tk,.lmap .tk{font-size:9px;fill:var(--muted);font-family:var(--mono)}.psvg .tv{fill:var(--ink)}
.psvg .pa{fill:var(--rc,var(--accent));fill-opacity:.1}.psvg .pl{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:2 2}
.psvg .cb{fill:var(--cold);fill-opacity:.12}.psvg .dn{stroke:var(--good);stroke-width:1.2;stroke-dasharray:3 2}
.lmap .ld{cursor:pointer}.lmap .gz{font-size:8px;fill:var(--muted);opacity:.8}.lmap .gz.gc{font-size:10px;font-weight:700;fill:#c8902a;opacity:1}.lmap .gt{font-size:7px;fill:var(--muted);opacity:.6}
.simz{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin:0 0 6px}.zb{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--sunken);color:var(--ink)}.zb.zg{background:#e8b04a33;color:#a8741a;font-weight:600}.lmap .lbl{fill:var(--ink);font-family:var(--body);font-size:11px;font-weight:600;paint-order:stroke;stroke:var(--surface);stroke-width:3px}
.lmapc{padding-bottom:6px}
.tkey{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--muted);margin-top:2px}.tkey i{display:inline-block;width:14px;height:4px;border-radius:2px}.tkey span{margin-right:4px}
.fit{margin:8px 0 2px;display:grid;gap:4px}.fitr{display:flex;flex-wrap:wrap;align-items:center;gap:4px}.fh{font-size:11px;color:var(--muted);width:3.4em}
.fp{font-size:11.5px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.fp.on{background:var(--rc,var(--accent));border-color:transparent;color:#fff}.fp.no{text-decoration:line-through;opacity:.55}.fp.all{border-style:dashed;color:var(--ink)}
.ufprev{background:var(--sunken);border-radius:12px;padding:6px;margin-bottom:10px;--rc:#C8602E}.ufprev .tl{background:var(--surface)}
.ufp{display:grid;grid-template-columns:1.1fr 1fr 1fr 34px 36px;gap:5px;align-items:center;margin-bottom:5px}.ufp input{width:100%;min-width:0;padding:7px 6px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}.ufp input[type=checkbox]{width:20px;height:20px;justify-self:center}
.ufh{font-size:11px;color:var(--muted);margin-bottom:2px}
.pst{color:var(--good)}
.trk{margin-top:8px;border-top:1px dashed var(--line);padding-top:4px}.trk summary small{font-weight:400;letter-spacing:0}
.trkv{background:var(--accent-soft);border-radius:10px;padding:7px 10px;font-size:13px;margin:4px 0}
.brow{display:grid;grid-template-columns:1fr 130px 46px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);cursor:pointer}
.bname{min-width:0;font-size:13px}.bname>div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btags{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px}.btags span{font-size:10px;background:var(--sunken);border-radius:4px;padding:0 4px;color:var(--muted)}
.dstrip{width:130px;height:18px}.bsc{text-align:right;font-size:15px;font-weight:600;line-height:1.1}.bsc small{display:block;font-size:9.5px;font-weight:400;color:var(--muted)}
.dgrp{margin:6px 0}.dname{font-size:11.5px;color:var(--muted);margin-bottom:2px}
.dbar{display:grid;grid-template-columns:minmax(0,1.3fr) 1fr 48px;gap:6px;align-items:center;font-size:12.5px;padding:1px 0}.dk{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtrack{height:8px;background:var(--sunken);border-radius:4px;overflow:hidden}.dtrack i{display:block;height:100%;background:var(--muted);border-radius:4px}.dbar.top .dtrack i{background:var(--good)}.dbar.top .dk{font-weight:600}
.dv{text-align:right}.dv small{color:var(--muted);font-size:10px;margin-left:2px}
.prow{padding:7px 0;border-bottom:1px solid var(--line);gap:8px;align-items:center}.prow>div:first-child{flex:1;min-width:0}.prow .btn{white-space:nowrap}.row.nowrap{flex-wrap:nowrap}.ckrow{display:flex;gap:6px;align-items:center;font-size:13px;margin:8px 0 4px}.recpick{margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--line)}.rlib details summary{cursor:pointer;margin-top:4px}.myrec .grp small{font-weight:400}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:5px 11px;font-size:13px}
.chip.open{border-color:var(--ink);font-weight:700}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.has{border-color:var(--accent);color:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.cmp{width:100%;border-collapse:collapse;font-size:13px}
.cmp th,.cmp td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
.cmp th{color:var(--muted);font-weight:500}
.cmp tr.d td{color:var(--accent);font-weight:700}
svg{display:block;width:100%;height:auto}
svg text{font-family:var(--mono);font-size:10px;fill:var(--muted)}
svg .ax{stroke:var(--line);stroke-width:1}
svg .pt{fill:var(--accent);stroke:var(--surface);stroke-width:1.5;cursor:pointer}
svg .best{fill:none;stroke:var(--ink);stroke-width:1.5}
svg .band{fill:var(--good);opacity:.13}
svg .lbl{fill:var(--ink);font-weight:600}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:13px;z-index:30;display:none;max-width:90%}
.up{color:var(--accent)}.down{color:var(--cold)}
.rc-row{margin:10px 0 14px}.rc-name{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}.rc-d{font-size:13px;white-space:nowrap;margin-left:8px}
.rc-bar{position:relative;height:14px;border-radius:7px;background:var(--sunken);margin-top:6px;overflow:visible}
.rc-bar i{position:absolute;top:0;bottom:0;border-radius:7px}
.rc-rest{background:color-mix(in srgb,var(--warn) 22%,transparent)}.rc-win{background:color-mix(in srgb,var(--good) 30%,transparent)}
.rc-fill{left:0;top:5px!important;bottom:5px!important;background:var(--muted)}.rc-fill.good{background:var(--good)}.rc-fill.warn{background:var(--warn)}.rc-fill.cold{background:var(--cold)}
.rc-now{position:absolute;top:-3px;bottom:-3px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--ink)}
.rc-axis{position:relative;height:16px;font-size:11px;color:var(--muted);margin-top:2px}.rc-axis span{position:absolute;transform:translateX(-50%)}
.rc-key{gap:14px;margin-top:6px}.rc-key span{display:inline-flex;align-items:center;gap:5px}.rc-sw{display:inline-block;width:14px;height:8px;border-radius:4px;position:static!important}
details>summary{cursor:pointer;list-style:none}details>summary::-webkit-details-marker{display:none}details.card summary b{font-size:14px}
.cmp tr[data-act]{cursor:pointer}
.desk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 12px 16px;margin:8px 0 12px;border-radius:16px;background:linear-gradient(180deg,#a8774c,#8a5a34);box-shadow:inset 0 -6px 0 #6b4226,0 2px 8px rgba(0,0,0,.25);background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 2px,transparent 2px 22px),linear-gradient(180deg,#a8774c,#8a5a34)}
.desk.sticky{position:sticky;top:0;z-index:6}
.slot{min-height:84px;border:2px dashed rgba(255,244,225,.55);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 4px;color:#fff4e1;text-align:center;transition:transform .12s,background .12s}
.slot.wide{grid-column:1/-1;min-height:46px;flex-direction:row;gap:10px}
.slot-l{font-size:12px;font-weight:700;letter-spacing:.05em;opacity:.95}.slot-e{font-size:11px;opacity:.7}.slot-n{font-size:11px;line-height:1.25;max-width:100%;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.slot.full{border-style:solid;border-color:rgba(255,244,225,.85);background:rgba(255,244,225,.14);cursor:pointer}
.slot.can{border-color:#ffe08a;background:rgba(255,224,138,.12)}.slot.hot{border-color:#ffe08a;background:rgba(255,224,138,.3);transform:scale(1.05)}
.shelf{display:flex;flex-wrap:wrap;gap:8px}.shelf-row{margin-bottom:6px}
.tool{width:76px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border:1px solid var(--line);border-radius:12px;background:var(--bg);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;text-align:center}
.tool span{font-size:10.5px;line-height:1.2;color:var(--ink);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tool.used{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.tool.bad{opacity:.35}
.tool.ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;box-shadow:0 8px 20px rgba(0,0,0,.35);opacity:.95}
svg.px{image-rendering:pixelated}svg.dk{filter:drop-shadow(1px 0 0 #9aa3ad) drop-shadow(-1px 0 0 #9aa3ad) drop-shadow(0 1px 0 #9aa3ad) drop-shadow(0 -1px 0 #9aa3ad);overflow:visible}
.mr{width:100%;padding:0 2px}.mr-bar{position:relative;height:8px;border-radius:4px;background:var(--sunken);margin-top:3px}.mr-bar i{position:absolute;top:0;bottom:0;border-radius:4px}
.mr-fill{left:0;top:2.5px!important;bottom:2.5px!important;background:var(--muted)}.mr-fill.good{background:var(--good)}.mr-fill.warn{background:var(--warn)}.mr-fill.cold{background:var(--cold)}
.mr-bar b{position:absolute;top:-2px;bottom:-2px;width:2px;margin-left:-1px;background:var(--ink);border-radius:1px}.mr-t{font-size:10px;margin-top:2px}
.words{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.word{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;padding:7px 9px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.w-en{font-weight:700;font-size:14px}.w-ipa{font-size:11.5px;color:var(--accent)}.w-zh{font-size:11.5px;color:var(--muted)}
.bt{display:flex;flex-direction:column;align-items:center;font-size:10px;line-height:1.3;margin-top:1px}.bt-m{color:var(--accent);font-weight:700}.bt-a{color:var(--muted);white-space:nowrap;font-size:9.5px}.bt-n{opacity:.6}
.slot-b{font-size:10px;opacity:.85}
.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.catc{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;padding:10px 6px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}

<script>
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY=864e5;
const dayStart=t=>{const d=new Date(t);return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()};
const pd=s=>{const[a,b,c]=String(s).split('-').map(Number);return new Date(a,b-1,c).getTime()};
const p2=n=>String(n).padStart(2,'0');
const iso=t=>{const d=new Date(t);return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`};
const isoLocal=t=>{const d=new Date(t);return `${iso(t)}T${p2(d.getHours())}:${p2(d.getMinutes())}`};
const when=t=>{const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${p2(d.getHours())}:${p2(d.getMinutes())}`};
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const num=v=>(v===''||v==null||isNaN(+v))?null:+v;
const has=v=>v!==null&&v!==undefined&&v!=='';
const fmtTime=s=>!has(s)?'—':`${Math.floor(s/60)}:${p2(Math.round(s%60))}`;
const parseTime=v=>{v=String(v).trim();if(!v)return null;if(v.includes(':')){const[m,s]=v.split(':');return (+m||0)*60+(+s||0)}return isNaN(+v)?null:+v};
const r1=n=>Math.round(n*10)/10, r2=n=>Math.round(n*100)/100;

/* ---------- vocabulary ---------- */
const PARAMS=[{k:'grinder',l:'磨豆機'},{k:'grind',l:'刻度'},{k:'dripper',l:'濾杯'},{k:'paper',l:'濾紙'},{k:'kettle',l:'注水壺'},{k:'h2o',l:'用水'},{k:'method',l:'手法'},{k:'temp',l:'水溫',u:'°C'},{k:'dose',l:'粉重',u:'g'},{k:'water',l:'注水',u:'g'},{k:'pours',l:'注水段'},{k:'time',l:'時間'}];
const fmtP=(p,v)=>!has(v)?'—':p.k==='time'?fmtTime(v):p.k==='pours'?String(v).split('\n').join(' / '):v+(p.u||'');
const SC=[['嗅覺',[['fa','前嗅覺'],['ra','後嗅覺']]],['味覺',[['acid','酸'],['sweet','甜'],['bitter','苦']]],['觸覺',[['body','厚度'],['astr','澀感']]],['後韻',[['fin_acid','酸'],['huigan','甘'],['fin_bitter','苦'],['fin_astr','澀']]],['整體',[['overall','整體']]]];
const SCL=Object.fromEntries(SC.flatMap(g=>g[1]));
/* 品質（杯測式）：−1 差、0 普通、1 很好、2 傑出 */
const QI=[['q_flavor','香氣／風味',20],['q_acid','酸／鹹',15],['q_sweet','甜／苦',20],['q_mouth','口感',15],['q_bal','平衡',15],['q_clar','清晰度',15],['q_fin','餘韻',10]];

const COND=[['ok','正常'],['nose','鼻塞／感冒'],['smell','環境有氣味'],['mouth','口腔干擾（剛吃東西、刷牙）'],['fatigue','味覺疲勞（喝太多杯）'],['tired','疲倦、沒睡好'],['rush','匆忙、沒專心']];

const QL=Object.fromEntries(QI.map(x=>[x[0],x[1]])),QV=[-1,-0.5,0,0.5,1,1.5,2];
const QW={'-1':'差','-0.5':'偏差','0':'普通','0.5':'好','1':'很好','1.5':'優異','2':'傑出'};
const qWord=v=>QW[String(v)]||'';
let RELM=(()=>{try{return localStorage.getItem('bn-relmode')!=='direct'}catch(e){return true}})();
const REL=[['acid','酸'],['sweet','甜'],['bitter','苦'],['body','厚度']];
const TEMPS=[['hot','高溫'],['warm','中溫'],['room','常溫']];
const WHEEL={'花香':['茉莉','玫瑰','洋甘菊','橙花','紅茶'],'莓果':['草莓','藍莓','覆盆莓','黑莓','蔓越莓'],'柑橘':['檸檬','葡萄柚','柳橙','萊姆','佛手柑'],'核果熱帶':['水蜜桃','杏桃','芒果','鳳梨','荔枝','百香果'],'其他水果':['蘋果','葡萄','梨','櫻桃','李子'],'果乾':['葡萄乾','蜜棗','無花果'],'發酵':['酒香','威士忌','蘭姆','過度發酵'],'甜感':['蜂蜜','焦糖','黑糖','楓糖','香草'],'堅果可可':['杏仁','榛果','花生','牛奶巧克力','黑巧克力'],'香料':['肉桂','丁香','胡椒'],'烘焙':['穀物','烤麵包','煙燻','焦苦'],'草本':['青草','生豆味','草本','茶感']};

/* ---------- state + storage ---------- */
const S={beans:[],brews:[],gear:[],loaded:{beans:false,brews:false,gear:false},view:'log',cloud:false,aBean:null,cmpA:null,cmpB:null,canPhoto:false};
let store=null,sampleFn=null,DLS=null;
const clean=o=>JSON.parse(JSON.stringify(o,(k,v)=>k.startsWith('_')||k==='id'?undefined:v));
function localStore(){
  const K='brewlog-v1';let dels=[];
  try{const d=JSON.parse(localStorage.getItem(K)||'null');if(d){S.beans=d.beans||[];S.brews=d.brews||[];S.gear=d.gear||[];dels=d.dels||[]}}catch(e){}
  S.loaded={beans:true,brews:true,gear:true};
  const snap=()=>({beans:S.beans,brews:S.brews,gear:S.gear,dels});
  const keep=()=>{try{localStorage.setItem(K,JSON.stringify(snap()))}catch(e){}};
  const put=()=>{keep();render();if(G)G.changed()};
  const up=(arr,o)=>{const i=arr.findIndex(x=>x.id===o.id);if(i<0)arr.push(o);else arr[i]=o};
  const merge=r=>{dels=[...new Set(dels.concat(r.dels||[]))];for(const c of ['beans','brews','gear']){const m=new Map(S[c].map(x=>[x.id,x]));(r[c]||[]).forEach(x=>{const o=m.get(x.id);if(!o||(x.u||0)>(o.u||0))m.set(x.id,x)});S[c]=[...m.values()].filter(x=>!dels.includes(x.id))}keep();render()};
  const G=/github\.io$/.test(location.hostname)?drive(snap,merge):null;
  if(!G)$('#sync').textContent='僅存在這台裝置';
  /* 收件匣：Claude 幫忙整理的豆子／紀錄放在 inbox.json，開啟時只補進還沒有、也沒被刪掉的項目 */

function geosOf(b){const t=[b.region,b.station,b.origin,b.name].filter(Boolean).join(' ');const parts=String(b.origin||'').split(/[×x、,，/]/).map(s=>s.trim()).filter(Boolean);
  const out=[];if(parts.length>1){for(const p of parts){const g=GEO.find(g=>g.re.test(p));if(g&&!out.includes(g))out.push(g)}if(out.length)return out}
  const g=GEO.find(g=>g.re.test(t));return g?[g]:[]}
function altOf(b){const m=String(b.altitude||'').match(/(\d{3,4})(?:\s*[–\-~～至到]\s*(\d{3,4}))?/);if(m)return{lo:+m[1],hi:+(m[2]||m[1]),est:false};
  const g=geosOf(b);if(!g.length)return null;return{lo:Math.min(...g.map(x=>x.alt[0])),hi:Math.max(...g.map(x=>x.alt[1])),est:true,multi:g.length>1}}
const kmTo=(g)=>{const R=6371,t=Math.PI/180,a=23.6,o=121;const d=Math.acos(Math.sin(a*t)*Math.sin(g.lat*t)+Math.cos(a*t)*Math.cos(g.lat*t)*Math.cos((g.lon-o)*t));return Math.round(R*d/100)*100};

function mapSvg(b){const gs=geosOf(b);const tw=[MPX(121),MPY(23.6)];

function altSvg(b,cap=true){const a=altOf(b);const W=320,H=150,T=10,B=22,max=2600,Y=v=>T+(H-T-B)*(1-Math.min(v,max)/max);
  if(!a)return '<div class="sub">還沒有海拔資料，在「編輯」填海拔（例如 1900–2200m）就會畫出來。</div>';
  const mid=(a.lo+a.hi)/2,tier=mid>=2000?'極高海拔':mid>=1600?'高海拔':mid>=1200?'中海拔':'低海拔';
  let s=`<svg class="alts" viewBox="0 0 ${W} ${H}" role="img" aria-label="海拔 ${a.lo} 到 ${a.hi} 公尺，${tier}">`;
  for(const[v,l]of[[1200,'1200'],[1600,'1600'],[2000,'2000']])s+=`<line x1="34" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" class="gl"/><text x="30" y="${Y(v)+3}" text-anchor="end" class="al">${l}</text>`;
  s+=`<text x="30" y="${Y(0)+3}" text-anchor="end" class="al">0 m</text>`;
  const pk=Y(Math.min(a.hi+250,max));
  s+=`<polygon class="mt2" points="34,${Y(0)} 90,${Y(900)} 130,${Y(600)} 175,${Y(1300)} 205,${Y(1000)} ${W},${Y(0)}"/>`;
  s+=`<polygon class="mt" points="120,${Y(0)} 210,${pk} 236,${pk+8} 250,${pk+2} ${W},${Y(a.lo*0.55)} ${W},${Y(0)}"/>`;
  s+=`<polygon class="snow" points="210,${pk} 236,${pk+8} 250,${pk+2} 244,${pk+14} 228,${pk+10} 216,${pk+16}"/>`;
  s+=`<rect x="34" y="${Y(a.hi)}" width="${W-34}" height="${Math.max(3,Y(a.lo)-Y(a.hi))}" class="band"/>`;
  for(let i=0;i<5;i++){const x=150+i*22,yy=(Y(a.lo)+Y(a.hi))/2+((i%2)*6-3);s+=`<g transform="translate(${x} ${yy})"><rect x="-.8" y="0" width="1.6" height="7" fill="#6b4a2a"/><circle r="5" cy="-1" class="tree"/><circle r="1.4" cx="2" cy="1" fill="#c0392b"/></g>`}
  s+=`<text x="${W-4}" y="${Y(a.hi)-4}" text-anchor="end" class="av">${a.lo===a.hi?a.lo:a.lo+'–'+a.hi} m${a.est?'（估）':''}</text>`;
  /* 參考：台北 101（508 m） */
  s+=`<rect x="52" y="${Y(508)}" width="5" height="${Y(0)-Y(508)}" class="ref"/><text x="60" y="${Y(508)+4}" class="al">101 大樓</text>`;
  return s+'</svg>'+(cap?'':'<!--')+`<div class="alt-cap"><b>${tier}</b>　${a.est?'豆袋沒寫海拔，這是產區常見的範圍。':''}${ALTSAY(mid)}</div>`+(cap?'':'-->')}

async function recAction(a,el){const id=el.dataset.id,v=el.dataset.v;
  if(await vizAction(a,el))return true;
  if(a==='myAdd'){await addMyRec(id);return true}
  if(a==='myGo'){S.rtab='my';render();setTimeout(()=>{const n=document.getElementById('my-'+id);if(n)n.scrollIntoView({block:'start'})},50);return true}
  if(a==='libCat'){LIBC=v;render();return true}
  if(a==='libShow'){S.rtab='lib';LIBC='all';LIBQ=(libById(id)||{}).name||'';render();return true}
  if(a==='libBrew'){let rec=myByLib(id);if(!rec){await addMyRec(id);rec=myByLib(id)}if(rec)startRec(rec.id,'base');return true}
  if(a==='myBrew'){startRec(id,v);return true}
  if(a==='myDel'){if(confirmTap(el,'myrec'+id)){try{await store.del('gear',id);toast('已移除配方（沖過的紀錄都還在）')}catch(e){}}return true}
  if(a==='preNew'){openPreset(id);return true}

  if(a==='preFromBrew'){const b=brewById(v);openPreset(id,null,b?pickP(b):null);return true}
  if(a==='preSave'){await savePreset();return true}
  if(a==='preDel'){if(confirmTap(el,'pre'+PF.pid))await delPreset();return true}
  return false}

function fitOf(r){if(r.fit&&(r.fit.r||r.fit.p))return{r:r.fit.r||[],p:r.fit.p||[],rn:r.fit.rn||[],pn:r.fit.pn||[],all:!!r.fit.all};
  const t=String(r.beans||''),on={r:new Set(),p:new Set()},neg={r:new Set(),p:new Set()};
  const RI={'極淺':0,'淺':1,'中淺':2,'淺中':2,'中':3,'中深':4,'深':4};
  const roastsIn=s=>{const o=new Set();let x=s;
    x=x.replace(/(極淺|中淺|淺中|中深|淺|中|深)焙?(?:到|至|～|~)(極淺|中淺|淺中|中深|淺|中|深)焙/g,(m,a,b)=>{for(let i=RI[a];i<=RI[b];i++)o.add(i);return ' '});

    if(/中焙/.test(x.replace(/中深焙|淺中焙/g,'')))o.add(3);if(/深焙/.test(x))o.add(4);return o};
  const procsIn=s=>{const o=new Set();if(/水洗/.test(s))o.add('washed');if(/日曬/.test(s))o.add('natural');if(/蜜處理|蜜/.test(s))o.add('honey');if(/發酵(?!味)|厭氧|特殊處理/.test(s))o.add('ferment');return o};
  t.split(/[。；，]/).forEach(cl=>{if(/避開|避免/.test(cl))return;const bad=/會苦|容易苦|不建議|不適合|萃不足|偏酸偏淡|效益不大/.test(cl)&&!/不要苦|苦澀的豆|收得住|不容易苦|不會苦/.test(cl);
    roastsIn(cl).forEach(i=>(bad?neg.r:on.r).add(ROASTS[i][0]));procsIn(cl).forEach(k=>(bad?neg.p:on.p).add(k))});

  s+=`<line x1="${L}" x2="${W-R}" y1="${Y(top)}" y2="${Y(top)}" class="gl"/><text x="${L-3}" y="${Y(top)+3}" class="tk" text-anchor="end">${top}g</text><text x="${L-3}" y="${Y(0)+3}" class="tk" text-anchor="end">0</text>`;

function grinderDirt(g){
  const kind=grinderKind(g),base={hand:20,electric:40,blade:10}[kind];
  const bl=ownsTool('blower'),br=ownsTool('brush');let mult=1;if(bl)mult*=1.4;if(br)mult*=1.3;
  const limit=Math.round(base*mult),since=g.cleanAt||0;

  const load=used.reduce((s,x)=>{const b=S.beans.find(y=>y.id===x.beanId);return s+(b?OIL[beanTraits(b).roast]:1)},0);
  const pct=Math.round(load/limit*100),oily=used.filter(x=>{const b=S.beans.find(y=>y.id===x.beanId);return b&&OIL[beanTraits(b).roast]>1}).length;
  const why=[`${{hand:'手搖錐刀',electric:'電動磨豆機',blade:'砍豆機'}[kind]}：基本每 ${base} 次拆洗一次`];
  if(bl||br)why.push(`你每次磨完都會用${[bl&&'吹球',br&&'毛刷'].filter(Boolean).join('和')}清潔，延長到每 ${limit} 次`);else why.push('到器材圖鑑把吹球、毛刷標成「我有」，代表每次都會清，拆洗間隔會拉長');

  return{n:used.length,load:Math.round(load*10)/10,limit,pct,c,t,why,left:Math.max(0,Math.ceil(limit-load))}}

  else if(a==='unarchive'){const b={...S.beans.find(x=>x.id===id)};delete b.archived;delete b.archivedAt;await store.save('beans',b);toast('已取回')}
  else if(a==='newBatch'){const b=S.beans.find(x=>x.id===id);if(b){BF={...b,id:newId(),roast:iso(Date.now()),agtron:null,agtronNote:null,ai:null,frozenDays:0,frozenSince:null};delete BF.u;BF._edit=false;BF._msg='同款新批次：改烘焙日、重量，有量色值就填 Agtron。';drawBean()}}

  else if(a==='toDesk'){SEL.bean=id;keepSel();closeSheet();location.hash='recipe';render()}
  else if(a==='newGear')startGear(v);
  else if(a==='editGear')startGear(null,id);

    const g={...gearById(id),cleanAt:Date.now()};try{await store.save('gear',g);if(GF&&GF.id===id){GF.cleanAt=g.cleanAt;drawGear()}toast('已歸零，重新開始計算')}catch(e){toast('儲存失敗')}}
  else if(a==='gearDr'&&GF){const i=GF.drippers.indexOf(v);if(i<0)GF.drippers.push(v);else GF.drippers.splice(i,1);drawGear()}
  else if(a==='delGear'){if(confirmTap(el,'gear'+id)){await store.del('gear',id);closeSheet();toast('已刪除')}}
  else if(a==='useRec')useRec(!!el.dataset.ai);
  else if(a==='usePro')usePro(el.dataset.id);
  else if(a==='aiRec')aiRec();
  else if(a==='pdf')sharePdf();
  else if(a==='beanPdf'){const b=S.beans.find(x=>x.id===id)||beans().find(x=>x.id===id);if(b)showPdf(beanCanvas(b),`豆子筆記_${safeName(shortBean(b))}.pdf`,'分享豆子 PDF')}
  else if(a==='pdfShare')pdfShare();
  else if(a==='pdfSave'){if(PDF&&DLS)DLS.save({filename:PDF.nm,data:PDF.blob}).then(()=>toast('已儲存 PDF')).catch(e=>{if(e&&e.code!=='declined')toast(e&&e.code==='rate_limited'?'稍等一下再試':'這裡無法儲存檔案，可以長按圖片存成照片')})}
  else if(a==='scfgReset'){const i=S.gear.findIndex(x=>x.id==='cfg-score');const g={id:'cfg-score',type:'setting',name:'評分設定',...JSON.parse(JSON.stringify(SDEF))};if(i<0)S.gear.push(g);else S.gear[i]=g;store.save('gear',g).catch(()=>{});render()}
  else if(a==='rTab'){S.rtab=v;render();$('#main').scrollTop=0}
  else if(a==='catF'){CATF=v;render()}
  else if(a==='catItem')catItem(v);
  else if(a==='catOwn')catOwn(v);
  else if(a==='catDrop'){if(confirmTap(el,'cd'+id))catDrop(id)}
  else if(a==='pickCombo'){const[b,g,d,p,k,m,w]=v.split(',');SEL={bean:b,grinder:g,dripper:d,paper:p,kettle:k,method:m,water:w};Object.keys(SEL).forEach(x=>{if(!SEL[x])delete SEL[x]});keepSel();S.ai=null;render();$('#main').scrollTop=0}
  else if(a==='unslot'){delete SEL[v];keepSel();S.ai=null;render()}

  else if(a==='delBean'){if(confirmTap(el,'bean'+id)){await store.del('beans',id);closeSheet();toast('已刪除')}}
  else if(a==='saveBean')saveBean();
  else if(a==='freeze'){if(demoBlock())return;const b={...S.beans.find(x=>x.id===id)};const t=dayStart(Date.now());

  else if(a==='export'){const txt=JSON.stringify({app:'brewlog',v:1,beans:beans(),brews:brews()},null,1);try{await navigator.clipboard.writeText(txt);toast('已複製到剪貼簿')}catch(e){toast('無法複製，請稍後再試')}}
  else if(a==='vClose'){if(REC){try{REC.stop()}catch(e){}REC=null}if(VW){F={...VW.prev};VW=null;drawForm();draftSave()}else closeSheet()}
  else if(a==='vGo'&&VW){if(REC){try{REC.stop()}catch(e){}REC=null}VW.i=+v;drawVoice()}
  else if(a==='vNext'&&VW){if(REC){try{REC.stop()}catch(e){}REC=null}VW.i++;drawVoice()}
  else if(a==='vPrev'&&VW){if(REC){try{REC.stop()}catch(e){}REC=null}VW.i--;drawVoice()}
  else if(a==='vMic'&&VW)vMic();
  else if(a==='vDone'&&VW)vDone();
  else if(a==='useRecVoice'){useRec(false);startVoice()}
  else if(F){
    if(a==='voice'){startVoice();return}
    if(a==='saveBrew'){saveBrew();return}
    if(a==='photo'){$('#photo').click();return}
    if(a==='mode')F.mode=v;
    else if(a==='slot')F._slot=v;
    else if(a==='met')F.met=F.met===v?null:v;
    else if(a==='cond'){let c=(F.cond||[]).slice();if(c.includes(v))c=c.filter(x=>x!==v);else c=v==='ok'?['ok']:c.filter(x=>x!=='ok').concat(v);F.cond=c}
    else if(a==='score')F.score=cyc(F.score,+v);
    else if(a==='arom'){F.arom={...(F.arom||{})};const k=el.dataset.k,n=cyc(F.arom[k],+v);if(n==null)delete F.arom[k];else F.arom[k]=n}
    else if(a==='pasteToggle')F._paste=true;
    else if(a==='parse'){parseNote();return}
    else if(a==='relmode'){RELM=!RELM;try{localStorage.setItem('bn-relmode',RELM?'rel':'direct')}catch(e){}}
    else if(a==='scd'||a==='qd'){const sl=slot(),obj=a==='scd'?sl.s:sl.q,k=el.dataset.k,base=a==='scd'?+F.temps.hot.s[k]:+F.temps.hot.q[k],[lo,hi]=a==='scd'?[0,5]:[-1,2],cur=has(obj[k])?+obj[k]:base;obj[k]=Math.max(lo,Math.min(hi,+v===0?base:cur+ +v))}
    else if(a==='scdR'||a==='qdR'){const sl=slot();delete (a==='scdR'?sl.s:sl.q)[el.dataset.k]}
    else if(a==='q'){const q=slot().q,k=el.dataset.k;if(q[k]===+v)delete q[k];else q[k]=+v}
    else if(a==='qq'){F.q={...(F.q||{})};const k=el.dataset.k;if(F.q[k]===+v)delete F.q[k];else F.q[k]=+v}
    else if(a==='sc'){const s=slot().s,k=el.dataset.k;const n=cyc(s[k],+v);if(n==null)delete s[k];else s[k]=n}
    else if(a==='rel'){const k=el.dataset.k;if(F.rel[k]===+v)delete F.rel[k];else F.rel[k]=+v}
    else if(a==='cat')F._cat=F._cat===v?null:v;
    else if(a==='flav'){const t=flavTarget(),i=t.indexOf(v);if(i<0)t.push(v);else t.splice(i,1)}
    drawForm();
  }
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(ufInput(t))return;

  if(t.dataset.b&&BF){BF[t.dataset.b]=t.value;return}
  if(t.dataset.scfg){setScfg(t.dataset.scfg,t.value);return}
  if(t.dataset.libq!==undefined){LIBQ=t.value;const p=t.selectionStart;render();const n=document.querySelector('[data-libq]');if(n){n.focus();try{n.setSelectionRange(p,p)}catch(e){}}return}
  if(t.dataset.pf&&PF){const k=t.dataset.pf,ty=t.dataset.t;PF[k]=ty==='num'?num(t.value):ty==='time'?parseTime(t.value):t.value;return}
  if(t.dataset.prename!==undefined&&F){F._preName=t.value;return}
  if(t.dataset.catq!==undefined){CATQ=t.value;const m=$('#main'),p=t.selectionStart;render();const n=document.querySelector('[data-catq]');if(n){n.focus();try{n.setSelectionRange(p,p)}catch(e){}}return}
  if(t.dataset.g&&GF){GF[t.dataset.g]=t.value;if(t.dataset.g==='icon'){GF.skin=0;drawGear()}else if(t.dataset.g==='skin')drawGear();return}
  if(t.dataset.f&&F){const k=t.dataset.f,ty=t.dataset.t;
    if(k==='_tn'){slot().n=t.value;return}
    if(ty==='num')F[k]=num(t.value);else if(ty==='time')F.time=parseTime(t.value);else if(ty==='dt'){const d=new Date(t.value).getTime();if(!isNaN(d))F.ts=d}else F[k]=t.value;
    if(k==='ey')F.eyManual=has(F.ey);
    if(['tds','bev','dose'].includes(k))autoEY();
  }
});
document.addEventListener('change',ev=>{

/* 由左往右滑＝上一頁 */
(function(){let x0=0,y0=0,t0=0,ok=false,armed=0;const ind=document.createElement('div');ind.id='swb';ind.textContent='‹';document.body.appendChild(ind);
  const skip=el=>{for(let e=el;e&&e!==document.body;e=e.parentElement){if(e.matches&&e.matches('[data-drag],input[type=range],canvas,svg.curve'))return true;const cs=getComputedStyle(e);if(/(auto|scroll)/.test(cs.overflowX)&&e.scrollWidth>e.clientWidth+2&&e.scrollLeft>0)return true}return false};
  document.addEventListener('touchstart',e=>{if(e.touches.length!==1){ok=false;return}const t=e.touches[0];x0=t.clientX;y0=t.clientY;t0=Date.now();ok=!skip(e.target)&&!document.querySelector('.dragging')},{passive:true});
  document.addEventListener('touchmove',e=>{if(!ok)return;const t=e.touches[0],dx=t.clientX-x0,dy=Math.abs(t.clientY-y0);if(dy>40&&dy>dx){ok=false;ind.style.opacity=0;return}if(dx>0){ind.style.opacity=Math.min(1,dx/90);ind.style.transform='translate('+Math.min(dx/2,50)+'px,-50%)'}},{passive:true});
  document.addEventListener('touchend',e=>{ind.style.opacity=0;ind.style.transform='';if(!ok)return;ok=false;const t=e.changedTouches[0],dx=t.clientX-x0,dy=Math.abs(t.clientY-y0);if(dx<80||dy>dx*0.5||Date.now()-t0>800)return;goBack()},{passive:true});
  window.goBack=function(){
    if(F||VW){toast('記錄中不能滑動返回，要離開請按「取消」（內容會暫存）');return}
    if(TOUR){if(TOUR.i>0){TOUR.i--;drawTour()}else closeSheet();return}

    if($('#sheet').classList.contains('on')){if((F||BF||GF)&&Date.now()-armed>2500){armed=Date.now();toast('再往右滑一次關閉（未存的內容會不見）');return}armed=0;closeSheet();return}
    const v=VSTACK.pop();if(v){route._back=1;location.hash=v}};
})();
