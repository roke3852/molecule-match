<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="author" content="Jim Lu">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>沖煮筆記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one phone-width column, instrument-style readouts in mono, bottom tab bar, full-screen sheets for entry */
  --bg:#F2F5F3; --surface:#FFFFFF; --sunken:#E8EDEA; --ink:#1B2421; --muted:#5C6965; --line:#D5DDD8;
  --accent:#9E2B45; --accent-ink:#FFFFFF; --accent-soft:#F4E1E6;
  --good:#2B7A57; --warn:#A8690F; --cold:#33689A;
  --display:"Noto Serif TC","Songti TC",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111615; --surface:#1A211F; --sunken:#232C29; --ink:#E7ECE9; --muted:#98A6A1; --line:#2D3835;
    --accent:#E57A92; --accent-ink:#22090F; --accent-soft:#3A1F27;
    --good:#6BC49B; --warn:#E2B35F; --cold:#82B4E0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111615; --surface:#1A211F; --sunken:#232C29; --ink:#E7ECE9; --muted:#98A6A1; --line:#2D3835;
  --accent:#E57A92; --accent-ink:#22090F; --accent-soft:#3A1F27;
  --good:#6BC49B; --warn:#E2B35F; --cold:#82B4E0; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
header{padding:14px 16px 8px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
header h1{font-family:var(--display);font-size:22px;margin:0;letter-spacing:.04em}
#sync{font-size:12px;color:var(--muted);text-align:right}
main{flex:1;overflow-y:auto;padding:4px 16px 24px;display:flex;flex-direction:column;gap:12px}
nav{display:grid;grid-template-columns:1fr 1fr auto 1fr;gap:4px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
nav a{text-align:center;padding:9px 4px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:500}
nav a.on{color:var(--accent);background:var(--accent-soft)}
.fab{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:9px 18px;font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
button.card{text-align:left;width:100%}
h2{font-size:13px;font-weight:700;color:var(--muted);margin:8px 0 0;letter-spacing:.08em}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.between{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.title{font-weight:700;font-size:16px}
.sub{color:var(--muted);font-size:13px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.good{color:var(--good)}.pill.warn{color:var(--warn)}.pill.cold{color:var(--cold)}.pill.muted{color:var(--muted)}
.tag{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--sunken)}
.chg{font-size:12px;padding:2px 8px;border-radius:6px;border:1px dashed var(--accent);color:var(--accent)}
.score{font-family:var(--mono);font-weight:600;font-size:20px;min-width:44px;text-align:center;padding:4px 6px;border-radius:8px;background:var(--accent-soft);color:var(--accent)}
.score small{display:block;font-size:10px;font-weight:400;font-family:var(--body);color:var(--muted)}
.banner{border:1px dashed var(--warn);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.tile b{display:block;font-family:var(--mono);font-size:20px}
.tile span{font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px;font-weight:500}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--accent)}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:10;display:none}
.sheet.on{display:block}
.sheet-in{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.sheet-head b{font-family:var(--display);font-size:18px}
.sheet-body{flex:1;overflow-y:auto;padding:12px 16px 24px;display:flex;flex-direction:column;gap:14px}
.sheet-foot{padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface);display:flex;gap:8px}
.sheet-foot .btn{flex:1}
fieldset{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px 12px;margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
legend{font-size:13px;font-weight:700;color:var(--muted);padding:0 6px;letter-spacing:.06em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{width:100%;min-width:0;padding:8px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:15px;color:var(--ink)}
label.f input.mono{font-family:var(--mono)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{flex:1;min-width:30px;padding:7px 0;border:1px solid var(--line);background:var(--bg);border-radius:8px;font-family:var(--mono)}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.seg.txt button{font-family:var(--body);padding:7px 10px}
.srow{display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:center}
.srow>span{font-size:13px}
.grp{font-size:11px;color:var(--muted);letter-spacing:.1em;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:5px 11px;font-size:13px}
.chip.open{border-color:var(--ink);font-weight:700}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.has{border-color:var(--accent);color:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.cmp{width:100%;border-collapse:collapse;font-size:13px}
.cmp th,.cmp td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
.cmp th{color:var(--muted);font-weight:500}
.cmp tr.d td{color:var(--accent);font-weight:700}
svg{display:block;width:100%;height:auto}
svg text{font-family:var(--mono);font-size:10px;fill:var(--muted)}
svg .ax{stroke:var(--line);stroke-width:1}
svg .pt{fill:var(--accent);stroke:var(--surface);stroke-width:1.5;cursor:pointer}
svg .best{fill:none;stroke:var(--ink);stroke-width:1.5}
svg .band{fill:var(--good);opacity:.13}
svg .lbl{fill:var(--ink);font-weight:600}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:13px;z-index:30;display:none;max-width:90%}
.up{color:var(--accent)}.down{color:var(--cold)}
</style>
</head>
<body>
<div id="app">
  <header><h1>沖煮筆記</h1><div id="sync">讀取中…</div></header>
  <main id="main"></main>
  <nav>
    <a href="#log" data-v="log">紀錄</a>
    <a href="#beans" data-v="beans">豆子</a>
    <button class="fab" data-act="new">＋ 記一杯</button>
    <a href="#analysis" data-v="analysis">分析</a>
  </nav>
</div>
<div class="sheet" id="sheet"><div class="sheet-in" id="sheetIn"></div></div>
<div id="toast" role="status"></div>
<input type="file" id="photo" accept="image/*" hidden>
<input type="file" id="beanPhoto" accept="image/*" multiple hidden>
<script>
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY=864e5;
const dayStart=t=>{const d=new Date(t);return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()};
const pd=s=>{const[a,b,c]=String(s).split('-').map(Number);return new Date(a,b-1,c).getTime()};
const p2=n=>String(n).padStart(2,'0');
const iso=t=>{const d=new Date(t);return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`};
const isoLocal=t=>{const d=new Date(t);return `${iso(t)}T${p2(d.getHours())}:${p2(d.getMinutes())}`};
const when=t=>{const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${p2(d.getHours())}:${p2(d.getMinutes())}`};
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const num=v=>(v===''||v==null||isNaN(+v))?null:+v;
const has=v=>v!==null&&v!==undefined&&v!=='';
const fmtTime=s=>!has(s)?'—':`${Math.floor(s/60)}:${p2(Math.round(s%60))}`;
const parseTime=v=>{v=String(v).trim();if(!v)return null;if(v.includes(':')){const[m,s]=v.split(':');return (+m||0)*60+(+s||0)}return isNaN(+v)?null:+v};
const r1=n=>Math.round(n*10)/10, r2=n=>Math.round(n*100)/100;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)}

/* ---------- vocabulary ---------- */
const PARAMS=[{k:'grinder',l:'磨豆機'},{k:'grind',l:'刻度'},{k:'dripper',l:'濾杯'},{k:'paper',l:'濾紙'},{k:'method',l:'手法'},{k:'temp',l:'水溫',u:'°C'},{k:'dose',l:'粉重',u:'g'},{k:'water',l:'注水',u:'g'},{k:'pours',l:'注水段'},{k:'time',l:'時間'}];
const fmtP=(p,v)=>!has(v)?'—':p.k==='time'?fmtTime(v):p.k==='pours'?String(v).split('\n').join(' / '):v+(p.u||'');
const SC=[['嗅覺',[['fa','前嗅覺'],['ra','後嗅覺']]],['味覺',[['acid','酸'],['sweet','甜'],['bitter','苦']]],['觸覺',[['body','厚度'],['astr','澀感']]],['後韻',[['fin_acid','酸'],['huigan','甘'],['fin_bitter','苦'],['fin_astr','澀']]],['整體',[['overall','整體']]]];
const SCL=Object.fromEntries(SC.flatMap(g=>g[1]));
const REL=[['acid','酸'],['sweet','甜'],['bitter','苦'],['body','厚度']];
const TEMPS=[['hot','高溫'],['warm','中溫'],['room','常溫']];
const WHEEL={'花香':['茉莉','玫瑰','洋甘菊','橙花','紅茶'],'莓果':['草莓','藍莓','覆盆莓','黑莓','蔓越莓'],'柑橘':['檸檬','葡萄柚','柳橙','萊姆','佛手柑'],'核果熱帶':['水蜜桃','杏桃','芒果','鳳梨','荔枝','百香果'],'其他水果':['蘋果','葡萄','梨','櫻桃','李子'],'果乾':['葡萄乾','蜜棗','無花果'],'發酵':['酒香','威士忌','蘭姆','過度發酵'],'甜感':['蜂蜜','焦糖','黑糖','楓糖','香草'],'堅果可可':['杏仁','榛果','花生','牛奶巧克力','黑巧克力'],'香料':['肉桂','丁香','胡椒'],'烘焙':['穀物','烤麵包','煙燻','焦苦'],'草本':['青草','生豆味','草本','茶感']};

/* ---------- state + storage ---------- */
const S={beans:[],brews:[],loaded:{beans:false,brews:false},view:'log',cloud:false,aBean:null,cmpA:null,cmpB:null,canPhoto:false};
let store=null,sampleFn=null;
const clean=o=>JSON.parse(JSON.stringify(o,(k,v)=>k.startsWith('_')||k==='id'?undefined:v));
function localStore(){
  const K='brewlog-v1';let dels=[];
  try{const d=JSON.parse(localStorage.getItem(K)||'null');if(d){S.beans=d.beans||[];S.brews=d.brews||[];dels=d.dels||[]}}catch(e){}
  S.loaded={beans:true,brews:true};
  const snap=()=>({beans:S.beans,brews:S.brews,dels});
  const keep=()=>{try{localStorage.setItem(K,JSON.stringify(snap()))}catch(e){}};
  const put=()=>{keep();render();if(G)G.changed()};
  const up=(arr,o)=>{const i=arr.findIndex(x=>x.id===o.id);if(i<0)arr.push(o);else arr[i]=o};
  const merge=r=>{dels=[...new Set(dels.concat(r.dels||[]))];for(const c of ['beans','brews']){const m=new Map(S[c].map(x=>[x.id,x]));(r[c]||[]).forEach(x=>{const o=m.get(x.id);if(!o||(x.u||0)>(o.u||0))m.set(x.id,x)});S[c]=[...m.values()].filter(x=>!dels.includes(x.id))}keep();render()};
  const G=/github\.io$/.test(location.hostname)?drive(snap,merge):null;
  if(!G)$('#sync').textContent='僅存在這台裝置';
  return{save:async(c,o)=>{up(S[c],{...clean(o),id:o.id,u:Date.now()});put()},del:async(c,id)=>{S[c]=S[c].filter(x=>x.id!==id);dels.push(id);put()}};
}
/* Google 雲端同步：存成自己 Google 雲端硬碟裡的隱藏 App 檔案（只在 GitHub 網址上啟用） */
function drive(snap,merge){
  const GCLIENT='267421312122-l2ggo7t35tqpf8ej5osqttt08ke30lr1.apps.googleusercontent.com',GFILE='brew-notes.json',GAPI='https://www.googleapis.com',SCOPE='https://www.googleapis.com/auth/drive.appdata';
  let tok=null,exp=0,fid=null,client=null,on=false,timer=null;
  const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
  const el=$('#sync'),say=m=>{el.textContent=m};
  el.style.cursor='pointer';el.style.textDecoration='underline';el.setAttribute('role','button');el.tabIndex=0;
  try{const t=JSON.parse(sessionStorage.getItem('bn-gtok')||'null');if(t&&t.exp>Date.now()){tok=t.tok;exp=t.exp}}catch(e){}
  const lib=()=>new Promise((ok,no)=>{if(window.google&&google.accounts&&google.accounts.oauth2)return ok();const sc=document.createElement('script');sc.src='https://accounts.google.com/gsi/client';sc.onload=()=>ok();sc.onerror=()=>no(new Error('lib'));document.head.appendChild(sc)});
  setTimeout(()=>lib().catch(()=>{}),600);
  async function gf(url,opt={}){
    if(!tok||Date.now()>exp)throw new Error('auth');
    const r=await fetch(url,Object.assign({},opt,{headers:Object.assign({Authorization:'Bearer '+tok},opt.headers||{})}));
    if(r.status===401){tok=null;throw new Error('auth')}
    if(!r.ok)throw new Error('http '+r.status);
    return r;
  }
  const expired=()=>say('☁️ Google 連線過期，點這裡連回');
  async function push(manual){
    if(!on)return;if(!tok||Date.now()>exp){expired();return}
    const body=JSON.stringify(snap());say('☁️ 存檔中…');
    try{
      if(fid)await gf(GAPI+'/upload/drive/v3/files/'+fid+'?uploadType=media',{method:'PATCH',keepalive:body.length<60000,headers:{'Content-Type':'application/json'},body});
      else{const b='bn'+Date.now(),meta=JSON.stringify({name:GFILE,parents:['appDataFolder']});
        const mp='--'+b+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+meta+'\r\n--'+b+'\r\nContent-Type: application/json\r\n\r\n'+body+'\r\n--'+b+'--';
        fid=(await (await gf(GAPI+'/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:mp})).json()).id}
      const hm=new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',hour12:false});
      say('☁️ 已存到 Google '+hm);if(manual)toast('已存到雲端 '+hm);
    }catch(e){if(e.message==='auth')expired();else say('⚠️ 雲端存檔失敗，資料先存在這台')}
  }
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&timer){clearTimeout(timer);timer=null;push()}});
  async function afterLogin(){
    say('☁️ 讀取雲端資料…');
    try{
      const j=await (await gf(GAPI+'/drive/v3/files?spaces=appDataFolder&fields=files(id)&q='+encodeURIComponent("name='"+GFILE+"'"))).json();
      fid=j.files&&j.files[0]?j.files[0].id:null;
      let rem=null;if(fid)rem=await (await gf(GAPI+'/drive/v3/files/'+fid+'?alt=media')).json().catch(()=>null);
      on=true;ls.set('bn-g','1');if(rem&&(rem.beans||rem.brews))merge(rem);
      await push();
    }catch(e){if(e.message==='auth')expired();else say('⚠️ 讀取 Google 雲端失敗，點這裡再試')}
  }
  function login(){
    const go=()=>{
      if(!client)client=google.accounts.oauth2.initTokenClient({client_id:GCLIENT,scope:SCOPE,
        callback:t=>{if(t&&t.access_token){tok=t.access_token;exp=Date.now()+((+t.expires_in||3600)-120)*1000;try{sessionStorage.setItem('bn-gtok',JSON.stringify({tok,exp}))}catch(e){}afterLogin()}else say('⚠️ Google 登入沒有完成，點這裡再試')},
        error_callback:()=>say('⚠️ Google 登入被取消或被擋，點這裡再試')});
      client.requestAccessToken({prompt:ls.get('bn-g')==='1'?'':'consent'});
    };
    lib().then(go,()=>say('⚠️ 無法載入 Google 登入，請確認網路'));
  }
  el.onclick=()=>{if(on&&tok&&Date.now()<exp)push(true);else login()};
  if(tok&&ls.get('bn-g')==='1')afterLogin();else say(ls.get('bn-g')==='1'?'☁️ 點這裡連回 Google 同步':'☁️ 點這裡用 Google 同步');
  return{changed(){if(!on)return;clearTimeout(timer);timer=setTimeout(push,1500)}};
}
async function initStore(){
  let db=null,user=null,uid=null;
  try{if(window.claude&&claude.use){[db,user]=await Promise.all([claude.use('db'),claude.use('user')]);claude.use('sample').then(s=>{sampleFn=s;S.canPhoto=!!s;if(F)drawForm()}).catch(()=>{})}}catch(e){}
  try{uid=user?await user.id():null}catch(e){}
  if(!(db&&uid)){store=localStore();render();return}
  S.cloud=true;
  const root=db.doc('data/users/'+uid+'/brewlog');
  const cols={beans:root.collection('beans'),brews:root.collection('brews')};
  const timer=setTimeout(()=>{$('#sync').textContent='暫時連不上雲端，資料可能不是最新'},10000);
  const fail=e=>{clearTimeout(timer);S.loaded={beans:true,brews:true};$('#sync').textContent='雲端同步中斷，請重新開啟頁面';render()};
  for(const c of ['beans','brews']){
    cols[c].onSnapshot(snap=>{
      S[c]=snap.docs.map(d=>({...d.data(),id:d.id}));S.loaded[c]=true;
      if(!snap.metadata.fromCache&&S.loaded.beans&&S.loaded.brews){clearTimeout(timer);$('#sync').textContent='已同步到雲端'}
      render();
    },fail);
  }
  store={save:(c,o)=>cols[c].doc(o.id).set(clean(o)),del:(c,id)=>cols[c].doc(id).delete()};
}

/* ---------- example data (shown only while the store is empty; never saved) ---------- */
function demoData(){
  const t0=dayStart(Date.now()),b1='demo-a',b2='demo-b';
  const beans=[{id:b1,name:'衣索比亞 果丁丁 水洗',origin:'衣索比亞',process:'水洗',roaster:'範例烘焙所',roast:iso(t0-14*DAY),agtron:78,winStart:7,winEnd:28,weight:200},

let DEMO=null;

/* ---------- domain logic ---------- */
function restDay(b,at=Date.now()){
  if(!b||!b.roast)return null;
  const d0=dayStart(at);let d=Math.floor((d0-pd(b.roast))/DAY),f=b.frozenDays||0;
  if(b.frozenSince)f+=Math.max(0,Math.floor((d0-pd(b.frozenSince))/DAY));
  return Math.max(0,d-f);
}
function beanStatus(b){
  const d=restDay(b);if(d==null)return{c:'muted',t:'未填烘焙日'};
  if(b.frozenSince)return{c:'cold',t:`冷凍中 · 停在第 ${d} 天`};
  const s=b.winStart??7,e=b.winEnd??30;
  if(d<s)return{c:'warn',t:`養豆中 · 還要 ${s-d} 天`};
  if(d<=e)return{c:'good',t:`適飲期 · 還有 ${e-d} 天`};
  return{c:'muted',t:`已過適飲期 ${d-e} 天`};
}
function remaining(b){if(!has(b.weight))return null;return Math.round(b.weight-brews().filter(x=>x.beanId===b.id).reduce((s,x)=>s+(+x.dose||0),0))}
const same=(a,b)=>(!has(a)&&!has(b))||String(a)===String(b);
const diff=(a,b)=>PARAMS.filter(p=>!same(a[p.k],b[p.k])).map(p=>({p,from:a[p.k],to:b[p.k]}));
function sens(b,k){const v=TEMPS.map(t=>b.temps?.[t[0]]?.s?.[k]).filter(has);return v.length?v.reduce((a,c)=>a+c,0)/v.length:null}
function allFlavors(b){const s=new Set(b.flavors||[]);TEMPS.forEach(t=>(b.temps?.[t[0]]?.f||[]).forEach(x=>s.add(x)));return[...s]}
function effect(a,b){ // what changed in the cup from a to b
  const out=[];
  if(has(a.score)&&has(b.score)&&a.score!==b.score)out.push({l:'總分',d:b.score-a.score,t:(b.score>a.score?'+':'')+r1(b.score-a.score)});
  for(const[k,l]of REL){let d=null;

    else{const x=sens(a,k),y=sens(b,k);if(x!=null&&y!=null)d=Math.sign(r1(y-x))}

}
const effHtml=e=>e.length?e.map(x=>`<span class="tag ${x.d>0?'up':'down'}">${x.l} ${x.t}</span>`).join(''):'<span class="sub">杯中表現沒有記錄到差異</span>';
const chgHtml=d=>d.map(x=>`<span class="chg">${x.p.l} ${esc(fmtP(x.p,x.from))}→${esc(fmtP(x.p,x.to))}</span>`).join('');

/* ---------- charts ---------- */
function ticks(min,max,n=4){const span=(max-min)||1,mag=10**Math.floor(Math.log10(span/n));const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>span/s<=n+1)||mag*10;const r=[];for(let v=Math.ceil(min/step-1e-9)*step;v<=max+1e-9;v+=step)r.push(+v.toFixed(6));return r}
function dom(vals,minPad){let a=Math.min(...vals),b=Math.max(...vals);const pad=Math.max((b-a)*0.2,minPad);return[a-pad,b+pad]}
function scatter({pts,xd,yd,xl,yl,band}){
  const W=340,H=230,L=38,R=12,T=12,B=34,x=v=>L+(v-xd[0])/(xd[1]-xd[0])*(W-L-R),y=v=>H-B-(v-yd[0])/(yd[1]-yd[0])*(H-T-B);
  const best=pts.filter(p=>has(p.score)).sort((a,b)=>b.score-a.score)[0];
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(xl)} 對 ${esc(yl)}">`;
  if(band){const a=Math.max(band[0],xd[0]),b=Math.min(band[1],xd[1]);if(b>a)s+=`<rect class="band" x="${x(a)}" y="${T}" width="${x(b)-x(a)}" height="${H-T-B}"/><text x="${x(a)+3}" y="${T+11}">適飲期</text>`}
  for(const t of ticks(xd[0],xd[1]))s+=`<line class="ax" x1="${x(t)}" x2="${x(t)}" y1="${T}" y2="${H-B}"/><text x="${x(t)}" y="${H-B+13}" text-anchor="middle">${t}</text>`;
  for(const t of ticks(yd[0],yd[1]))s+=`<line class="ax" x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L-5}" y="${y(t)+3}" text-anchor="end">${t}</text>`;
  s+=`<text x="${(L+W-R)/2}" y="${H-4}" text-anchor="middle">${esc(xl)}</text><text x="10" y="${(T+H-B)/2}" text-anchor="middle" transform="rotate(-90 10 ${(T+H-B)/2})">${esc(yl)}</text>`;
  for(const p of pts){const sc=has(p.score)?p.score:2.5;s+=`<circle class="pt" data-act="detail" data-id="${esc(p.id)}" cx="${x(p.x)}" cy="${y(p.y)}" r="${4+sc*0.9}" fill-opacity="${0.2+sc*0.16}"><title>${esc(p.tip)}</title></circle>`}
  if(best){const bx=x(best.x),by=y(best.y);s+=`<circle class="best" cx="${bx}" cy="${by}" r="${8+best.score*0.9}"/><text class="lbl" x="${bx>W-90?bx-14:bx+14}" y="${by<T+16?by+16:by-10}" text-anchor="${bx>W-90?'end':'start'}">最高 ${best.score} 分</text>`}
  return s+'</svg>';
}

  try{
    const lim=sampleFn.limits?await sampleFn.limits():null;if(lim&&!lim.images){msg('這個檢視無法讀取照片，請手動輸入');return}
    const r=await sampleFn('這是 Difluid 咖啡濃度計或其 App 的照片/截圖。讀出畫面上的數字，只回傳一個 JSON 物件，不要其他文字：{"tds":數字或null,"ey":萃取率百分比數字或null,"dose":粉重克數或null,"bev":咖啡液重克數或null,"agtron":烘焙度數字或null}。看不到的欄位填 null，不要猜。',{images:[file],modelTier:'quick',cache:false});
    const j=JSON.parse((r.text.match(/\{[\s\S]*\}/)||['{}'])[0]),got=[];
    for(const[k,l]of [['tds','TDS'],['ey','萃取率'],['dose','粉重'],['bev','液重']])if(typeof j[k]==='number'){F[k]=j[k];got.push(`${l} ${j[k]}`);if(k==='ey')F.eyManual=true}
    F._photoMsg=got.length?'讀到：'+got.join('、')+'。請核對一次。':'照片裡找不到數字，請手動輸入';autoEY();drawForm();
  }catch(e){msg(e&&e.code==='rate_limited'?'讀取太頻繁，稍後再試':'讀取失敗，請手動輸入')}
}
async function readBeanPhoto(files){
  const msg=m=>{BF._msg=m;const e=$('#beanMsg');if(e)e.textContent=m};
  if(!sampleFn||!BF)return;msg('讀取中…');
  try{
    const lim=sampleFn.limits?await sampleFn.limits():null;if(lim&&!lim.images){msg('這個檢視無法讀取照片，請手動輸入');return}
    const r=await sampleFn('這些是咖啡豆袋的照片或咖啡 App 的豆子資料截圖。整理成一個 JSON 物件，只回傳 JSON：{"name":"豆子名稱（產國 產區 處理廠 品種 處理法，簡短）","origin":"產國","region":"產區","station":"處理廠或莊園","variety":"品種","process":"處理法","roaster":"烘焙商","roast":"烘焙日期 YYYY-MM-DD","agtron":數字,"notes":"標示的風味，用頓號分隔"}。圖上看不到的欄位填 null，不要猜；有效日期不是烘焙日期。',{images:files,cache:false});
    const j=JSON.parse((r.text.match(/\{[\s\S]*\}/)||['{}'])[0]);let n=0;
    for(const k of ['name','origin','region','station','variety','process','roaster','notes'])if(typeof j[k]==='string'&&j[k].trim()){BF[k]=j[k].trim();n++}
    if(typeof j.roast==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(j.roast)){BF.roast=j.roast;n++}
    if(typeof j.agtron==='number'){BF.agtron=j.agtron;n++}
    BF._msg=n?`已填入 ${n} 個欄位，請核對。`:'圖上找不到豆子資料，請手動輸入';drawBean();
  }catch(e){msg(e&&e.code==='rate_limited'?'讀取太頻繁，稍後再試':'讀取失敗，請手動輸入')}
}
/* bean form */
function startBean(id){
  const b=id?S.beans.find(x=>x.id===id):null;
  BF=b?{...b}:{id:newId(),name:'',notes:'',origin:'',region:'',station:'',variety:'',process:'',roaster:'',roast:iso(Date.now()),agtron:null,winStart:7,winEnd:30,weight:null,frozenDays:0,frozenSince:null};BF._edit=!!b;drawBean();
}
function drawBean(){
  const b=BF._edit?BF:null;
  const inp=(k,l,t='text',x='')=>`<label class="f">${l}<input id="b-${k}" data-b="${k}" type="${t}" value="${esc(BF[k]??'')}" ${t==='number'?'step="any" inputmode="decimal" class="mono"':''} ${x}></label>`;
  openSheet(`<div class="sheet-head"><b>${b?'編輯豆子':'新增豆子'}</b><button class="btn sm" data-act="close">取消</button></div><div class="sheet-body">
    ${S.canPhoto?`<fieldset><legend>從截圖帶入</legend><div class="row"><button type="button" class="btn sm" data-act="beanPhoto">選擇豆袋照片或 App 截圖（可多張）</button><span class="sub" id="beanMsg">${esc(BF._msg||'')}</span></div></fieldset>`:''}
    <fieldset><legend>基本資料</legend>${inp('name','名稱','text','placeholder="例如 衣索比亞 果丁丁 水洗"')}<div class="grid2">${inp('origin','產國')}${inp('region','產區')}${inp('station','處理廠／莊園')}${inp('variety','品種')}${inp('process','處理法')}${inp('roaster','烘焙商')}${inp('agtron','烘焙度（Difluid Agtron）','number')}</div>${inp('notes','烘焙商標示的風味（選填）')}</fieldset>
    <fieldset><legend>養豆</legend><div class="grid2">${inp('roast','烘焙日','date')}${inp('weight','整包重量 g','number')}${inp('winStart','適飲期從第幾天','number')}${inp('winEnd','到第幾天','number')}</div>
      <div class="sub">每次記一杯會自動帶入養豆天數，並從重量扣掉粉重。冷凍期間不計入天數。</div></fieldset>
  </div><div class="sheet-foot">${b?`<button class="btn danger" data-act="delBean" data-id="${esc(b.id)}">刪除</button>`:''}<button class="btn pri" data-act="saveBean">儲存</button></div>`);
}
async function saveBean(){
  if(!BF.name.trim()){toast('請填豆子名稱');return}
  const b={...BF};delete b._edit;delete b._msg;['agtron','weight','winStart','winEnd'].forEach(k=>b[k]=num(b[k]));
  if(b.winStart==null)b.winStart=7;if(b.winEnd==null)b.winEnd=30;
  try{await store.save('beans',b);closeSheet();toast('已儲存')}catch(e){toast('儲存失敗，請再試一次')}
}

/* ---------- events ---------- */
let armed=null;
function confirmTap(el,key){if(armed===key){armed=null;return true}armed=key;el.textContent='再按一次確認刪除';setTimeout(()=>{if(armed===key)armed=null},4000);return false}
document.addEventListener('click',async ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,id=el.dataset.id,v=el.dataset.v;
  const demoBlock=()=>{if(isDemo()){toast('這是範例資料，先新增你的豆子');return true}return false};
  if(a==='close')closeSheet();
  else if(a==='detail')detail(id);
  else if(a==='new')startBrew({baseId:el.dataset.base,beanId:el.dataset.bean});
  else if(a==='editBrew'){if(!demoBlock())startBrew({editId:id})}
  else if(a==='delBrew'){if(!demoBlock()&&confirmTap(el,'brew'+id)){await store.del('brews',id);closeSheet();toast('已刪除')}}
  else if(a==='newBean')startBean();
  else if(a==='beanPhoto')$('#beanPhoto').click();
  else if(a==='editBean'){if(!demoBlock())startBean(id)}
  else if(a==='delBean'){if(confirmTap(el,'bean'+id)){await store.del('beans',id);closeSheet();toast('已刪除')}}
  else if(a==='saveBean')saveBean();
  else if(a==='freeze'){if(demoBlock())return;const b={...S.beans.find(x=>x.id===id)};const t=dayStart(Date.now());
    if(b.frozenSince){b.frozenDays=(b.frozenDays||0)+Math.max(0,Math.floor((t-pd(b.frozenSince))/DAY));b.frozenSince=null}else b.frozenSince=iso(t);
    try{await store.save('beans',b)}catch(e){toast('儲存失敗')}}
  else if(a==='export'){const txt=JSON.stringify({app:'brewlog',v:1,beans:beans(),brews:brews()},null,1);try{await navigator.clipboard.writeText(txt);toast('已複製到剪貼簿')}catch(e){toast('無法複製，請稍後再試')}}
  else if(F){
    if(a==='saveBrew'){saveBrew();return}
    if(a==='photo'){$('#photo').click();return}
    if(a==='mode')F.mode=v;
    else if(a==='slot')F._slot=v;
    else if(a==='met')F.met=F.met===v?null:v;
    else if(a==='score')F.score=cyc(F.score,+v);
    else if(a==='pasteToggle')F._paste=true;
    else if(a==='parse'){parseNote();return}
    else if(a==='sc'){const s=slot().s,k=el.dataset.k;const n=cyc(s[k],+v);if(n==null)delete s[k];else s[k]=n}
    else if(a==='rel'){const k=el.dataset.k;if(F.rel[k]===+v)delete F.rel[k];else F.rel[k]=+v}
    else if(a==='cat')F._cat=F._cat===v?null:v;
    else if(a==='flav'){const t=flavTarget(),i=t.indexOf(v);if(i<0)t.push(v);else t.splice(i,1)}
    drawForm();
  }
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.dataset.b&&BF){BF[t.dataset.b]=t.value;return}
  if(t.dataset.f&&F){const k=t.dataset.f,ty=t.dataset.t;
    if(k==='_tn'){slot().n=t.value;return}
    if(ty==='num')F[k]=num(t.value);else if(ty==='time')F.time=parseTime(t.value);else if(ty==='dt'){const d=new Date(t.value).getTime();if(!isNaN(d))F.ts=d}else F[k]=t.value;
    if(k==='ey')F.eyManual=has(F.ey);
    if(['tds','bev','dose'].includes(k))autoEY();
  }
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset.sel){S[t.dataset.sel]=t.value;if(t.dataset.sel==='aBean'){S.cmpA=S.cmpB=null}render();return}
  if(t.id==='beanPhoto'){const fs=[...(t.files||[])].slice(0,4);t.value='';if(fs.length)readBeanPhoto(fs);return}
  if(t.id==='photo'){const f=t.files&&t.files[0];t.value='';if(f)readPhoto(f);return}
  if(F&&(t.dataset.f==='beanId'||t.dataset.f==='ts')){
    if(t.dataset.f==='beanId'&&!F._edit){const last=brewsOf(F.beanId).slice(-1)[0];F.baseId=last?last.id:null;if(last){Object.assign(F,copyParams(last));F.target=last.target||''}F.rel={}}
    drawForm();
  }
});
window.addEventListener('hashchange',route);
route();initStore();
</script>
