.tm{border-bottom:none}body.note-on .tm{border-bottom:2px dotted var(--gold);cursor:help}body.note-on .tm.t-p{border-bottom-color:#7fd0c0}body.note-on .tm.t-l{border-bottom-color:#f08a8a}

.lrow{padding:10px 0;border-bottom:1px dashed var(--line)}.lrow p{margin:4px 0;line-height:1.7;font-size:14px}.lk{opacity:.5}
.flt{display:flex;flex-wrap:wrap;gap:5px}.flt button{background:var(--pan);border:1px solid var(--line);color:var(--ink);padding:4px 8px;border-radius:3px;font-size:12px;font-family:inherit}.flt button.on{background:#7a2a2a}
.drow{display:flex;gap:6px;align-items:flex-start}.drow>div{flex:1}.drow .gch{margin-top:12px}
.big{font-size:96px;text-align:center;color:var(--gold);text-shadow:5px 5px 0 #7a2a2a;margin:16px 0 4px;font-weight:700}
.sum{text-align:center;background:var(--pan);padding:10px;border-radius:3px;margin:10px 0;line-height:1.8}
#pop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;align-items:center;justify-content:center;padding:20px}#pop.on{display:flex}
#popB{background:#f2ead6;color:#2a2416;max-width:420px;width:100%;border:3px solid #8a7a5a;border-radius:4px;padding:16px;position:relative;line-height:1.75;max-height:80vh;overflow:auto}
#popB .btn{background:#e2d6b8;color:#2a2416;border-color:#8a7a5a}#popB .btn.ghost{background:transparent}#popB .mute{color:#7a6a4a}
#popX{position:absolute;right:8px;top:4px;font-size:22px;cursor:pointer;color:#8a7a5a}
.pc{display:flex;gap:10px;align-items:center}.pc img{width:56px;image-rendering:pixelated}.pc b{display:block}.pc small{color:#7a6a4a}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);background:#7a2a2a;border:2px solid #c9a85a;padding:8px 16px;border-radius:4px;opacity:0;transition:.25s;z-index:60;font-size:14px;max-width:90vw;text-align:center}#toast.on{opacity:1;transform:translate(-50%,0)}

<div class="frame"><i></i></div>
<div class="wrap">

// 詞彙（點畫線的字看說明；註解模式開啟時顯示）
const GLOSS={
'管委會':'管理委員會。由區分所有權人會議選出委員組成，負責執行社區事務。',
'區權會':'區分所有權人會議。全體所有權人組成的最高決策機關，比管委會大。',
'區權人':'區分所有權人，也就是有產權的住戶。',
'起造人':'申請建照、蓋房子的那一方，通常就是建商。',
'工務所':'建商在工地的工程辦公室，負責施工與修繕。',
'點交':'起造人把公共設施、圖說、基金正式移交給管委會。點交後保固才開始起算，所以建商往往想快、管委會往往要慢。',
'初勘':'公設點交前的第一次全面檢測，把缺失全部列出來。',
'履勘':'缺失修完後的再次現場勘驗，確認真的修好了。',
'複驗':'針對初勘缺失逐項複查，看是否改善完成。',
'竣工圖':'房子蓋好後依實際完成狀況繪製的圖。日後維修全靠它，所以「現況跟圖不符」是大事。',
'第三方檢測':'由與建商、住戶都無利害關係的專業公司做的檢測，報告較有公信力。',
'公共基金':'社區的存款。修繕、更新設備、應付大事都靠它，依區權會決議使用。',
'管理費':'每月向住戶收取的費用，支付物業、清潔、水電等日常開銷。',
'物業':'物業管理公司。負責社區日常行政、收費、報修、清潔與廠商管理。',
'保全':'負責門禁、巡邏、收發包裹的人員，常與物業同一家公司。',
'代管期':'管委會成立、點交完成前，由建商委任的物業先代為管理的期間。',
'實名制住戶群':'以真實戶別登記加入的社區群組，管委會在此發佈正式決策。',
'試營運':'正式開放前的試用期，用來發現問題、建立規則。',
'防焰標章':'窗簾、地毯等經檢驗合格的防焰物品標示。公共空間沒有它，是安全缺失。',
'自警閥':'自動警報逆止閥。撒水系統管路有水流動時會觸發警報，是消防撒水的「心臟瓣膜」。',
'連結送水管':'消防隊到場後，從外部送水口把水打進大樓的專用管路。',
'撒水頭':'天花板上的消防灑水頭。罩子沒拆，就等於沒裝。',
'受信總機':'火警受信總機。所有偵煙、偵熱器的訊號都送到這裡，平常放在防災中心。',
'防水閘門':'車道入口的擋水閘門，颱風豪雨時升起，防止水灌進地下室。',
'泡沫灑水':'地下停車場用的泡沫滅火系統，用來撲滅汽油類火災。',
'滾溝式':'一種管路接頭工法，用溝槽與管扣連接。合法，但檢測單位擔心地震時的脫管風險。',
'白華':'牆面滲水後析出的白色鹽類結晶，代表水從某處跑了進來。',
'導盲磚':'地面的觸覺引導磚，無障礙設施的一部分。',
'拷克':'考克閥，小型旋塞閥。裝在壓力錶前，換錶時不必停整個系統。',
'裝潢保證金':'住戶裝潢前繳交的押金，用來擔保公共區域不被弄壞。',
'包場':'付費預約、整段時間獨占使用公設空間。',
'長輩圖':'配上大字祝福語或養生資訊的圖片，常在早上七點出現。',
'普渡':'中元節祭拜好兄弟的儀式。社區普渡是很多住戶第一次見面的場合。',
'公版':'統一的標準回覆範本。',
'S級':'本作解讀：立即危險，須馬上處理或隔離。',
'A級':'本作解讀：影響安全的缺失，例如消防、標示、防火。',
'B級':'本作解讀：一般缺失，多為外觀、施工污染或固定不佳。',
'E級':'本作解讀：建議事項，非缺失但值得改善。',
'F級':'本作解讀：現況與竣工圖說不符。',
};

{t:'「每次開放前由物業依檢查表巡檢簽名，也歡迎住戶志工一起看——張媽媽、羅阿姨願意的話，第一班就請您們。」',v:2,d:[2,2,2],r:'三分鐘後，張媽媽回：「好啊。」又過了十分鐘，羅阿姨回了兩個字：「幾點？」'},

{id:6,vol:2,title:'十月三十一',year:'115 年 10 月 31 日・第三方初勘',

{t:'建商很有誠意，能當場改最好。',v:0,d:[-1,-1,0],r:'方技師看了你一眼，什麼都沒說，但在他的筆記本上多畫了一個圈。'},

{t:'他只是想早點下班。',v:1,j:1,d:[0,0,0],r:'也許。但他後來一直待到晚上七點，一條一條盯著工程師寫了什麼。'}]}),

G('grade',6),
N('下午一點半，防水閘門測試。閘門升起來的那一刻，所有人都屏住了呼吸。左側下方，一道細細的水流滲了出來。'),S('fang','擋水閘門左側下方漏水，判定不合格。'),S('li','……那是我們上個月才調過的。'),
N('下午一點四十五分，泡沫灑水系統測試。地下室的警報聲響徹五層樓，阿德從 B1 跑上來大喊：「真的不是火災！真的不是！」'),

{t:'「四千筆！這是重大工程瑕疵，我們要提告！」',v:1,d:[-1,0,1],r:'主委拉了拉你的袖子。報告還沒出來，你已經把子彈打光了。'}]}),
N('那天晚上回家，你的運動鞋底黏著一小塊施工水泥。你把它留了下來，放在書桌上，像一枚勳章。')]},

{t:'她又在找機會攻擊主委。',v:0,d:[0,-1,-1],r:'也許。但她這次是自己跑去服務中心翻了報告——這是一個想知道真相的人。'}]}),

S('lin','……那兩個 S 級，現在處理了沒？'),

{t:'「S 級立即發函要求建商限期處理，物業先做隔離與警示，車位 262 暫停使用並通知車主。」',v:2,d:[2,2,2],r:'主委回：「照辦。」一小時後，阿德在車位 262 周邊拉起了黃色封鎖線，還很專業地貼了一張「施工中，好兄弟請繞道」。'},

{t:'「請她以住戶代表身分列席，負責缺失與金額的核對；談判口徑由主委統一。」',v:2,d:[2,2,2],r:'你在委員群組提議，主委回了一句：「我也正有此意。」嚴監委補充：「會議公開、紀錄完整，依法沒有問題。」'},

N('你走出服務中心時，羅阿姨在後面叫住你。'),S('lin','沈委員。'),S('lin','……泳池排水溝加蓋那件事，我看到你們列進去了。'),N('她沒有說謝謝。但她說了「你們」，不是「你們委員」。')]},

{id:8,vol:3,title:'建商回函',year:'115 年 11 月・建商回函討論案',
recap:['住戶意見彙整後送交大谷，再轉給建商。','建商的回函來了。厚厚一疊，開頭寫著「本公司秉持誠信，全力配合」。','翻到後面，才是重點。'],
sc:[B('meet'),N('委員會議桌上，攤著建商的回函。錢委員用紅筆圈，嚴監委用藍筆畫，主委用手指一行一行往下走。'),C('hong'),S('hong','各位委員，我們很有誠意。四千零三筆，我們會處理絕大部分。'),S('hong','只有少數幾類，依合約與工程慣例，不在我們責任範圍。'),
Q({k:'解語',p:'洪協理說「處理絕大部分，只有少數幾類不在責任範圍」。這句話怎麼聽？',x:'「絕大部分」按筆數算，很容易做到——施工污染、保護膜未除，一撕一擦就是幾百筆。「少數幾類」按金額算，往往才是大頭：消防配管工法、圖說不符、銷售承諾。談判時要問的不是「修幾筆」，而是「不修的那些，值多少錢」。',o:[
{t:'建商很有誠意，大部分都修了。',v:0,d:[-1,-1,0],r:'錢委員把回函翻到最後一頁，指著一行小字：「那『少數幾類』加起來，比前面全部都貴。」'},
{t:'用筆數講誠意，用類別藏金額——要問的是「不修的那些值多少」。',v:2,d:[2,2,0],r:'你把回函拆成兩欄：「建商願修」、「建商不修」。第二欄雖短，每一行後面都跟著一個很大的數字。'},
{t:'他是在暗示我們要給點好處。',v:0,d:[0,0,-1],r:'嚴監委咳了一聲：「這種話，不要出現在會議記錄裡。」'}]}),
N('回函中「不修」的理由，大致分成幾種：'),N('一、銷售海報泳池區的躺椅、遮陽傘、櫻花樹、落地盆栽，大廳木長椅、櫃檯旁木格柵——「海報為示意圖，僅供參考」。'),N('二、建議事項，例如監視主機加裝 UPS、車道增設警示燈、各樓增設監視器——「非合約範圍，屬管委會自行增設」。'),N('三、大量施工污染、刮痕——「部分為住戶裝潢期間造成」。'),N('四、消防管系滾溝式壓接配管、竣工圖與現況不符——「工法合法，現場微調不影響功能」。'),
S('zw','一條一條來。先說海報。'),L('c22'),
Q({k:'回話',p:'「海報為示意圖，僅供參考」——你怎麼回？',x:'《消費者保護法》第 22 條：企業經營者對消費者所負的義務，不得低於廣告內容。銷售海報不是裝飾，是買方決定購買的依據。這一類最適合要求「履行或折算」：櫻花樹可以種，種不了就折價。',o:[
{t:'「海報確實常常只是示意，這部分我們放棄。」',v:0,d:[-1,-1,-2],r:'羅阿姨在列席位上把筆放下：「你知道那幾棵櫻花樹，是我當初買這間的理由之一嗎？」'},
{t:'「依消保法第 22 條，廣告內容是契約的一部分。請依海報履行，或提出等值折算方案。」',v:2,d:[2,2,2],r:'洪協理的笑容第一次垮了一角：「這個……我回去跟公司報告。」'},
{t:'「海報上的櫻花樹，我們要一模一樣的，品種、高度、開花時間都要一樣。」',v:1,j:1,d:[0,0,1],r:'洪協理認真地問：「開花時間……我們也要負責？」你們兩個都沉默了。'}]}),
S('qian','再來是「住戶裝潢造成」。'),S('li','（小聲）……大部分是我們自己弄的。保護膜沒撕的，總不會是住戶貼的吧。'),N('洪協理回頭瞪了李主任一眼。李主任低頭看手機。'),
Q({k:'決斷',p:'李主任剛剛說溜了嘴。你要怎麼用這句話？',x:'在談判桌上把對方的人當場拆穿，贏了一句話，輸掉一個以後可能幫你的人。更好的做法是：不點名、不追打，改提一個「舉證」原則——建商主張是住戶造成的，請提出裝潢前後的紀錄；提不出來的，視為施工缺失。',o:[

 function tone(t,midi,dur,type,vol,out,att=.01,rel){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f(midi);

<script>
// ===== 心機版引擎：路線、底牌、內心 OS、動畫 =====
const STY={正:['正道','📜','#2f7fc1'],謀:['權謀','🦊','#8a4ad0'],嗆:['嗆聲','🔥','#e0453a'],滑:['搞笑','🤪','#e8a00c'],憨:['老實','🥔','#8a8a8a']};
const styOf=o=>o.s||(o.j?'滑':o.v===2?'正':(o.v===0&&/！/.test(o.t))?'嗆':'憨');
const hasCard=id=>(SV.cards||[]).includes(id);
function giveCard(id){SV.cards=SV.cards||[];if(!hasCard(id)){SV.cards.push(id);save();toast('🃏 底牌入手：'+CARDS[id].who+'「'+CARDS[id].t+'」');AU.sfx('stamp');stats()}}
DN[0]='信任';DN[1]='心機';
stats=function(){const f=Math.max(0,Math.min(10,st.f));$('#stF').textContent='信任 '+'♥'.repeat(f)+'♡'.repeat(10-f);$('#stI').textContent='🦊'+st.i;$('#stR').textContent='👍'+st.r+'　🃏'+(SV.cards||[]).length};

 if(s&&s[0]==='card'){ip++;giveCard(s[1]);return step()}
 if(s&&s[0]==='os'){ip++;log.push(['me','（心裡話）'+s[1]]);saveMid();showChar('me',0,'n');const w=$('#who');w.style.display='inline-block';w.textContent='沈委員・心裡話';say(s[1],false);$('#txt').classList.add('os');return}
 return _step()};

 const ord=shuffle(q.o.map((o,i)=>i));

 AU.sfx(o.j?'joke':['bad','mid','good'][o.v]);showChar(w,0,o.v===2?'smile':o.v===0?'frown':'n');floaty(STY[sy][1]);
 const lab=['下策','中策','上策'][o.v]+'・'+STY[sy][0];log.push(['q',q.p,o.t,lab]);const dl=dtx(o.d);

 const b=$('#qbox');b.innerHTML=`<div class="ver v${o.v} pop">${['下策','中策','上策'][o.v]}<span class="stchip" style="background:${STY[sy][2]}">${STY[sy][1]} ${STY[sy][0]}</span></div><div class="qp">${mk(o.r)}</div>${dl?`<div class="dl">${dl}</div>`:''}<div class="note"><b>弦外之音</b><br>${mk(q.x)}</div>${routes.length>1?`<div class="routes">這題的上策不只一種：${routes.map(r=>`<span style="background:${STY[r][2]}">${STY[r][1]} ${STY[r][0]}</span>`).join('')}</div>`:''}<button class="btn c" id="bCont">繼　續</button>`;b.scrollTop=0;
 $('#bCont').onclick=()=>{AU.q(false);b.classList.remove('on');$('#dlg').style.display='';if(st.f<=0)return fail();step()}};
const TITLE={謀:['老狐狸','你沒吵過一次架，卻贏了每一場。大家都說你人很好——這正是你最可怕的地方。'],正:['包青天','你用規矩擋下了一切。沒有人喜歡你，但也沒有人抓得到你的把柄。'],嗆:['人形砲台','你說了所有人不敢說的話。群組截圖裡，你出現的次數僅次於金阿姨。'],滑:['社區開心果','沒有人知道你的立場，包括你自己。但開會只要有你，大家就不會打起來。'],憨:['老實人','你相信每一個人說的每一句話。這個社區需要你這樣的人——大概吧。']};
function styBars(o){const t=Object.values(o).reduce((a,b)=>a+b,0)||1;return Object.keys(STY).filter(k=>o[k]).sort((a,b)=>o[b]-o[a]).map(k=>`<div class="bar"><span>${STY[k][1]} ${STY[k][0]}</span><i style="width:${o[k]/t*100}%;background:${STY[k][2]}"></i><b>${o[k]}</b></div>`).join('')}
const topSty=o=>Object.keys(o).sort((a,b)=>o[b]-o[a])[0]||'憨';
finish=function(){SV.mid=null;const pct=st.max?st.pts/st.max:1,g=pct>=.85?'甲':pct>=.6?'乙':'丙',rk={甲:3,乙:2,丙:1},old=SV.ch[CH.id];
 if(!old||rk[g]>rk[old.g]||(g===old.g&&st.r>old.r))SV.ch[CH.id]={g,i:st.i,r:st.r,f:st.f};SV.styc=SV.styc||{};SV.styc[CH.id]=st.sty||{};save();AU.q(false);AU.sfx(g==='丙'?'mid':'win');
 const cm={甲:'洞若觀火。這一回的每一句屁話，你都聽出了底下那一句。',乙:'大致無虧。只是有幾句話，你聽見了聲，沒聽見音。',丙:'驚險過關。你把屁話當真話回了。'}[g];
 const me=st.sty||{},ts=topSty(me),nx=CHAPTERS[CHAPTERS.indexOf(CH)+1];let fin='';
 if(!nx){const all={};Object.values(SV.styc).forEach(o=>Object.keys(o).forEach(k=>all[k]=(all[k]||0)+o[k]));const T=TITLE[topSty(all)];fin=`<div class="final"><small>第一屆任期總評</small><b>${STY[topSty(all)][1]} ${T[0]}</b><p>${T[1]}</p>${styBars(all)}<p class="small mute">底牌蒐集 ${(SV.cards||[]).length}/${Object.keys(CARDS).length}</p></div>`}
 $('#endBody').innerHTML=`<div class="center mute ls">第${NUM[CHAPTERS.indexOf(CH)]}回・${esc(CH.title)}</div><div class="big pop">${g}</div><p class="center lh">${cm}</p><div class="sum">信任 ${st.f}　心機 ${st.i}　口碑 ${st.r}<br><small>有效回應 ${Math.round(pct*100)}%</small></div><div class="sum"><b>本回路線：${STY[ts][1]} ${STY[ts][0]}派</b>${styBars(me)}</div>${fin}${nx?`<button class="btn c" id="bNx">下一回：${esc(nx.title)}</button>`:'<p class="center gold lh">全劇終。謝謝你陪錦華盛世走完第一屆。</p>'}<button class="btn c" id="bLs">返回章回</button>`;
 go('sEnd');if(nx)$('#bNx').onclick=()=>openRecap(nx.id);$('#bLs').onclick=()=>go('sChap')};
$('#mChars').onclick=()=>{$('#lbTitle').textContent='人物譜與底牌';$('#lbBody').innerHTML=`<p class="mute small">🃏 底牌 ${(SV.cards||[]).length}/${Object.keys(CARDS).length}：每個人真正在意的那件事。拿到底牌，後面的章回會多出只有你能選的選項。</p>`+Object.keys(CHARS).map(id=>{const c=CHARS[id],u=SV.chars.includes(id),cd=Object.keys(CARDS).filter(k=>CARDS[k].c===id);return `<div class="crow${u?'':' lk'}"><img src="${faceURL(id,0,'n')}" style="${u?'':'filter:brightness(0) opacity(.35)'}"><div><b>${u?esc(c.n):'？？？'}</b><small>${u?esc(c.t):'故事進行後解鎖'}</small>${u?`<p>${esc(c.b)}</p>`:''}${u?cd.map(k=>hasCard(k)?`<div class="cardb"><b>🃏 ${esc(CARDS[k].t)}</b>${esc(CARDS[k].e)}</div>`:`<div class="cardb lk">🃏 底牌未取得</div>`).join(''):''}</div></div>`}).join('');go('sList')};
if($('#sChap').classList.contains('on'))renderChap();

// ===== 雲端存檔（與三朝聽音同一套：名字登入、可選 4 位數密碼） =====
const FB='https://molecule-match-default-rtdb.asia-southeast1.firebasedatabase.app/trips/shengshi';
const nameKey=n=>Array.from(n).map(c=>c.codePointAt(0).toString(36)).join('-');
function h32(t,seed){let h=2166136261^seed;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619)}h^=h>>>13;h=Math.imul(h,0x5bd1e995);return ((h^(h>>>15))>>>0).toString(36)}
const pinHash=(k,pin)=>pin?[1,2,3].map(i=>h32('ss|'+k+'|'+pin,i*7919)).join(''):'';
const fixSV=d=>{const o=Object.assign(blank(),d||{});['chars','laws','quotes','jokes','cards'].forEach(k=>o[k]=Array.isArray(o[k])?o[k]:[]);if(!o.chars.length)o.chars=['me'];['ch','styc'].forEach(k=>{const v=o[k]||{},n={};Object.keys(v).forEach(i=>{if(v[i])n[i]=v[i]});o[k]=n});return o};
function mergeSV(a,b){const u=(x,y)=>[...new Set([...(x||[]),...(y||[])])],rk={甲:3,乙:2,丙:1},nw=(a.at||0)>=(b.at||0)?a:b,o=fixSV(nw);
 ['chars','laws','quotes','jokes','cards'].forEach(k=>o[k]=u(a[k],b[k]));o.ch={};new Set([...Object.keys(a.ch||{}),...Object.keys(b.ch||{})]).forEach(id=>{const x=(a.ch||{})[id],y=(b.ch||{})[id];o.ch[id]=!x?y:!y?x:rk[y.g]>rk[x.g]?y:x});
 o.styc=Object.assign({},(nw===a?b:a).styc||{},nw.styc||{});o.at=Math.max(a.at||0,b.at||0);return o}
let cloudT=0;
function setCloud(s){const t={wait:'☁ 同步中…',ok:'☁ 已同步到雲端',off:'⚠ 離線中，先存在這台裝置'}[s]||'';$$('.cst').forEach(e=>e.textContent=t)}
async function cpush(){const p=curP();if(!p)return;setCloud('wait');try{const r=await fetch(`${FB}/saves/${p.k}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({n:p.n,ph:p.ph||'',at:SV.at||0,sv:SV})});if(!r.ok)throw 0;setCloud('ok')}catch(e){setCloud('off')}}
async function cpull(){const p=curP();if(!p)return;const k=p.k;setCloud('wait');try{const r=await fetch(`${FB}/saves/${k}.json`);if(!r.ok)throw 0;const d=await r.json();if(P.cur!==k)return;
  if(d&&d.sv){SV=mergeSV(fixSV(SV),fixSV(d.sv));_save();if((SV.at||0)>(d.at||0))return cpush()}else if(SV.at)return cpush();setCloud('ok')}catch(e){setCloud('off')}
 if($('#sChap').classList.contains('on'))renderChap()}
const _save=save;save=function(){SV.at=Date.now();_save();clearTimeout(cloudT);cloudT=setTimeout(cpush,1200)};
const _load=load;load=function(){_load();SV=fixSV(SV)};
async function login(name,pin){name=String(name||'').replace(/\s+/g,' ').trim().slice(0,12);pin=String(pin||'').trim();
 if(!name)return '請輸入名字';if(pin&&!/^\d{4}$/.test(pin))return '密碼要剛好 4 個數字，或留空';
 const lp=P.list.find(p=>p.n.toLowerCase()===name.toLowerCase());if(lp){P.cur=lp.k;LS.set('shengshi-players',P);load();cpull();return ''}
 const k=nameKey(name.toLowerCase());let row=null;try{const r=await fetch(`${FB}/saves/${k}.json`);if(r.ok)row=await r.json()}catch(e){}
 const ph=pinHash(k,pin);if(row&&row.ph&&row.ph!==ph)return pin?'密碼不對，再試一次':'這個名字設了密碼，請輸入密碼或換個名字';
 P.list.push({k,n:(row&&row.n)||name,ph:(row&&row.ph)||ph,at:Date.now()});P.cur=k;LS.set('shengshi-players',P);load();if(row&&row.sv){SV=mergeSV(SV,fixSV(row.sv));_save();setCloud('ok')}else{SV.at=Date.now();_save();cpush()}return ''}
$('#bEnter').onclick=async()=>{const b=$('#bEnter');b.disabled=true;b.textContent='連線中…';const e=await login($('#nm').value,$('#pin').value);b.disabled=false;b.textContent='進　入';if(e)return toast(e);go('sChap')};
const _showLogin=showLogin;showLogin=function(){_showLogin();$$('#plist .pl').forEach(b=>b.onclick=()=>{P.cur=b.dataset.k;LS.set('shengshi-players',P);load();go('sChap');cpull()})};

// ===== 開場動畫（復古掌機風，原創畫面） =====
let introPhase=0,introT0=0,introRAF=0;
function startIntro(){go('sIntro');AU.scene('title');const c=$('#icv'),x=c.getContext('2d'),W=160,H=144;c.width=W;c.height=H;x.imageSmoothingEnabled=false;
 const R=(col,a,b,w,h)=>{x.fillStyle=col;x.fillRect(Math.round(a),Math.round(b),Math.round(w),Math.round(h))};
 const lerp=(a,b,t)=>'rgb('+a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(',')+')',cl=v=>Math.max(0,Math.min(1,v));
 const stars=[...Array(46)].map((_,i)=>[(i*53+7)%W,(i*29+3)%84,i%4]);
 const TW=[[8,30,86],[42,30,104],[80,30,98],[118,30,80]];introT0=performance.now();introPhase=0;const st=$('.istage');st.className='istage';
 function frame(now){const t=(now-introT0)/1000;
  if(t<2.8){R('#000',0,0,W,H);const p=cl(t/1.3),sx=165-p*92,sy=14+p*48;if(t<1.5)for(let i=0;i<9;i++)R(i?['#cfe','#8cf','#48a'][i%3]:'#fff',sx+i*4,sy-i*2.1,i<3?3:2,i<3?3:1);
   if(t>1.3){const k=Math.sin((t-1.3)*9)>0;R('#fff',72,60,3,3);if(k){R('#ffd',73,54,1,15);R('#ffd',66,61,15,1)}}
   st.classList.toggle('pre',t>1.4);}
  else{const s=t-2.8,d=cl(s/5);st.classList.remove('pre');
   for(let y=0;y<H;y++)R(lerp(y<70?[12,16,48]:[30,28,70],y<70?[255,150,90]:[255,214,140],d*(.55+y/H*.45)),0,y,W,1);
   if(d<.9)stars.forEach(([a,b,k])=>{if((Math.floor(t*3)+k)%4)R(d<.5?'#fff':'#fda',a,b,1,1)});
   const sunY=118-d*52;x.fillStyle='#fff3b0';x.beginPath();x.arc(80,sunY,17,0,7);x.fill();x.fillStyle='#ffd24a';x.beginPath();x.arc(80,sunY,13,0,7);x.fill();
   for(let i=0;i<3;i++){const cx=((s*(5+i*2)+i*70)%(W+50))-40,cy=22+i*17;R('rgba(255,255,255,.75)',cx+5,cy,22,3);R('rgba(255,255,255,.75)',cx,cy+3,34,4)}
   const rise=(1-cl(s/2.2))**2*90;TW.forEach(([a,w,h],i)=>{const y=H-h+rise;R('#1d2244',a,y,w,h+rise);R('#2c3364',a,y,w,2);R('#141831',a+w-4,y,4,h);
    for(let j=5;j<h-6;j+=7)for(let k=3;k<w-6;k+=6){const on=s>1.6+((i*7+j*3+k)%23)*.14;R(on?(((Math.floor(t*2)+j+k)%19)?'#ffd86a':'#fff'):'#0e1228',a+k,y+j,3,4)}});
   R('#2f8fc0',0,H-5,W,5);R('#7fd0f0',((t*20)%W),H-4,10,1);R('#7fd0f0',((t*20+70)%W),H-2,14,1);
   if(s>2.2&&s<5.2){const p=(s-2.2)/3,px=-12+p*190,py=52-Math.sin(p*3.1)*22;for(let i=1;i<7;i++)R('rgba(255,255,255,'+(.5-i*.07)+')',px-i*5,py+2+i*.6,3,1);
    x.fillStyle='#fff';x.beginPath();x.moveTo(px+12,py);x.lineTo(px,py-4);x.lineTo(px+3,py+1);x.lineTo(px,py+5);x.fill();R('#c8d4e8',px+2,py+1,7,1)}
   if(s>5&&s<5.5)R('rgba(255,255,255,'+(1-(s-5)*2)+')',0,0,W,H);
   if(s>=5&&introPhase<1){introPhase=1;st.classList.add('title');AU.sfx('win')}}
  introRAF=requestAnimationFrame(frame)}
 cancelAnimationFrame(introRAF);introRAF=requestAnimationFrame(frame)}
$('#sIntro').onclick=()=>{if(introPhase<1){introT0=performance.now()-7800;return}cancelAnimationFrame(introRAF);AU.sfx('open');showLogin()};
